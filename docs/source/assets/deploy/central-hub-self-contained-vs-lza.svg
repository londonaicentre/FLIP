ont-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1296" dy="0.0">+</tspan></text><path d="M910 125C990 125 1030 150 1060 160" fill="none" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M940 210C1000 210 1035 182 1060 172" fill="none" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1118 165H1240" fill="none" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><rect x="700" y="275" width="680" height="230" rx="14" fill="#FFF5EC" stroke="#ED7100" stroke-width="1.5"/><text x="718" y="303" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ED7100" text-anchor="start"><tspan x="718" dy="0.0">Workload account</tspan></text><text x="718" y="322" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5F6B7A" text-anchor="start"><tspan x="718" dy="0.0">No internet gateway, no NAT</tspan></text><circle cx="925" cy="312" r="11" fill="#C2185B" stroke="#fff" stroke-width="2"/><text x="925" y="318" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="925" dy="0.0">+</tspan></text><g><rect x="767.0" y="347.0" width="46" height="46" rx="9.2" fill="#ED7100"/><use href="#g-mirror" x="771.6" y="351.6" width="36.8" height="36.8"/><text x="790" y="410.0" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="790" dy="0.0">ECR pull-through</tspan></text></g><circle cx="813" cy="347" r="11" fill="#C2185B" stroke="#fff" stroke-width="2"/><text x="813" y="353" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="813" dy="0.0">+</tspan></text><g><rect x="775.0" y="440.0" width="30" height="30" rx="6.0" fill="#DD344C"/><use href="#g-lock" x="778.0" y="443.0" width="24.0" height="24.0"/></g><text x="790" y="487" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="790" dy="0.0">Session Manager only</tspan></text><g><rect x="932.0" y="327.0" width="36" height="36" rx="7.2" fill="#3B48CC"/><use href="#g-database" x="935.6" y="330.6" width="28.8" height="28.8"/></g><text x="950" y="382" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="950" dy="0.0">RDS (isolated)</tspan></text><g><rect x="932.0" y="402.0" width="36" height="36" rx="7.2" fill="#7AA116"/><use href="#g-bucket" x="935.6" y="405.6" width="28.8" height="28.8"/></g><text x="950" y="457" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="950" dy="0.0">S3 + KMS</tspan></text><g><rect x="1085.0" y="350.0" width="50" height="50" rx="10.0" fill="#ED7100"/><use href="#g-container" x="1090.0" y="355.0" width="40.0" height="40.0"/><text x="1110" y="418.0" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="1110" dy="0.0">FLIP hub</tspan></text></g><g><rect x="1245.0" y="350.0" width="50" height="50" rx="10.0" fill="#ED7100"/><use href="#g-container" x="1250.0" y="355.0" width="40.0" height="40.0"/><text x="1270" y="418.0" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#232F3E" text-anchor="middle"><tspan x="1270" dy="0.0">FL server</tspan></text></g><path d="M1030 330V480" stroke="#ED7100" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 5"/><path d="M1270 212V342" fill="none" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1262 212C1240 290 1135 290 1116 342" fill="none" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><circle cx="34" cy="538" r="10" fill="#B45309" stroke="#fff" stroke-width="2"/><text x="34" y="543" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="34" dy="0.0">!</tspan></text><text x="52" y="534" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#232F3E" text-anchor="start"><tspan x="52" dy="0.0">One account owns its own internet edge and outbound route: a single misconfigured</tspan><tspan x="52" dy="15.2">rule or compromised role can open both, and nothing outside the account checks.</tspan></text><circle cx="714" cy="538" r="11" fill="#C2185B" stroke="#fff" stroke-width="2"/><text x="714" y="544" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="714" dy="0.0">+</tspan></text><text x="732" y="534" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#C2185B" text-anchor="start"><tspan x="732" dy="0.0">The platform team owns the edge and inspects every request;</tspan><tspan x="732" dy="15.2">the hub account has no route to the internet at all.</tspan></text></svg>