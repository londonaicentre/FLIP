  <rect x="390" y="276" width="258" height="28" fill="#2C3E6B"/>
  <use href="#jt-lock" x="400" y="283.0" width="12" height="14"/>
  <text x="420" y="294.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">config_fed_server.json</text>
  <rect x="390" y="310" width="258" height="28" fill="#2C3E6B"/>
  <use href="#jt-lock" x="400" y="317.0" width="12" height="14"/>
  <text x="420" y="328.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">config_fed_client.json</text>
  <text x="374" y="382" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#6B7280" text-anchor="start">OTHER JOB TYPES, SAME SHAPE</text>
  <rect x="374" y="392" width="290" height="28" fill="#ffffff" stroke="#2C3E6B" stroke-width="1.5"/>
  <text x="386" y="410.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#2C3E6B">evaluation</text>
  <rect x="374" y="426" width="290" height="28" fill="#ffffff" stroke="#2C3E6B" stroke-width="1.5"/>
  <text x="386" y="444.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#2C3E6B">diffusion_model</text>
  <rect x="590" y="432" width="64" height="16" fill="#ffffff" stroke="#8A9BBD" rx="2"/>
  <text x="622" y="444" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#5A6B8F">NVFLARE</text>
  <rect x="374" y="460" width="290" height="28" fill="#ffffff" stroke="#2C3E6B" stroke-width="1.5"/>
  <text x="386" y="478.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#2C3E6B">fed_opt</text>
  <rect x="590" y="466" width="64" height="16" fill="#ffffff" stroke="#8A9BBD" rx="2"/>
  <text x="622" y="478" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#5A6B8F">NVFLARE</text>
  <path d="M296,172 H335 V120 H374" stroke="#3F4252" stroke-width="2" fill="none"/>
  <circle cx="296" cy="172" r="4" fill="#3F4252"/>
  <circle cx="374" cy="120" r="4" fill="#3F4252"/>
  <text x="738" y="214" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#6B7280" text-anchor="middle">2 · CHECK</text>
  <rect x="692" y="224" width="92" height="56" fill="#23262E"/>
  <text x="738" y="248" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle"><tspan x="738" dy="0">required</tspan><tspan x="738" dy="16.5">files present?</tspan></text>
  <path d="M664,252 H692" stroke="#3F4252" stroke-width="2" fill="none"/>
  <circle cx="664" cy="252" r="4" fill="#3F4252"/>
  <circle cx="692" cy="252" r="4" fill="#3F4252"/>
  <path d="M784,252 H814" stroke="#3F4252" stroke-width="2" fill="none"/>
  <circle cx="784" cy="252" r="4" fill="#3F4252"/>
  <circle cx="814" cy="252" r="4" fill="#3F4252"/>
  <text x="799" y="243" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2C3E6B" text-anchor="middle">yes</text>
