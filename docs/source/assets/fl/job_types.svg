  <rect x="484" y="176" width="82" height="28" fill="#ffffff" stroke="#61366E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="525.0" y="194.5" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#61366E">trainer.py</text>
  <rect x="572" y="176" width="76" height="28" fill="#ffffff" stroke="#61366E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="610.0" y="194.5" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#61366E">models.py</text>
  <text x="390" y="232" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#2C3E6B" text-anchor="start">PROVIDES, FIXED</text>
