<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-labelledby="jt-title jt-desc" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
  <title id="jt-title">How a job type turns uploaded files into an FL app</title>
  <desc id="jt-desc">The researcher uploads config.json, trainer.py, models.py and any helper files;
    the job_type in config.json selects a template in the FLIP Hub. 1: the template (standard,
    evaluation, diffusion_model or fed_opt on NVFLARE) lists the files it requires from the
    researcher and provides its own fixed files. 2: if a required file is missing the submission
    is rejected, naming the missing files, and nothing ships. 3: otherwise the bundled app is the
    template's fixed files plus the researcher's files under app/custom, where the template's
    copy wins a name clash, and it is sent to the FL API of the net it runs on.</desc>
  <defs>
    <symbol id="jt-lock" viewBox="0 0 12 14">
      <path d="M3,6 V4 a3,3 0 0 1 6,0 V6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <rect x="1" y="6" width="10" height="7.5" rx="1.5" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="20" y="60" width="300" height="470" rx="18" fill="none" stroke="#B8BDC6" stroke-width="3" stroke-dasharray="0.1 7" stroke-linecap="round"/>
  <text x="44" y="98" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#2C3E6B">Researcher</text>
  <text x="44" y="124" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#6B7280" text-anchor="start">UPLOADS</text>
  <rect x="44" y="134" width="252" height="76" fill="#61366E"/>
  <text x="56" y="158" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#ffffff">config.json</text>
  <rect x="56" y="170" width="228" height="28" fill="#482852"/>
  <text x="66" y="189" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#F7F3F9">"job_type": "standard"</text>
  <rect x="44" y="222" width="252" height="40" fill="#61366E"/>
  <text x="56" y="246.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#ffffff">trainer.py</text>
  <rect x="44" y="274" width="252" height="40" fill="#61366E"/>
  <text x="56" y="298.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#ffffff">models.py</text>
  <text x="44" y="346" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start"><tspan x="44" dy="0">plus any helpers (optional)</tspan></text>
  <rect x="44" y="356" width="252" height="40" fill="#ffffff" stroke="#61366E" stroke-width="1.5"/>
  <text x="56" y="380.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#61366E">transforms.py</text>
  <text x="44" y="436" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan x="44" dy="0">config.json is required for every</tspan><tspan x="44" dy="17.0">job type. Its job_type picks the</tspan><tspan x="44" dy="17.0">template; the template decides</tspan><tspan x="44" dy="17.0">which other files are required.</tspan></text>
  <rect x="350" y="20" width="830" height="510" rx="18" fill="none" stroke="#C41E6A" stroke-width="3" stroke-dasharray="0.1 7" stroke-linecap="round"/>
  <text x="374" y="58" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="22"><tspan font-weight="bold" fill="#C41E6A">FLIP Hub</tspan><tspan fill="#872B6E"> (Central Hub API)</tspan></text>
  <text x="374" y="90" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#6B7280" text-anchor="start">1 · TEMPLATE FOR THE JOB TYPE</text>
