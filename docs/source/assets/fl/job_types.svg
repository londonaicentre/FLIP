  <text x="814" y="90" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#6B7280" text-anchor="start">3 · BUNDLED APP</text>
  <rect x="814" y="100" width="344" height="356" fill="#F9FAFB" stroke="#D1D5DB"/>
