  <rect x="830" y="204" width="312" height="28" fill="#2C3E6B"/>
  <use href="#jt-lock" x="840" y="211.0" width="12" height="14"/>
  <text x="860" y="222.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">app/config/config_fed_client.json</text>
  <text x="830" y="262" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.6" fill="#61366E" text-anchor="start">FROM THE UPLOAD</text>
  <rect x="830" y="272" width="312" height="28" fill="#61366E"/>
  <text x="842" y="290.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">app/custom/config.json</text>
  <rect x="830" y="306" width="312" height="28" fill="#61366E"/>
  <text x="842" y="324.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">app/custom/trainer.py</text>
  <rect x="830" y="340" width="312" height="28" fill="#61366E"/>
  <text x="842" y="358.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">app/custom/models.py</text>
  <rect x="830" y="374" width="312" height="28" fill="#ffffff" stroke="#61366E" stroke-width="1.5"/>
  <text x="842" y="392.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#61366E">app/custom/transforms.py</text>
  <text x="830" y="428" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start"><tspan x="830" dy="0">Same name as a template file? The</tspan><tspan x="830" dy="16.5">template's copy wins; the upload is skipped.</tspan></text>
  <path d="M986,456 V476" stroke="#3F4252" stroke-width="2" fill="none"/>
  <circle cx="986" cy="456" r="4" fill="#3F4252"/>
  <circle cx="986" cy="476" r="4" fill="#3F4252"/>
  <rect x="926" y="476" width="120" height="40" fill="#C41E6A"/>
  <text x="986" y="501" text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">FL API</text>
  <text x="1056" y="494" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="start"><tspan x="1056" dy="0">of the net</tspan><tspan x="1056" dy="16.0">it runs on</tspan></text>
  <rect x="20" y="555" width="14" height="14" fill="#61366E"/>
  <text x="42" y="566" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#374151" text-anchor="start"><tspan x="42" dy="0">uploaded files</tspan></text>
  <rect x="156" y="555" width="14" height="14" fill="#ffffff" stroke="#61366E" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="178" y="566" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#374151" text-anchor="start"><tspan x="178" dy="0">required by the job type</tspan></text>
  <rect x="380" y="555" width="14" height="14" fill="#2C3E6B"/>
  <use href="#jt-lock" x="382" y="556" width="10" height="12"/>
  <text x="402" y="566" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#374151" text-anchor="start"><tspan x="402" dy="0">fixed, from the platform template</tspan></text>
  <text x="20" y="604" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan x="20" dy="0">Shown for NVFLARE. On Flower you upload client_app.py instead of trainer.py; the template provides server_app.py,</tspan><tspan x="20" dy="17.0">strategy.py and pyproject.toml; uploaded files go in app/; and the job types are standard and evaluation.</tspan></text>
</svg>
