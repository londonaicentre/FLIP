[project]
name = "docs"
version = "0.1.0"
description = "Documentation for the FLIP project"
readme = "README.md"
authors = [
    { name = "R. Garcia-Dias", email = "rafaelagd@gmail.com" },
    { name = "A. Triay Bagur", email = "alexandre.triay_bagur@kcl.ac.uk" },
]
requires-python = ">=3.12"
dependencies = [
    # Renders deploy/providers/AWS/architecture/central_hub.py at build time (needs graphviz `dot` on PATH).
    "diagrams>=0.25.1",
    "idna>=3.15",
    "readthedocs-sphinx-search>=0.3.2",
    "requests>=2.33.0",
    "setuptools>=80.8.0",
    "sphinx-autoapi>=3.6.0",
    # HTML redirect stubs for pages renamed in FLIP#364 (components/architecture-overview, component-fl-nodes).
    "sphinx-reredirects>=1.1.0",
    "sphinx-rtd-theme>=3.0.2",
    "sphinxcontrib-bibtex>=2.7.0",
    # Swimlane (sequence) diagrams written as text in the rst, e.g. on flip-workflow.rst.
    "sphinxcontrib-mermaid>=2.1.1",
    "urllib3>=2.7.0",
]

[project.scripts]
docs = "docs:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Emergency cooldown override (CONTRIBUTING.md, "Emergency override"): admit the critical-advisory fix
# certifi 2026.10.19 before the 3-day cooldown does. Each cutoff is that release's upload time, so
# nothing newer gets in, and it also freezes the package: remove it after 2026-10-23T15:13Z (#1618).
exclude-newer-package = { certifi = "2026-10-20T02:25:00Z" }
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2
]
