# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation-app"
version = "1.0.0"
description = "Evaluation app"
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flip-utils>=0.1.8",
    "flwr[simulation]>=1.32.0",
    "monai>=1.5.2",
    "nibabel>=5.3.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.10.0,<2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

# On-platform, Flower's runtime dependency installer runs `uv sync` against this
# file on every app launch (ServerApp on the SuperLink, ClientApp on each
# SuperNode) and prepends the resulting per-run env to sys.path. The [tool.uv]
# tables below steer that resolution (FLIP#767):
#   * flip-utils installs from the source baked into the FL images at
#     /opt/flip-utils — never from PyPI — so FL runs always execute the in-repo
#     flip-utils. To test unpublished flip-utils changes, rebuild the FL images
#     (`make build-fl FL_BACKEND=flower`).
#   * torch/torchvision come from PyTorch's cu128 index: PyPI's default cu130
#     wheels need NVIDIA driver >=580 (dev hosts run 575.x). This mirrors the
#     pin in flip-utils' own pyproject, which does NOT apply here — uv honors
#     only the root project's [tool.uv] tables.
# /opt/flip-utils exists only inside the FL containers; for local simulation
# work, start from fl-tutorials/flower/ instead of this template.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
flip-utils = { path = "/opt/flip-utils" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.flwr.app]
publisher = "flwrlabs"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 1 # Evaluation only needs 1 round
local-epochs = 1      # Number of evaluation rounds per model
learning-rate = 1e-4
batch-size = 2
# Model configuration
spatial-dims = 3
num-classes = 2
# Checkpoint filename to evaluate, relative to flip-job-dir.
# Dummy placeholder -- the real value is supplied per run via config.toml.
checkpoint = "dummy.pt"
# FLIP configuration - needs to be set here so it can be overridden by flwr run command
# See https://flower.ai/docs/framework/ref-api-cli.html#flwr-run for more details
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"

# Linter
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
