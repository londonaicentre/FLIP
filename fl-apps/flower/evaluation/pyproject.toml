# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation-app"
version = "1.0.0"
description = "Evaluation app"
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flip-utils>=0.1.8",
    "flwr[simulation]>=1.27.0",
    "monai>=1.5.2",
    "nibabel>=5.3.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 1 # Evaluation only needs 1 round
local-epochs = 1      # Number of evaluation rounds per model
learning-rate = 1e-4
batch-size = 2
# Model configuration
spatial-dims = 3
num-classes = 2
# FLIP configuration - needs to be set here so it can be overridden by flwr run command
# See https://flower.ai/docs/framework/ref-api-cli.html#flwr-run for more details
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"

# Metrics specification for evaluation
# Define metric names and their expected types ("float" or "int" only - native numeric types).
[tool.flwr.app.config.metrics]
mean_dice = "float"

# Model definitions
# A model entry must exist here so config.toml can override it: Flower's --run-config can only
# override keys already declared in pyproject.toml, never add new ones. The checkpoint and path
# below are dummy placeholders -- supply the real values per run in config.toml under a matching
# [models.example_model] section. The model name (example_model) is fixed here; config.toml can
# override its values but not rename it.
[tool.flwr.app.config.models.example_model]
checkpoint = "dummy.pt"
path = "dummy"

# Linter
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT']
