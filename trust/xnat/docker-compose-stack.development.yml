# Development overlay for docker-compose-stack.yml
# - Mounts plugins and config from the host for hot-reload during development
#   (in production, these are baked into the Docker image)
# - Overrides resource constraints for development machines with more CPU/RAM
services:
  xnat-web:
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 4G
        limits:
          cpus: "6"
          memory: 8G
    environment:
      - DATA_PATH=${XNAT_DATA_DIR}/xnat-data
      # Shorten the plugin-readiness wait for development. The 900s default suits an unattended
      # deploy, where waiting out a slow cold start beats failing; at a developer's terminal a
      # wrong plugin cache or a broken registration is better reported in minutes, and re-running
      # `make up` is cheap. Still generous — the plugins are already on disk by this point.
      - XNAT_PLUGIN_READINESS_TIMEOUT_SECONDS=${XNAT_PLUGIN_READINESS_TIMEOUT_SECONDS:-300}
    volumes:
      - ${XNAT_PATH}/xnat/plugins:${XNAT_HOME}/plugins
      - ${XNAT_PATH}/xnat/config:${XNAT_ROOT}/config
      # XNAT's container service plugin executes Docker commands on the host
      # (via the mounted Docker socket). Those host-spawned containers need
      # access to XNAT data through host paths, so these must be bind-mounted.
      # XNAT_DATA_DIR is the absolute per-trust data dir resolved by
      # trust/xnat/Makefile (see the XNAT_DATA_DIR comment there); using it
      # here keeps Make's xnat-reset and these mounts pointing at the same dirs.
      - ${XNAT_DATA_DIR}/xnat-data/tomcat_logs:${XNAT_HOME}/logs
      - ${XNAT_DATA_DIR}/xnat-data/archive:${XNAT_ROOT}/archive
      - ${XNAT_DATA_DIR}/xnat-data/build:${XNAT_ROOT}/build
      - ${XNAT_DATA_DIR}/xnat-data/cache:${XNAT_ROOT}/cache

  xnat-db:
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d
      # Persist the database (FLIP#1048). Without this, /var/lib/postgresql/data falls
      # back to the anonymous volume the postgres image declares, and swarm mints a NEW
      # empty one on every task recreate — so any `up-xnat` (and therefore any
      # `make -C trust up-trust`) silently discards every project, user and imaging
      # session. xnat-web's archive IS bind-mounted below, so the symptom is the worst
      # kind: the DICOM files survive on disk while the database indexing them does not,
      # and XNAT comes back up healthy, serving 200s, with zero projects. Production
      # already does this (docker-compose-stack.production.yml); dev was the outlier.
      # Kept under XNAT_DATA_DIR so a trust's database sits beside its archive and the
      # two cannot drift apart when an operator moves or clears that trust's data.
      - ${XNAT_DATA_DIR}/xnat-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 2G
        limits:
          cpus: "4"
          memory: 4G
