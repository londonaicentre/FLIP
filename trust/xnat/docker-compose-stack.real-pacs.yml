# Opt-in overlay: publish XNAT's DICOM SCP receiver on the host.
#
# Applied by `make up-xnat ... REAL_PACS=true` (trust/xnat/Makefile). Needed only when the PACS is
# outside this host: FLIP retrieves by DQR, so after XNAT issues C-FIND/C-MOVE the PACS opens a
# *new* association back to XNAT to C-STORE the studies. That return leg is inbound, and without a
# published port it never arrives — queries succeed and retrievals silently time out (FLIP#993).
#
# The mocked Orthanc that ships for development does not need this: it reaches xnat-web:${XNAT_PORT}
# over the container network.
#
# XNAT_PORT is used on both sides of the mapping deliberately. DQR matches the C-MOVE destination
# against a registered SCP receiver by exact AE title and port, so the port the PACS connects to must
# be the same number XNAT binds — no translation is possible on this leg. The Makefile refuses to
# deploy if XNAT_WEB_PORT and XNAT_PORT collide.
services:
  xnat-web:
    ports:
      - ${XNAT_PORT}:${XNAT_PORT}
