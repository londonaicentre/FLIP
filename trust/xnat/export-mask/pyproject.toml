[project]
name = "xnat-export-mask"
version = "1.0.0"
description = "XNAT Container Service command: convert an OHIF DICOM-SEG assessor to NIfTI and upload it back"
requires-python = ">=3.12,<3.13"
dependencies = [
    "highdicom>=0.28",
    "numpy>=2",
    "requests>=2.32",
    "simpleitk>=2.5.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    # 41 advisories, five critical: GHSA-8g5g-8vmr-9782, GHSA-w889-685w-c8fh, GHSA-332p-7hrc-92wf,
    # GHSA-v9pv-5gc8-w2m6, GHSA-5x8w-8jj5-q52h.
    "pillow>=13.0.0",
]
