[project]
name = "xnat-nifti-to-seg"
version = "1.0.0"
description = "XNAT Container Service command: turn a scan's NIfTI label masks into DICOM-SEG ROI collections"
requires-python = ">=3.13,<3.14"
dependencies = [
    "highdicom>=0.28",
    "numpy>=2",
    "pydicom>=3",
    "requests>=2.32",
    "simpleitk>=2.5.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    # 41 advisories, five critical: GHSA-8g5g-8vmr-9782, GHSA-w889-685w-c8fh, GHSA-332p-7hrc-92wf,
    # GHSA-v9pv-5gc8-w2m6, GHSA-5x8w-8jj5-q52h.
    "pillow>=13.0.0",
]
