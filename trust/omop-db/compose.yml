# Standalone image build + populate pipeline (NOT the runtime trust stack — that
# is trust/deploy/compose_trust.<env>.yml). Brings up one empty OMOP database
# per trust so `make populate` can load each trust's slice of the canonical
# dataset; the resulting volumes/Trust_<N>/db_data trees are what the trust
# stack mounts (and what gets exported to the Hugging Face pgdata tarballs).
# Config comes from .env.build (see .env.build.example).
services:
  omop-db-trust1:
    image: ${OMOP_DB_IMAGE:-ghcr.io/londonaicentre/omop-db}:${OMOP_DB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OMOP_DB_PORT_TRUST_1:-5434}:5432"
    environment:
      POSTGRES_USER: ${OMOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OMOP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OMOP_POSTGRES_DB}
      DATA_ACCESS_POSTGRES_PASSWORD: ${DATA_ACCESS_POSTGRES_PASSWORD}
    volumes:
      - ./volumes/Trust_1/db_data:/var/lib/postgresql/data
    networks:
      - omop-build-network

  omop-db-trust2:
    image: ${OMOP_DB_IMAGE:-ghcr.io/londonaicentre/omop-db}:${OMOP_DB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OMOP_DB_PORT_TRUST_2:-5436}:5432"
    environment:
      POSTGRES_USER: ${OMOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OMOP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OMOP_POSTGRES_DB}
      DATA_ACCESS_POSTGRES_PASSWORD: ${DATA_ACCESS_POSTGRES_PASSWORD}
    volumes:
      - ./volumes/Trust_2/db_data:/var/lib/postgresql/data
    networks:
      - omop-build-network

  # Optional DB browser; opt in with `docker compose --profile pgadmin up`.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["pgadmin"]
    ports:
      - "${PG_ADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - omop-build-network

volumes:
  pgadmin_data:

networks:
  omop-build-network:
    driver: bridge
