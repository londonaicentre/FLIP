# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:

  fl-client-net-1:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_CLIENT_NAME}:${DOCKER_FL_TAG}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No capability is added back. The image runs non-root (GHSA-8465) and Docker
    # grants effective capabilities only to root, so a cap_add here would land in
    # the bounding set and never take effect (CapEff stays 0).
    #
    # provision/workspace-dev/ (gitignored) is written by `make provision` as the host
    # user. The image's identity is now FIXED at flip/1000/1000 rather than baked from
    # the building developer's .env.development (FLIP#1171), so the two no longer
    # coincide by luck for whoever built the image and mismatch for everyone else —
    # published :stag images used to crash-loop here for any developer who was not uid
    # 1000. Instead of chowning the kit dirs to the container (the previous advice, and
    # what this comment used to say), `user:` below runs the container as the host user
    # that already owns them. What aborted the entrypoint in that case was the envsubst
    # write into the bind-mounted local/ (guarded by `|| exit 1`); the `chmod +x` calls
    # on startup/*.sh are unguarded and do not crash-loop.
    #
    # uid = the host user, so the provisioned kit and this net's images slice are
    # readable and writable without any chown; gid = the image's, so /app stays
    # writable for NVFLARE's job workspace (fl-base makes it group-writable). On
    # EC2/on-prem the host user is uid 1000 and this resolves to the baked identity.
    user: "${UID:-1000}:${FL_IMAGE_GID:-1000}"
    volumes:
      # This net's slice of the images download directory, at the unchanged container
      # path — see compose_trust.production.nvflare.yml for the least-privilege
      # rationale; `make up-trust` / `up-fl-clients` pre-create the host net dirs.
      # The :? guard keeps an unset var loud — a bare ${VAR}/net-1 would silently
      # mount a root-created /net-1 from the host's filesystem root.
      - ${BASE_IMAGES_DOWNLOAD_DIR:?set in the trust kit file}/net-1:/app/data/images/net-1
      # Provisioned NVFLARE secrets (certificates, fed_client.json) — mounted from the
      # FL kit slot assigned by the hub, NOT the trust's friendly name. The slot dir's
      # fed_client.json baked-in CN is the identity the FL server sees on registration.
      - ${FL_PROVISIONED_DIR}/net-1/services/${FL_KIT_SLOT}/local:/app/local
      - ${FL_PROVISIONED_DIR}/net-1/services/${FL_KIT_SLOT}/startup:/app/startup
      - ${FL_PROVISIONED_DIR}/net-1/services/${FL_KIT_SLOT}/transfer:/app/transfer
    environment:
      - NET_ID=net-1
      - NUM_AVAILABLE_GPUS=${NUM_AVAILABLE_GPUS}
      - MEMORY_PER_GPU_IN_GIB=${MEMORY_PER_GPU_IN_GIB}
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      # FL clients intentionally do not have access to Central Hub API credentials.
      # Only the fl-server (on the Central Hub) communicates with flip-api via INTERNAL_SERVICE_KEY.
      - DATA_ACCESS_API_URL=${DATA_ACCESS_API_URL}
      - IMAGING_API_URL=${IMAGING_API_URL}
      # Trust-internal service auth — fl-client must send this header on every imaging-api call
      # so the imaging-api can distinguish authorised callers from anything else on the trust network.
      # This key is per-trust and never leaves the trust environment.
      - TRUST_INTERNAL_SERVICE_KEY_HEADER=${TRUST_INTERNAL_SERVICE_KEY_HEADER}
      - TRUST_INTERNAL_SERVICE_KEY=${TRUST_INTERNAL_SERVICE_KEY}
      # Site-enforced NVFLARE privacy policy (FLIP#851) — set in the trust's kit file
      # (Host-local profile) and rendered into /app/local/privacy.json by the fl-client
      # entrypoint at container start. Unset/empty = no site policy (previous behavior).
      - FL_SITE_PRIVACY_POLICY=${FL_SITE_PRIVACY_POLICY:-}
      - FL_SITE_PRIVACY_PERCENTILE=${FL_SITE_PRIVACY_PERCENTILE:-}
      - FL_SITE_PRIVACY_GAMMA=${FL_SITE_PRIVACY_GAMMA:-}
    networks:
      - default
      - fl-net-1
    shm_size: '32gb'
    # GPU passthrough via compose_trust.development.gpu.yml overlay (gated on NUM_AVAILABLE_GPUS)

  fl-client-net-2:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_CLIENT_NAME}:${DOCKER_FL_TAG}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No capability added back, and the same host-uid override — see fl-client-net-1.
    user: "${UID:-1000}:${FL_IMAGE_GID:-1000}"
    volumes:
      # This net's slice of the images download directory (see fl-client-net-1 above)
      - ${BASE_IMAGES_DOWNLOAD_DIR:?set in the trust kit file}/net-2:/app/data/images/net-2
      # Provisioned NVFLARE secrets (certificates, fed_client.json)
      - ${FL_PROVISIONED_DIR}/net-2/services/${FL_KIT_SLOT}/local:/app/local
      - ${FL_PROVISIONED_DIR}/net-2/services/${FL_KIT_SLOT}/startup:/app/startup
      - ${FL_PROVISIONED_DIR}/net-2/services/${FL_KIT_SLOT}/transfer:/app/transfer
    environment:
      - NET_ID=net-2
      - NUM_AVAILABLE_GPUS=${NUM_AVAILABLE_GPUS}
      - MEMORY_PER_GPU_IN_GIB=${MEMORY_PER_GPU_IN_GIB}
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      # FL clients intentionally do not have access to Central Hub API credentials.
      # Only the fl-server (on the Central Hub) communicates with flip-api via INTERNAL_SERVICE_KEY.
      - DATA_ACCESS_API_URL=${DATA_ACCESS_API_URL}
      - IMAGING_API_URL=${IMAGING_API_URL}
      # Trust-internal service auth — fl-client must send this header on every imaging-api call
      # so the imaging-api can distinguish authorised callers from anything else on the trust network.
      # This key is per-trust and never leaves the trust environment.
      - TRUST_INTERNAL_SERVICE_KEY_HEADER=${TRUST_INTERNAL_SERVICE_KEY_HEADER}
      - TRUST_INTERNAL_SERVICE_KEY=${TRUST_INTERNAL_SERVICE_KEY}
      # Site-enforced NVFLARE privacy policy (FLIP#851) — see the fl-client-net-1 note.
      - FL_SITE_PRIVACY_POLICY=${FL_SITE_PRIVACY_POLICY:-}
      - FL_SITE_PRIVACY_PERCENTILE=${FL_SITE_PRIVACY_PERCENTILE:-}
      - FL_SITE_PRIVACY_GAMMA=${FL_SITE_PRIVACY_GAMMA:-}
    networks:
      - default
      - fl-net-2
    shm_size: '32gb'
    # GPU passthrough via compose_trust.development.gpu.yml overlay (gated on NUM_AVAILABLE_GPUS)
