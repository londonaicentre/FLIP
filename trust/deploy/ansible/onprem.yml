# onprem.yml
#
# Provisions an on-premises Ubuntu host to run the FLIP Trust-API stack.
# Trusts poll the Central Hub for tasks — all communication is outbound.
#
# Composed from the roles in ./roles, which deploy/providers/AWS/site.yml (the
# EC2 trust) shares; what differs per host type is stated in `vars:` below.
#
# Usage:
#   ansible-playbook -i <trust-host-ip>, \
#     -u ubuntu --private-key ~/.ssh/trust_key \
#     trust/deploy/ansible/onprem.yml
#
#   There is no data play: the OMOP and Orthanc stores start empty and
#   `make -C trust up-trust` seeds them from the canonical dataset at bring-up
#   (FLIP#1187, `ensure-seeded`) — there is no snapshot to restore any more.

---
- name: Provision on-premises Trust host
  hosts: all
  become: true
  vars:
    flip_dir: /opt/flip
    # Which FL backend this trust will run. Only affects the ownership of the
    # per-net images bind sources (the Flower client runs as a different UID from
    # imaging-api). `make provision-local-trust` passes the deployment's
    # FL_BACKEND; a standalone run needs `-e fl_backend=flower` explicitly.
    fl_backend: nvflare
    # The operator extracts the kit tarball by hand (package-onprem-trust-kit.sh),
    # so the role lays down the directory tree and nothing wipes it.
    fl_kit_source: precreate
    # Intentionally NO flip_docker_users — adding the SSH login user to the
    # `docker` group is equivalent to giving them passwordless root (any group
    # member can `docker run -v /:/host …` and chroot to the host fs). Operators
    # run docker / `make -C trust up-trust` via `sudo` instead; the `ubuntu`
    # account already has sudo per the on-prem README prerequisites.
    # tests/test_onprem_playbook.py pins this.
  roles:
    - flip_base_packages
    - flip_docker
    - flip_trust_dirs
    - flip_fl_kit
    # The production compose reads Loki/Alloy/Grafana config from
    # /opt/flip/config/observability by default (OBSERVABILITY_CONFIG_DIR).
    - flip_observability_config
