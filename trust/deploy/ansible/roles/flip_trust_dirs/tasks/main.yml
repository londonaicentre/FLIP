---
# The images base dirs are the bind-mount sources for the imaging-api / fl-client
# images dir. Each trust compose project bind-mounts one of these onto
# /app/data/images via BASE_IMAGES_DOWNLOAD_DIR, then imaging-api creates
# /app/data/images/net-1/ inside it as uid 1000 (the `flip` user in the container).
# If we don't pre-create them here Docker creates the missing source path as root at
# first startup, leaving the container unable to mkdir net-1 inside it - imaging-api
# then 500s every download with `[Errno 13] Permission denied:
# '/app/data/images/net-1'`, and the FL training run fails downstream with
# `num_samples=0` because the whole cohort's image fetches errored out.
# The net-N children must be pre-created too — see the separate, backend-aware task
# below.
#
# Tagged flkit so an EC2 `--tags flkit` re-stage lays these down again alongside the kit.
- name: create Trust application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flip_owner }}"
    group: "{{ flip_group }}"
    mode: "0755"
  loop: "{{ ([flip_dir] + flip_app_dirs + flip_images_base_dirs) | unique }}"
  tags: flkit

# Each fl-client bind-mounts only its own net's slice (<base>/net-N — least
# privilege, so training code can't read another net's cached studies), so
# the net-N children need pre-creating as well: a Docker-created root-owned
# net-N breaks imaging-api's writes into it exactly as described above.
#
# Their group is backend-aware because the fl-client writes inside net-N too
# (flip.add_resource stages under net-N/upload/, NVFLARE CleanupImages deletes
# net-N's children):
#   * NVFLARE — its client runs as uid 1000, the same as imaging-api, so the
#     plain owner:group 0755 of the parent dirs covers both writers.
#   * Flower  — its client is built on upstream flwr/base, which runs as `app`
#     (uid/gid 49999) and gets no supplementary group from the production
#     compose. Without group 49999 + 0775 it is only "other" on the net dir and
#     add_resource fails with EACCES.
# Keep in sync with the K8s chart's images-init
# (trust/deploy/helm/templates/fl-client.yaml) and trust/Makefile's $(ensure_net_dirs).
- name: create per-net images bind-mount directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flip_owner }}"
    group: "{{ '49999' if fl_backend == 'flower' else flip_group }}"
    mode: "{{ '0775' if fl_backend == 'flower' else '0755' }}"
  loop: "{{ flip_net_dirs }}"
  tags: flkit

# XNAT containers run as the in-image `xnat` user (UID 1001) after the
# Docker-hardening pass on `trust/xnat/xnat/Dockerfile`. Bind-mounted host
# paths must be writable by that UID or first-boot writes (archive ingest,
# build cache, Tomcat log rotation, prearchive moves) fail with EACCES.
# The uid is a literal on purpose: trust/xnat/tests/test_data_dir_ownership.py
# pins it to trust/xnat/Makefile's XNAT_CONTAINER_UID.
- name: create XNAT bind-mount directories (owned by container UID 1001)
  file:
    path: "{{ item }}"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0755"
  loop:
    - "{{ flip_dir }}/xnat"
    - "{{ flip_dir }}/xnat/xnat-data/tomcat_logs"
    - "{{ flip_dir }}/xnat/xnat-data/archive"
    - "{{ flip_dir }}/xnat/xnat-data/build"
    - "{{ flip_dir }}/xnat/xnat-data/cache"
    - "{{ flip_dir }}/xnat/xnat-db-data"

- name: create Loki data directory
  file:
    path: "{{ flip_dir }}/volumes/loki"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"
  when: flip_observability_volume_dirs

- name: create Grafana data directory
  file:
    path: "{{ flip_dir }}/volumes/grafana"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
  when: flip_observability_volume_dirs
