---
# The EC2 kit stage: this host's slot out of the hub's participant-kit bucket, via the
# instance role. deploy/providers/AWS/tests/test_trust_kit_staging.py reads the two
# shell blocks below by task name and pins their FLIP#965 properties (abort on first
# failure, wipe net-1 before the fetch, assert the result, consume trust_s3_source bare).

# Scoped to this stage rather than the inventory play's assert block: that block runs
# under every tag selection (the play is `tags: always`), and the data roles further
# down legitimately default trust_num to "1". Only kit staging must have it stated,
# because there the wrong value fetches another trust's identity.
- name: ensure trust_num is defined for NVFLARE kit staging
  assert:
    that:
      - trust_num is defined
      - trust_num | string | length > 0
    fail_msg: >-
      trust_num must be defined for FL kit staging — it selects the participant-kit
      slot (Trust_<trust_num>) this host was assigned by the hub at registration.
      Pass it explicitly, e.g. `-e trust_num=2`, including for a standalone
      `--tags flkit` re-stage. There is deliberately no default: staging the wrong
      slot puts another trust's FL identity on this host and reports success.
  when: fl_backend == "nvflare"

- name: sync NVFLARE participant kit from S3
  # `aws s3 sync` skips files when source/dest size + mtime "look
  # equivalent", so a freshly regenerated kit can leave stale
  # rootCA.pem / client.crt / fed_client.json in place — the
  # symptom is fl-client failing with CERTIFICATE_VERIFY_FAILED
  # against a server cert signed by the new rootCA. Wipe the
  # destination first to force a clean copy. Mirrors the
  # ecs_efs_provision.tf fix on the central-hub side.
  #
  # The hierarchical dest (net-1/services/<slot>) preserves the
  # S3 bundle's own layout — the compose mount in
  # trust/deploy/compose_trust.production.nvflare.yml is
  # ${FL_KIT_DIR}/net-1/services/${TRUST_NAME}/{local,startup,transfer},
  # which resolves to /opt/flip/fl-kit/net-1/services/<slot>/...
  #
  # Every step here runs as root via `become: true` — the `find -delete`, the
  # sync and all three `mkdir -p`s — so the whole tree under $dest lands root-owned.
  # The closing `chown -R` is the ONLY thing that makes it writable by the non-root
  # fl-client (GHSA-8465; CI builds the images at UID=1000, matching ubuntu on this
  # host). It is load-bearing, not tidying: do not drop it as redundant.
  #
  # Nor is there any point pre-creating the leaf dirs from an Ansible `file:` task
  # ahead of this one: the net-1 wipe below deletes whatever such a task created.
  # precreate.yml does pre-create them, and is right to — there the operator
  # extracts a kit tarball by hand and nothing wipes.
  #
  # local/ and transfer/ are re-created after the sync: the `find -delete` above clears
  # them, and aws s3 sync mirrors objects rather than empty prefixes, so the provisioner's
  # empty transfer/ never comes back. Docker would then create the
  # bind-mount source as root and the non-root fl-client could not write its trained
  # model at the END of a run. local/ gets the same treatment because site policy writes
  # privacy.json into it at container start. package-onprem-trust-kit.sh does the same mkdir.
  #
  # The wipe is scoped to net-1/, not to $dest, so the host ends up holding exactly one
  # slot's kit — matching the Flower stage below. ansible-init deliberately stages Trust_1
  # before registration (there is no assigned slot to read yet), so a host that later
  # registers as any other slot would otherwise keep a complete startup kit for Trust_1 —
  # client.key, client.crt, rootCA.pem, fed_client.json — indefinitely. Nothing mounts it,
  # but it is another trust's FL identity sitting on this host's disk, which is the same
  # exposure class the narrowed Flower sync closes.
  #
  # No `|| true` on the wipe: `find -mindepth 1 -delete` already exits 0 on an empty or
  # freshly created directory, so the guard could only ever mask a genuine failure — and a
  # failed wipe is exactly the staleness the wipe exists to prevent, which `aws s3 sync`
  # would then skip past on size+mtime equivalence.
  #
  # The assertions that follow are the same durable guard as the Flower branch below
  # (FLIP#965): the wipe means a no-op sync leaves the host with no kit at all. The second
  # one additionally proves the kit belongs to the slot being staged rather than merely
  # that some kit is present — fed_client.json carries the client's own fully-qualified
  # site name, so a mis-slotted or half-wiped stage is caught here rather than at the first
  # training run.
  #
  # That check reads client.fqsn as a JSON field rather than pattern-matching the file:
  # an exact comparison is what is wanted, and building a regex out of a templated slot
  # name would quietly change meaning if slot naming ever grew a metacharacter. python3
  # is on the host by definition — Ansible runs its own modules through it — whereas jq
  # is not installed here. Unreadable JSON fails the same way a wrong name does — python
  # prints the parse error above the message below — which is the safe direction:
  # nothing downstream can use a kit this guard cannot parse.
  vars:
    # Ends in "/" — consumers pass it bare, never with a slash appended (see FLIP#965).
    trust_s3_source: "s3://{{ flip_aicentre_bucket }}/fl-flare-participant-kits/{{ fl_kit_date }}/net-1/services/{{ fl_kit_slot }}/"
  shell: |
    set -euo pipefail
    dest="{{ fl_kit_dir }}/net-1/services/{{ fl_kit_slot }}"
    mkdir -p "{{ fl_kit_dir }}/net-1"
    find "{{ fl_kit_dir }}/net-1" -mindepth 1 -delete
    mkdir -p "$dest"
    aws s3 sync \
      "{{ trust_s3_source }}" \
      "$dest"
    mkdir -p "$dest/local" "$dest/transfer"
    if [ ! -s "$dest/startup/fed_client.json" ]; then
      echo "ERROR: NVFLARE kit staging produced no fed_client.json in $dest." >&2
      echo "       Source: {{ trust_s3_source }}" >&2
      echo "       Check FLARE_KIT_DATE matches an S3 prefix, and that the instance role" >&2
      echo "       can kms:Decrypt the bucket CMK." >&2
      exit 1
    fi
    if ! python3 -c \
         'import json, sys; kit = json.load(open(sys.argv[1])); sys.exit(0 if kit.get("client", {}).get("fqsn") == sys.argv[2] else 1)' \
         "$dest/startup/fed_client.json" "{{ fl_kit_slot }}"; then
      echo "ERROR: the kit staged in $dest does not name {{ fl_kit_slot }} in client.fqsn." >&2
      echo "       Source: {{ trust_s3_source }}" >&2
      echo "       fed_client.json names a different site, so this host would register with" >&2
      echo "       the federation under the wrong identity. Check FL_KIT_SLOT_NUMBER in the" >&2
      echo "       kit file and that FLARE_KIT_DATE holds a kit for this slot." >&2
      exit 1
    fi
    chown -R {{ flip_owner }}:{{ flip_group }} "$dest"
  args:
    executable: /bin/bash
  register: trust_sync
  changed_when: "'download:' in trust_sync.stdout or 'copy:' in trust_sync.stdout"
  when: fl_backend == "nvflare"

# Same requirement as the NVFLARE stage above — trust_num selects which SuperNode
# credential is staged. Bare `{{ trust_num }}` already fails an undefined run, but
# on a Jinja "undefined variable" error rather than one that says what to pass.
- name: ensure trust_num is defined for Flower kit staging
  assert:
    that:
      - trust_num is defined
      - trust_num | string | length > 0
    fail_msg: >-
      trust_num must be defined for FL kit staging — it selects this host's own
      SuperNode credential (keys/supernode_credentials_<trust_num>). Pass it
      explicitly, e.g. `-e trust_num=2`, including for a standalone `--tags flkit`
      re-stage.
  when: fl_backend == "flower"

- name: sync Flower net-1 certificates and keys from S3
  # Two rules below are load-bearing, both from FLIP#965:
  #
  # 1. trust_s3_source is passed BARE. It already ends in "/", and appending another
  #    gives "net-1//" — a literal empty path segment matching no key, so the sync
  #    copies nothing, exits 0 and reports ok. The NVFLARE sync above passes it bare
  #    for the same reason; keep the two identical.
  # 2. Only this host's own credential is staged. The prefix also holds every other
  #    slot's SuperNode private key and the SuperLink server key, so syncing it whole
  #    puts the whole federation's FL identity on every trust host. The SuperNode
  #    reads exactly ca.crt and its own supernode_credentials_<slot> (the `command:`
  #    block in compose_trust.production.flower.yml), which is what the two --include
  #    patterns below fetch — and nothing more.
  #
  #    This is intentionally NARROWER than package-onprem-trust-kit.sh, which syncs
  #    the whole certificates/ tree (ca.crt, server.pem, server.key) plus the one
  #    supernode credential. That tarball therefore still hands an on-prem operator
  #    the SuperLink's server key — the same exposure class narrowed here for EC2 —
  #    and closing it can be split into a follow-up.
  #
  #    On ca.key: fl-services/flower/Makefile excludes it from `upload-creds-to-s3`,
  #    so a kit published through that target carries ca.crt / server.pem /
  #    server.key and no CA key. That is a property of the upload path, not of the
  #    bucket — a prefix published before the exclusion existed can still hold one,
  #    and `--delete` only reaches the prefix being re-synced. Do not read the
  #    exclusion as "there is no CA key in S3" when reasoning about what a bucket
  #    read is worth: a CA key mints certificates the SuperLink trusts, which is a
  #    strictly stronger capability than any single participant kit.
  #
  # The closing assertion is the durable half of the fix: because the wipe below runs
  # first, a sync that copies nothing leaves the host with NO kit, and aws s3 sync
  # exits 0 on an empty source. Assert the result rather than trust the exit code.
  #
  # See the NVFLARE sync above — same staleness trap. Flower's
  # mTLS chain (rootCA.pem / server.pem / client.pem) is
  # regenerated whenever the kit date changes; without a wipe
  # `aws s3 sync` can leave a previous rootCA in place and the
  # client fails the TLS handshake to fl-server.
  #
  # No `|| true` on the wipe, for the reason given in the NVFLARE stage above:
  # `find -mindepth 1 -delete` exits 0 on an empty directory anyway, so it could
  # only mask a real failure and leave the staleness the wipe exists to remove.
  vars:
    # For flower the compose mounts are ${FL_KIT_DIR}/net-1/{certificates,keys}.
    # Ends in "/" — consumers pass it bare, never with a slash appended (see FLIP#965).
    trust_s3_source: "s3://{{ flip_aicentre_bucket }}/fl-flower-participant-kits/{{ fl_kit_date }}/net-1/"
  shell: |
    set -euo pipefail
    mkdir -p "{{ fl_kit_dir }}/net-1"
    find "{{ fl_kit_dir }}/net-1" -mindepth 1 -delete
    aws s3 sync \
      "{{ trust_s3_source }}" \
      "{{ fl_kit_dir }}/net-1/" \
      --exclude "*" \
      --include "certificates/ca.crt" \
      --include "keys/supernode_credentials_{{ trust_num }}"
    if [ ! -s "{{ fl_kit_dir }}/net-1/certificates/ca.crt" ] ||
       [ ! -s "{{ fl_kit_dir }}/net-1/keys/supernode_credentials_{{ trust_num }}" ]; then
      echo "ERROR: Flower kit staging produced no usable kit in {{ fl_kit_dir }}/net-1." >&2
      echo "       Source: {{ trust_s3_source }} (slot {{ trust_num }})" >&2
      echo "       Check FLOWER_KIT_DATE matches an S3 prefix, that a kit exists for this" >&2
      echo "       slot, and that the instance role can kms:Decrypt the bucket CMK." >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: trust_sync
  changed_when: "'download:' in trust_sync.stdout or 'copy:' in trust_sync.stdout"
  when: fl_backend == "flower"
