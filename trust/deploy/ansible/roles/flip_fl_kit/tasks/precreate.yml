---
# Pre-create <fl_kit_dir>/net-1/services/<slot>/{local,startup,transfer} — the layout
# the trust-side prod compose mounts via ${FL_KIT_DIR}/net-1/services/${TRUST_NAME}/...
# (nvflare) or ${FL_KIT_DIR}/net-1/{certificates,keys} (flower). The operator then
# extracts the kit tarball into it by hand; if they override FL_KIT_DIR in their trust
# kit file they're responsible for the directory tree themselves. The s3 path does NOT
# do this: its net-1 wipe would delete whatever was pre-created.
- name: Create FL participant kit directories (default FL_KIT_DIR=/opt/flip/fl-kit)
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flip_owner }}"
    group: "{{ flip_group }}"
    mode: "0755"
  loop:
    - "{{ fl_kit_dir }}/net-1"
    - "{{ fl_kit_dir }}/net-1/services"
    - "{{ fl_kit_dir }}/net-1/services/{{ fl_kit_precreate_slot }}"
    - "{{ fl_kit_dir }}/net-1/services/{{ fl_kit_precreate_slot }}/local"
    - "{{ fl_kit_dir }}/net-1/services/{{ fl_kit_precreate_slot }}/startup"
    - "{{ fl_kit_dir }}/net-1/services/{{ fl_kit_precreate_slot }}/transfer"
    - "{{ fl_kit_dir }}/net-1/certificates"
    - "{{ fl_kit_dir }}/net-1/keys"
