---
- name: check the FL kit inputs
  ansible.builtin.assert:
    that:
      - fl_kit_source is defined and fl_kit_source in ["s3", "local", "precreate", "none"]
      - fl_backend is defined and fl_backend in ["nvflare", "flower"]
    fail_msg: >-
      fl_kit_source must be s3, local, precreate or none (got {{ fl_kit_source | default('unset') }}) and
      fl_backend must be nvflare or flower (got {{ fl_backend | default('unset') }}).
      The play sets fl_kit_source; pass -e fl_backend=<nvflare|flower>. A wrong value wipes and
      stages the wrong kit layout, and a missing source would stage nothing.

- name: ensure FL kit directory exists
  file:
    path: "{{ fl_kit_dir }}"
    state: directory
    owner: "{{ flip_owner }}"
    group: "{{ flip_group }}"
    mode: "0755"

# Static imports so a play-level tag (the EC2 play's `flkit`) reaches every task, and
# so `when:` is applied per imported task rather than to a dynamic include.
- name: stage the kit from S3
  import_tasks: s3.yml
  when: fl_kit_source == "s3"

- name: copy the kit from a directory on the controller
  import_tasks: local.yml
  when: fl_kit_source == "local"

- name: pre-create the kit directory tree for an out-of-band kit
  import_tasks: precreate.yml
  when: fl_kit_source == "precreate"

# The kit holds the FL client's private key, and both staging sources leave it 0644: the copy keeps
# the source's mode, aws s3 sync uses the umask. The owner is the image's user, as the Helm chart's
# stage-kit has it. precreate is skipped: there the operator extracts the kit afterwards.
- name: make the kit readable by the FL client only
  file:
    path: "{{ fl_kit_dir }}/net-1"
    state: directory
    recurse: true
    owner: "{{ fl_kit_owner }}"
    group: "{{ fl_kit_owner }}"
    mode: "u+rwX,go-rwx"
  when: fl_kit_source in ["s3", "local"]
