---
- name: ensure FL kit directory exists
  file:
    path: "{{ fl_kit_dir }}"
    state: directory
    owner: "{{ flip_owner }}"
    group: "{{ flip_group }}"
    mode: "0755"

# Static imports so a play-level tag (the EC2 play's `flkit`) reaches every task, and
# so `when:` is applied per imported task rather than to a dynamic include.
- name: stage the kit from S3
  import_tasks: s3.yml
  when: fl_kit_source == "s3"

- name: pre-create the kit directory tree for an out-of-band kit
  import_tasks: precreate.yml
  when: fl_kit_source == "precreate"
