---
# The canonical dataset carries no core vocabulary (FLIP#842/#843): it is
# licensed, so it is loaded separately here, into the cluster the seed filled,
# via a throwaway container on a loopback-only port. The loader skips tables that already
# hold the core vocabulary, so re-runs are safe. Bundle comes from the org S3
# bucket via the instance role — so this role needs the AWS CLI and a role or
# credentials that can read that bucket; it is the one data role an on-prem
# host cannot run as-is (`make -C trust load-omop-vocab` is the on-prem route).
- name: assert the cluster password extra-var is set
  assert:
    that:
      - omop_postgres_password is defined
      - omop_postgres_password | length > 0
    fail_msg: "omop_postgres_password is required (the kit's OMOP_POSTGRES_PASSWORD; passed by make seed-trust-data)"

- name: install postgresql-client and unzip
  apt:
    name:
      - postgresql-client
      - unzip
    state: present
    update_cache: yes

# Everything from the S3 fetch onwards is wrapped so the `always:` cleanup runs
# even when the unzip, the container, the readiness wait or the loader fails.
# Without it a mid-play failure leaves the licensed bundle at rest on the host.
#
# Both stages stage into a dot-prefixed temp path and rename only on success,
# so an interrupted download or extraction is never mistaken for a present
# bundle by the next run's `creates:` guard. Same idiom as `fetch-vocab-core`
# in trust/omop-db/Makefile.
- name: load the core vocabulary, cleaning up whatever happens
  block:
    - name: download core vocabulary bundle from S3 (instance role)
      shell: |
        set -euo pipefail
        aws s3 cp "s3://{{ omop_vocab_s3_bucket }}/vocab/{{ vocab_core_bundle }}.zip" "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp"
        mv "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp" "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
      args:
        creates: "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
        executable: /bin/bash

    - name: unzip core vocabulary bundle
      shell: |
        set -euo pipefail
        rm -rf "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"
        unzip -q "{{ omop_dir }}/{{ vocab_core_bundle }}.zip" -d "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"
        mv "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp" "{{ omop_dir }}/{{ vocab_core_bundle }}"
      args:
        creates: "{{ omop_dir }}/{{ vocab_core_bundle }}"
        executable: /bin/bash

    - name: copy vocabulary loader and constraints from the repo checkout
      copy:
        src: "{{ omop_db_files_dir }}/{{ item }}"
        dest: "{{ omop_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - load_core_vocab.sh
        - OMOPCDM_postgresql_5.4_constraints.sql

    - name: start throwaway database container on the seeded volume
      command: >
        docker run -d --name omop-vocab-load
        -v {{ omop_dir }}/db_data:/var/lib/postgresql/data
        -p 127.0.0.1:{{ vocab_load_port }}:5432
        {{ omop_db_image }}

    - name: wait for the database to accept connections
      command: docker exec omop-vocab-load pg_isready -U {{ omop_vocab_pg_user }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: stream the core vocabulary and apply constraints
      command: bash {{ omop_dir }}/load_core_vocab.sh {{ omop_dir }}/{{ vocab_core_bundle }} {{ omop_dir }}/OMOPCDM_postgresql_5.4_constraints.sql
      environment:
        OMOP_DB_HOST: "127.0.0.1"
        OMOP_DB_PORT: "{{ vocab_load_port }}"
        OMOP_POSTGRES_USER: "{{ omop_vocab_pg_user }}"
        OMOP_POSTGRES_PASSWORD: "{{ omop_postgres_password }}"
        OMOP_POSTGRES_DB: "{{ omop_vocab_pg_db }}"
  always:
    # Deleting the licensed content comes FIRST: a failing task in `always:`
    # aborts the remaining `always:` tasks, so with the container removal
    # ahead of it a `docker rm` against an unreachable daemon would leave
    # ~3.6GB of licensed vocabulary at rest on the host — exactly what this
    # task exists to prevent. The temp paths are included so an interrupted
    # download or extraction leaves nothing behind either.
    - name: remove the downloaded bundle (~3.6GB of licensed content does not belong at rest on the host)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
        - "{{ omop_dir }}/{{ vocab_core_bundle }}"
        - "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp"
        - "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"

    # This runs even when the container was never started. `docker rm -f`
    # already exits 0 on a missing container (since Docker 23), so only the
    # "No such container" case is tolerated explicitly — a genuine failure
    # (unreachable daemon, un-removable container) must still fail the play:
    # it would leave a Postgres container holding {{ omop_dir }}/db_data and
    # the loopback port, which the real omop-db later mounts.
    - name: stop the throwaway container
      command: docker rm -f omop-vocab-load
      register: vocab_rm
      changed_when: false
      failed_when: vocab_rm.rc != 0 and 'No such container' not in (vocab_rm.stderr | default(''))
