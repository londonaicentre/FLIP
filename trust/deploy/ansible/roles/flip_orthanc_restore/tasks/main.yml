---
# Restores the MOCK Orthanc storage snapshot into orthanc_data_dir.
# Dev/stag trusts only — never point this at a host fronting a real PACS.
- name: ensure trust_data_version is defined
  assert:
    that:
      - trust_data_version is defined
      - trust_data_version | string | length > 0
    fail_msg: "trust_data_version must be defined (contents of trust/.data_version, a tag on the trust-data dataset, e.g. 20260729)."

# Orthanc runs as the in-image `orthanc` user (UID 999) after the
# Docker-hardening pass on `trust/orthanc/Dockerfile`. The base and data
# directories — and everything extracted into them by `tar` (which runs
# as root) — must end up owned by UID 999 or Orthanc cannot write its
# SQLite index, ingest new DICOM, or update the storage area.
- name: ensure orthanc base directory exists
  file:
    path: "{{ orthanc_base_dir }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0755"

- name: download Orthanc archive from Hugging Face
  ansible.builtin.get_url:
    url: "{{ hf_base_url }}/{{ orthanc_trust_dir }}/{{ orthanc_archive }}"
    # Version-stamped for the same reason as the OMOP archive: with a fixed
    # name, get_url (force: false) skips the download when orthanc_data_version is
    # bumped and the extract below restores the previous version's DICOM.
    dest: "{{ orthanc_base_dir }}/{{ orthanc_archive }}"
    mode: "0644"

- name: clear existing Orthanc storage
  shell: rm -rf {{ orthanc_data_dir }}/*
  changed_when: false

- name: ensure orthanc data directory exists
  file:
    path: "{{ orthanc_data_dir }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0755"

- name: extract Orthanc data into orthanc-storage
  command: >
    tar -xf {{ orthanc_base_dir }}/{{ orthanc_archive }} -C {{ orthanc_data_dir }}

# Same accumulation as the OMOP archive: the stamped name keeps each
# orthanc_data_version's tarball on disk for good. Keep only the one just
# extracted.
- name: find superseded Orthanc archives
  ansible.builtin.find:
    paths: "{{ orthanc_base_dir }}"
    patterns: "trust{{ orthanc_trust_num }}_orthanc_data_*.tar"
    excludes: "{{ orthanc_archive }}"
    file_type: file
    recurse: false
  register: superseded_orthanc_archives

- name: remove superseded Orthanc archives
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ superseded_orthanc_archives.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: ensure Orthanc storage is owned by container UID 999 and writable
  file:
    path: "{{ orthanc_data_dir }}"
    owner: "999"
    group: "999"
    mode: "0755"
    recurse: true
