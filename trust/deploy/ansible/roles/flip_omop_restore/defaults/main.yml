---
omop_dir: /opt/flip/omop
# trust_num selects which trust's mock data package to load (e.g. "1" or "2").
# Pass via -e trust_num=2 for Trust_2 hosts. Defaults to "1" for
# backwards-compat with single-trust deployments.
omop_trust_num: "{{ trust_num | default('1') }}"
# trust_data_version is the tag from trust/.data_version, passed as an extra-var
# by the Makefile seed-trust-data target. One copy of each archive lives at an
# unversioned path on the dataset; the version is the revision the URL resolves at.
pgdata_trust_dir: "trust{{ omop_trust_num }}"
pgdata_archive: "trust{{ omop_trust_num }}_pgdata.tar"
# Mock data is fetched anonymously over HTTPS from the public Hugging Face
# dataset (no AWS CLI / credentials needed). Laid out per trust; archives are
# gzip-compressed tarballs named .tar (tar auto-detects gzip on extraction).
hf_trust_data_repo: "{{ trust_data_hf_repo | default('aicentreflip/trust-data') }}"
hf_trust_data_revision: "{{ trust_data_hf_revision | default(trust_data_version) }}"
hf_base_url: "https://huggingface.co/datasets/{{ hf_trust_data_repo }}/resolve/{{ hf_trust_data_revision }}"
