# Accounts to add to the `docker` group. Empty by default, deliberately: docker
# group membership is root-equivalent (any member can `docker run -v /:/host …`
# and chroot to the host fs). The EC2 play opts `ubuntu` in because that host is
# reachable only through SSM; the on-prem play leaves it empty and operators run
# docker via sudo. trust/deploy/ansible/tests/test_onprem_playbook.py pins that.
flip_docker_users: []
