#
# After Docker is installed (flip_docker may swap a distro docker.io for docker-ce): re-register the
# nvidia runtime the image's toolkit set up, then prove a container sees the GPU. An fl-client that
# silently falls back to CPU is the failure to catch here, not at training time.
---
- name: register the nvidia runtime with Docker
  command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk
  changed_when: "'Wrote updated config' in nvidia_ctk.stdout"
  when: trust_has_gpu | default(false)

- name: restart Docker to pick up the nvidia runtime
  systemd:
    name: docker
    state: restarted
  when: nvidia_ctk is changed

- name: check a container can see the GPU
  command: docker run --rm --gpus all ubuntu:24.04 nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
  register: gpu_container_check
  changed_when: false
  when: trust_has_gpu | default(false)

- name: report the GPU the fl-client will get
  debug:
    msg: "GPU visible in containers: {{ gpu_container_check.stdout }}"
  when: trust_has_gpu | default(false)
