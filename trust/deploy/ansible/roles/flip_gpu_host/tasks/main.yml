#
# Before the apt upgrade. A GPU image (the Deep Learning Base GPU AMI) ships the NVIDIA driver and
# container toolkit; a blanket upgrade would move the kernel out from under the driver's modules, so
# hold the driver and kernel the image shipped. A newer driver comes from a newer image, not apt.
# Sets trust_has_gpu for runtime.yml. Does nothing on a host without nvidia-smi.
---
- name: probe for nvidia-smi
  command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi_probe
  changed_when: false
  failed_when: false

- name: record whether this trust host has a GPU
  set_fact:
    trust_has_gpu: "{{ nvidia_smi_probe.rc == 0 }}"

- name: hold the NVIDIA driver and kernel packages the image shipped
  shell: |
    set -o pipefail
    dpkg-query -W -f='${Package} ${Status}\n' \
      | awk '$4 == "installed" && $1 ~ /^(nvidia-|libnvidia-|cuda-drivers|linux-(image|headers|modules|aws))/ {print $1}' \
      | xargs --no-run-if-empty apt-mark hold
  args:
    executable: /bin/bash
  register: gpu_hold
  changed_when: "'set on hold' in gpu_hold.stdout"
  when: trust_has_gpu
