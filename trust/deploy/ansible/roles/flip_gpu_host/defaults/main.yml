---
# The container runtime.yml runs nvidia-smi in: GHCR's mirror of uv's Debian image, the one the seed
# role pins, since a trust host reaches one registry (FLIP#1721). The runtime injects nvidia-smi but
# not the glibc pieces it links (libdl, librt), which the mirrored busybox lacks.
gpu_check_image: "ghcr.io/londonaicentre/mirror/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca"
