# FLIP#1187: the stores start empty and are seeded, with the trust stack stopped, exactly the
# way a dev host (`make -C trust ensure-seeded`) and the Kubernetes chart (the trust-seed hook)
# seed them — the one procedure in trust/seed_trust.sh, run here in uv's image against two
# throwaway containers on the host's data directories (the same pattern flip_omop_vocab
# uses): omop-db initialises its schema and roles on the empty volume, Orthanc its index,
# and the seeder loads this trust's `source_trust` slice of each project through them. The
# loaders come from THIS checkout (copied over, like the vocabulary loader), so the host runs
# what the operator deploys. No snapshot, no S3: the data is fetched anonymously from Hugging
# Face at the pinned tag. Idempotent — a .data_version bump re-runs it and replaces only the
# listed projects' rows and studies.
---
# The throwaway omop-db below starts a postmaster on {{ omop_dir }}/db_data, and Postgres will
# not refuse if the running stack's omop-db already has it open: that postmaster's PID in
# postmaster.pid is invisible from the new container's PID namespace, so it is taken as stale
# and crash recovery runs over a live database (#1190 review). deploy-trust now stops the
# stack before reaching this play; this guard covers the standalone `make seed-trust-data`.
# It matches any compose project's omop-db on the host, not just trust<trust_num>'s — the
# data directory is host-global, so a stack under another project name holds it just the
# same — and the omop-seed container an aborted run may have left behind.
- name: check nothing on this host has the OMOP data directory open
  shell: |
    docker ps -q -f label=com.docker.compose.service=omop-db
    docker ps -q -f name='^omop-seed$'
  register: omop_dir_holders
  changed_when: false

- name: refuse to seed while the trust's own cluster has the data directory open
  assert:
    that:
      - omop_dir_holders.stdout | trim | length == 0
    fail_msg: >-
      a container on this host has {{ omop_dir }}/db_data open ({{ omop_dir_holders.stdout | trim }}):
      stop the trust stack first — DOCKER_CONTEXT=flip-trust make -C trust down-trust-ec2
      KIT=<CODE> HUB=<env>, which is what deploy-trust runs before seeding — or remove a
      leftover throwaway with `docker rm -f omop-seed`; seeding over a live database would
      run crash recovery on it from a second postmaster.

- name: assert the kit credentials are set
  assert:
    that:
      - omop_postgres_password is defined and omop_postgres_password | length > 0
      - data_access_postgres_password is defined and data_access_postgres_password | length > 0
      - (not seed_orthanc_enabled | bool) or (orthanc_username is defined and orthanc_username | length > 0)
      - (not seed_orthanc_enabled | bool) or (orthanc_password is defined and orthanc_password | length > 0)
    fail_msg: >-
      omop_postgres_password, data_access_postgres_password and (with seed_orthanc) orthanc_username /
      orthanc_password are required — the kit's OMOP_POSTGRES_PASSWORD, DATA_ACCESS_POSTGRES_PASSWORD,
      ORTHANC_USERNAME and ORTHANC_PASSWORD, passed by make seed-trust-data

# The FL kit slot is only the DEFAULT partition (trust/Makefile says why: slots are claimed in
# registration order, partitions are a property of the dataset). A slot past the dataset's
# partition count — Trust_3 on the two-partition mock data, i.e. any third registered trust —
# has no slice of its own; the loader would refuse it ten minutes in, from inside the no_log'd
# container. Name the fix here instead.
- name: assert the source_trust partition exists in the dataset
  assert:
    that:
      - seed_source_trust | int >= 1
      - seed_source_trust | int <= seed_num_trusts | int
    fail_msg: >-
      source_trust {{ seed_source_trust }} is not a partition of the dataset (it has
      {{ seed_num_trusts }}): this trust's FL kit slot number is being used as the default and
      exceeds it. Pick the partition this trust should receive and pass it explicitly as
      SOURCE_TRUST=<n> to the seed: make seed-trust-data for the hub's trust EC2, make seed or
      make deploy for a node from trust/deploy/terraform/aws-ec2.

# omop-db's entrypoint takes ownership of its data dir itself (it runs as root with CHOWN);
# Orthanc runs as uid 999 with no way to chown, so its directories must be 999-owned first.
- name: create the OMOP data directory
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ omop_dir }}"
    - "{{ omop_dir }}/db_data"

- name: create the Orthanc storage directory owned by container UID 999
  file:
    path: "{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0755"
  loop:
    - "{{ orthanc_base_dir }}"
    - "{{ orthanc_data_dir }}"

- name: create the seed working directory
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ seed_dir }}"
    - "{{ seed_dir }}/omop-db"
    - "{{ seed_dir }}/work"

- name: copy the seed procedure and the loaders from the repo checkout
  copy:
    src: "{{ item.src }}"
    dest: "{{ seed_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "{{ flip_repo_root }}/trust/seed_trust.sh", dest: "seed_trust.sh" }
    - {
        src: "{{ flip_repo_root }}/trust/orthanc/seed_orthanc.py",
        dest: "seed_orthanc.py",
      }
    - {
        src: "{{ flip_repo_root }}/trust/omop-db/pyproject.toml",
        dest: "omop-db/pyproject.toml",
      }
    - { src: "{{ flip_repo_root }}/trust/omop-db/README.md", dest: "omop-db/README.md" }
    - { src: "{{ flip_repo_root }}/trust/omop-db/src/", dest: "omop-db/src/" }

- name: seed, cleaning up the throwaway containers whatever happens
  block:
    - name: start a throwaway omop-db on the data volume (initialises the schema on an empty one)
      command: >
        docker run -d --name omop-seed
        -v {{ omop_dir }}/db_data:/var/lib/postgresql/data
        -p 127.0.0.1:{{ seed_omop_port }}:5432
        -e POSTGRES_USER={{ seed_omop_user }}
        -e POSTGRES_PASSWORD={{ omop_postgres_password }}
        -e POSTGRES_DB={{ seed_omop_db }}
        -e DATA_ACCESS_POSTGRES_PASSWORD={{ data_access_postgres_password }}
        {{ omop_db_image }}
      no_log: true

    - name: start a throwaway Orthanc on the storage directory
      command: >
        docker run -d --name orthanc-seed
        -v {{ orthanc_data_dir }}:/var/lib/orthanc/db
        -p 127.0.0.1:{{ seed_orthanc_port }}:8042
        -e ORTHANC__REGISTERED_USERS={{ {orthanc_username: orthanc_password} | to_json | quote }}
        {{ orthanc_image }}
      no_log: true
      when: seed_orthanc_enabled | bool

    # FORCE_DICOM_VOCAB=1 (make seed-trust-data FORCE_DICOM_VOCAB=1) reloads the DICOM
    # vocabulary over one that reports itself present: its "already loaded" signal is a
    # single concept committed before the bulk load, so a run killed in between leaves a
    # database that skips the load forever. Without it, recovery here means a hand-run
    # psql against the trust's cluster.
    - name: run the seed procedure against both (uv image, host network, loaders from this checkout)
      command: >
        docker run --rm --network host
        -v {{ seed_dir }}:/seed
        -e WORK_DIR=/seed/work
        -e TOOLS_SPEC="omop-db-tools @ /seed/omop-db"
        -e SEEDER=/seed/seed_orthanc.py
        -e TRUST_DATA_VERSION={{ hf_trust_data_revision }}
        -e HF_TRUST_DATA_REPO={{ hf_trust_data_repo }}
        -e PROJECTS="{{ seed_project_list }}"
        -e SOURCE_TRUST={{ seed_source_trust }}
        -e NUM_TRUSTS={{ seed_num_trusts }}
        -e SEED_OMOP=true
        -e SEED_ORTHANC={{ 'true' if seed_orthanc_enabled | bool else 'false' }}
        -e FORCE_DICOM_VOCAB={{ '1' if seed_force_dicom_vocab | bool else '' }}
        -e OMOP_DB_HOST=127.0.0.1
        -e OMOP_DB_PORT={{ seed_omop_port }}
        -e OMOP_POSTGRES_USER={{ seed_omop_user }}
        -e OMOP_POSTGRES_PASSWORD={{ omop_postgres_password }}
        -e OMOP_POSTGRES_DB={{ seed_omop_db }}
        -e ORTHANC_URL=http://127.0.0.1:{{ seed_orthanc_port }}
        -e ORTHANC_USERNAME={{ orthanc_username | default('') }}
        -e ORTHANC_PASSWORD={{ orthanc_password | default('') }}
        {{ uv_image }} bash /seed/seed_trust.sh
      no_log: true
      register: seed_run

    - name: seed summary
      debug:
        msg: "{{ seed_run.stdout_lines | select('search', '^(seed_trust:|✅)') | list }}"
  # The command above is no_log (its argv carries the kit passwords), which also hides the
  # reason when it fails. The loaders print no secrets, so show the tail of what they said —
  # a broken download, a partition that does not exist, an unreachable store — before failing.
  rescue:
    - name: seed procedure output (last lines)
      debug:
        msg: "{{ ((seed_run.stdout_lines | default([])) + (seed_run.stderr_lines | default([])))[-40:] }}"
      when: seed_run is defined
    - name: the seed procedure failed
      fail:
        msg: "seed_trust.sh failed on the Trust EC2 — see the output above (rc {{ seed_run.rc | default('?') }})"
  always:
    - name: stop the throwaway containers
      command: docker rm -f {{ item }}
      loop: [omop-seed, orthanc-seed]
      register: seed_rm
      changed_when: false
      failed_when: seed_rm.rc != 0 and 'No such container' not in (seed_rm.stderr | default(''))

    - name: drop the fetched tables and DICOM sets (the seeded stores keep the data)
      file:
        path: "{{ seed_dir }}/work"
        state: absent

