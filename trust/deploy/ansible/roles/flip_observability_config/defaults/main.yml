---
# The repo's trust/observability tree, resolved from this role's own location so
# the play can live anywhere (deploy/providers/AWS/site.yml runs it too).
observability_src_dir: "{{ role_path }}/../../../../observability"
# What the production compose mounts by default (OBSERVABILITY_CONFIG_DIR).
observability_dest_dir: /opt/flip/config/observability
flip_owner: ubuntu
flip_group: ubuntu
# The files the Loki / Alloy / Grafana containers read, relative to both dirs.
observability_config_files:
  - alloy/config.alloy
  - loki/loki-config.yml
  - grafana/provisioning/datasources/loki.yml
  - grafana/provisioning/dashboards/dashboards.yml
  - grafana/provisioning/dashboards/trust-apis.json
