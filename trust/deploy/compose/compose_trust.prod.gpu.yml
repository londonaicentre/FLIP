# GPU passthrough overlay (production). Applied by trust/Makefile only when the kit
# declares NUM_AVAILABLE_GPUS > 0 (see GPU_OVERRIDE). Kept out of the base prod compose
# so a GPU-less host — the AWS EC2 t3.xlarge test trust — brings the fl-client up
# CPU-only instead of failing with a "could not select device driver ... [[gpu]]" error.
# Real on-prem trusts set NUM_AVAILABLE_GPUS >= 1 and get the host GPU(s) reserved for
# the fl-client. `count` tracks NUM_AVAILABLE_GPUS so the Docker reservation and the
# fl-client app's own GPU hint stay in lockstep; to pin specific GPUs later, replace
# `count` with `device_ids: ["0", "2"]` (the two are mutually exclusive in the spec).
#
# No Linux capability is added back here for GPU passthrough: the NVIDIA
# Container Toolkit injects device nodes/driver libraries via an OCI prestart
# hook at the runtime level, not through an in-container capability.

services:

  fl-client-net-1:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NUM_AVAILABLE_GPUS}
              capabilities: [gpu]
