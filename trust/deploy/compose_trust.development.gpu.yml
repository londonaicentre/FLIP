# GPU passthrough overlay (development). Applied by trust/Makefile only when the kit
# declares NUM_AVAILABLE_GPUS > 0 (see GPU_OVERRIDE). Replaces the old hardcoded
# `gpus: all`, so a GPU-less dev/CI box can bring the dev stack up CPU-only by setting
# NUM_AVAILABLE_GPUS=0 instead of failing on a missing NVIDIA driver. Dev runs both FL
# nets, so both fl-clients are covered. `count` tracks NUM_AVAILABLE_GPUS so the Docker
# reservation and the fl-client app's own GPU hint stay in lockstep; to pin specific
# GPUs later, replace `count` with `device_ids: ["0", "2"]` (mutually exclusive).
#
# No Linux capability is added back here for GPU passthrough: the NVIDIA
# Container Toolkit injects device nodes/driver libraries via an OCI prestart
# hook at the runtime level, not through an in-container capability.

services:

  fl-client-net-1:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NUM_AVAILABLE_GPUS}
              capabilities: [gpu]

  fl-client-net-2:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NUM_AVAILABLE_GPUS}
              capabilities: [gpu]
