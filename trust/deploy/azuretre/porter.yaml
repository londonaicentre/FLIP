# A FLIP trust node as an AzureTRE workspace service (FLIP#1792). DRAFT: not yet deployed on an
# AzureTRE. Laid out like AzureTRE v0.29.1's azureml service (own subnet) and Guacamole Linux VM.
---
schemaVersion: 1.0.0
name: tre-service-flip-node
version: 0.1.0
description: "A FLIP trust node: FLIP's Docker Compose node on a VM in its own workspace subnet (draft)"
dockerfile: Dockerfile.tmpl
registry: azuretre

custom:
  # Read by terraform/locals.tf; the keys are template_schema.json's vm_size enum. D*s_v5 is the
  # family FLIP's own Azure VM is tested on. CPU only: flip-node join sets no GPUs.
  vm_sizes:
    "4 CPU | 16GB RAM": Standard_D4s_v5
    "8 CPU | 32GB RAM": Standard_D8s_v5
    "16 CPU | 64GB RAM": Standard_D16s_v5

credentials:
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET
    sensitive: true

parameters:
  - name: workspace_id
    type: string
  - name: tre_id
    type: string
  - name: workspace_subscription_id
    type: string
    default: ""
  - name: address_space
    type: string
    description: "The node subnet's address space, allocated by the TRE API"
  - name: flip_release
    type: string
    description: "FLIP release tag (vX.Y.Z) the node installs at first boot"
  - name: fl_backend
    type: string
    default: "nvflare"
  - name: vm_size
    type: string
    default: "4 CPU | 16GB RAM"
  - name: fl_server_ip_addresses
    type: string
    description: "The FL server's IPv4 addresses (the resource processor passes an array as base64 JSON)"
  - name: fl_port
    type: integer
    default: 8002
  - name: enable_shutdown_schedule
    type: boolean
    default: false
  - name: shutdown_time
    type: string
    default: ""
  - name: shutdown_timezone
    type: string
    default: "UTC"

  # Added by the resource processor
  - name: id
    type: string
    description: "Resource ID"
    env: id
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    default: "tfstate"
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: false
  - name: arm_environment
    env: ARM_ENVIRONMENT
    type: string
    default: "public"

outputs:
  - name: vm_name
    type: string
    applyTo:
      - install
      - upgrade
  - name: kit_drop_url
    type: string
    applyTo:
      - install
      - upgrade
  - name: kit_upload_command
    type: string
    applyTo:
      - install
      - upgrade
  - name: status_command
    type: string
    applyTo:
      - install
      - upgrade
  - name: join_command
    type: string
    applyTo:
      - install
      - upgrade

mixins:
  - terraform:
      clientVersion: 1.14.3

install:
  - terraform:
      description: "Deploy the FLIP trust node"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        workspace_id: ${ bundle.parameters.workspace_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        address_space: ${ bundle.parameters.address_space }
        flip_release: ${ bundle.parameters.flip_release }
        fl_backend: ${ bundle.parameters.fl_backend }
        vm_size: ${ bundle.parameters.vm_size }
        fl_server_ip_addresses: ${ bundle.parameters.fl_server_ip_addresses }
        fl_port: ${ bundle.parameters.fl_port }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.name }-${ bundle.parameters.id }
      outputs:
        - name: vm_name
        - name: kit_drop_url
        - name: kit_upload_command
        - name: status_command
        - name: join_command

upgrade:
  - terraform:
      description: "Upgrade the FLIP trust node"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        workspace_id: ${ bundle.parameters.workspace_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        address_space: ${ bundle.parameters.address_space }
        flip_release: ${ bundle.parameters.flip_release }
        fl_backend: ${ bundle.parameters.fl_backend }
        vm_size: ${ bundle.parameters.vm_size }
        fl_server_ip_addresses: ${ bundle.parameters.fl_server_ip_addresses }
        fl_port: ${ bundle.parameters.fl_port }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.name }-${ bundle.parameters.id }
      outputs:
        - name: vm_name
        - name: kit_drop_url
        - name: kit_upload_command
        - name: status_command
        - name: join_command

uninstall:
  - terraform:
      description: "Delete the FLIP trust node"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        workspace_id: ${ bundle.parameters.workspace_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        address_space: ${ bundle.parameters.address_space }
        flip_release: ${ bundle.parameters.flip_release }
        fl_backend: ${ bundle.parameters.fl_backend }
        vm_size: ${ bundle.parameters.vm_size }
        fl_server_ip_addresses: ${ bundle.parameters.fl_server_ip_addresses }
        fl_port: ${ bundle.parameters.fl_port }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.name }-${ bundle.parameters.id }
