#
# Overlay for a managed AKS cluster (FLIP#1390): deploy with PLATFORM_VALUES=values-aks.yaml, e.g.
#   make -C trust/deploy/helm deploy-trust-k8s KIT=<CODE> HUB=<stag|prod> \
#     PLATFORM_VALUES=values-aks.yaml KUBE_CONTEXT=<aks context>
# after `make kit-secret KIT_SRC=<slot kit dir>` has put the FL kit in its Secret. Set
# K8S_PLATFORM_VALUES=values-aks.yaml in the kit file instead and every deploy and upgrade of
# that KIT applies it, so a later run cannot drop it.

flClient:
  kit:
    # A managed node pool replaces nodes at will: the kit comes from a Secret, never the node.
    source: secret

omopDb:
  persistence:
    # A fresh Azure Disk has lost+found at its root, which initdb refuses.
    pgdataSubdir: pgdata
  vocabLoad:
    # The S3 vocabulary load needs an AWS route and, on a node role, the metadata endpoint, which
    # on Azure hands out managed-identity tokens. Off here whatever bucket the kit names, so the
    # NetworkPolicy keeps 169.254.169.254 closed and no failing post-install hook sinks the release.
    enabled: false

xnat:
  db:
    persistence:
      pgdataSubdir: pgdata
