#
# Requests for a single 4-vCPU, 16 GiB node (Standard_D4s_v5, the Azure free trial's whole quota),
# layered after values-aks.yaml: PLATFORM_VALUES="values-aks.yaml values-small-node.yaml".
# Requests only: limits are unchanged, so a pod still bursts when the node is idle. A real trust's
# node pool is larger (and GPU-equipped for training); leave this overlay out there.

flClient:
  resources:
    requests:
      cpu: 250m
      memory: 2Gi

xnat:
  web:
    resources:
      requests:
        cpu: 500m
