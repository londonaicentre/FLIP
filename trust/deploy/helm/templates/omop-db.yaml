{{- if .Values.omopDb.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-omop-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
data:
  POSTGRES_USER: {{ .Values.omopDb.credentials.user | quote }}
  POSTGRES_DB: {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: omop-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flip-trust.fullname" . }}-omop-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
spec:
  serviceName: omop-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: omop-db
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: omop-db
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.omopDb.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.omopDb.image.pin "global" .Values.global.image.tag "own" .Values.omopDb.image.tag) }}"
          imagePullPolicy: {{ .Values.omopDb.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-omop-db
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: omop-postgres-password
            - name: DATA_ACCESS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: data-access-postgres-password
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Gate on TCP, not the socket. The init-time server that runs
                    # /docker-entrypoint-initdb.d listens on the local socket only
                    # (listen_addresses=''), so a socket pg_isready goes green while the
                    # image's own 50_create_readonly_users.sh may still be mid-run — and
                    # a hook that then fails is killed by the kubelet mid-initdb. TCP
                    # readiness means the final server, i.e. the init scripts are done.
                    tries=0
                    until pg_isready -h 127.0.0.1 -p 5432 -U {{ .Values.omopDb.credentials.user | quote }} -d {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }} >/dev/null 2>&1; do
                      tries=$((tries + 1))
                      if [ "$tries" -ge 600 ]; then
                        echo "omop-db postStart: gave up waiting for postgres to accept TCP after ${tries} attempts;" \
                             "data_analyst_reader NOT provisioned" >&2
                        exit 1
                      fi
                      sleep 1
                    done
                    # Provision data_analyst_reader from the SAME file the Compose trust
                    # runs at first initdb — the image ships it at
                    # /flip/omop/create_readonly_users.sql — so both deployment paths
                    # grant exactly one thing: membership of omop_readonly_base (CONNECT,
                    # USAGE on omop, SELECT on its tables and sequences, DML/DDL revoked,
                    # connection limit, statement_timeout). It has to run here as well as
                    # from /docker-entrypoint-initdb.d because any PVC that already
                    # carries PG_VERSION — every upgrade over an existing release —
                    # makes the entrypoint skip initdb.d, leaving the roles as that
                    # release created them. The file is idempotent and converges an
                    # existing role: a
                    # release before FLIP#904 granted pg_read_all_data here instead —
                    # SELECT on every schema — and the file REVOKEs that, so upgrading
                    # over such a PVC narrows the live role rather than merely not
                    # widening it again.
                    #
                    # Only what the file cannot know is added after it: the password is
                    # re-applied unconditionally so a role left holding the hash it was
                    # initialised with and a rotated Secret both end up on
                    # DATA_ACCESS_POSTGRES_PASSWORD, and the database search_path so
                    # unqualified table refs resolve to omop.
                    #
                    # Same shape as xnat-db.yaml's hook, for the same reasons: psql is the
                    # `if` condition with ON_ERROR_STOP=1 so a failed statement fails the
                    # hook instead of printing success; the `\set` backtick keeps the
                    # password out of psql's argv (printenv rather than echo so the
                    # chart's credential-logging CI guard has nothing to match); the two
                    # SETs stop a server-side error on the ALTER from writing the new
                    # plaintext password into the container log; the outcome is reported
                    # by RAISE WARNING into the postgres log, which IS the container's
                    # log stream, because postStart stdout is surfaced nowhere on
                    # success. Heredoc body tab-indented so `<<-` does the stripping.
                    #
                    # The closing check is what makes the outcome visible: the REVOKE lives
                    # in the image's copy of the file, so an omopDb.image.tag built before
                    # it landed runs cleanly here and leaves the role exactly as wide as it
                    # was. A WARNING rather than a failure — the schema pin in
                    # data-access-api's validate_query still holds, as it always has, and
                    # failing the hook would take the whole trust down for a
                    # defence-in-depth narrowing — but it names the fix.
                    if ! psql -X -q -v ON_ERROR_STOP=1 -U {{ .Values.omopDb.credentials.user | quote }} -d {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }} <<-'EOSQL'
                    	SET log_statement = none;
                    	SET log_min_error_statement = panic;
                    	\set data_analyst_password `printenv DATA_ACCESS_POSTGRES_PASSWORD`
                    	\i /flip/omop/create_readonly_users.sql
                    	ALTER ROLE data_analyst_reader WITH PASSWORD :'data_analyst_password';
                    	ALTER DATABASE {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }} SET search_path = omop, public;
                    	DO $$ BEGIN
                    	  IF pg_has_role('data_analyst_reader', 'pg_read_all_data', 'MEMBER') THEN
                    	    RAISE WARNING 'omop-db postStart: data_analyst_reader STILL holds pg_read_all_data (SELECT on every schema) — the image''s /flip/omop/create_readonly_users.sql predates FLIP#904; point omopDb.image.tag at an omop-db image built from a newer trust/omop-db';
                    	  ELSE
                    	    RAISE WARNING 'omop-db postStart: data_analyst_reader provisioned from /flip/omop/create_readonly_users.sql (omop-scoped), password synced';
                    	  END IF;
                    	END $$;
                    	EOSQL
                    then
                      echo "omop-db postStart: FAILED to provision data_analyst_reader from /flip/omop/create_readonly_users.sql;" \
                           "data-access-api will not authenticate or will not see omop" >&2
                      exit 1
                    fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.omopDb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.omopDb.credentials.user | quote }}
                - -d
                - {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }}
            initialDelaySeconds: {{ .Values.omopDb.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.omopDb.probes.liveness.periodSeconds }}
            # pg_isready forks a client and connects; under a heavy write load
            # (the vocabulary-load post-install hook COPYs ~33M rows into concept_ancestor)
            # that can take many seconds, especially on slow or emulated hosts.
            # Kubernetes defaults timeoutSeconds to 1 and failureThreshold to 3,
            # so the DEFAULTS restart Postgres mid-load and abort the very hook
            # this chart ships — the connection dies with
            #   FATAL: terminating connection due to administrator command
            # Give the probe room; a genuinely wedged Postgres still trips it.
            timeoutSeconds: {{ .Values.omopDb.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.omopDb.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.omopDb.credentials.user | quote }}
                - -d
                - {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }}
            initialDelaySeconds: {{ .Values.omopDb.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.omopDb.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.omopDb.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.omopDb.probes.readiness.failureThreshold }}
  {{- if .Values.omopDb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "flip-trust.labels" . | nindent 10 }}
          app.kubernetes.io/component: omop-db
      spec:
        accessModes:
          - {{ .Values.omopDb.persistence.accessMode }}
        {{- if .Values.omopDb.persistence.storageClassName }}
        storageClassName: {{ .Values.omopDb.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.omopDb.persistence.size }}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  {{- end }}
{{- else }}
# External omop-db: create a minimal Service to point at the external host
apiVersion: v1
kind: Service
metadata:
  name: omop-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
    flip/external: "true"
spec:
  type: ExternalName
  externalName: {{ .Values.omopDb.external.host | quote }}
  ports:
    - port: {{ .Values.omopDb.external.port }}
      targetPort: {{ .Values.omopDb.external.port }}
      protocol: TCP
      name: postgres
{{- end }}
