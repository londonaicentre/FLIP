{{- if and .Values.xnat.enabled .Values.xnat.db.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
data:
  # No POSTGRES_USER: the stock entrypoint would then create the superuser under
  # that name and there would be exactly one role. The superuser stays `postgres`
  # (as on the swarm path, trust/xnat/docker-compose-stack.yml) and the image's
  # baked XNAT.sql creates `xnat` as a separate, non-superuser application role.
  POSTGRES_DB: "xnat"
  XNAT_DATASOURCE_USERNAME: {{ .Values.xnat.db.datasourceUsername | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  type: {{ .Values.xnat.db.service.type }}
  ports:
    - port: {{ .Values.xnat.db.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  serviceName: xnat-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-db
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-db
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.xnat.db.image.repository }}:{{ .Values.xnat.db.image.tag }}"
          imagePullPolicy: {{ .Values.xnat.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-xnat-db
          env:
            # The Postgres superuser. Distinct from the xnat application role
            # below (FLIP-PT-056) — pointing both at one key would make the app
            # role's password superuser-equivalent, and the xnat-db entrypoint
            # guard now refuses to start when the two match.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-admin-password
            # Consumed by the image's XNAT.sql at first initdb to create the
            # `xnat` role, and re-applied to the live role on every start by the
            # postStart hook below; also what xnat-web and imaging-api
            # authenticate with.
            - name: XNAT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # The init-time server that runs XNAT.sql (and the rest of
                    # /docker-entrypoint-initdb.d) listens on the local socket only
                    # (listen_addresses=''), so a TCP probe only succeeds against the final
                    # server. On a first init that means XNAT.sql has already created the role;
                    # on an already-populated PVC the entrypoint skips
                    # /docker-entrypoint-initdb.d altogether, so the role is whatever the volume
                    # already held — the restore case the next block is here to cover.
                    tries=0
                    until pg_isready -h 127.0.0.1 -p 5432 -U {{ .Values.xnat.db.datasourceUsername | quote }} >/dev/null 2>&1; do
                      tries=$((tries + 1))
                      if [ "$tries" -ge 600 ]; then
                        echo "xnat-db postStart: gave up waiting for postgres to accept TCP after ${tries} attempts;" \
                             "xnat role password NOT synced" >&2
                        exit 1
                      fi
                      sleep 1
                    done
                    # Re-apply the `xnat` role's password on every start: XNAT.sql (baked into
                    # the image under /docker-entrypoint-initdb.d) sets it only at the first
                    # initdb of an empty PVC, so a rotated xnat-datasource-password otherwise
                    # never reaches the live role (a PVC snapshot or pg_dumpall restore likewise
                    # brings back the old hash until the next restart). Same idea as
                    # omop-db.yaml's data_analyst_reader sync but narrower: that one CREATEs the
                    # role if absent; this one only ALTERs.
                    #
                    # Connects as `postgres` over the local socket (stock-image pg_hba
                    # `local all all trust`, so no credential is needed) rather than as `xnat`
                    # itself. PG12 does not redact `ALTER ROLE ... PASSWORD` on a server-side
                    # error, and the image's default log_min_error_statement (error) would
                    # otherwise write the new plaintext password into the container's log stream
                    # on any error on that statement. Authenticating as `xnat` would let a holder
                    # of the *current* xnat credential force exactly that error (e.g.
                    # `ALTER ROLE xnat SET default_transaction_read_only = on` — USERSET, no
                    # CREATEROLE needed) to leak the *new* password on the next rotation. The two
                    # SET statements below close that: log_statement=none suppresses the
                    # statement text on success, and log_min_error_statement=panic means nothing
                    # short of a server crash logs the erroring statement either.
                    #
                    # The outcome is reported by psql rather than by the shell. postStart stdout
                    # goes nowhere (the kubelet surfaces it only in a FailedPostStartHook event)
                    # and /proc/1/fd/1 is not writable in this image: PID 1 is postgres under
                    # uid 70 via su-exec, and dropping credentials clears the process's dumpable
                    # flag, so /proc/1/fd is ptrace-gated and Docker grants no CAP_SYS_PTRACE —
                    # writing there fails as both root and uid 70. RAISE WARNING instead goes to
                    # the postgres server log, which is the container's own log stream. psql is
                    # the `if` condition so ON_ERROR_STOP=1 is load-bearing: a missing `xnat`
                    # role (a PVC restored without globals) must fail the hook loudly, not print
                    # success. The `\set pw` backtick keeps the password out of psql's argv (the
                    # idiom XNAT.sql itself uses) — `printenv` rather than `echo "$VAR"` because
                    # a rendered `echo` of a *PASSWORD/SECRET/TOKEN var is what the chart's
                    # credential-logging CI guard looks for, and busybox provides the applet
                    # anyway. The heredoc body is tab-indented so `<<-` does the stripping
                    # rather than YAML's de-indent.
                    if ! psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
                           -v u={{ .Values.xnat.db.datasourceUsername | quote }} <<-'EOSQL'
                    	SET log_statement = none;
                    	SET log_min_error_statement = panic;
                    	\set pw `printenv XNAT_DATASOURCE_PASSWORD`
                    	ALTER ROLE :"u" WITH PASSWORD :'pw';
                    	DO $$ BEGIN RAISE WARNING 'xnat-db postStart: xnat role password synced'; END $$;
                    	EOSQL
                    then
                      echo "xnat-db postStart: FAILED to sync the xnat role password;" \
                           "xnat-web and imaging-api will not authenticate" >&2
                      exit 1
                    fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.xnat.db.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 5
            periodSeconds: 5
  {{- if .Values.xnat.db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "flip-trust.labels" . | nindent 10 }}
          app.kubernetes.io/component: xnat-db
      spec:
        accessModes:
          - {{ .Values.xnat.db.persistence.accessMode }}
        {{- if .Values.xnat.db.persistence.storageClassName }}
        storageClassName: {{ .Values.xnat.db.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.xnat.db.persistence.size }}
  {{- end }}
{{- end }}
