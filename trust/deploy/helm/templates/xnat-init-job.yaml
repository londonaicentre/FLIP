{{- if and .Values.xnat.enabled .Values.xnat.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
    app.kubernetes.io/part-of: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-init
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      # The service account used to be created here by a sibling postgres:17-alpine
      # container that INSERTed straight into xdat_user with a fixed bcrypt hash.
      # That is removed: the row it wrote has no xhbm_xdat_user_auth record, which
      # XNAT 1.9.3 back-filled on the later password PUT but 1.10.0 does not, so the
      # account could never authenticate. configure-xnat-web now creates it through
      # POST /xapi/users instead — see the comment at that call.
      # configure-xnat-web runs as an INIT container, not a sibling.
      #
      # Both used to run concurrently in containers[], with configure-dcm2niix
      # polling /xapi/siteConfig for up to 300s waiting for the activation that
      # configure-xnat-web performs. On a slow host that budget expires first and
      # configure-dcm2niix exits 1. Under restartPolicy: OnFailure the kubelet
      # restarts only the FAILED container, so configure-xnat-web keeps running
      # (verified: it held restartCount=0 and its original startedAt across a
      # configure-dcm2niix restart) — but the retry re-enters the same race, and
      # a waiter that outlives the activation it is waiting for is a timing
      # accident rather than a guarantee.
      #
      # An initContainer runs to completion before containers[] start, which
      # removes the race by construction rather than by widening the timeout.
      #
      # It does make the waits strictly serial rather than overlapping, so the
      # theoretical ceiling rises: this container's readiness wait (600-1200s) plus
      # the plugin gate (600-1200s), then configure-dcm2niix's own readiness wait
      # (900s, configure-dcm2niix.sh's since FLIP#1451) — 35 to 55 minutes, against
      # roughly 50 at the old max() of the two chains. Neither figure is reachable: `make deploy` passes
      # `--timeout $(HELM_TIMEOUT)`, which bounds the hook below both, and did so
      # before this change too. Observed installs complete in 37-69s on a laptop
      # kind cluster and ~22 minutes on a real trust cluster. If a budget here is
      # ever raised past HELM_TIMEOUT (30m by default, trust/deploy/helm/Makefile),
      # raise that with it: the extra budget is otherwise unreachable, because Helm
      # stops waiting first and marks the release failed. (It does not stop this Job —
      # there is no activeDeadlineSeconds here and the delete policy is
      # before-hook-creation,hook-succeeded, so the Job runs on while the release
      # already reads as failed.) The hook failure then names helm rather than the wait
      # that expired — exactly how FLIP#1228 hid a correct chart behind five
      # consecutive "Job not ready" upgrades.
      initContainers:
        - name: configure-xnat-web
          # Runs the same configure-xnat.sh the Compose deployment runs, from the same image that
          # ships it (trust/xnat/xnat/Dockerfile ADDs config/ to ${XNAT_ROOT}/config). This used to
          # be ~380 lines of shell inlined here plus a third copy in a ConfigMap, and the three had
          # drifted: the inlined copy hardcoded the mocked Orthanc and ignored the chart's own
          # orthanc.dicomHost / dicomPort / dicomAet values, which is why the external-PACS override
          # never actually redirected DQR (FLIP#993). One script, one place, covered by
          # trust/xnat/tests/.
          #
          # configure-xnat.sh is self-contained: it waits for XNAT, waits for the DQR plugin routes
          # via wait-for-xnat-plugins.sh, then applies site, user, DQR, SCP receiver and PACS
          # configuration. It short-circuits when the site is already initialised, so re-running on
          # helm upgrade is safe.
          #
          # The `cd /data/xnat/config` below is a literal on purpose. XNAT_ROOT is a build ARG only —
          # the image never exports it (the Dockerfile exports XNAT_HOME, not XNAT_ROOT), so there is
          # no image-provided variable to read it back from at runtime. And /data/xnat is pinned
          # chart-wide, not just here: xnat-web's six persistent-volume mountPaths, its XNAT_HOME, its
          # -Dxnat.home, and the Container Service ConfigMap's "combined-path-translation" below all
          # spell it out. An image rebuilt with a different XNAT_ROOT breaks every one of those with
          # or without this line, so a value here would advertise a configurability the chart does not
          # have. If XNAT_ROOT ever needs to move, it moves in all of those places at once.
          image: "{{ .Values.xnat.web.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.xnat.image.pin "global" .Values.global.image.tag "own" .Values.xnat.web.image.tag) }}"
          imagePullPolicy: {{ .Values.xnat.web.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              cd /data/xnat/config
              bash configure-xnat.sh
          env:
            - name: XNAT_URL
              value: "http://xnat-web:8080"
            # One admin-password probe round per run: restartPolicy: OnFailure already retries
            # this container, and in-script retries on top would multiply the failed logins a
            # wrong password costs toward XNAT's ~20-login lockout (FLIP#1384).
            - name: XNAT_AUTH_PROBE_ATTEMPTS
              value: "1"
            - name: XNAT_ADMIN_USER
              value: {{ .Values.xnat.web.adminUser | quote }}
            # Both map to the same secret key, matching the xnat-web deployment: on a fresh install
            # XNAT is seeded with this password, and configure-xnat.sh rotates from it to itself.
            - name: XNAT_ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
            - name: XNAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
            - name: XNAT_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-user
            - name: XNAT_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-password
            # DICOM SCP receiver: the port XNAT binds and registers, and the AE title the PACS
            # addresses its C-STORE association to. Must match what the PACS has registered.
            # No `| default` here: Helm substitutes a default for an empty string too, which would
            # hand the script a value it considers configured and cancel its fail-loud guard. The
            # chart's own defaults live in values.yaml; an operator who blanks one gets an error.
            - name: XNAT_PORT
              value: {{ .Values.xnat.web.dicomPort | quote }}
            - name: XNAT_AETITLE
              value: {{ .Values.xnat.web.dicomAet | quote }}
            # Upstream PACS. Defaults are the mocked Orthanc; a real trust overrides them.
            - name: PACS_HOST
              value: {{ .Values.pacs.host | quote }}
            - name: PACS_AETITLE
              value: {{ .Values.pacs.aeTitle | quote }}
            - name: PACS_QR_PORT
              value: {{ .Values.pacs.qrPort | quote }}
            - name: PACS_LABEL
              value: {{ .Values.pacs.label | quote }}
            - name: PACS_SUPPORTS_EXTENDED_NEGOTIATIONS
              value: {{ .Values.pacs.supportsExtendedNegotiations | quote }}
            # Throttle: a production PACS may refuse further associations after a certain volume.
            - name: PACS_AVAILABILITY_DAYS
              value: {{ .Values.pacs.availability.days | quote }}
            - name: PACS_AVAILABILITY_START
              value: {{ .Values.pacs.availability.start | quote }}
            - name: PACS_AVAILABILITY_END
              value: {{ .Values.pacs.availability.end | quote }}
            - name: PACS_THREADS
              value: {{ .Values.pacs.availability.threads | quote }}
            - name: PACS_UTILIZATION_PERCENT
              value: {{ .Values.pacs.availability.utilizationPercent | quote }}
            - name: DQR_MAX_PACS_REQUEST_ATTEMPTS
              value: {{ .Values.pacs.dqr.maxRequestAttempts | quote }}
            - name: DQR_RETRY_WAIT_SECONDS
              value: {{ .Values.pacs.dqr.retryWaitSeconds | quote }}
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      containers:
        # Configures the XNAT Container Service (its native Kubernetes backend, available since
        # container-service 3.2.0), registers or updates the dcm2niix command, repairs the
        # projects' DICOM->NIfTI triggers and enables the Event Service, so imaging-api can create
        # per-project event subscriptions.
        #
        # Runs the same configure-dcm2niix.sh the Compose deployment runs, from the same image
        # that ships it, with XNAT_CS_BACKEND=kubernetes selecting the backend registration —
        # exactly as configure-xnat-web above runs configure-xnat.sh (FLIP#993). This used to be
        # ~300 lines of shell inlined here, plus a ConfigMap of hand-synced copies of
        # dcm2niix_command.json, the Kubernetes backend entry and anon_script.das, and the two
        # copies had drifted: only this one deleted and re-registered dcm2niix without ever
        # pinging the backend, and only the Compose one registered an image host. Since FLIP#1451
        # there is one script, covered for both backends by trust/xnat/tests/, and it updates the
        # command in place so every project's trigger keeps its wrapper id.
        #
        # The image, and with it the script, follows xnat.web.image (and xnat.image.pin, the kit's
        # XNAT_TAG). An image built before FLIP#1451 carries a Docker-only script that dies under
        # `set -u` on DATA_PATH, which would surface as a bare failed helm upgrade, so the image is
        # checked first and refused by name.
        - name: configure-dcm2niix
          image: "{{ .Values.xnat.web.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.xnat.image.pin "global" .Values.global.image.tag "own" .Values.xnat.web.image.tag) }}"
          imagePullPolicy: {{ .Values.xnat.web.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              cd /data/xnat/config
              if ! grep -q XNAT_CS_BACKEND configure-dcm2niix.sh; then
                echo "ERROR: xnat-web image {{ .Values.xnat.web.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.xnat.image.pin "global" .Values.global.image.tag "own" .Values.xnat.web.image.tag) }} predates FLIP#1451: its configure-dcm2niix.sh configures Docker only, not this chart's Kubernetes backend." >&2
                echo "  xnat.image.pin (the kit's XNAT_TAG) or xnat.web.image.tag holds it back; use an xnat-web image from the release that ships this chart, or later." >&2
                exit 1
              fi
              bash configure-dcm2niix.sh
          env:
            - name: XNAT_URL
              value: "http://xnat-web:8080"
            - name: XNAT_CS_BACKEND
              value: "kubernetes"
            # The single xnat-web data PVC, whose root holds both archive/ and build/: the
            # Container Service mounts it into every conversion Job (FLIP#565).
            - name: XNAT_CS_PVC_NAME
              value: "{{ include "flip-trust.fullname" . }}-xnat-web"
            - name: XNAT_ADMIN_USER
              value: {{ .Values.xnat.web.adminUser | quote }}
            - name: XNAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
{{- end }}
