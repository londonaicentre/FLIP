# The published omop-db image and the seeded data carry no licensed vocabulary (FLIP#842/843):
# this Job loads the licensed core vocabulary into the running database after
# install/upgrade, using the image's own loader, from the unpacked bundle the operator
# staged onto the node (FLIP#923: `make download-vocab` or an Athena export, then
# `make stage-vocab`). The chart fetches nothing and needs no cloud credentials.
#
# The loader skips every table that already holds the vocabulary and reads the bundle only
# for those it loads, so a routine upgrade costs a few queries. It still applies the FK
# constraints each run, which is how a previous run that loaded every table and then died
# before applying them heals on the next upgrade.
#
# So the staged folder is needed only for the first load, and the hostPath is
# DirectoryOrCreate rather than Directory. The kubelet mounts every volume before any
# container (init containers included) starts, so nothing in the pod can skip the mount, and
# whether the database is loaded is unknowable at render time. With `Directory`, a folder
# removed after the first load (or a rebuilt node) would hold the pod in ContainerCreating
# until HELM_TIMEOUT and fail the upgrade; with DirectoryOrCreate the kubelet leaves an empty
# folder there, the probe below finds the vocabulary loaded, and nothing is read from it.
#
# Gated on hostPath as well as enabled: the licensed bundle has no public mirror, so with
# nothing staged there is nothing this Job could do — no hostPath ⇒ no Job ⇒ the release
# installs cleanly. NOTES.txt announces the skip so it is not silent.
{{- $vocab := .Values.omopDb.vocabLoad }}
{{- range $key := list "s3Bucket" "awsProfile" "hostAwsMount" "fetchResources" "workDirSize" "bundleName" }}
{{- if hasKey $vocab $key }}
{{- fail (printf "omopDb.vocabLoad.%s was removed (FLIP#923): the chart no longer fetches the vocabulary from S3. Unpack the bundle into a folder (make -C trust/deploy/helm download-vocab with S3 access, or an OHDSI Athena export), stage it with make -C trust/deploy/helm stage-vocab VOCAB_DIR=<folder> KUBE_CONTEXT=<ctx>, set omopDb.vocabLoad.hostPath to where it was staged, and drop %s from your values (re-run sync-kit for a generated override)." $key $key) }}
{{- end }}
{{- end }}
{{- if and .Values.omopDb.enabled $vocab.enabled $vocab.hostPath }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-omop-vocab-load
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-vocab-load
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # No `hook-succeeded`, unlike omop-db-init-job: the failure mode of a missing
    # vocabulary is silence (cohort queries return nothing), so the completed Job
    # is the operator's evidence that the load ran and what it skipped. Exactly
    # one lingers — the next upgrade replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: omop-vocab-load
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with $vocab.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: load-vocab
          image: "{{ .Values.omopDb.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.omopDb.image.pin "global" .Values.global.image.tag "own" .Values.omopDb.image.tag) }}"
          imagePullPolicy: {{ .Values.omopDb.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # The release's own rollout may still be in flight: the chart deploys with
              # `helm upgrade --install` and no --wait. Timing out here fails the Pod, and
              # after backoffLimit the whole release — deliberately: a database that never
              # comes up is not a state this Job can load into.
              attempts=0
              until pg_isready -h "${OMOP_DB_HOST}" -p "${OMOP_DB_PORT}" > /dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "${attempts}" -ge 60 ]; then
                  echo "omop-db not reachable after ${attempts} attempts" >&2
                  exit 1
                fi
                sleep 5
              done
              # Already loaded (every upgrade after the first): the loader below reads nothing
              # from /vocab and only re-applies the constraints, so the folder may be gone.
              # Otherwise fail with the cause, rather than on the first missing CSV.
              if /flip/omop/load_core_vocab.sh --check; then
                echo "Core vocabulary already loaded: the staged folder is not read."
              elif [ ! -f /vocab/CONCEPT.csv ]; then
                echo "Core vocabulary not loaded and the staged folder (omopDb.vocabLoad.hostPath) on this node holds no CONCEPT.csv: stage it with make -C trust/deploy/helm stage-vocab, on the node this Job runs on (omopDb.vocabLoad.nodeSelector)." >&2
                exit 1
              fi
              /flip/omop/load_core_vocab.sh /vocab /flip/omop/constraints.sql
          env:
            {{- include "flip-trust.omopVocabDbEnv" . | nindent 12 }}
          resources:
            {{- toYaml $vocab.loadResources | nindent 12 }}
          volumeMounts:
            - name: vocab
              mountPath: /vocab
              readOnly: true
      volumes:
        - name: vocab
          hostPath:
            path: {{ $vocab.hostPath | quote }}
            type: DirectoryOrCreate
{{- end }}
