# Caps how many dcm2niix Jobs run at once: they are the namespace's only BestEffort pods
# (FLIP#1448; README "Container Service jobs").
{{- $max := (.Values.xnat.containerService | default dict).maxConcurrentJobs }}
{{- if and .Values.xnat.enabled $max }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-container-jobs
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-container-jobs
spec:
  scopes:
    - BestEffort
  hard:
    pods: {{ $max | quote }}
{{- end }}
