# The in-cluster auto-upgrade agent (#1644): the only agent shape; Compose trusts upgrade by hand.
#
# The identity is deliberately narrow, and the narrowness is the design:
#   - no `secrets` verbs. The one credential the agent needs arrives as a projected Secret volume
#     with an `items:` list, which the kubelet mounts without consulting this ServiceAccount, so the
#     pod holds the trust's API key and none of the OMOP/XNAT/Grafana passwords.
#   - no cluster-scoped permissions. Everything here is a Role in this one namespace.
#   - the kinds are enumerated, not `*`. tests/test_upgrade_agent_rbac.py re-renders the chart and
#     fails when a template renders a kind this Role does not cover, so the list cannot rot.
#
# Helm release records: HELM_DRIVER=configmap. Helm's Secret driver finds a release by LISTing
# secrets with a label selector, and RBAC cannot scope a list to a name — a list returns contents.
# ConfigMap records cost this identity configmap write access (it could rewrite the rendered
# governance document). This is not a boundary around the credentials: the Role creates and patches
# Deployments and Jobs, so the identity could start a pod that mounts any Secret in the namespace,
# and permission to create workloads amounts to permission to read Secrets. What the driver buys is
# that the credentials are not one `list` away and are not in `helm get values`. The deploy side has
# to use the same driver, or it cannot see the release this agent upgrades.
#
# The trust's Secret must live outside the release (secrets.create=false). With secrets.create the AES
# key and the OMOP, XNAT and Orthanc passwords are values of the release, so they are stored in its
# release record — a ConfigMap this identity reads — and `helm get values` returns them. The chart's
# own Secret would also need `secrets` verbs to upgrade. `make deploy AUTO_UPGRADE=1` applies the
# Secret with kubectl from values-secrets.yaml instead, outside the release.
{{- if .Values.autoUpgrade.enabled }}
{{- if .Values.secrets.create }}
{{- fail "autoUpgrade.enabled needs the trust Secret managed outside the release: set secrets.create=false and secrets.existingName (make -C trust/deploy/helm deploy AUTO_UPGRADE=1 does both). With secrets.create the passwords are stored in the release record the agent can read, and the agent cannot patch the chart's Secret." }}
{{- end }}
{{- if le (int .Values.autoUpgrade.activeDeadlineSeconds) 600 }}
{{- fail "autoUpgrade.activeDeadlineSeconds must be more than 600: the agent keeps 300 s of it to report before the Job is stopped" }}
{{- end }}
{{- $fullname := include "flip-trust.fullname" . }}
{{- $ns := include "flip-trust.namespace" . }}
{{- /* The same Secret every trust service reads its keys from: the site's `secrets.existingName`. */}}
{{- $secret := .Values.autoUpgrade.kitSecretName | default .Values.secrets.existingName }}
{{- $tag := .Values.autoUpgrade.image.tag | default .Values.global.image.tag }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-upgrade-agent
  namespace: {{ $ns }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-upgrade-agent
  namespace: {{ $ns }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-agent
rules:
  # Everything a `helm upgrade` of this chart has to create, patch or delete. `get`/`list` are
  # needed because Helm compares the render against what is live before it applies.
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    # `cronjobs` included because the agent's own CronJob is part of the release: without it the
    # first upgrade after enabling the agent cannot patch the object it runs under.
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Rendered only when their values block is enabled; listed so enabling one does not silently
  # break the agent on the next upgrade.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-upgrade-agent
  namespace: {{ $ns }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-upgrade-agent
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-upgrade-agent
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-upgrade-agent
  namespace: {{ $ns }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-agent
spec:
  schedule: {{ .Values.autoUpgrade.schedule | quote }}
  suspend: {{ .Values.autoUpgrade.suspend }}
  # A tick that overruns its hour must not be joined by the next: two agents racing for the lease
  # waste an upgrade, and the loser's report can misdate which release moved.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt per tick. A retry inside the same hour would re-run an hour-old decision, and
      # the hub's lease is the only thing that would then stop it.
      backoffLimit: {{ .Values.autoUpgrade.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.autoUpgrade.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "flip-trust.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: upgrade-agent
        spec:
          serviceAccountName: {{ $fullname }}-upgrade-agent
          restartPolicy: Never
          # On the Job deadline the pod gets SIGTERM; the agent turns it into a FAILED report, which needs
          # a few HTTP attempts. The agent's own --budget-seconds should make this the backstop, not the path.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            # The kubelet writes the projected key root-owned; fsGroup hands it to this pod's group,
            # and defaultMode 0440 below lets that group (and nothing else) read it.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: upgrade-agent
              image: "{{ .Values.autoUpgrade.image.repository }}:{{ $tag }}"
              imagePullPolicy: {{ .Values.autoUpgrade.image.pullPolicy }}
              args:
                - tick
                - --namespace
                - {{ $ns }}
                - --release
                - {{ .Release.Name }}
                - --chart-repository
                - {{ .Values.autoUpgrade.chartRepository }}
                - --kit-name
                - {{ .Values.trustName }}
                - --hub
                - {{ .Values.environment | replace "production" "prod" | replace "staging" "stag" }}
                # The agent's own clock, five minutes inside the Job's: it stops its helm calls and
                # health wait in time to report FAILED, rather than being killed holding the lease.
                - --budget-seconds
                - {{ sub (int .Values.autoUpgrade.activeDeadlineSeconds) 300 | quote }}
              env:
                # The non-secret halves of the kit; the API key itself comes from the volume below.
                - name: CENTRAL_HUB_API_URL
                  value: {{ .Values.trustApi.env.CENTRAL_HUB_API_URL | quote }}
                - name: TRUST_API_KEY_HEADER
                  value: {{ .Values.trustApi.env.TRUST_API_KEY_HEADER | quote }}
                # trust-api's Service: the pod's own loopback has nothing on it.
                - name: TRUST_API_URL
                  value: "http://trust-api.{{ $ns }}.svc:{{ .Values.trustApi.service.port }}"
                # Helm records, in ConfigMaps rather than Secrets (see the header comment).
                - name: HELM_DRIVER
                  value: configmap
                # The root filesystem is read-only: helm's cache/config/data and the chart pull go to
                # the scratch volume at /tmp.
                - name: HOME
                  value: /tmp
                - name: HELM_CACHE_HOME
                  value: /tmp/helm/cache
                - name: HELM_CONFIG_HOME
                  value: /tmp/helm/config
                - name: HELM_DATA_HOME
                  value: /tmp/helm/data
              volumeMounts:
                - name: kit
                  mountPath: /etc/flip/upgrade-kit
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.autoUpgrade.resources | nindent 16 }}
          volumes:
            # Writable scratch for a read-only root: the pulled chart, helm's caches. Gone with the pod.
            - name: scratch
              emptyDir:
                sizeLimit: 256Mi
            - name: kit
              secret:
                secretName: {{ $secret }}
                # Only the trust's API key. The kubelet mounts this for the pod without the
                # ServiceAccount holding any `secrets` verb, which is the point of the projection.
                items:
                  - key: trust-api-key
                    path: trust-api-key
                defaultMode: 0440
{{- end }}
