{{- if .Values.sharedImagesPvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flip-trust.fullname" . }}-shared-images
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-images
spec:
  accessModes:
    - {{ .Values.sharedImagesPvc.accessMode }}
  {{- if .Values.sharedImagesPvc.storageClassName }}
  storageClassName: {{ .Values.sharedImagesPvc.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sharedImagesPvc.size }}
{{- end }}
