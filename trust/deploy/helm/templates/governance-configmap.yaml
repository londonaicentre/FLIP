{{- if .Values.governance.document }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-governance
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: governance
data:
  # The trust's governance document (FLIP#1259) — the document itself, as the operator
  # supplied it. data-access-api and the fl-client read it from the read-only mount both
  # templates place at /app/governance.toml, the same filename the Compose stack mounts,
  # so one document means the same thing on both deployment shapes.
  governance.toml: |
{{ .Values.governance.document | indent 4 }}
{{- end }}
