{{- if and .Values.flClient.gpu.enabled .Values.flClient.gpu.operator.enabled }}
# This template validates that the NVIDIA GPU operator is installed and
# configures the necessary tolerations / node selectors for GPU workloads.
# Requires: https://github.com/NVIDIA/gpu-operator to be installed in the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-gpu-validation
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu
data:
  # Validate that the cluster has GPU nodes available
  check-gpu-nodes.sh: |
    #!/bin/sh
    set -euo pipefail
    echo "Checking for GPU nodes in the cluster..."
    GPU_NODES=$(kubectl get nodes -l nvidia.com/gpu.present=true -o name 2>/dev/null | wc -l)
    if [ "$GPU_NODES" -eq 0 ]; then
      echo "WARNING: No GPU nodes found. GPU workloads may not schedule."
      echo "Ensure the NVIDIA GPU Operator is installed and GPU nodes are labeled."
    else
      echo "Found ${GPU_NODES} GPU node(s)."
    fi
{{- end }}
