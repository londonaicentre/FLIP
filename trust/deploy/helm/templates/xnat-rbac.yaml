# RBAC for the XNAT Container Service plugin's Kubernetes compute backend.
# The plugin reads in-cluster ServiceAccount credentials from the XNAT pod and
# uses CoreV1Api + BatchV1Api to drive container workloads as Jobs.
# Verbs cover only what KubernetesClientImpl (container-service 3.8.1) calls:
#   - pods: list (ping) + list/watch (informer)
#   - pods/log: get (post-hoc log retrieval; logs are not streamed live)
#   - jobs.batch: create/patch/delete + list/watch (informer)
# No cluster-scoped permissions are required; PVCs are referenced by name only.

{{- if .Values.xnat.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flip-trust.fullname" . }}-xnat-web
subjects:
  - kind: ServiceAccount
    name: {{ include "flip-trust.fullname" . }}-xnat-web
    namespace: {{ include "flip-trust.namespace" . }}
{{- end }}
