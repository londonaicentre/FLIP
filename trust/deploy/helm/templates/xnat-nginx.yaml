{{- if and .Values.xnat.enabled .Values.xnat.nginx.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
data:
  # Default nginx configuration for XNAT reverse proxy
  # Can be overridden by mounting a custom config
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://xnat-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
spec:
  type: {{ .Values.xnat.nginx.service.type }}
  ports:
    - port: {{ .Values.xnat.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-nginx
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-nginx
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.xnat.nginx.image.repository }}:{{ .Values.xnat.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.xnat.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.xnat.nginx.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.nginx.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.nginx.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.xnat.nginx.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.nginx.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.nginx.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.xnat.nginx.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flip-trust.fullname" . }}-xnat-nginx
{{- end }}
