{{- define "flip-trust.xnatNginxConf" }}
worker_processes auto;
events {
  worker_connections 1024;
}
http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  gzip on;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  server {
    listen 80;
    server_name _;
    location / {
      proxy_pass http://xnat-web:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 0;
    }
  }
}
{{- end }}
{{- if and .Values.xnat.enabled .Values.xnat.nginx.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
data:
  # The whole nginx.conf, mounted over the image's (trust/xnat/nginx/custom-nginx.conf), which
  # includes nothing from conf.d: a server block there was never read (FLIP#1880). Same settings as
  # the image's, less its /orthanc/ route, with longer proxy timeouts.
  nginx.conf: |
    {{- include "flip-trust.xnatNginxConf" . | trim | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
spec:
  type: {{ .Values.xnat.nginx.service.type }}
  ports:
    - port: {{ .Values.xnat.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-nginx
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-nginx
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-nginx
      annotations:
        # A subPath mount never sees a ConfigMap edit, so a changed config restarts the pod.
        checksum/config: {{ include "flip-trust.xnatNginxConf" . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.xnat.nginx.image.repository }}:{{ include "flip-trust.imageTag" (dict "pin" .Values.xnat.image.pin "global" .Values.global.image.tag "own" .Values.xnat.nginx.image.tag) }}"
          imagePullPolicy: {{ .Values.xnat.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.xnat.nginx.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.nginx.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.nginx.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.xnat.nginx.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.nginx.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.nginx.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.xnat.nginx.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flip-trust.fullname" . }}-xnat-nginx
{{- end }}
