{{- if .Values.dataAccessApi.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flip-trust.fullname" . }}-data-access-api
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-data-access-api
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
data:
  OMOP_DB_SERVICE_NAME: {{ if .Values.omopDb.enabled }}omop-db{{ else }}{{ .Values.omopDb.external.host }}{{ end }}
  OMOP_POSTGRES_DB: {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }}
  DATA_ACCESS_POSTGRES_USER: {{ .Values.dataAccessApi.env.DATA_ACCESS_POSTGRES_USER | quote }}
  ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  {{- if .Values.dataAccessApi.snapshots.enabled }}
  # Approved-cohort membership store (FLIP#857) — the PVC mount below. Row-level serving is
  # fail-closed without it.
  COHORT_SNAPSHOT_DIR: "/snapshots"
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flip-trust.fullname" . }}-data-access-api
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
spec:
  replicas: {{ .Values.dataAccessApi.replicas }}
  {{- if and .Values.dataAccessApi.snapshots.enabled (eq .Values.dataAccessApi.snapshots.accessMode "ReadWriteOnce") }}
  # A ReadWriteOnce store attaches to one node: a surge pod scheduled elsewhere would wait on the
  # volume forever and stall the rollout, so the old pod goes first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-access-api
  template:
    metadata:
      {{- if .Values.governance.document }}
      annotations:
        # Editing the governance document must roll this pod: a ConfigMap content change
        # restarts nothing by itself, so without this hash data-access-api would keep
        # serving the rules it read at container start. (templates/fl-client.yaml keeps
        # FL_SITE_PRIVACY_* in the pod template for the same reason.)
        checksum/governance: {{ include (print $.Template.BasePath "/governance-configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data-access-api
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "flip-trust.fullname" . }}-data-access-api
      {{- if .Values.dataAccessApi.snapshots.enabled }}
      securityContext:
        # Makes the snapshot PVC group-writable for the image's non-root user — without it a
        # fresh volume mounts root-owned, every freeze fails, and fail-closed serving refuses
        # every project.
        fsGroup: {{ .Values.dataAccessApi.snapshots.fsGroup }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataAccessApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: data-access-api
          image: "{{ .Values.dataAccessApi.image.repository }}:{{ include "flip-trust.imageTag" (dict "global" .Values.global.image.tag "own" .Values.dataAccessApi.image.tag) }}"
          imagePullPolicy: {{ .Values.dataAccessApi.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.dataAccessApi.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-data-access-api
          env:
            - name: DATA_ACCESS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: data-access-postgres-password
            - name: AES_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: aes-key-base64
            - name: TRUST_INTERNAL_SERVICE_KEY_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: trust-internal-service-key-header
            - name: TRUST_INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: trust-internal-service-key
            # The trust's own disclosure floor, from the kit's COHORT_QUERY_THRESHOLD via sync-kit.
            # In the pod template rather than the ConfigMap so a change rolls the pod. The
            # governance document below is validated against it, so the two must agree with
            # what check-governance checked — before this, every chart-deployed trust ran at 10.
            - name: COHORT_QUERY_THRESHOLD
              value: {{ .Values.dataAccessApi.cohortQueryThreshold | quote }}
            {{- if .Values.governance.document }}
            # The trust's governance document (FLIP#1259), mounted read-only below. Present
            # only when governance.document is set: unset leaves this service on the
            # platform defaults (COHORT_QUERY_THRESHOLD) exactly as it was before the feature.
            - name: ACCESS_POLICY_FILE
              value: /app/governance.toml
            {{- end }}
          {{- if or .Values.dataAccessApi.snapshots.enabled .Values.governance.document }}
          volumeMounts:
            {{- if .Values.dataAccessApi.snapshots.enabled }}
            - name: cohort-snapshots
              mountPath: /snapshots
            {{- end }}
            {{- if .Values.governance.document }}
            - name: governance
              mountPath: /app/governance.toml
              # subPath, not a directory mount: /app is the service's own tree, and a
              # volume mounted over it would hide the code. Read-only because a service
              # must never be able to rewrite its own policy.
              subPath: governance.toml
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.dataAccessApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.dataAccessApi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.dataAccessApi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.dataAccessApi.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.dataAccessApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.dataAccessApi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.dataAccessApi.probes.readiness.timeoutSeconds }}
      {{- if or .Values.dataAccessApi.snapshots.enabled .Values.governance.document }}
      volumes:
        {{- if .Values.dataAccessApi.snapshots.enabled }}
        - name: cohort-snapshots
          persistentVolumeClaim:
            claimName: {{ include "flip-trust.fullname" . }}-cohort-snapshots
        {{- end }}
        {{- if .Values.governance.document }}
        # /app/governance.toml is the filename the Compose stack mounts, so one document
        # means the same thing on either deployment shape.
        - name: governance
          configMap:
            name: {{ include "flip-trust.fullname" . }}-governance
        {{- end }}
      {{- end }}
{{- if .Values.dataAccessApi.snapshots.enabled }}
---
# Approved-cohort membership store (FLIP#857): one record per approved project UUID (the query
# of record + person/accession ids, no clinical values) — back this PV up with the OMOP volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flip-trust.fullname" . }}-cohort-snapshots
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
spec:
  accessModes:
    - {{ .Values.dataAccessApi.snapshots.accessMode }}
  {{- if .Values.dataAccessApi.snapshots.storageClassName }}
  storageClassName: {{ .Values.dataAccessApi.snapshots.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dataAccessApi.snapshots.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: data-access-api
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
spec:
  type: {{ .Values.dataAccessApi.service.type }}
  ports:
    - port: {{ .Values.dataAccessApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data-access-api
{{- end }}
