# Overlay for an EKS cluster from trust/deploy/terraform/aws/eks (FLIP#1439), with values-small-node.yaml.
flClient:
  kit:
    # A managed node group replaces nodes at will: the kit comes from a Secret, never the node.
    source: secret

omopDb:
  persistence:
    # A fresh EBS volume has lost+found at its root, which initdb refuses.
    pgdataSubdir: pgdata
  vocabLoad:
    # The vocabulary sits in the hub's bucket, which a node in the site's account cannot read; the
    # site loads its own licensed copy. Off, the NetworkPolicy also keeps 169.254.169.254 closed.
    enabled: false

xnat:
  db:
    persistence:
      pgdataSubdir: pgdata
  web:
    persistence:
      # Container Service mounts this volume in every conversion pod, on any node: EFS (the root's
      # xnat-efs class, from make storage-class), not an EBS volume that attaches to one node.
      storageClassName: xnat-efs
      accessMode: ReadWriteMany
