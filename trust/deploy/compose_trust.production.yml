# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:

  # --- Application services ---

  # Image built from https://github.com/londonaicentre/flip-omop-db
  omop-db:
    image: ghcr.io/londonaicentre/omop-db:latest
    restart: always
    ports:
      - "${OMOP_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${OMOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OMOP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OMOP_POSTGRES_DB}
    volumes:
      - ${OMOP_DATA_DIR:-/opt/flip/omop/db_data}:/var/lib/postgresql/data

  orthanc:
    image: ghcr.io/londonaicentre/orthanc:${DOCKER_TAG}
    restart: always
    ports:
      # - "${PACS_DICOM_PORT}:4242"
      - "${PACS_UI_PORT}:8042"
    volumes:
      - ${ORTHANC_STORAGE_DIR:-/opt/flip/orthanc/orthanc-storage}:/var/lib/orthanc/db
    environment:
      ORTHANC__REGISTERED_USERS: |
          {"${ORTHANC_USERNAME}": "${ORTHANC_PASSWORD}"}
      ORTHANC__DICOM_MODALITIES: |
          {"XNAT": {"AET": "XNAT", "Host": "xnat-web", "Port": "${XNAT_PORT}"}}

  imaging-api:
    image: ghcr.io/londonaicentre/imaging-api:${DOCKER_TAG}
    # Override the default CMD so that the production image uses uvicorn directly
    # instead of `fastapi dev --reload-exclude` (which fails on older fastapi CLI versions).
    # The entrypoint.sh fix (uvicorn for non-debug mode) will remove the need for this
    # override once the next image build is pushed.
    command: ["uv", "run", "python", "-m", "uvicorn", "imaging_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${IMAGING_API_PORT}:8000"
    environment:
      # XNAT_URL, PACS_ID, XNAT_DATABASE_URL, DATA_ACCESS_API_URL and
      # TRUST_INTERNAL_SERVICE_KEY_HEADER are internal-topology constants and now
      # default in imaging_api/config.py — do not inject them (an empty ${VAR}
      # from a kit that omits them would override the code default).
      XNAT_PORT: ${XNAT_PORT}
      XNAT_SERVICE_USER: ${XNAT_SERVICE_USER}
      XNAT_SERVICE_PASSWORD: ${XNAT_SERVICE_PASSWORD}
      AES_KEY_BASE64: ${AES_KEY_BASE64}
      ENV: production
      BASE_IMAGES_DOWNLOAD_DIR: /app/data/images
      LOG_LEVEL: ${TRUST_LOG_LEVEL}
      TRUST_INTERNAL_SERVICE_KEY: ${TRUST_INTERNAL_SERVICE_KEY}
    # NOTE the volume BASE_IMAGES_DOWNLOAD_DIR is mounted to share images downloaded from XNAT with FL clients
    volumes:
      - ${BASE_IMAGES_DOWNLOAD_DIR}:/app/data/images

  data-access-api:
    image: ghcr.io/londonaicentre/data-access-api:${DOCKER_TAG}
    ports:
      - "${DATA_ACCESS_API_PORT}:8000"
    environment:
      # OMOP_DB_SERVICE_NAME and TRUST_INTERNAL_SERVICE_KEY_HEADER default in
      # data_access_api/config.py — not injected (see imaging-api note above).
      DATA_ACCESS_POSTGRES_USER: ${DATA_ACCESS_POSTGRES_USER}
      DATA_ACCESS_POSTGRES_PASSWORD: ${DATA_ACCESS_POSTGRES_PASSWORD}
      OMOP_POSTGRES_DB: ${OMOP_POSTGRES_DB}
      AES_KEY_BASE64: ${AES_KEY_BASE64}
      ENV: production
      LOG_LEVEL: ${TRUST_LOG_LEVEL}
      TRUST_INTERNAL_SERVICE_KEY: ${TRUST_INTERNAL_SERVICE_KEY}

  trust-api:
    image: ghcr.io/londonaicentre/trust-api:${DOCKER_TAG}
    # Port exposed on host for SSM port forwarding (swagger docs debugging).
    # Security group blocks all inbound — only reachable via SSM tunnel.
    ports:
      - "${TRUST_API_PORT}:8000"
    environment:
      CENTRAL_HUB_API_URL: ${CENTRAL_HUB_API_URL}
      # DATA_ACCESS_API_URL, IMAGING_API_URL and TRUST_INTERNAL_SERVICE_KEY_HEADER
      # default in trust_api/config.py — not injected (see imaging-api note above).
      TRUST_API_KEY_HEADER: ${TRUST_API_KEY_HEADER}
      TRUST_API_KEY: ${TRUST_API_KEY}
      AES_KEY_BASE64: ${AES_KEY_BASE64}
      TRUST_NAME: ${TRUST_NAME}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      ENV: production
      LOG_LEVEL: ${TRUST_LOG_LEVEL}
      TRUST_INTERNAL_SERVICE_KEY: ${TRUST_INTERNAL_SERVICE_KEY}

  # --- Observability infrastructure ---

  loki:
    image: grafana/loki:3.4.0
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/flip/config/observability}/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${LOKI_DATA_VOLUME:-trust-local-loki-data}:/loki

  alloy:
    image: grafana/alloy:v1.9.0
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/flip/config/observability}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.0
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ${GRAFANA_DATA_VOLUME:-trust-local-grafana-data}:/var/lib/grafana
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/flip/config/observability}/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

networks:
  default:
    external: true
    name: ${TRUST_NETWORK_NAME}

# Docker-managed named volumes for the observability stack. Defaults baked
# into the loki / grafana mounts above point at these names so a fresh
# trust stack on a laptop Just Works without any host-side bootstrap.
# Operators on an Ansible-provisioned EC2 / on-prem host override
# LOKI_DATA_VOLUME / GRAFANA_DATA_VOLUME in their kit file to bind paths
# under /opt/flip/volumes/... (which the playbook creates with the right
# ownership). Both shapes — bind path or named volume — slot into the same
# compose mount syntax; docker compose distinguishes them by whether the
# value matches a declared `volumes:` entry below.
volumes:
  trust-local-loki-data:
  trust-local-grafana-data:
