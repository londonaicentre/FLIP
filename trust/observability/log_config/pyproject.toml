[project]
name = "log-config"
version = "0.1.0"
description = "Structured JSON logging middleware for FLIP trust services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The source root for imports is the parent directory so that `import log_config` resolves.
# Setting sources maps the project root (".") to the parent ("..") at install time.
sources = {"." = "log_config"}

[tool.hatch.build.targets.editable]
sources = {"." = "log_config"}
