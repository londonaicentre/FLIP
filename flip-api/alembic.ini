[alembic]
# Migration scripts live under the flip_api package so they ride the existing
# `src/` bind mount (dev) and `COPY src/` (prod) with no extra Dockerfile COPY.
# `%(here)s` anchors the path to this file's directory, so `alembic ...` works
# whether invoked from /app (container) or flip-api/ (host / pytest).
script_location = %(here)s/src/flip_api/db/migrations
prepend_sys_path = .

# NO sqlalchemy.url here on purpose. The database URL — including the prod AWS
# Secrets Manager password lookup — is owned by flip_api.db.database.engine and
# reused by env.py, or supplied as a live Connection injected by the integration
# tests (config.attributes["connection"]). Secrets never live in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
