# Runs non-root (uid 49999, set in the Dockerfile), so every writable path lives under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # $upstream_status tells a SuperLink's own answer from the proxy's 503 for an
    # unreachable or unverifiable one, which is otherwise the same line.
    log_format fleet '$remote_addr "$request" $status upstream=$upstream_status $request_time';
    access_log /dev/stdout fleet;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/fleet-routes.map;
    # Rendered from templates/fleet-proxy.conf.template by the base image's entrypoint.
    include /tmp/fleet-proxy.conf;
}
