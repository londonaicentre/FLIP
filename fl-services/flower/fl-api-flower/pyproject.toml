[project]
name = "flip-fl-api-flower"
version = "0.13.1"
description = "FL API for Flower deployment runtime."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.11",
    "flwr>=1.38.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
    "tomlkit>=0.14.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "grpcio>=1.60",
    "grpcio-health-checking>=1.60",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.5",
    "ruff>=0.15.0",
    "types-requests>=2.32.0.20250515",
]

[tool.uv]
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Emergency cooldown override (CONTRIBUTING.md, "Emergency override"): admit the critical-advisory fixes
# certifi 2026.10.19 and uv 0.13.4 before the 3-day cooldown does. Each cutoff is that release's upload time, so
# nothing newer gets in, and it also freezes the package: remove it after 2026-10-23T15:13Z (#1618).
exclude-newer-package = { certifi = "2026-10-20T02:25:00Z", uv = "2026-10-20T15:13:00Z" }
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    "anyio>=4.14.2",  # CVE-2026-63374, CVE-2026-64847, CVE-2026-63349; transitive via httpx, starlette, watchfiles
    "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2
]
# flwr pins cryptography<47.0.0 even in its latest release (GHSA-537c-gmf6-5ccf
# needs >=48.0.1); override past that ceiling since flwr only uses cryptography
# for TLS cert loading in secure aggregation, a stable surface across majors.
# flwr 1.38 also pins uv<0.12 for its per-run app install, which FLIP does not use (#1418); override it so
# uv>=0.13.4 (GHSA-hq85-5cpj-mr62, the same compromised CA root as certifi) can be installed.
override-dependencies = ["cryptography>=50.0.0", "uv>=0.13.4"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
omit = ["*.venv/*", "*/tests/*", "*/__init__.py"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = []
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
 
[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
