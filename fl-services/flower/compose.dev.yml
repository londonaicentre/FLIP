# Standalone Flower FL dev stack (insecure): builds the four flower-* :dev images
# and runs a single SuperLink + 2 SuperNodes + fl-api, no central hub / trusts.
# flip-utils installs from the in-repo source (fl-base build context = repo
# root), so the old fliputils_dist
# additional-context dev target is gone. Used by fl-services/flower/Makefile
# (build / up / submit). The central-hub multi-net Flower topology is the separate
# deploy/compose.development.flower.yml.
services:
  # build the flower-fl-base image for a Flower app
  flwr-base:
    image: flower-fl-base:dev
    build:
      context: ../../
      dockerfile: fl-services/flower/fl-base/Dockerfile
      args:
        LOCAL_DEV: ${LOCAL_DEV:-false}
    profiles: ["build-only"]

  fl-api:
    image: flower-fl-api:dev
    build:
      context: ../../fl-services/flower/fl-api-flower
      dockerfile: Dockerfile
    # Add the host's group as a supplementary group so bind-mounted files (owned
    # by the host user, group-writable) stay writable, without disturbing the
    # image's own user. DOCKER_GID comes from the Makefile; defaults to 1000.
    group_add: &host-gid ["${DOCKER_GID:-1000}"]
    environment:
      - ALLOWED_JOB_FOLDERS=${ALLOWED_JOB_FOLDERS:-numpy,3d_spleen_segmentation,3d_spleen_segmentation_evaluation}
      - SUPERLINK_ADDRESS=${SUPERLINK_ADDRESS:-superlink:9093}
      - SUPERLINK_HEALTH_ADDRESS=${SUPERLINK_HEALTH_ADDRESS:-superlink:9097}
      - FLOWER_SRC_ROOT=/app/src
    volumes:
      - ../../fl-tutorials/flower:/app/src
      - ../../fl-services/flower/fl-api-flower/fl_api:/app/fl_api
      - ../../fl-services/flower/fl-api-flower/tests:/app/tests
    # No host port published by default — submit jobs with `make submit` (which
    # execs into this container). Run `make up-debug` (layers compose.debug.yml)
    # to publish 8000 for the Swagger UI at http://localhost:8000/docs.
    networks:
      - flwr-dev-net

  # create a SuperLink service
  superlink:
    image: flower-superlink:dev
    build:
      context: ../../fl-services/flower/superlink
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flower-fl-base:dev}
    group_add: *host-gid
    environment:
      - LOCAL_DEV=true
      - WORKING_DIR=/app/runs
    volumes:
      - ${WORKING_DIR:-/tmp/flwr-dev-runs}:/app/runs
      # Shared with fl-api: uploaded app bundles (sources + model checkpoints) live
      # under /app/src/<model_id>; the evaluation ServerApp reads checkpoints from there.
      - ../../fl-tutorials/flower:/app/src
    command:
      - --insecure
      - --health-server-address
      - ${SUPERLINK_HEALTH_SERVER_BIND_ADDRESS:-0.0.0.0:9097}
    # No host port published by default; fl-api reaches the SuperLink over the
    # internal network (superlink:9093). `make up-debug` publishes 9093 for the
    # `flwr` CLI from the host.
    networks:
      - flwr-dev-net

  # create two SuperNode services with different node configs
  supernode-1:
    image: flower-supernode:dev
    build:
      context: ../../fl-services/flower/supernode
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flower-fl-base:dev}
    working_dir: /app
    group_add: *host-gid
    environment:
      - SUPERNODE_NAME=Trust_1
      - LOCAL_DEV=true
      - DEV_IMAGES_DIR=/images
      - DEV_DATAFRAME=/dataframe_file
      - WORKING_DIR=/app/runs
    volumes:
      - ${DEV_IMAGES_DIR:-/tmp/flwr-dev-images}:/images
      - ${DEV_DATAFRAME:-/tmp/flwr-dev-dataframe.csv}:/dataframe_file:ro
      - ${WORKING_DIR:-/tmp/flwr-dev-runs}:/app/runs
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --health-server-address
      - ${SUPERNODE_HEALTH_SERVER_BIND_ADDRESS:-0.0.0.0:9098}
    deploy:
      resources:
        limits:
          cpus: "4"
    depends_on:
      - superlink
    networks:
      - flwr-dev-net

  supernode-2:
    image: flower-supernode:dev
    build:
      context: ../../fl-services/flower/supernode
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flower-fl-base:dev}
    working_dir: /app
    group_add: *host-gid
    environment:
      - SUPERNODE_NAME=Trust_2
      - LOCAL_DEV=true
      - DEV_IMAGES_DIR=/images
      - DEV_DATAFRAME=/dataframe_file
      - WORKING_DIR=/app/runs
    volumes:
      - ${DEV_IMAGES_DIR:-/tmp/flwr-dev-images}:/images
      - ${DEV_DATAFRAME:-/tmp/flwr-dev-dataframe.csv}:/dataframe_file:ro
      - ${WORKING_DIR:-/tmp/flwr-dev-runs}:/app/runs
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --health-server-address
      - ${SUPERNODE_HEALTH_SERVER_BIND_ADDRESS:-0.0.0.0:9098}
    deploy:
      resources:
        limits:
          cpus: "4"
    depends_on:
      - superlink
    networks:
      - flwr-dev-net

networks:
  flwr-dev-net:
    name: flwr-dev-net
