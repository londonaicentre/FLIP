[project]
name = "flip-fl-api"
version = "0.1.0"
description = "Wrapper API for NVFLARE FL Admin API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "nvflare==2.8.0",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = [
    "coverage>=7.7.1",
    "mypy>=1.15.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
    "types-requests>=2.32.0.20250515",
    "debugpy>=1.8.14",
]

[tool.uv]
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    "aiohttp>=3.14.0",           # CVE-2026-47265, CVE-2026-34993, CVE-2026-34525/16/15/14/13/12, CVE-2026-22815, CVE-2026-21860
    "cryptography>=46.0.7",      # CVE-2026-26007, CVE-2026-39892, CVE-2026-34073
    # flask>=3.1.3 omitted: nvflare==2.8.0 hard-pins flask==3.0.2; unresolvable until nvflare relaxes that pin
    "idna>=3.15",                # CVE-2026-45409
    "protobuf>=6.33.5",          # CVE-2026-0994, CVE-2025-4565
    "pygments>=2.20.0",          # CVE-2026-4539
    "pyjwt>=2.12.0",             # CVE-2026-32597
    "python-dotenv>=1.2.2",      # CVE-2026-28684
    "python-multipart>=0.0.27",  # CVE-2026-42561, CVE-2026-24486, CVE-2026-40347
    "requests>=2.33.0",          # CVE-2026-25645, CVE-2024-47081
    "starlette>=1.2.1",          # CVE-2026-48710, CVE-2025-62727
    "urllib3>=2.7.0",            # CVE-2026-44431, CVE-2025-66471/66418, CVE-2025-50182/50181
    "werkzeug>=3.1.6",           # CVE-2026-27199, CVE-2026-21860, CVE-2025-66221, CVE-2024-49767/49766
]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
omit = ["*.venv/*", "*/tests/*", "*/__init__.py"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = []
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
 
[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']

[tool.mypy]
exclude = '^transfer_upload/'
