# This is a sample compose file that can be used for local development, to test that the FL base, server and client
# images build correctly and can communicate with each other. It is not intended for production use.
#
# Provisioned secrets (e.g. certificates in local, startup dirs) are mounted from provision/workspace-dev/ (gitignored).
services:
  fl-base:
    image: flare-fl-base:dev
    build:
      context: ../../
      dockerfile: fl-services/nvflare/fl-base/Dockerfile
      # Deliberately does NOT pass UID/GID/UNAME (FLIP#1171). The Dockerfile fixes
      # the image identity at flip/1000/1000, so a locally-built :dev image matches
      # CI's :stag exactly. Passing the building developer's identity here is what
      # made the two diverge: the dev composes reuse that identity as *runtime*
      # config (HOME, the ~/.aws mount path), so images built by a developer whose
      # uid is not 1000 worked while the published ones crash-looped. Runtime
      # identity is handled separately, by `user:` in the deploy composes.
      args:
        LOCAL_DEV: ${LOCAL_DEV:-false}
    profiles: ["build-only"]

  fl-server:
    # NOTE container_name is mandatory here in order for FL clients to resolve the server hostname (e.g. address
    # fl-server-net-1:8002 from within the client containers)
    container_name: fl-server-net-${NET_NUMBER}
    image: flare-fl-server:dev
    # Run as the HOST user with the image's gid (FLIP#1171). The provisioned kit
    # mounted below is written by `make provision` as the host user, so only a
    # matching uid can write it; the image identity is fixed at flip/1000/1000 and
    # no longer inherits whoever built the image. The gid stays the image's so /app
    # and /home/flip -- group-writable in fl-base -- remain writable.
    user: "${UID:-1000}:1000"
    build:
      context: ../../fl-services/nvflare/fl-server
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flare-fl-base:dev}
    environment:
      # The overridden uid is absent from the image's /etc/passwd, so pwd.getpwuid()
      # raises and HOME falls back to "/". getpass.getuser() checks these first.
      - HOME=/home/flip
      - USER=flip
      - LOGNAME=flip
      - NET_ID=net-${NET_NUMBER}
      - LOCAL_DEV=false
      - MIN_CLIENTS=1
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=fake-s3-bucket
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      # Provisioned secrets from provision/workspace-dev/ (gitignored)
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/fl-server-net-${NET_NUMBER}/local:/app/local
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/fl-server-net-${NET_NUMBER}/startup:/app/startup
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/fl-server-net-${NET_NUMBER}/transfer:/app/transfer
    command: ["/bin/bash", "/app/entrypoint.sh"]

  flip-fl-api:
    container_name: flip-fl-api-net-${NET_NUMBER}
    image: flare-fl-api:dev
    # Host uid, image gid -- see fl-server above.
    user: "${UID:-1000}:1000"
    build:
      context: ../../fl-services/nvflare/fl-api-base
      dockerfile: Dockerfile
    environment:
      # Identity for the overridden uid -- see fl-server above.
      - HOME=/home/flip
      - USER=flip
      - LOGNAME=flip
      - FL_ADMIN_DIRECTORY=/app/admin
      - DEBUG=${DEBUG}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "${FL_API_PORT}:8000"
      - "5679:5679"
    volumes:
      # Provisioned secrets from provision/workspace-dev/ (gitignored)
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/flip-fl-api-net-${NET_NUMBER}/local:/app/admin/local
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/flip-fl-api-net-${NET_NUMBER}/startup:/app/admin/startup
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/flip-fl-api-net-${NET_NUMBER}/transfer:/app/admin/transfer
      # Static code from fl-services/ (tracked in git)
      - ../../fl-services/nvflare/fl-api-base/fl_api:/app/fl_api
      - ../../fl-services/nvflare/fl-api-base/tests:/app/tests
      # NOTE the transfer dir in the new provisioning is not straightforward to configure - for now, we keep "transfer"
      # as both the download_dir and upload_dir in fed_admin.json
      # - ../flip-fl-api/transfer_upload:/app/admin/transfer_upload:rw
      - ../../fl-services/nvflare/fl-api-base/.vscode:/app/.vscode
    command: ["/bin/bash", "/app/entrypoint.sh"]

  fl-client-1:
    container_name: fl-client-1-net-${NET_NUMBER}
    image: flare-fl-client:dev
    # Host uid, image gid -- see fl-server above.
    user: "${UID:-1000}:1000"
    build:
      context: ../../fl-services/nvflare/fl-client
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flare-fl-base:dev}
    environment:
      # Identity for the overridden uid -- see fl-server above.
      - HOME=/home/flip
      - USER=flip
      - LOGNAME=flip
      - NET_ID=net-${NET_NUMBER}
      - LOCAL_DEV=false
      - MIN_CLIENTS=1
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=fake-s3-bucket
      # - NUM_AVAILABLE_GPUS=1
      # - MEMORY_PER_GPU_IN_GIB=16
      - LOG_LEVEL=${LOG_LEVEL}
      # Site-enforced NVFLARE privacy policy (FLIP#851) — rendered into
      # /app/local/privacy.json by the entrypoint. Unset/empty = no site policy.
      - FL_SITE_PRIVACY_POLICY=${FL_SITE_PRIVACY_POLICY:-}
      - FL_SITE_PRIVACY_PERCENTILE=${FL_SITE_PRIVACY_PERCENTILE:-}
      - FL_SITE_PRIVACY_GAMMA=${FL_SITE_PRIVACY_GAMMA:-}
    volumes:
      # Provisioned secrets from provision/workspace-dev/ (gitignored)
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_1/local:/app/local
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_1/startup:/app/startup
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_1/transfer:/app/transfer
    command: ["/bin/bash", "/app/entrypoint.sh"]
    shm_size: "32gb"
    gpus: all

  fl-client-2:
    container_name: fl-client-2-net-${NET_NUMBER}
    image: flare-fl-client:dev
    # Host uid, image gid -- see fl-server above.
    user: "${UID:-1000}:1000"
    build:
      context: ../../fl-services/nvflare/fl-client
      dockerfile: Dockerfile
      args:
        BASE_REF: ${BASE_REF:-flare-fl-base:dev}
    environment:
      # Identity for the overridden uid -- see fl-server above.
      - HOME=/home/flip
      - USER=flip
      - LOGNAME=flip
      - NET_ID=net-${NET_NUMBER}
      - LOCAL_DEV=false
      - MIN_CLIENTS=1
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=fake-s3-bucket
      # - NUM_AVAILABLE_GPUS=1
      # - MEMORY_PER_GPU_IN_GIB=16
      - LOG_LEVEL=${LOG_LEVEL}
      # Site-enforced NVFLARE privacy policy (FLIP#851) — rendered into
      # /app/local/privacy.json by the entrypoint. Unset/empty = no site policy.
      - FL_SITE_PRIVACY_POLICY=${FL_SITE_PRIVACY_POLICY:-}
      - FL_SITE_PRIVACY_PERCENTILE=${FL_SITE_PRIVACY_PERCENTILE:-}
      - FL_SITE_PRIVACY_GAMMA=${FL_SITE_PRIVACY_GAMMA:-}
    volumes:
      # Provisioned secrets from provision/workspace-dev/ (gitignored)
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_2/local:/app/local
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_2/startup:/app/startup
      - ./provision/workspace-dev/net-${NET_NUMBER}/services/Trust_2/transfer:/app/transfer
    command: ["/bin/bash", "/app/entrypoint.sh"]
    shm_size: "32gb"
    gpus: all
