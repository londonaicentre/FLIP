# Pre-commit hooks for secret detection
# Install pre-commit: pip install pre-commit
# Setup hooks: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: check-env-vars
        name: Verify .env.development variables
        entry: python3 scripts/check_env_vars.py
        language: system
        pass_filenames: false
        files: ^\.env\.development(\.example)?$
        always_run: false

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.93.3
    hooks:
      - id: trufflehog

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: \.lock$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^\.github/workflows/'
      - id: end-of-file-fixer
      - id: detect-private-key

  # Keep each uv project's lockfile in sync with its pyproject.toml. uv-lock
  # operates on a single project, so this monorepo needs one entry per project,
  # each scoped (via files:) to that project's manifest and lockfile.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.16
    hooks:
      - id: uv-lock
        name: uv-lock (root)
        files: '^(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (flip-api)
        args: ['--project', 'flip-api']
        files: '^flip-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (docs)
        args: ['--project', 'docs']
        files: '^docs/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (trust-api)
        args: ['--project', 'trust/trust-api']
        files: '^trust/trust-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (imaging-api)
        args: ['--project', 'trust/imaging-api']
        files: '^trust/imaging-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (data-access-api)
        args: ['--project', 'trust/data-access-api']
        files: '^trust/data-access-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (xnat-tests)
        args: ['--project', 'trust/xnat/tests']
        files: '^trust/xnat/tests/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (aws-deploy)
        args: ['--project', 'deploy/providers/AWS']
        files: '^deploy/providers/AWS/(pyproject\.toml|uv\.lock|uv\.toml)$'
