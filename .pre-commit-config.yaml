# Pre-commit hooks for secret detection
# Install pre-commit: pip install pre-commit
# Setup hooks: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: check-env-vars
        name: Verify .env.development variables
        entry: python3 scripts/check_env_vars.py
        language: system
        pass_filenames: false
        files: ^\.env\.development(\.example)?$
        always_run: false

      # Regenerate each backend's fl-apps/<backend>/required_files.json from its per-template
      # required_files.json arrays (the manifest flip-api pulls from S3). Like prettier/
      # end-of-file-fixer, it rewrites the file and fails the commit when it changed, so you
      # re-stage and commit again — no need to remember to run the script. The
      # check-required-files CI workflow re-runs the same script + `git diff --exit-code` as the
      # backstop for commits made without pre-commit installed. (#356)
      - id: fl-apps-required-files
        name: Generate fl-apps per-backend required_files.json
        entry: bash fl-apps/check_required_files.sh
        language: system
        pass_filenames: false
        files: '^fl-apps/(check_required_files\.sh|.*required_files\.json)$'
        always_run: false

      # The dcm2niix Container Service image is pinned by `ARG DCM2NIIX_VERSION` in its Dockerfile
      # and referenced as a literal `<image>:<tag>` string by three deploy configs. A version bump
      # that misses one of them is silent at runtime (the old immutable tag keeps being pulled), so
      # verify them here. Unlike fl-apps-required-files this only reports — the four sites are
      # hand-written, not generated. The dcm2niix-pin-sync job in test_trust_xnat.yml re-runs the
      # same script as the backstop for commits made without pre-commit installed. (#980)
      - id: xnat-dcm2niix-pin-sync
        name: Check the dcm2niix image pin is in sync
        entry: bash trust/xnat/dcm2niix/check_image_pin_sync.sh
        language: system
        pass_filenames: false
        files: '^(trust/xnat/dcm2niix/(Dockerfile|check_image_pin_sync\.sh)|trust/xnat/xnat/config/dcm2niix_command\.json|deploy/providers/kubernetes/templates/xnat-init-job\.yaml|trust/imaging-api/imaging_api/config\.py)$'
        always_run: false

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.93.3
    hooks:
      - id: trufflehog

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: \.lock$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^\.github/workflows/|^deploy/providers/kubernetes/templates/'
      - id: end-of-file-fixer
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^deploy/providers/AWS/.*\.ya?ml$

  # Verify each uv project's lockfile is in sync with its pyproject.toml. The
  # `--check` flag makes uv-lock a verifier (fails on drift) instead of an
  # actor (silently regenerates). Use `make lock` to regenerate when a
  # pyproject.toml legitimately changes. uv-lock operates on a single project,
  # so this monorepo needs one entry per project, each scoped (via files:) to
  # that project's manifest and lockfile.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.16
    hooks:
      - id: uv-lock
        name: uv-lock (root)
        args: ['--check']
        files: '^(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (flip-api)
        args: ['--check', '--project', 'flip-api']
        files: '^flip-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (docs)
        args: ['--check', '--project', 'docs']
        files: '^docs/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (trust-api)
        args: ['--check', '--project', 'trust/trust-api']
        files: '^trust/trust-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (imaging-api)
        args: ['--check', '--project', 'trust/imaging-api']
        files: '^trust/imaging-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (data-access-api)
        args: ['--check', '--project', 'trust/data-access-api']
        files: '^trust/data-access-api/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (omop-db)
        args: ['--check', '--project', 'trust/omop-db']
        files: '^trust/omop-db/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (xnat-tests)
        args: ['--check', '--project', 'trust/xnat/tests']
        files: '^trust/xnat/tests/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (aws-deploy)
        args: ['--check', '--project', 'deploy/providers/AWS']
        files: '^deploy/providers/AWS/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (flip-utils)
        args: ['--check', '--project', 'flip-utils']
        files: '^flip-utils/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (fl-api-flower)
        args: ['--check', '--project', 'fl-services/flower/fl-api-flower']
        files: '^fl-services/flower/fl-api-flower/(pyproject\.toml|uv\.lock|uv\.toml)$'
      - id: uv-lock
        name: uv-lock (fl-api-base)
        args: ['--check', '--project', 'fl-services/nvflare/fl-api-base']
        files: '^fl-services/nvflare/fl-api-base/(pyproject\.toml|uv\.lock|uv\.toml)$'
