<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- No viewport-fit=cover: measured on iOS 26 Safari (#791), portrait rendering is letterboxed
       inside the browser chrome either way (safe-area insets stay 0), while in landscape cover
       slides content under the notch — only re-add it together with env(safe-area-inset-*)
       guards on every layout. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Pre-hydration default (light `body` token): the page paints light until useDark() applies
       the dark class, then useThemeColorMeta keeps this tag in sync with the app theme. -->
  <meta name="theme-color" content="#FAF7F5" />
  <meta name="description" content="FLIP (Federated Learning & Interoperability Platform) — train and evaluate medical imaging AI models across NHS Trusts while keeping patient data inside each hospital." />
  <meta http-equiv="expires" content="0">
  <script src="/js/window.js"></script>
  <title>FLIP | London AI Centre</title>
</head>

<body>
  <div id="app" class="antialiased font-medium"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
