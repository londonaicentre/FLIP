[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flip-utils"
dynamic = ["version"]
description = "FLIP - Federated Learning and Interoperability Platform library built on NVIDIA FLARE"
readme = {file = "docs/overview.rst", content-type = "text/x-rst"}
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "AI Centre for Value Based Healthcare" },
    { name = "Guy's and St Thomas' NHS Foundation Trust" },
    { name = "King's College London" },
    { name = "A. Triay Bagur", email = "alexandre.triay_bagur@kcl.ac.uk" },
    { name = "P. Wright", email = "p.wright@kcl.ac.uk" },
    { name = "R. Garcia-Dias", email = "r.gaciadias@gmail.com" },
    { name = "V. Fernandez", email = "virginia.fernandez@kcl.ac.uk" },
]
maintainers = [
    { name = "A. Triay Bagur", email = "alexandre.triay_bagur@kcl.ac.uk" },
    { name = "P. Wright", email = "p.wright@kcl.ac.uk" },
    { name = "R. Garcia-Dias", email = "r.gaciadias@gmail.com" },
    { name = "V. Fernandez", email = "virginia.fernandez@kcl.ac.uk" },
]
keywords = ["federated-learning", "medical-imaging", "nvflare", "flip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "boto3>=1.38.31",
    "nvflare==2.7.2",
    "pandas>=2.3.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/londonaicentre/flip-fl-base"
Repository = "https://github.com/londonaicentre/flip-fl-base"
Documentation = "https://flip-fl-base.readthedocs.io/en/stable"
Issues = "https://github.com/londonaicentre/flip-fl-base/issues"

[project.optional-dependencies]
# Full dependencies for running FL jobs (includes ML frameworks)
full = [
    "einops==0.8.1",
    "gdown>=5.2.2",
    "lpips==0.1.4",
    "monai>=1.5.2",
    "nibabel>=5.3.2",
    "pydicom>=3.0.2",
    # Pin torch>=2.11,<2.12 (was 2.9.1 via MONAI transitive) so the NVFlare
    # supernode runs the same torch as the flower one (flip-fl-base-flower
    # pins the same range). PyPI's torch 2.11.x ships the cu128 build by
    # default, which matches host NVIDIA driver 575.x. 2.12 ships cu130
    # which needs driver >=580.
    "torch>=2.11.0,<2.12",
]

[tool.uv]
# 72h supply-chain cooldown; see CONTRIBUTING.md ("Dependency cooldown").
exclude-newer = "3 days"
# Security: minimum versions for transitive packages with open CVEs.
constraint-dependencies = [
    "aiohttp>=3.14.0",           # CVE-2026-47265, CVE-2026-34993, CVE-2026-34525/16/15/14/13/12, CVE-2026-22815, CVE-2026-21860
    "cryptography>=46.0.7",      # CVE-2026-26007, CVE-2026-39892, CVE-2026-34073
    "filelock>=3.20.3",          # CVE-2025-68146, CVE-2026-22701
    # flask>=3.1.3 omitted: nvflare==2.7.2 hard-pins flask==3.0.2; unresolvable until nvflare relaxes that pin
    "idna>=3.15",                # CVE-2026-45409
    "pillow>=12.2.0",            # CVE-2026-42311/42310/42309/42308/40192/25990
    "protobuf>=6.33.5",          # CVE-2026-0994
    "pygments>=2.20.0",          # CVE-2026-4539
    "pyjwt>=2.12.0",             # CVE-2026-32597
    "python-dotenv>=1.2.2",      # CVE-2026-28684
    "requests>=2.33.0",          # CVE-2026-25645
    "urllib3>=2.7.0",            # CVE-2026-44431, CVE-2025-66471/66418
    "werkzeug>=3.1.6",           # CVE-2026-27199, CVE-2026-21860, CVE-2025-66221, CVE-2024-49767/49766
]

# Pull torch from PyTorch's cu128 wheel index instead of PyPI's default cu130
# build. cu130 needs NVIDIA driver >=580; current dev hosts run 575.x and would
# fail at torch.cuda.is_available() (same trap that bit flip-fl-base-flower).
# Mirrors the --extra-index-url flag in the flower fl-base Dockerfile.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.version]
path = "flip/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["flip"]

[tool.hatch.build.targets.sdist]
include = [
    "/flip",
    "/README.md",
    "/LICENSE.md",
    "/NOTICE.md",
    "/pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".coverage",
    "*.coverage",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.6.0",
    "matplotlib>=3.10.7",
    "mypy>=1.18.2,<2.0",
    "pyqt5>=5.15.11",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
    "types-requests>=2.32.4.20260107",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT']

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# Exclude subdirectories that have their own pyproject.toml and dependencies
norecursedirs = ["fl_services", "fl-base", ".venv", "workspace", ".test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Exclude patterns to avoid duplicate module issues
exclude = [
    "^tests/",
    "^fl_services/",
    "^workspace/",
    "^\\.test_",
    "^\\.venv/",
]

# Each app has its own 'custom' module, so we need to treat them separately
# by using explicit-package-bases with the namespace_packages option
explicit_package_bases = true
namespace_packages = true

# Ignore duplicate module errors for these specific patterns
[[tool.mypy.overrides]]
module = [
    "custom",
    "custom.*",
    "utils",
    "utils.*",
]
ignore_errors = true
