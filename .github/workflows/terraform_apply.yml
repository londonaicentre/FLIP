#
# Terraform apply on merge (FLIP#962): develop → staging, main → production.
#
# Production applies automatically, on the official release cycle, with no human
# gate beyond branch protection and PR review on `main`. Two hazards make that
# safe to switch on, and both are handled here rather than left to a runbook:
#
#   Hazard A — an apply un-pins the released image.
#     ecs_services.tf tracks max(terraform_revision, live_revision), so a no-op
#     apply preserves what deploy-centralhub deployed. But an apply that *changes*
#     a task definition mints a revision from the env file's mutable `:stag` /
#     `:prod` tag, discarding the immutable sha pin from FLIP#751. Solved by
#     resolving the tag instead of reading it — see scripts/resolve-image-tags.sh.
#
#   Hazard B — replacing fl-server-net-1 kills an in-flight training run (FLIP#770).
#     A runner cannot ask the hub whether a run is in flight (GET /fl/quiesce is
#     Cognito-gated, CloudFront strips the internal key, and the scheduler state
#     is in a private subnet), so the gate asks the plan instead: if nothing on
#     the FL watch list changes, apply; otherwise hold for an operator. See
#     scripts/check-fl-plan-impact.sh.
#
# Re-running after quiescing: dispatch this workflow on the same branch with
# `fl_quiesced: true`. That input is the operator's attestation that FL job
# pickup is paused and no net is BUSY, and it is the only thing that skips the
# gate — without it the re-run re-reads the same plan, finds the same FL change
# and holds again, forever. Dispatching from any other branch fails closed: the
# apply role's trust policy pins job_workflow_ref to this file at
# refs/heads/{develop,main}.
#
# Release applies (FLIP#1283). release.yml dispatches this workflow on
# refs/heads/main with `release_tag: v<X.Y.Z>` once the fourteen image builds it
# fired at the tag have gone green, and the tag is forwarded to the resolver as
# RELEASE_TAG. Three consequences worth stating plainly:
#
#   * A release workflow can now trigger a production apply. It is still this
#     file running on refs/heads/main under the aws-prod environment, so the OIDC
#     trust policy, branch protection and environment rules are unchanged — what
#     is new is the trigger, not the authority.
#   * The ref is refs/heads/main and not the tag precisely because of that trust
#     policy: a dispatch at refs/tags/v<X.Y.Z> presents job_workflow_ref at the
#     tag and fails to assume the role.
#   * The release dispatch and the ordinary push apply of the same commit share
#     the concurrency group `tf-apply-main` with cancel-in-progress: false, so a
#     running apply is never interrupted, and the release one — fired after a
#     wait the length of an image build — applies second. That is the order that
#     matters: the push apply pins `sha-<short7>`, the release apply pins
#     `v<X.Y.Z>@sha256:…` over it.
#     `cancel-in-progress: false` protects the RUNNING apply, not a QUEUED one.
#     GitHub holds at most one pending run per group, so whatever is queued next
#     on main displaces what was queued before it. If you re-dispatch this
#     workflow while a release is in flight — the usual case being an
#     `fl_quiesced: true` re-dispatch of a held apply — pass `release_tag` too,
#     or your run silently takes the release apply's place and production stays
#     on the previous release. release.yml's "Confirm the release apply actually
#     ran" step catches that case and re-dispatches once (FLIP#1283).
#
# A release apply that changes the FL task-definition tag trips hazard B's gate
# and holds for an operator's `fl_quiesced: true` re-dispatch, exactly as any
# other FL-affecting apply does. That is deliberate: a platform release is an
# attended event, and the gate is not weakened for it.
#
# The UI (FLIP#1186). The `ui` job publishes flip-ui from the same commit once
# the apply has succeeded (publish_ui.yml), so the UI never reaches users ahead
# of the API it calls: a held apply holds the UI too, and the re-dispatch that
# releases the apply publishes it. `make deploy-ui` remains the manual path.

name: Terraform Apply

on:
  # Every push, not only infrastructure ones (FLIP#1186): the hub's images and
  # the UI deploy through this workflow, so a path filter left a flip-api or
  # flip-ui merge undeployed until the next infrastructure change. A push that
  # changes nothing plans to a no-op, probes GHCR once (see the wait step) and
  # republishes the same UI.
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      fl_quiesced:
        description: >-
          FL is quiesced (deployment mode on, no BUSY net) — skip the FL-impact
          gate. This is an operator attestation, not a check: the runner cannot
          reach GET /fl/quiesce, so nothing verifies it.
        type: boolean
        default: false
      hold_minutes:
        description: >-
          Staging only. Minutes to keep staging up after the end to end check
          before stopping it. Empty uses the repository variable
          STAGING_HOLD_MINUTES, or 120. Ignored on main.
        type: string
        default: ""
      release_tag:
        description: >-
          Pin this release (v<X.Y.Z>) instead of the commit's sha image. Set by
          release.yml once the release builds are green; leave empty for an
          ordinary operator re-run. Fails closed if the release images are not
          published — see scripts/resolve-image-tags.sh.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Never cancel an apply in progress — a half-applied plan leaves state and
  # reality disagreeing in a way the next run cannot reason about.
  group: tf-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # FLIP#1596. Staging is stopped between deploys, so the apply has to turn it on
  # before it can plan: Terraform refreshes RDS on every plan and a stopped
  # instance fails the refresh, not the apply, which reads as a broken pipeline
  # rather than a sleeping database. This also restores the ECS desired counts,
  # which the apply itself no longer does now that ecs_services.tf ignores them.
  #
  # Idempotent on an estate that is already up, so a start against a running
  # estate costs one describe call per resource and nothing else. A merge made
  # while a hold is sleeping is not that case: the workflow-level
  # `tf-apply-<ref>` group has `cancel-in-progress: false`, so the new run would
  # otherwise queue behind the whole hold and its stop, and then start an estate
  # that is still stopping. Claiming `stag-hold` here cancels the sleeping hold
  # before the merge waits on it, which is also the right outcome on its own
  # terms: the hold's purpose is to keep staging up after a deploy, and a newer
  # deploy supersedes it. The hold-then-stop job at the end of this run opens a
  # fresh window.
  start-staging:
    name: Start staging before the apply
    if: (github.repository == 'londonaicentre/FLIP' || vars.TF_CI_ON_FORK == 'true') && github.ref_name != 'main' && vars.TF_STAG_DISABLED != 'true'
    concurrency:
      group: stag-hold
      cancel-in-progress: true
    uses: ./.github/workflows/staging_lifecycle.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit # pragma: allowlist secret
    with:
      # The data half only. The ECS counts are restored after the gate, by the
      # restore-staging-services job below.
      action: start-stag-data

  apply:
    name: Apply (${{ github.ref_name == 'main' && 'prod' || 'stag' }})
    # Setting the repository variable TF_STAG_DISABLED=true pauses the staging
    # leg of plan, apply and drift, so a develop merge cannot rebuild a staging
    # estate that was torn down on purpose. It is a repository variable rather
    # than an aws-stag one because a job-level `if` is evaluated before the job's
    # environment is loaded. Production (main) never reads it.
    #
    # Outside londonaicentre/FLIP, plan, apply and drift all skip unless the
    # repository variable TF_CI_ON_FORK is `true` (adopters:
    # deploy/providers/AWS/ci/README.md). A fork has no aws-* environments, so each
    # run would fail and mail whoever pushed, or for drift whoever last edited it.
    #
    # `always()` is required because start-staging is skipped on main, and a
    # skipped dependency would otherwise skip this job, i.e. silently stop every
    # production apply. The result checks below are what stop `always()` from
    # meaning "apply even though staging could not be started": planning against a
    # database that never came up produces a refresh error, not a plan.
    needs: [start-staging]
    if: >-
      (github.repository == 'londonaicentre/FLIP' || vars.TF_CI_ON_FORK == 'true')
      && always()
      && (github.ref_name == 'main' || vars.TF_STAG_DISABLED != 'true')
      && needs.start-staging.result != 'failure'
      && needs.start-staging.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'aws-prod' || 'aws-stag' }}
    permissions:
      contents: read
      id-token: write # mint the OIDC token
      packages: read # probe GHCR for the release image tag

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the image-wait decision below diffs this push against
          # its predecessor, which a shallow clone cannot reach.
          fetch-depth: 0

      # Validated here as well as in the resolver, because the two reject
      # different things: the resolver only ever sees the string, while the
      # estate check below is this workflow's own invariant. `release_tag` is a
      # free-text dispatch input, so a typo would otherwise reach the resolver as
      # "the release image is absent" and read as a failed build.
      - name: Validate the release tag
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::release_tag must be a stable release tag v<X>.<Y>.<Z> (got '${RELEASE_TAG}')"; exit 1; }
          # The estate is chosen by the ref — develop → stag, main → prod — and a
          # release is a main/prod event by definition. A release_tag on develop
          # would pin a production release into staging from a branch whose code
          # is not in it.
          [[ "${GITHUB_REF_NAME}" == "main" ]] ||
            { echo "::error::release_tag is only valid on main (prod); got ref ${GITHUB_REF_NAME}"; exit 1; }

          # THE TAG MUST BE THIS COMMIT. The dispatch runs main as it is when the
          # dispatch fires, up to the whole build wait after the tag was cut. If a
          # hotfix B merged during that window, B's own push apply has pinned
          # sha-B; applying release A's images on top of B's code is a silent
          # rollback of production. Checking the tag against the commit actually
          # checked out turns that into a red run before any AWS call.
          #
          # Recovery is to cut a release from the newer commit, not to re-run
          # this: by then the older release's images are genuinely not what main
          # is.
          TAG_SHA="$(git rev-parse -q --verify "${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          [[ -n "${TAG_SHA}" ]] ||
            { echo "::error::${RELEASE_TAG} does not resolve to a commit in this checkout"; exit 1; }
          [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]] ||
            { echo "::error::${RELEASE_TAG} is ${TAG_SHA}, but this run is applying ${GITHUB_SHA} — main moved on after the tag was cut. Applying ${RELEASE_TAG}'s images over newer code would roll production back; cut a release from ${GITHUB_SHA} instead."; exit 1; }
          echo "Pinning release ${RELEASE_TAG} (${TAG_SHA})."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          role-session-name: flip-tf-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # This workflow fires on `deploy/providers/AWS/**`; the image builds fire on
      # service paths. An infrastructure-only merge therefore publishes no
      # `sha-<short7>` image at all, and waiting the full budget for one that
      # cannot exist burns GHCR_WAIT_SECONDS of idle runner on the commonest kind
      # of apply. The resolver looks for three images (flip-api, fl-server,
      # fl-api), but the two FL ones are published by one workflow and share a
      # single budget, so the worst case is two waits, not three. So the budget is
      # spent only when this push actually touched a path that builds one of them.
      - name: Decide how long to wait for this commit's images
        id: wait
        env:
          BEFORE: ${{ github.event.before }}
          CONFIGURED_WAIT: ${{ vars.GHCR_WAIT_SECONDS || 900 }}
        run: |
          set -euo pipefail
          # flip-api        <- test_flip_api.yml -> docker_build_flip_api.yml
          # flare-fl-server
          # flower-superlink <- fl-docker-build-{nvflare,flower}.yml
          paths=(
            flip-api
            fl-services
            flip-utils
            .github/workflows/test_flip_api.yml
            .github/workflows/docker_build_flip_api.yml
            .github/workflows/fl-docker-build-nvflare.yml
            .github/workflows/fl-docker-build-flower.yml
          )
          seconds="${CONFIGURED_WAIT}"
          reason="cannot tell what changed — waiting the full budget"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${BEFORE}" =~ ^[0-9a-f]{40}$ ]] &&
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if [[ -z "$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- "${paths[@]}")" ]]; then
              seconds=0
              reason="no service path changed in ${BEFORE:0:7}..${GITHUB_SHA:0:7} — probing once instead of waiting"
            else
              reason="a service path changed — waiting up to ${CONFIGURED_WAIT}s for its image"
            fi
          fi
          echo "GHCR wait: ${seconds}s (${reason})."
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"

      # Hazard A. Waits for this commit's `sha-<short7>` images, which
      # docker_build_*.yml publishes only after the service's tests pass — so an
      # apply cannot deploy an image that never went green. When no image was
      # published (an infrastructure-only merge) it reuses what the services are
      # already running, never the mutable tag.
      - name: Resolve the image tags to pin
        env:
          GIT_SHA: ${{ github.sha }}
          # Empty on every path but a release dispatch, which is exactly the
          # pre-FLIP#1283 sha behaviour — see scripts/resolve-image-tags.sh.
          RELEASE_TAG: ${{ inputs.release_tag }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          FALLBACK_DOCKER_TAG: ${{ vars.DOCKER_TAG }}
          FALLBACK_DOCKER_FL_TAG: ${{ vars.DOCKER_FL_TAG }}
          FL_BACKEND: ${{ vars.FL_BACKEND }}
          GHCR_WAIT_SECONDS: ${{ steps.wait.outputs.seconds }}
        run: deploy/providers/AWS/scripts/resolve-image-tags.sh >> "$GITHUB_ENV"

      # DOCKER_TAG / DOCKER_FL_TAG are deliberately absent from this env block:
      # they are inherited from the step above via $GITHUB_ENV. Setting them from
      # `vars` here would override the resolved values and reintroduce hazard A.
      - name: Compose the Terraform env file
        env:
          # The estate: TF_HUB (stag | prod) on the environment. No fallback, so an
          # unset TF_HUB fails this step instead of composing some default estate.
          HUB: ${{ vars.TF_HUB }}
          # The class this run is allowed to compose, asserted by the script. The
          # ref says which class the *branch* deploys; TF_HUB says which estate to
          # deploy it into, and nothing else checks the two agree. They must:
          # TF_HUB=stag on aws-prod composes a prod-sized plan whose
          # RDS is refreshed as deletion_protection = false, skip_final_snapshot =
          # true — then applies it unattended on main. With this, that is a red
          # compose step instead of a plan someone has to read closely.
          EXPECTED_ENV_CLASS: ${{ github.ref_name == 'main' && 'prod' || 'stag' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FLIP_TFSTATE_BUCKET_NAME: ${{ vars.FLIP_TFSTATE_BUCKET_NAME }}
          AICENTRE_BUCKET_NAME: ${{ vars.AICENTRE_BUCKET_NAME }}
          FLIP_APP_BUNDLES_BUCKET_NAME: ${{ vars.FLIP_APP_BUNDLES_BUCKET_NAME }}
          FLIP_FL_RESULTS_BUCKET_NAME: ${{ vars.FLIP_FL_RESULTS_BUCKET_NAME }}
          FLIP_MODEL_FILES_UPLOADS_BUCKET_NAME: ${{ vars.FLIP_MODEL_FILES_UPLOADS_BUCKET_NAME }}
          FLIP_UI_BUCKET_NAME: ${{ vars.FLIP_UI_BUCKET_NAME }}
          FL_SERVER_PORT: ${{ vars.FL_SERVER_PORT }}
          ENFORCE_MFA: ${{ vars.ENFORCE_MFA }}
          DEMO_ASSETS_BUCKET_NAME: ${{ vars.DEMO_ASSETS_BUCKET_NAME }}
          FL_ADMIN_DIRECTORY: ${{ vars.FL_ADMIN_DIRECTORY }}
          INTERNAL_SERVICE_KEY_HEADER: ${{ vars.INTERNAL_SERVICE_KEY_HEADER }}
          TRUST_API_KEY_HEADER: ${{ vars.TRUST_API_KEY_HEADER }}
          SES_VERIFIED_EMAIL: ${{ vars.SES_VERIFIED_EMAIL }}
          ALB_SUBDOMAIN: ${{ vars.ALB_SUBDOMAIN }}
          NLB_SUBDOMAIN: ${{ vars.NLB_SUBDOMAIN }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          FL_BACKEND: ${{ vars.FL_BACKEND }}
          FL_KIT_SLOT_NAMES: ${{ vars.FL_KIT_SLOT_NAMES }}
          FLARE_KIT_DATE: ${{ vars.FLARE_KIT_DATE }}
          FLOWER_KIT_DATE: ${{ vars.FLOWER_KIT_DATE }}
          DEPLOY_TRUST_EC2: ${{ vars.DEPLOY_TRUST_EC2 }}
          JOB_RESOURCE_SPEC_NUM_GPUS: ${{ vars.JOB_RESOURCE_SPEC_NUM_GPUS }}
          # The LZA keys (FLIP#749), required — see compose-ci-env.sh. The last three have no
          # `export TF_VAR_…` line in the Makefile, so the script writes them into
          # the env file as raw exports. The two web-edge values are optional on
          # purpose: the edge is built from this stack's outputs, so they are
          # legitimately empty on a first apply.
          ACCESS_LOGS_BUCKET_NAME: ${{ vars.ACCESS_LOGS_BUCKET_NAME }}
          EFS_PROVISION_IMAGE: ${{ vars.EFS_PROVISION_IMAGE }}
          LZA_VPC_NAME: ${{ vars.LZA_VPC_NAME }}
          MANAGE_DNS: ${{ vars.MANAGE_DNS }}
          NETWORKING_INGRESS_CIDRS: ${{ vars.NETWORKING_INGRESS_CIDRS }}
          LZA_WEB_EDGE_DOMAIN: ${{ vars.LZA_WEB_EDGE_DOMAIN }}
          LZA_WEB_EDGE_DISTRIBUTION_ARN: ${{ vars.LZA_WEB_EDGE_DISTRIBUTION_ARN }}
          ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
          AES_KEY_BASE64: ${{ secrets.AES_KEY_BASE64 }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          INTERNAL_SERVICE_KEY_HASH: ${{ secrets.INTERNAL_SERVICE_KEY_HASH }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
        run: deploy/providers/AWS/scripts/compose-ci-env.sh

      - name: Write the EC2 keypair public key
        run: |
          mkdir -p "$HOME/.ssh"
          if ! aws ssm get-parameter \
            --name /flip/ci/host_aws_public_key \
            --query Parameter.Value --output text > "$HOME/.ssh/host-aws.pub"; then
            echo "::error::/flip/ci/host_aws_public_key is missing. It is declared in" \
                 "deploy/providers/AWS/parameter_store.tf and created by the first" \
                 "laptop apply of that root in this account."
            exit 1
          fi
          chmod 600 "$HOME/.ssh/host-aws.pub"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false

      - name: Export the Terraform variables
        working-directory: deploy/providers/AWS
        env:
          # The compose step's HUB, so `make` reads the env file it wrote and maps
          # it onto TF_VAR_* exactly as a laptop plan would.
          HUB: ${{ vars.TF_HUB }}
        run: make --no-print-directory print-tf-env >> "$GITHUB_ENV"

      # Plan first and apply *that file*, never `apply -auto-approve` against a
      # fresh plan: the gate below has to inspect the same plan that gets applied,
      # or it is checking something else.
      - name: Terraform plan
        uses: op5dev/tf-via-pr@39ed2635c056ca408ed24cc5c2baf0ef4381a7a5 # v13.7.4
        with:
          command: plan
          working-directory: deploy/providers/AWS
          arg-backend-config: bucket=${{ vars.FLIP_TFSTATE_BUCKET_NAME }},region=${{ vars.AWS_REGION }}
          validate: true
          format: true
          # preserve-plan keeps the file in the working directory, which the FL
          # gate below and the apply step both read. That is local to the runner.
          preserve-plan: true
          # upload-plan is a different thing and MUST stay false: it publishes
          # the plan as a workflow artifact, and the plan file is a zip
          # containing the full tfstate — AES_KEY_BASE64, INTERNAL_SERVICE_KEY
          # and ADMIN_USER_PASSWORD in plaintext. This repository is public, so
          # that artifact would be a public download of production credentials.
          # An applied-plan audit trail is not worth that; the run log records
          # what was applied.
          upload-plan: false

      # FLIP#1596. The gate below asks whether this apply could disturb a training
      # run. On a stopped staging estate the answer is no by construction: with
      # fl-server-net-1 and fl-api-net-1 at desired count 0 there is no task to
      # interrupt and none can start, so there is nothing for an operator to
      # attest to. Without this, every develop apply to a stopped estate, a docs
      # only merge included, holds for an fl_quiesced dispatch that means nothing.
      #
      # This is a MEASUREMENT, not an attestation. It asks ECS, in this job,
      # moments before the plan is read, and it is deliberately taken before
      # restore-staging-services puts the counts back. It never runs on main: the
      # production estate is not stopped by anything, so a true here could only
      # ever come from a bug or a misconfigured variable, and the step not
      # existing is a stronger guarantee than the step returning false.
      - name: Check whether the FL services are stopped
        id: fl_state
        if: github.ref_name != 'main'
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: deploy/providers/AWS/scripts/staging-power.sh status

      # Hazard B. Exit 1 holds the deploy with the resources named; exit 2 means
      # the plan could not be read, which is also a hold — never an apply.
      - name: Check the plan for FL impact
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fl_quiesced) }}
        working-directory: deploy/providers/AWS
        env:
          # Empty on main and on any run where the step above could not answer,
          # and the script treats anything but the literal "true" as "the gate
          # stands", so a failed measurement holds rather than releases.
          FL_SERVICES_STOPPED: ${{ steps.fl_state.outputs.fl_stopped }}
        run: |
          terraform show -json tfplan > tfplan.json
          scripts/check-fl-plan-impact.sh tfplan.json

      # The same script, advisory-only, on exactly the runs the gate above skips
      # (FLIP#1199). `fl_quiesced=true` attests that FL is quiesced — it says
      # nothing about whether the networking account has been updated, and an NLB
      # replacement is both FL-disruptive and ingress-changing, so the one apply
      # most likely to break the cross-repo contract is the one that would
      # otherwise emit no LZA advisory at all. It exits 0 on every readable plan;
      # an unreadable plan fails the step (it fails closed rather than claiming
      # "no advisory"), which is why `continue-on-error: true` is set here: the
      # attestation is what releases the apply, and a broken advisory — an
      # unexpected plan shape, a jq error, a future selector bug — must not take
      # away the one documented way past a gate that is holding or failing.
      - name: Emit the plan advisories (FL gate skipped)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fl_quiesced }}
        continue-on-error: true
        working-directory: deploy/providers/AWS
        env:
          ADVISORY_ONLY: "true"
        run: |
          terraform show -json tfplan > tfplan.json
          scripts/check-fl-plan-impact.sh tfplan.json

      # The documented remedy for a held apply — quiesce FL, then re-run — needs
      # a way to say "I have quiesced it", or the re-run holds on the same plan
      # forever. Nothing here verifies the claim: the runner cannot reach
      # GET /fl/quiesce. It is recorded as a warning annotation with the actor's
      # name so the attestation is attributable after the fact.
      - name: Record the FL-quiesce attestation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fl_quiesced }}
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "::warning title=FL gate skipped::${ACTOR} dispatched this apply with fl_quiesced=true, so the FL gate did not hold this apply (scripts/check-fl-plan-impact.sh ran advisory-only). An in-flight training run is killed if that attestation is wrong."

      # tf-via-pr moves `plan-file` onto its own working path, so hand it a copy
      # rather than the file it is about to overwrite.
      - name: Stage the reviewed plan
        working-directory: deploy/providers/AWS
        run: cp tfplan tfplan.gated

      - name: Terraform apply
        uses: op5dev/tf-via-pr@39ed2635c056ca408ed24cc5c2baf0ef4381a7a5 # v13.7.4
        with:
          command: apply
          working-directory: deploy/providers/AWS
          arg-backend-config: bucket=${{ vars.FLIP_TFSTATE_BUCKET_NAME }},region=${{ vars.AWS_REGION }}
          plan-file: deploy/providers/AWS/tfplan.gated
          # Belt and braces. Today tf-via-pr only uploads for `command: plan`, so
          # this step would not publish anything — but the state-in-plaintext
          # consequence is severe enough on a public repo that it should not
          # depend on that staying true. The harness requires it on every step.
          upload-plan: false

      # The UI build reads the Cognito ids from environment variables, because it
      # runs without the credentials to read Terraform state. They change only if
      # the pool or client is replaced; this is the run that would replace them,
      # so it says so.
      - name: Check the UI's Cognito ids against Terraform
        working-directory: deploy/providers/AWS
        env:
          UI_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
          UI_CLIENT_ID: ${{ vars.AWS_COGNITO_APP_CLIENT_ID }}
        run: |
          set -uo pipefail
          pool="$(terraform output -raw CognitoUserPoolId 2>/dev/null)" || pool=""
          client="$(terraform output -raw CognitoAppClientId 2>/dev/null)" || client=""
          if [[ "${pool}" != "${UI_POOL_ID}" || "${client}" != "${UI_CLIENT_ID}" ]]; then
            echo "::warning title=UI Cognito ids differ::AWS_COGNITO_USER_POOL_ID / AWS_COGNITO_APP_CLIENT_ID on this environment do not match terraform output CognitoUserPoolId / CognitoAppClientId. The published UI signs in against the variables: update them and re-run the ui job."
          fi

  ui:
    name: Publish flip-ui (${{ github.ref_name == 'main' && 'prod' || 'stag' }})
    needs: apply
    uses: ./.github/workflows/publish_ui.yml
    # The ceiling for publish_ui.yml's jobs: its build job narrows to
    # contents: read, so only the publish job can mint a token.
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.ref_name == 'main' && 'aws-prod' || 'aws-stag' }}
      release_tag: ${{ inputs.release_tag }}

  # ---------------------------------------------------------------------------
  # The staging cycle after the apply (FLIP#1596): restore, check, hold, stop.
  # None of these jobs exists on a production apply. They are gated on the ref
  # rather than on an environment ternary so that there is no expression anywhere
  # in this file that could select aws-prod for a stop.
  # ---------------------------------------------------------------------------

  # The counts the gate needed to see at 0. Terraform no longer owns them
  # (ecs_services.tf, ignore_changes = [desired_count]), so this is what brings
  # the services back after an apply: the "no manual steps" half of the start
  # path.
  restore-staging-services:
    name: Restore the staging ECS services
    needs: [apply]
    if: github.ref_name != 'main' && needs.apply.result == 'success' && vars.TF_STAG_DISABLED != 'true'
    uses: ./.github/workflows/staging_lifecycle.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit # pragma: allowlist secret
    with:
      action: start-stag-services

  # The end to end check. FLIP#1596 asks for login, a cohort query and an FL round;
  # none of those can run from a GitHub runner today, so this is deliberately the
  # smaller thing it asks for second: an unauthenticated reachability check of the
  # deployed hub, reported on the run summary.
  #
  # What it does NOT do, and why. Login needs a Cognito user and MFA is on; a
  # cohort query needs that session; an FL round needs reachable trusts, which on
  # LZA sit behind the networking account's edge and are not addressable from a
  # hosted runner. Each of those is a credential and a route this workflow does not
  # have, and inventing an unauthenticated path to them would be a hole in the
  # estate, not a test. The existing suites are no help either: local_auth_smoke.yml
  # boots a compose stack with no AWS at all, and `make e2e_smoke` is a dev box
  # target that needs FL images and trusts. So: a health probe now, and a real
  # authenticated end to end check when there is a CI identity to run it as.
  #
  # Never blocks the stop. A hub that does not answer is a reason to look, not a
  # reason to leave staging running all night.
  staging-end-to-end:
    name: End to end check against staging
    needs: [apply, restore-staging-services]
    if: github.ref_name != 'main' && needs.apply.result == 'success' && vars.TF_STAG_DISABLED != 'true'
    runs-on: ubuntu-latest
    # Required, not cosmetic. LZA_WEB_EDGE_DOMAIN is an aws-stag environment
    # variable, not a repository one, so a job with no environment reads it as
    # empty, skips the probe and reports a warning annotation nobody reads. The
    # whole check then passes without having checked anything. Hard-coded rather
    # than a ternary for the same reason as staging_lifecycle.yml: nothing here
    # should be able to select aws-prod.
    environment: aws-stag
    permissions:
      contents: read
    steps:
      - name: Probe the deployed hub
        id: probe
        # The probe itself is allowed to fail so that the report step below runs
        # and renders the summary; the report step is what sets the job's result.
        continue-on-error: true
        env:
          # Set STAGING_HEALTH_URL to point the check somewhere specific;
          # otherwise it is derived from the LZA web edge domain.
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          EDGE_DOMAIN: ${{ vars.LZA_WEB_EDGE_DOMAIN }}
        run: |
          set -uo pipefail
          url="${HEALTH_URL}"
          if [[ -z "${url}" && -n "${EDGE_DOMAIN}" ]]; then
            url="https://${EDGE_DOMAIN}/api/health"
          fi
          if [[ -z "${url}" ]]; then
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning title=End to end check skipped::Neither STAGING_HEALTH_URL nor LZA_WEB_EDGE_DOMAIN is set, so there is no address to probe."
            exit 0
          fi
          echo "Probing ${url}"
          # The service has just been scaled from 0, so the first minute is an ECS
          # task pulling an image and an ALB target going healthy. Retrying is the
          # check; a single immediate curl would only ever measure that.
          code=000
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o "${RUNNER_TEMP}/body.txt" -w '%{http_code}' --max-time 15 "${url}" || echo 000)"
            [[ "${code}" =~ ^(2|3)[0-9][0-9]$ ]] && break
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 20
          done
          echo "status=${code}" >> "$GITHUB_OUTPUT"
          if [[ "${code}" =~ ^(2|3)[0-9][0-9]$ ]]; then
            echo "verdict=passed" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the result
        if: always()
        env:
          VERDICT: ${{ steps.probe.outputs.verdict }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail
          case "${VERDICT:-failed}" in
            passed)  icon="✅"; text="The deployed hub answered (HTTP ${STATUS})." ;;
            skipped) icon="⏭️"; text="No address configured, so nothing was probed. Set STAGING_HEALTH_URL or LZA_WEB_EDGE_DOMAIN on the aws-stag environment." ;;
            *)       icon="❌"; text="The deployed hub did not answer (last status ${STATUS:-none})." ;;
          esac
          {
            echo "### ${icon} End to end check against staging"
            echo
            echo "${text}"
            echo
            echo "Staging now enters its hold window; it stops when the window ends."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${icon} ${text}"

          # The job's verdict. A check that renders ❌ on the summary and still
          # exits 0 is not a check, and "skipped" is a failure too: it means the
          # deploy was never verified, which is indistinguishable from a silent
          # misconfiguration of the address. hold-then-stop-staging runs under
          # `always()`, so failing here never leaves staging up.
          case "${VERDICT:-failed}" in
            passed) ;;
            skipped)
              echo "::error title=End to end check not run::Neither STAGING_HEALTH_URL nor LZA_WEB_EDGE_DOMAIN is set on aws-stag, so the deploy was not verified."
              exit 1
              ;;
            *)
              echo "::error title=End to end check failed::The deployed hub did not answer (last status ${STATUS:-none})."
              exit 1
              ;;
          esac

  # The hold, then the stop. `needs` the end to end job but not its verdict: a
  # failed probe must not leave staging running indefinitely, which is the state
  # this whole issue exists to end.
  hold-then-stop-staging:
    name: Hold staging, then stop it
    needs: [apply, staging-end-to-end]
    if: >-
      always() && github.ref_name != 'main'
      && needs.apply.result == 'success'
      && vars.TF_STAG_DISABLED != 'true'
    uses: ./.github/workflows/staging_lifecycle.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit # pragma: allowlist secret
    with:
      action: hold-then-stop
      # Empty on a push, which is what makes the repository variable
      # STAGING_HOLD_MINUTES the default for merges while a dispatch can still
      # override it per run.
      hold_minutes: ${{ inputs.hold_minutes }}
