name: Build and Push Docker Image for XNAT Database

on:
  workflow_dispatch:
  # Release builds (FLIP#1204): every image, at the tag — see AGENTS.md "Docker image builds".
  push:
    tags: ['v*.*.*']
  # Publish only after "Trust - XNAT CI" passes on main/develop (FLIP#880); the job-level `if`
  # below gates on its success. workflow_run has no path filter, so that workflow's push paths
  # cover every input of the XNAT images.
  workflow_run:
    workflows: ["Trust - XNAT CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-push:
    # Only publish when the upstream test run passed. Dispatch and release-tag runs have no
    # workflow_run context, so they pass. The head_repository clause is the trust boundary
    # (FLIP#882, scripts/tests/test_workflow_trust_guards.py).
    # The event clause builds a commit once (FLIP#2020): the suite also runs for the
    # develop→main PR, whose head branch passes the `branches` filter above, and a second
    # build would replace the immutable sha-<short7> tag with a different image.
    # A suite run started by hand is not a push either, so it no longer republishes: dispatch
    # this workflow instead.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) &&
      github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions: # override top-level read-only default to allow GHCR push
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./trust/xnat/postgres
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: londonaicentre/xnat-db
      BUILD_ARGS: |
        --build-arg PG_VERSION=16-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # workflow_run.* is empty on the other events, so fall back to the run's own ref.
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A stable v<X.Y.Z> tag must point at a commit on main — releases are cut there by
      # release.yml; pre-release (-rc.N) tags are the release-candidate path and pass.
      - name: Release tag guard
        uses: ./.github/actions/release-tag-guard

      # A branch build must not publish a tag a deploy resolves (stag/prod/latest/dev,
      # sha-<short7>, v<X.Y.Z>) — see AGENTS.md "Docker image builds".
      - name: Publish ref guard
        uses: ./.github/actions/publish-ref-guard

      - name: Determine tags
        id: tags
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_WR_EVENT: ${{ github.event.workflow_run.event }}
          GH_WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Under workflow_run, github.sha / github.ref_name name the default branch, not the
          # tested commit, so tag from the triggering run's head_sha / head_branch.
          if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
            SHA="$GH_WR_SHA"
            REF_NAME="$GH_WR_BRANCH"
          else
            SHA="$GH_SHA"
            REF_NAME="$GH_REF_NAME"
          fi

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SHA}"

          # An empty sha would silently publish a mutable literal `sha-` tag — refuse.
          [[ -n "$SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }

          # Immutable short-SHA tag (FLIP#751), pushed uniformly on every publish; today
          # only the hub ECS images are consumed (by `make deploy-centralhub`). Length 7
          # must match the tag resolution in deploy/aws/Makefile.
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${SHA:0:7}"

          # A release-tag run publishes :v<X.Y.Z> only — see AGENTS.md "Docker image builds".
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            TAGS="${REGISTRY}/${IMAGE_NAME}:${GH_REF_NAME}"
          else
            # Branch name sanitization
            SAFE_REF_NAME=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${SAFE_REF_NAME}"
          fi

          # Branch number (if starts with number)
          if [[ "$REF_NAME" =~ ^[0-9]+ ]]; then
              BRANCH_NUM=$(echo "$REF_NAME" | grep -oE '^[0-9]+')
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH_NUM}"
          fi

          # PR Number (if PR)
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
             PR_NUMBER=$(echo "$GH_REF" | awk -F / '{print $3}')
             TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi

          # Determine if this is a merge/push to main or develop
          BRANCH_NAME=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$GH_WR_EVENT" == "push" ]]; then
            BRANCH_NAME="$GH_WR_BRANCH"
          elif [[ "$GH_EVENT_NAME" == "push" ]]; then
            BRANCH_NAME="$GH_REF_NAME"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stag"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login $REGISTRY -u "$GH_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          TAG_FLAGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS+=("-t" "$tag")
          done
          # shellcheck disable=SC2086
          docker build $BUILD_ARGS "${TAG_FLAGS[@]}" .

      # FLIP#1812: a red migration smoke never publishes. The upgrade verbs' script dumps a
      # PostgreSQL 12.2 xnat-db, then this image starts on the same volume and has to restore it.
      - name: Smoke test — a PostgreSQL 12 volume is restored on first start (FLIP#1812)
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG="${DOCKER_TAGS%%,*}"
          RUN=(docker run -d -v xnat-db-smoke:/var/lib/postgresql/data -e POSTGRES_DB=xnat
               -e POSTGRES_PASSWORD="$(openssl rand -hex 16)"
               -e XNAT_DATASOURCE_USERNAME=xnat -e XNAT_DATASOURCE_PASSWORD="$(openssl rand -hex 16)")
          # TCP, not the socket: the server initdb runs its scripts against does not listen on it.
          ready() {
            for _ in $(seq 1 60); do docker exec "$1" pg_isready -q -h 127.0.0.1 && return; sleep 2; done
            docker logs "$1"; return 1
          }
          "${RUN[@]}" --name xnat-db-smoke-12 \
            -v "$PWD/XNAT.sql:/docker-entrypoint-initdb.d/XNAT.sql:ro" postgres:12.2-alpine
          ready xnat-db-smoke-12
          docker exec xnat-db-smoke-12 psql -X -U xnat -d xnat -c 'create table smoke as select 42 as answer'
          docker exec -i xnat-db-smoke-12 sh -s 16 < ../scripts/xnat_db_migrate_dump.sh
          docker stop xnat-db-smoke-12
          "${RUN[@]}" --name xnat-db-smoke-16 "$TAG"
          ready xnat-db-smoke-16
          test "$(docker exec xnat-db-smoke-16 psql -XAt -U xnat -d xnat -c 'select answer from smoke')" = 42
          test "$(docker exec xnat-db-smoke-16 psql -XAt -U postgres -c 'show server_version_num' | cut -c1-2)" = 16
          docker exec xnat-db-smoke-16 test -f /var/lib/postgresql/data/pg16/xnat-restored
          docker rm -f xnat-db-smoke-12 xnat-db-smoke-16
          docker volume rm xnat-db-smoke

      - name: Push Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "$tag"
          done
