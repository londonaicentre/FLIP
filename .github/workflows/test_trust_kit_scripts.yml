# scripts/tests/test_trust_kit_lib.py had no CI job, so its assertions — including the one proving
# a kit file is restricted to 0600 *before* the trust credentials are written into it (FLIP#889) —
# only ran when someone remembered to run them by hand. Stdlib only, no services, ~1s.

name: Trust kit scripts

on:
  push:
    branches: [develop]
    paths:
      - "scripts/trust_kit_lib.py"
      - "scripts/tests/test_trust_kit_lib.py"
      - ".github/workflows/test_trust_kit_scripts.yml"
  pull_request:
    branches: [develop]
    paths:
      - "scripts/trust_kit_lib.py"
      - "scripts/tests/test_trust_kit_lib.py"
      - ".github/workflows/test_trust_kit_scripts.yml"

permissions:
  contents: read

jobs:
  test-trust-kit-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trust_kit_lib tests
        run: python scripts/tests/test_trust_kit_lib.py
