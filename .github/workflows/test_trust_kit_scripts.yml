# scripts/tests/ had no CI job at all, so its assertions — including the one proving a kit file is
# restricted to 0600 *before* the trust credentials are written into it (FLIP#889) — only ran when
# someone remembered to run them by hand. Every file in that directory is stdlib-only, needs no
# services and shares the same `if __name__ == "__main__": main()` contract, so the whole directory
# runs here rather than one named file: a new script test is then covered by existing there.

name: Trust kit scripts

on:
  push:
    branches: [develop]
    paths:
      - "scripts/**"
      - ".github/workflows/test_trust_kit_scripts.yml"
      # Some guards here assert on files outside scripts/ — test_container_identity.py
      # on the compose files, test_workflow_trust_guards.py on the image-build
      # workflows, test_pr_paths_changed.py on the gated service workflows and the
      # path gate itself — so those paths trigger the push run too, or a guard
      # silently never runs on the very edit it exists to catch (FLIP#1171 was
      # reintroduced once that way). pull_request below is deliberately unfiltered:
      # every develop-targeted PR runs this ~1s job, which removes the trap entirely
      # where it matters and needs no path list to keep in step with the guards. That
      # stays true now the service suites are themselves path-gated on PRs into
      # develop (FLIP#1223) — this workflow is not gated, and must not be, because it
      # is where those gates are checked.
      - ".github/workflows/test_*.yml"
      - ".github/workflows/pr_paths_changed.yml"
      - "deploy/compose*.yml"
      - "trust/deploy/compose*.yml"
      - "fl-services/nvflare/compose.dev.yml"
      # test_secret_scanning_gate.py asserts on the secret-scanning workflow, the
      # pre-commit pin and the baseline (FLIP#1215) — same trap, same fix.
      - ".github/workflows/secret-scanning.yml"
      - ".pre-commit-config.yaml"
      - ".secrets.baseline"
      # test_compose_env_coverage.py asserts the dev composes against the env example (FLIP#1230).
      - ".env.development.example"
      - "deploy/fl_backend.mk"
      - ".github/workflows/docker_build_*.yml"
      - ".github/workflows/fl-docker-build-*.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - ".github/tests/**"
      - "tests/**"
      - "Makefile"
      - "trust/Makefile"
      - "trust/xnat/Makefile"
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test-trust-kit-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # test_sync_trust_kit.py drives sync_trust_kit.py through `uv run --no-config` and hard-exits
      # (rather than skipping) when uv is absent, so the runner needs it even though the tests
      # themselves are stdlib-only.
      - name: Install uv
        run: pip install uv
      # scripts/tests/, plus the repo-level trees that mirror what they test: tests/ for the root
      # Makefile, .github/tests/ for the workflows and actions. All stdlib-only.
      - name: Run scripts/, tests/ and .github/tests/
        run: |
          for test_file in scripts/tests/test_*.py tests/test_*.py $(find .github/tests -name 'test_*.py' | sort); do
            echo "== $test_file"
            python "$test_file" || exit 1
          done
