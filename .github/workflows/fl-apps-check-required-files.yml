name: Check required_files.json in fl-apps

on:
  push:
    branches: [develop]
    paths:
      - "fl-apps/**"
      - ".github/workflows/fl-apps-check-required-files.yml"
  pull_request:
    branches: [develop]
    paths:
      - "fl-apps/**"
      - ".github/workflows/fl-apps-check-required-files.yml"

permissions:
  contents: read

jobs:
  check-required-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Regenerate per-backend required_files manifests
        run: bash fl-apps/check_required_files.sh
      - name: Fail if committed manifests are stale
        run: |
          if ! git diff --exit-code -- 'fl-apps/**/required_files.json'; then
            echo "::error::A committed fl-apps/<backend>/required_files.json is out of date. Run 'bash fl-apps/check_required_files.sh' and commit the regenerated manifest." >&2
            exit 1
          fi
