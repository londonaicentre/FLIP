name: FLIP UI CI

on:
  push:
    branches: [main, develop]
    paths:
      - "flip-ui/**"
      - ".github/workflows/test_flip_ui.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        flip-ui/**
        .github/workflows/test_flip_ui.yml

  flip-ui:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: flip
    defaults:
      run:
        working-directory: ./flip-ui

    env:
      VITE_LOCAL: false
      # This job only runs lint + Vitest unit tests, neither of which needs
      # the Cypress desktop binary. Skipping its postinstall download avoids a
      # hard dependency on download.cypress.io (a flaky external CDN) during
      # `npm ci`. The cypress-e2e job below still installs the binary via
      # cypress-io/github-action, which caches it.
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Node.js version
        uses: actions/setup-node@v5 #
        with:
          # Node 24 LTS bundles npm >=11.10 (active LTS since Oct 2025). Node
          # 22 LTS bundles npm 10.x which silently ignores `.npmrc
          # min-release-age`, leaving the supply-chain cooldown unenforced.
          node-version: "24"
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Typechecks the Cypress test tree (test/tsconfig.json), which nothing
      # else covers: lint is eslint-only.
      - name: Run test-tree typecheck
        run: npm run test:types

      # Typechecks src/ and mocks/ with vue-tsc. Vitest strips types without
      # checking them, and every CI and deploy build is build:deploy (vite
      # build alone), so without this step src/ type errors never fail a run.
      - name: Run src typecheck
        run: npm run type-check

      - name: Run tests with npm
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: flip-ui/coverage/cobertura-coverage.xml
          flags: flip-ui
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  cypress-e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Runs the Cypress E2E suite against a stubbed API (network-level
    # intercepts in test/cypress/support/globalIntercepts.ts). No real
    # backend or Cognito user pool is needed — the fixture-driven flow
    # is independent of cloud infra.
    name: Cypress (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Cap each shard well below the 360-min default. 30 leaves headroom
    # for `runMode: 3` retries without burning a runner-day on a hung
    # browser.
    timeout-minutes: 30
    # Export Cognito + API config to every step. flip-ui/scripts/generate-
    # window-js.sh (run via the `pretest:start` npm hook before vite boots)
    # reads these from the shell env and emits `public/js/window.js`. Without
    # them, it falls back to its production defaults — including `/api` on
    # the base URL — and the spec intercepts (path-only, no `/api` prefix)
    # silently miss every request.
    #
    # CENTRAL_HUB_API_URL deliberately omits the `/api` segment used in
    # production: the specs use path-only intercepts (e.g. "/projects/*")
    # which never cross slashes, so they wouldn't match `/api/projects/foo`.
    # Production traffic still uses the real `/api` URL.
    env:
      VITE_LOCAL: "false"
      # Build-time gate for the Cypress test seams in src/utils/auth.ts
      # and src/main.ts. Vite inlines this and dead-code-eliminates the
      # surrounding branches in any non-E2E build, so the test seams
      # cannot ship in a production bundle.
      VITE_E2E: "true"
      CENTRAL_HUB_API_URL: "http://localhost:8080"
      # The Cypress suites stub Cognito's endpoint; keep the UI on that provider (FLIP#919).
      AUTH_BACKEND: "cognito"
      AWS_COGNITO_USER_POOL_ID: "eu-west-2_DUMMY1234"
      AWS_COGNITO_APP_CLIENT_ID: "dummyclientid1234567890ab"
      AWS_REGION: "eu-west-2"
      # Drives the blacklist check in src/partials/models/ModelUpload.vue
      # exercised by upload_model.spec.ts.
      BLACKLISTED_MODEL_FILES: "flip.py,server_app.py"
    strategy:
      # Don't cancel sibling groups when one fails — surface every broken
      # group in a single CI run so triage is one pass instead of N.
      fail-fast: false
      matrix:
        group: [group-1, group-2, group-3, group-4, group-5, group-6]
    defaults:
      run:
        working-directory: ./flip-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Node.js version
        uses: actions/setup-node@v5
        with:
          # Node 24 LTS bundles npm >=11.10; see the comment in the flip-ui
          # job above. The default `npm ci` run by cypress-io/github-action
          # then honours `.npmrc min-release-age`.
          node-version: "24"
          cache: npm
          cache-dependency-path: flip-ui/package-lock.json

      - name: Stub flip-ui/.env.e2e for Cypress
        # Vite's `loadEnv` and the cypress plugin (dotenv) both read this
        # file at process start. The values mirror the job-level `env:`
        # block above — they're stubs because the suite mocks Cognito and
        # the API at the network layer, so nothing here ever hits AWS.
        #
        # `.env.e2e`, not `.env.development` — see flip-ui/README.md → Testing.
        run: |
          cat > .env.e2e <<'EOF'
          VITE_LOCAL=false
          VITE_E2E=true
          CENTRAL_HUB_API_URL=http://localhost:8080
          AUTH_BACKEND=cognito
          AWS_COGNITO_USER_POOL_ID=eu-west-2_DUMMY1234
          AWS_COGNITO_APP_CLIENT_ID=dummyclientid1234567890ab
          AWS_REGION=eu-west-2
          BLACKLISTED_MODEL_FILES=flip.py,server_app.py
          EOF

      - name: Cypress run
        uses: cypress-io/github-action@v7
        # install-command defaults to `npm ci` when package-lock.json exists,
        # which is what we want here — reproducible installs in CI.
        with:
          working-directory: flip-ui
          browser: chrome
          start: npm run test:start
          # Plain http:// (not http-get://) — cypress-io/github-action v6 passes
          # this directly to its runner, which rejects the start-server-and-test
          # `http-get://` prefix and tries to exec it as a binary.
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          spec: test/cypress/integration/${{ matrix.group }}/**/*.spec.ts

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots-${{ matrix.group }}
          path: flip-ui/test/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  public-demo:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Builds the public demo as its publish does (build:demo, into dist-demo/
    # at base "/", FLIP#2012) and walks it as a visitor would. The demo shares
    # src/ with the real UI, so a UI change that breaks it fails here. The demo
    # build reads no environment, and its Mirage server answers every request.
    name: Public demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./flip-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Node.js version
        uses: actions/setup-node@v5
        with:
          # Node 24 LTS bundles npm >=11.10; see the comment in the flip-ui job above.
          node-version: "24"
          cache: npm
          cache-dependency-path: flip-ui/package-lock.json

      - name: Build and walk the demo
        uses: cypress-io/github-action@v7
        with:
          working-directory: flip-ui
          browser: chrome
          build: npm run build:demo
          # The walk's baseUrl is 127.0.0.1, so bind there rather than to
          # whichever address "localhost" resolves to on the runner. The demo
          # is served at the root, as on its own host.
          start: npm run serve:demo -- --host 127.0.0.1
          wait-on: "http://127.0.0.1:4174/"
          wait-on-timeout: 120
          config-file: cypress.public-demo.config.ts

      # The publish ships dist-demo/ as built: check it is the demo, with its own window.js.
      - name: Check the demo build
        run: |
          set -euo pipefail
          if [[ ! -f dist-demo/index.html ]]; then
            echo "::error::dist-demo/index.html is missing."
            exit 1
          fi
          if ! grep -Eq 'window.RELEASE_VERSION = "demo/[^"]+";' dist-demo/js/window.js; then
            echo "::error::dist-demo/js/window.js does not carry the demo's release."
            exit 1
          fi
          if ! compgen -G "dist-demo/static/*.js" > /dev/null; then
            echo "::error::dist-demo/static/ has no .js files."
            exit 1
          fi

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots-public-demo
          path: flip-ui/test/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
