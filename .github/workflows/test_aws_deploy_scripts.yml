name: AWS Deploy Scripts CI

on:
  push:
    branches: [main, develop]
    paths:
      - "deploy/providers/AWS/**"
      - ".github/workflows/test_aws_deploy_scripts.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "deploy/providers/AWS/**"

permissions:
  contents: read

jobs:
  ssh-config-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/providers/AWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run linting (ruff)
        run: uv run ruff check . --select I,F,E,W,PT,UP006,UP007,UP035,UP045

      - name: Run type checking (mypy)
        run: uv run mypy update_ssm_ssh_config.py check_status.py

      - name: Run unit tests (pytest)
        run: uv run pytest test_update_ssm_ssh_config.py -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./deploy/providers/AWS/coverage.xml
          flags: aws-deploy-scripts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
