name: FLIP API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "flip-api/**"
      # The unmocked manifest tests in tests/unit/fl_services/ read the real fl-apps/ tree.
      - "fl-apps/**"
      - ".github/workflows/test_flip_api.yml"
      # Shared inputs consumed from outside flip-api/. The job copies the root env
      # template to .env.development, which flip_api/config.py reads as its env_file
      # and flip-api/Makefile includes+exports; that Makefile also parse-time-includes
      # deploy/instance.mk, so `make unit_test` cannot even start without it.
      - ".env.development.example"
      - "deploy/instance.mk"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        flip-api/**
        fl-apps/**
        .github/workflows/test_flip_api.yml
        .env.development.example
        deploy/instance.mk

  flip-api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: flip
    # Postgres for integration tests is managed by Testcontainers (see
    # flip-api/tests/integration/conftest.py). Docker is preinstalled on
    # ubuntu-latest, so no `services:` block is needed here.
    defaults:
      run:
        working-directory: ./flip-api # Set working directory for subsequent steps

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Stated literally because flip-api, unlike the trust services, has no
          # .python-version file to point `python-version-file` at; keep this in
          # step with requires-python and the Dockerfile base (both 3.12). Do not
          # restore the previous `github.event.inputs.python-version || '3.11'`
          # form — this workflow has no workflow_dispatch trigger, so that input
          # was always empty and the job silently ran 3.11.
          python-version: "3.12"

      - name: Install uv (if used for dependency management)
        run: pip install uv

      - name: Setup environment file
        run: |
          cp ../.env.development.example ../.env.development
          # Override sensitive values with GitHub secrets
          echo "AES_KEY_BASE64=${{ secrets.AES_KEY_BASE64 }}" >> ../.env.development
          echo "DATA_ACCESS_POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          echo "OMOP_POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          # The GitHub environment can inject empty-string env vars; Pydantic
          # Settings treats explicit env vars (even empty) as an override of
          # the model default. Set ENV explicitly to prevent validation failure.
          echo "ENV=development" >> ../.env.development

      - name: Run unit tests
        run: make unit_test

      - name: Run integration tests (Testcontainers-managed Postgres)
        run: make integration_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: flip-api/coverage-unit.xml,flip-api/coverage-integration.xml
          flags: flip-api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
