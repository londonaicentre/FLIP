name: FLIP API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "flip-api/**"
      - ".github/workflows/test_flip_api.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  flip-api:
    runs-on: ubuntu-latest
    environment: flip
    # Postgres for integration tests is managed by Testcontainers (see
    # flip-api/tests/integration/conftest.py). Docker is preinstalled on
    # ubuntu-latest, so no `services:` block is needed here.
    defaults:
      run:
        working-directory: ./flip-api # Set working directory for subsequent steps

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # get python version from ./flip-api/.python-version file
          # if not found, use 3.11
          python-version: ${{ github.event.inputs.python-version || '3.11' }}

      - name: Install uv (if used for dependency management)
        run: pip install uv

      - name: Setup environment file
        run: |
          cp ../.env.development.example ../.env.development
          # Generate CI-only non-secret values so fork PR tests do not depend on repository secrets or reusable defaults.
          python - <<'PY' >> ../.env.development
          import base64
          import secrets

          print(f"AES_KEY_BASE64={base64.b64encode(secrets.token_bytes(32)).decode()}")
          print(f"DATA_ACCESS_POSTGRES_PASSWORD={secrets.token_urlsafe(24)}")
          print(f"OMOP_POSTGRES_PASSWORD={secrets.token_urlsafe(24)}")
          print(f"POSTGRES_PASSWORD={secrets.token_urlsafe(24)}")
          print("SES_VERIFIED_EMAIL=ci@example.com")
          print("AWS_SES_ADMIN_EMAIL_ADDRESS=ci@example.com")
          print("AWS_SES_SENDER_EMAIL_ADDRESS=ci@example.com")
          print("ENV=development")
          PY

      - name: Run unit tests
        run: make unit_test

      - name: Run integration tests (Testcontainers-managed Postgres)
        run: make integration_test

      - name: Run Schemathesis OpenAPI smoke test
        continue-on-error: true
        run: make schemathesis_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: flip-api/coverage.xml
          flags: flip-api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
