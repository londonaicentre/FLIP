name: Trust - Snowflake SPCS specs CI

on:
  push:
    branches: [main, develop]
    paths:
      - "trust/deploy/snowflake/**"
      # The Makefile derives the kit env token from PROD through it.
      - "deploy/env_mode.mk"
      - ".github/workflows/test_snowflake_specs.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches the
  # Snowflake node shape (pr_paths_changed.yml; PRs into main always run everything).
  # The list is the push `paths:` filter above, verbatim -
  # scripts/tests/test_pr_paths_changed.py fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        trust/deploy/snowflake/**
        deploy/env_mode.mk
        .github/workflows/test_snowflake_specs.yml

  spec-guards:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Spec and sync-kit guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # Credential-free by construction: the specs are rendered from a fixture kit and
      # the deploy path is asserted as emitted SQL, so nothing here needs a Snowflake
      # account, a connection or any network access.
      - name: Spec and sync-kit guards
        working-directory: trust/deploy/snowflake
        run: uv run --no-project --with pytest --with "pyyaml==6.0.3" pytest tests/ -v

      - name: Lint
        run: |
          pip install ruff
          ruff check trust/deploy/snowflake
          ruff format --check trust/deploy/snowflake
