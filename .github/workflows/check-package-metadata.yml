name: Check Package Metadata

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "flip-utils/**"
      - ".github/workflows/check-package-metadata.yml"

jobs:
    check-metadata:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: ./flip-utils
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              run: pip install uv

            - name: Install dependencies
              run: uv sync --all-extras

            - name: Install twine
              run: pip install twine

            - name: Build package
              run: uv build

            - name: Check package metadata with twine
              run: twine check dist/* --strict
