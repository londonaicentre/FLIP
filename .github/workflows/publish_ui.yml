#
# Publish flip-ui to the environment's UI bucket (FLIP#1186), and the public demo
# to its own bucket (FLIP#2012). Called by terraform_apply.yml once an apply has
# succeeded, so the UI never reaches users ahead of the API it calls: a held apply
# holds the UI too.
#
# The build never holds credentials, and each publish holds only its own:
#
#   build         npm ci runs third-party install scripts, so this job has no
#                 id-token, no AWS step and no secrets. window.js is generated
#                 from the environment's public values only (it is served to
#                 every browser anyway); the composed Terraform env file, which
#                 carries the AES key and the admin password, never reaches it.
#                 The demo is a second build, into its own artefact.
#   publish       assumes the UI-publish role (modules/terraform_ci_bootstrap),
#                 which can write the UI bucket and nothing else, and runs the
#                 same scripts/publish-ui.sh as `make deploy-ui`.
#   publish-demo  assumes the demo-publish role, which can write the demo bucket
#                 and nothing else, and runs the same script as `make deploy-demo`.
#                 The demo is served from its own host, so the browser keeps it
#                 away from the app's origin and tokens.
#
# Each publish runs where its role variable is set, and is skipped with a warning
# where it is not. Both roles trust this file at the environment's branch: a job
# inside a reusable workflow presents the called file as job_workflow_ref,
# whoever calls it.

name: Publish flip-ui

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to publish into (aws-stag or aws-prod).
        type: string
        required: true
      release_tag:
        description: The release being applied (v<X.Y.Z>), or empty for a sha build.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # For the environment's variables. Declaring it grants nothing by itself:
    # this job requests no token and references no secret.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.role.outputs.set }}
      demo: ${{ steps.demo_role.outputs.set }}
    steps:
      # A job-level `if` is evaluated before the environment's variables load,
      # so whether this environment publishes at all is decided here, once.
      # Until a role exists its publish is skipped rather than failed.
      - name: Check for the UI-publish role
        id: role
        env:
          ROLE_ARN: ${{ vars.TF_UI_PUBLISH_ROLE_ARN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -n "${ROLE_ARN}" ]]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=flip-ui not published::${ENVIRONMENT} has no TF_UI_PUBLISH_ROLE_ARN, so the UI was not published. Run make deploy-ui, or create the role (modules/terraform_ci_bootstrap, ui_bucket_name) and set the variable."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for the demo-publish role
        id: demo_role
        env:
          ROLE_ARN: ${{ vars.TF_DEMO_PUBLISH_ROLE_ARN }}
          FLIP_DEMO_BUCKET_NAME: ${{ vars.FLIP_DEMO_BUCKET_NAME }}
          DEMO_SITE_URL: ${{ vars.DEMO_SITE_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "::warning title=Public demo not published::${ENVIRONMENT} has no TF_DEMO_PUBLISH_ROLE_ARN, so the demo was not published. Run make deploy-demo, or create the role (modules/terraform_ci_bootstrap, demo_bucket_name) and set the variable."
            echo "set=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for demo_key in FLIP_DEMO_BUCKET_NAME DEMO_SITE_URL; do
            [[ -n "${!demo_key}" ]] || missing="${missing} ${demo_key}"
          done
          [[ -z "${missing}" ]] ||
            { echo "::error::${ENVIRONMENT} has TF_DEMO_PUBLISH_ROLE_ARN but is missing the variable(s):${missing}."; exit 1; }
          [[ "${DEMO_SITE_URL}" =~ ^https://[^/]+$ ]] ||
            { echo "::error::${ENVIRONMENT}'s DEMO_SITE_URL must be https://<demo host> with no path, got '${DEMO_SITE_URL}'."; exit 1; }
          echo "set=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.role.outputs.set == 'true' || steps.demo_role.outputs.set == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.role.outputs.set == 'true' || steps.demo_role.outputs.set == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: flip-ui/package-lock.json

      # generate-window-js.sh falls back to localhost for an unset API URL, which
      # would publish a UI that talks to nothing. Fail here instead.
      - name: Check the window.js inputs
        if: steps.role.outputs.set == 'true'
        env:
          AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
          AWS_COGNITO_APP_CLIENT_ID: ${{ vars.AWS_COGNITO_APP_CLIENT_ID }}
          CENTRAL_HUB_API_URL: ${{ vars.CENTRAL_HUB_API_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          missing=""
          for key in AWS_COGNITO_USER_POOL_ID AWS_COGNITO_APP_CLIENT_ID CENTRAL_HUB_API_URL AWS_REGION; do
            [[ -n "${!key}" ]] || missing="${missing} ${key}"
          done
          [[ -z "${missing}" ]] ||
            { echo "::error::${ENVIRONMENT} is missing the variable(s):${missing}. See deploy/providers/AWS/README.md, \"flip-ui on S3 + CloudFront\"."; exit 1; }
          # The site shares the API's origin, which the check after the publish
          # finds by dropping this suffix.
          [[ "${CENTRAL_HUB_API_URL}" == */api ]] ||
            { echo "::error::${ENVIRONMENT}'s CENTRAL_HUB_API_URL must end in /api, got '${CENTRAL_HUB_API_URL}'."; exit 1; }

      - name: Build
        if: steps.role.outputs.set == 'true'
        working-directory: flip-ui
        env:
          AUTH_BACKEND: cognito
          AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
          AWS_COGNITO_APP_CLIENT_ID: ${{ vars.AWS_COGNITO_APP_CLIENT_ID }}
          CENTRAL_HUB_API_URL: ${{ vars.CENTRAL_HUB_API_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BLACKLISTED_MODEL_FILES: ${{ vars.BLACKLISTED_MODEL_FILES }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The build's own version, shown in the user menu: the release, or
          # sha-<short7>, the name of this commit's image builds.
          export RELEASE_VERSION="${RELEASE_TAG:-sha-${GIT_SHA:0:7}}"
          npm ci
          # postbuild:deploy writes dist/js/window.js from the env above.
          npm run build:deploy

      # Artifacts of a public repository are public downloads. This one holds
      # only what the site itself serves.
      - name: Upload the build
        if: steps.role.outputs.set == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flip-ui-dist
          path: flip-ui/dist/
          if-no-files-found: error
          retention-days: 1

      # The demo reads no environment: its window.js is generated from the
      # commit and its fixtures, and lands in dist-demo/.
      - name: Build the demo
        if: steps.demo_role.outputs.set == 'true'
        working-directory: flip-ui
        run: |
          set -euo pipefail
          [[ -d node_modules ]] || npm ci
          npm run build:demo

      - name: Upload the demo
        if: steps.demo_role.outputs.set == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flip-ui-demo
          path: flip-ui/dist-demo/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # assume the UI-publish role
    steps:
      - name: Checkout the publish script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: deploy/providers/AWS/scripts/publish-ui.sh
          sparse-checkout-cone-mode: false

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flip-ui-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TF_UI_PUBLISH_ROLE_ARN }}
          role-session-name: flip-ui-publish-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # The bucket is the variable cloudfront.tf creates it from, which is also
      # the role's scope.
      - name: Publish
        env:
          FLIP_UI_BUCKET_NAME: ${{ vars.FLIP_UI_BUCKET_NAME }}
        run: deploy/providers/AWS/scripts/publish-ui.sh dist "${FLIP_UI_BUCKET_NAME}"

      # index.html and window.js are no-cache, so the edge serves the new
      # window.js once it has re-fetched it. Reading it back proves the build
      # reached users, not just the bucket. The demo's is read back the same way.
      - name: Check the served window.js
        env:
          CENTRAL_HUB_API_URL: ${{ vars.CENTRAL_HUB_API_URL }}
        run: |
          set -euo pipefail
          site="${CENTRAL_HUB_API_URL%/api}"
          served() {
            local expected url="${site}/$1"
            expected="$(grep -o 'window.RELEASE_VERSION *= *"[^"]*"' "dist/$1")"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsS "${url}" | grep -Fq "${expected}"; then
                echo "${url} serves ${expected}."
                return 0
              fi
              sleep 15
            done
            echo "::error::${url} does not serve ${expected} after two minutes. The objects are in the bucket; check the edge's caching of $1."
            return 1
          }
          served js/window.js

  publish-demo:
    name: Publish the demo
    needs: build
    if: needs.build.outputs.demo == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # assume the demo-publish role
    steps:
      - name: Checkout the publish script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: deploy/providers/AWS/scripts/publish-ui.sh
          sparse-checkout-cone-mode: false

      - name: Download the demo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flip-ui-demo
          path: dist-demo

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TF_DEMO_PUBLISH_ROLE_ARN }}
          role-session-name: flip-demo-publish-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # The demo's layout is the app's (index.html, js/window.js, hashed
      # bundles), so the same script publishes it, to the bucket services.tf
      # creates from this variable.
      - name: Publish
        env:
          FLIP_DEMO_BUCKET_NAME: ${{ vars.FLIP_DEMO_BUCKET_NAME }}
        run: deploy/providers/AWS/scripts/publish-ui.sh dist-demo "${FLIP_DEMO_BUCKET_NAME}"

      # As for the app. The demo host's CSP (connect-src 'none') is defence in
      # depth now that the origin keeps the demo apart, so its absence warns.
      - name: Check the served window.js
        env:
          DEMO_SITE_URL: ${{ vars.DEMO_SITE_URL }}
        run: |
          set -euo pipefail
          url="${DEMO_SITE_URL}/js/window.js"
          expected="$(grep -o 'window.RELEASE_VERSION *= *"[^"]*"' dist-demo/js/window.js)"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS "${url}" | grep -Fq "${expected}"; then
              echo "${url} serves ${expected}."
              if ! curl -sSI "${DEMO_SITE_URL}/" | grep -i '^content-security-policy:' | grep -Fq "connect-src 'none'"; then
                echo "::warning::${DEMO_SITE_URL}/ is served without connect-src 'none'. Check the demo distribution's response-headers policy."
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::error::${url} does not serve ${expected} after two minutes. The objects are in the bucket; check the demo distribution and its caching."
          exit 1
