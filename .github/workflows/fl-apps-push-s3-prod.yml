name: Push fl-apps folder to S3 (production account) on merge to main (from develop branch)

on:
  push:
    branches:
      - main
    paths:
      - "fl-apps/nvflare/**"
      - ".github/workflows/fl-apps-push-s3-prod.yml"

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  sync:
    # Skip on forks: they cannot assume the upstream AWS OIDC role to sync to S3,
    # so this job would otherwise show a spurious CI failure on fork pushes.
    # Upstream develop/main S3 publishing is unchanged.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    environment: flip
    env:
      FL_BACKEND: nvflare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_TO_ASSUME }}
          role-session-name: ${{ vars.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate commit SHA file (with short SHA in filename)
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ github.sha }}" > "commit_${SHORT_SHA}.txt"
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Sync fl-apps folder and commit SHA to S3
        env:
          S3_FOLDER_URI: s3://${{ vars.AWS_PROD_S3_BUCKET_NAME }}/base-application/${{ env.FL_BACKEND }}
        run: |
          aws s3 rm "${S3_FOLDER_URI}/" --recursive --exclude "*" --include "commit_*.txt" --only-show-errors
          aws s3 sync fl-apps/nvflare/ "${S3_FOLDER_URI}/" --delete
          aws s3 cp "commit_${SHORT_SHA}.txt" "${S3_FOLDER_URI}/commit_${SHORT_SHA}.txt"
