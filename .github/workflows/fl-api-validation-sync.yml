# The nvflare and flower fl-api copies of validation.py hold byte-identical security guards
# (FLIP#893). This runs the drift check once, from one place, rather than as a duplicated step in
# each backend's test workflow — the same shape as fl-apps-check-tutorial-sync.yml. The script is
# pure bash/awk, so it needs neither Python nor uv.

name: Check fl-api validation guards are in sync

on:
  push:
    branches: [main, develop]
    paths:
      - "fl-services/nvflare/fl-api-base/fl_api/utils/validation.py"
      - "fl-services/flower/fl-api-flower/fl_api/utils/validation.py"
      - "scripts/check_fl_api_validation_sync.sh"
      - ".github/workflows/fl-api-validation-sync.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "fl-services/nvflare/fl-api-base/fl_api/utils/validation.py"
      - "fl-services/flower/fl-api-flower/fl_api/utils/validation.py"
      - "scripts/check_fl_api_validation_sync.sh"
      - ".github/workflows/fl-api-validation-sync.yml"

permissions:
  contents: read

jobs:
  check-validation-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run check_fl_api_validation_sync.sh
        run: bash scripts/check_fl_api_validation_sync.sh
