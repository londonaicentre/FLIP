name: Trust - Data tools CI

# The trust-level data tooling that has no service container: the PACS seeder
# (trust/orthanc/seed_orthanc.py), the dataset publisher
# (trust/publish_trust_data.py), the seed procedure (trust/seed_trust.sh) and the
# trust Makefile's dry-run tests (trust/tests/), ensure-seeded among them.
# The scripts are PEP 723 with their own pytest suites; nothing here needs
# Orthanc, Postgres or Hugging Face credentials.
# Deliberately its own workflow rather than a job on "Trust - OMOP DB CI": the
# omop-db image build is gated on THAT workflow's success and inherits its path
# filter, so wiring these paths in there would rebuild the image on a seeder change.
on:
  push:
    branches: [main, develop]
    paths:
      - "trust/orthanc/seed_orthanc.py"
      - "trust/orthanc/publish_dicom.py"
      - "trust/orthanc/tests/**"
      - "trust/orthanc/Makefile"
      - "trust/omop-db/Makefile"
      - "trust/publish_trust_data.py"
      - "trust/seed_trust.sh"
      - "trust/tests/**"
      - "trust/Makefile"
      - "trust/xnat/Makefile"
      - "tests/make_dry_run.py"
      # trust/tests renders these to check the fl-client list (FLIP#1677).
      - "trust/deploy/compose/**"
      - ".github/workflows/test_trust_data_tools.yml"
      # `make -C trust test-trust-data-tools` parse-time-includes these (make's own
      # MAKEFILE_LIST names them), so a change to any can break this suite before a
      # single test runs.
      - "deploy/env_mode.mk"
      - "deploy/fl_backend.mk"
      - "deploy/instance.mk"
      - "deploy/portable.mk"
      - "deploy/data_root.mk"
      # trust/orthanc/Makefile includes+exports the GSTT kit example at parse time, so a
      # content-only edit can fail this suite, not just an unparseable one. The KCH twin
      # exists but no Makefile reads it.
      - "trust/.env.GSTT.development.example"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run. Any other run is a group of its own, so a
# push to develop or main, a tag or a manual dispatch is never cancelled or queued (FLIP#2021).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        trust/orthanc/seed_orthanc.py
        trust/orthanc/publish_dicom.py
        trust/orthanc/tests/**
        trust/orthanc/Makefile
        trust/omop-db/Makefile
        trust/publish_trust_data.py
        trust/seed_trust.sh
        trust/tests/**
        trust/Makefile
        trust/xnat/Makefile
        tests/make_dry_run.py
        trust/deploy/compose/**
        .github/workflows/test_trust_data_tools.yml
        deploy/env_mode.mk
        deploy/fl_backend.mk
        deploy/instance.mk
        deploy/portable.mk
        deploy/data_root.mk
        trust/.env.GSTT.development.example

  trust-data-tools:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: PACS seeder — unit tests + lint
        run: make -C trust/orthanc test

      # trust/Makefile includes deploy/fl_backend.mk at parse time, which refuses an unset
      # FL_BACKEND; a dev checkout gets it from .env.development, CI has no such file.
      - name: Dataset publisher + seed procedure + trust Makefile — unit tests + lint
        run: make -C trust test-trust-data-tools FL_BACKEND=nvflare
