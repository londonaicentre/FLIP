name: Trust - Data Access API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "trust/data-access-api/**"
      - "trust/deploy/compose.test.yml"
      - "trust/trust-api/tests/integration/fixtures/**"
      - "trust/observability/**"
      - ".github/workflows/test_trust_data_access_api.yml"
      - ".github/actions/setup-trust-test-env/**"
      # The shared bootstrap action copies the root env template to .env.development,
      # which data_access_api/config.py reads as its env_file.
      - ".env.development.example"
      # This service's Makefile includes+exports the GSTT kit example at parse time, so a
      # line make cannot read stops the suite before a test runs, and its values land in the
      # environment Settings reads. The KCH twin exists but no Makefile reads it.
      - "trust/.env.GSTT.development.example"
      # tests/test_check_governance_script.py runs the shipped example document through the
      # service's own governance loader, so the suite consumes this file as an input too.
      - "trust/governance.example.toml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        trust/data-access-api/**
        trust/deploy/compose.test.yml
        trust/trust-api/tests/integration/fixtures/**
        trust/observability/**
        .github/workflows/test_trust_data_access_api.yml
        .github/actions/setup-trust-test-env/**
        .env.development.example
        trust/.env.GSTT.development.example
        trust/governance.example.toml

  data-access-api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: flip
    defaults:
      run:
        working-directory: ./trust/data-access-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup trust test env
        uses: ./.github/actions/setup-trust-test-env
        with:
          # python-version deliberately omitted — the composite action defaults to
          # the 3.12 that .python-version and requires-python pin. Do not restate
          # it per job: the previous `github.event.inputs.python-version` form had
          # no workflow_dispatch trigger to feed it, so this job silently ran 3.11
          # while the integration job below ran 3.12.
          trust-api-key: ${{ secrets.TRUST_API_KEY }}
          aes-key-base64: ${{ secrets.AES_KEY_BASE64 }}
          postgres-password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Run tests with pytest (example)
        run: make local_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: trust/data-access-api/coverage-unit.xml
          flags: data-access-api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  data-access-api-integration:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Drives the data-access-api ``/cohort`` endpoints against a real seeded Postgres
    # via the shared trust/deploy/compose.test.yml stack. Catches SQL-template / OMOP-schema
    # / auth regressions that the mocked unit suite cannot. See issue #369 (B3).
    #
    # Steps are split out (not bundled into ``make integration_test``) so a
    # failure shows the actual offending phase in the GitHub Actions UI.
    runs-on: ubuntu-latest
    environment: flip
    defaults:
      run:
        working-directory: ./trust/data-access-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup trust test env
        uses: ./.github/actions/setup-trust-test-env
        with:
          # python-version deliberately omitted — see the unit job above.
          trust-api-key: ${{ secrets.TRUST_API_KEY || 'test-trust-api-key-for-ci' }}
          aes-key-base64: ${{ secrets.AES_KEY_BASE64 || 'QgZ+TBA0lUxcuCiRPLneFe/JjMaUEUJWHACHHGz2gGA=' }}  # pragma: allowlist secret
          postgres-password: ${{ secrets.POSTGRES_PASSWORD || 'test_password' }}

      - name: Sync data-access-api venv (incl. testcontainers)
        run: uv sync --locked

      - name: Lint (ruff)
        env:
          BASE_IMAGES_DOWNLOAD_DIR: /tmp/images
        run: uv run ruff check .

      - name: Type check (mypy)
        env:
          BASE_IMAGES_DOWNLOAD_DIR: /tmp/images
        run: uv run mypy . --ignore-missing-imports

      - name: Validate compose file
        working-directory: ./trust/deploy
        run: docker compose -f compose.test.yml config --quiet

      - name: Pre-pull base images
        run: |
          docker pull --quiet postgres:16-alpine
          docker pull --quiet python:3.12-slim-bookworm

      - name: Build compose stack (data-access-api image)
        working-directory: ./trust/deploy
        run: docker compose -f compose.test.yml build

      - name: Run pytest integration suite
        env:
          BASE_IMAGES_DOWNLOAD_DIR: /tmp/images
        run: uv run pytest ./tests/integration --tb=long --disable-warnings -v --cov=data_access_api/ --cov-report=xml:coverage-integration.xml

      - name: Show data-access-api container logs on failure
        if: failure()
        working-directory: ./trust/deploy
        run: |
          echo "::group::data-access-api-test logs"
          docker compose -f compose.test.yml logs data-access-api-test || true
          echo "::endgroup::"
          echo "::group::omop-db-test logs"
          docker compose -f compose.test.yml logs omop-db-test || true
          echo "::endgroup::"

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: trust/data-access-api/coverage-integration.xml
          flags: data-access-api-integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
