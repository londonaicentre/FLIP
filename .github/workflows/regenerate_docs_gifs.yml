# Re-record the admin user-action GIFs whenever the admin UI changes on main,
# then open a PR against develop with the regenerated assets. Functional CI
# (test_flip_ui.yml) is untouched — video stays off there so the 6-shard PR
# pipeline isn't slowed down.
#
# See flip-ui/test/cypress/docs/admin/ for the demo specs and
# flip-ui/scripts/videos-to-gifs.sh for the ffmpeg conversion.

name: Regenerate docs GIFs

on:
  push:
    branches: [main]
    paths:
      - "flip-ui/src/**"
      - "flip-ui/test/cypress/docs/**"
      - "flip-ui/cypress.docs.config.ts"
      - "flip-ui/scripts/videos-to-gifs.sh"
      - ".github/workflows/regenerate_docs_gifs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_LOCAL: "false"
      VITE_E2E: "true"
      CENTRAL_HUB_API_URL: "http://localhost:8080"
      AWS_COGNITO_USER_POOL_ID: "eu-west-2_DUMMY1234"
      AWS_COGNITO_APP_CLIENT_ID: "dummyclientid1234567890ab"
      AWS_REGION: "eu-west-2"
      BLACKLISTED_MODEL_FILES: "flip.py,server_app.py"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: flip-ui/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stub flip-ui/.env.development for Cypress
        working-directory: ./flip-ui
        run: |
          cat > .env.development <<'EOF'
          VITE_LOCAL=false
          VITE_E2E=true
          CENTRAL_HUB_API_URL=http://localhost:8080
          AWS_COGNITO_USER_POOL_ID=eu-west-2_DUMMY1234
          AWS_COGNITO_APP_CLIENT_ID=dummyclientid1234567890ab
          AWS_REGION=eu-west-2
          BLACKLISTED_MODEL_FILES=flip.py,server_app.py
          EOF

      - name: Record docs demo specs
        uses: cypress-io/github-action@v6
        with:
          working-directory: flip-ui
          browser: chrome
          start: npm run test:start
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          config-file: cypress.docs.config.ts

      - name: Convert videos to GIFs
        working-directory: ./flip-ui
        run: bash scripts/videos-to-gifs.sh

      - name: Open PR with regenerated GIFs
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/regenerate-docs-gifs
          base: develop
          add-paths: docs/source/assets/admin/*.gif
          commit-message: |
            docs: regenerate admin user-action GIFs

            Auto-regenerated from main by .github/workflows/regenerate_docs_gifs.yml.

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: "docs: regenerate admin user-action GIFs"
          body: |
            Auto-regenerated from `main` @ ${{ github.sha }} by `.github/workflows/regenerate_docs_gifs.yml`.

            Review the rendered GIFs under `docs/source/assets/admin/` before merging.
          signoff: true
          delete-branch: true
