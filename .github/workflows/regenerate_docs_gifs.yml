# Re-record the documentation GIFs whenever the UI changes on develop and publish
# the recording as one commit on main of the public Hugging Face dataset
# aicentreflip/docs-gifs (FLIP#1236). The GIFs never enter git, and nothing comes
# back to it: every docs build without a set of its own fetches the newest
# recording, and release.yml tags the one each release ships (FLIP#1547;
# docs/scripts/fetch_docs_gifs.py, called from docs/source/conf.py).
#
# Two jobs on purpose. `record` runs Cypress + ffmpeg with no secrets and a read-only
# token, and mints the version before recording so its timestamp is the recording
# instant the manifest's `recorded_at` claims; `publish` reads HF_TOKEN from the
# `flip` environment in exactly one step, and only on develop — the environment is
# the shared CI one (no deployment-branch policy), so the ref gate, not the
# environment, is what keeps a branch dispatch from publishing to main.
#
# Functional CI (test_flip_ui.yml) is untouched — video stays off there so the
# 6-shard PR pipeline isn't slowed down. See flip-ui/test/cypress/docs/ for the demo
# specs and flip-ui/scripts/videos-to-gifs.sh for the ffmpeg conversion.

name: Regenerate docs GIFs

on:
  push:
    branches: [develop]
    paths:
      - "flip-ui/src/**"
      - "flip-ui/test/cypress/docs/**"
      - "flip-ui/cypress.docs.config.ts"
      - "flip-ui/scripts/videos-to-gifs.sh"
      - ".github/workflows/regenerate_docs_gifs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GIFS_DIR: docs/source/assets/generated/gifs
  DATASET: aicentreflip/docs-gifs

jobs:
  record:
    # Skip on forks: they hold no HF_TOKEN, so the run would only produce a spurious failure.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # A newer develop push supersedes a recording still in flight.
    concurrency:
      group: docs-gifs-record
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VITE_LOCAL: "false"
      VITE_E2E: "true"
      CENTRAL_HUB_API_URL: "http://localhost:8080"
      AUTH_BACKEND: "cognito"
      AWS_COGNITO_USER_POOL_ID: "eu-west-2_DUMMY1234"
      AWS_COGNITO_APP_CLIENT_ID: "dummyclientid1234567890ab"
      AWS_REGION: "eu-west-2"
      BLACKLISTED_MODEL_FILES: "flip.py,server_app.py"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Mint the version
        id: version
        # YYYYMMDDTHHMMSSZ-<sha7>: the instant this recording starts and the commit it
        # records, unique per second and source commit, sortable. Minted here rather
        # than in `publish` so it is the recording time, not the publish time.
        run: echo "version=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: flip-ui/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stub flip-ui/.env.e2e for Cypress
        # `.env.e2e`, not `.env.development` — see flip-ui/README.md → Testing.
        working-directory: ./flip-ui
        run: |
          cat > .env.e2e <<'ENV'
          VITE_LOCAL=false
          VITE_E2E=true
          CENTRAL_HUB_API_URL=http://localhost:8080
          AUTH_BACKEND=cognito
          AWS_COGNITO_USER_POOL_ID=eu-west-2_DUMMY1234
          AWS_COGNITO_APP_CLIENT_ID=dummyclientid1234567890ab
          AWS_REGION=eu-west-2
          BLACKLISTED_MODEL_FILES=flip.py,server_app.py
          ENV

      - name: Record docs demo specs
        uses: cypress-io/github-action@v7
        with:
          working-directory: flip-ui
          browser: chrome
          start: npm run test:start
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          config-file: cypress.docs.config.ts

      - name: Convert videos to GIFs
        working-directory: ./flip-ui
        run: bash scripts/videos-to-gifs.sh

      - name: Hand the GIFs to the publish job
        uses: actions/upload-artifact@v6
        with:
          name: docs-gifs
          path: ${{ env.GIFS_DIR }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: record
    # Only develop publishes: a workflow_dispatch from a branch still records (useful
    # for previewing a recording, as the run's artifact), but must not put that branch's
    # UI in front of every docs build.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `flip` environment is where the CI secrets live; HF_TOKEN is read from it
    # by the publish step alone. It is the shared CI environment, so it adds no
    # isolation of its own — the ref gate above is the control.
    environment: flip
    permissions:
      contents: read
    # A publish in flight completes; a later one queues behind it, so main's newest
    # commit is always the newest recording.
    concurrency:
      group: docs-gifs-publish
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ./docs/.python-version

      - name: Install uv
        run: pip install uv

      - name: Fetch the recorded GIFs
        uses: actions/download-artifact@v8
        with:
          name: docs-gifs
          path: ${{ env.GIFS_DIR }}

      - name: Publish to the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ needs.record.outputs.version }}
        run: |
          uv run docs/scripts/publish_docs_gifs.py \
            --repo "$DATASET" \
            --branch main \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gifs-dir "$GIFS_DIR" \
            --card docs/scripts/docs_gifs_card.md

      - name: Verify the recording resolves anonymously
        # No token in this step's environment (and the fetcher reads none): this is
        # exactly what a ReadTheDocs or contributor build will do next.
        run: uv run docs/scripts/fetch_docs_gifs.py --repo "$DATASET" --revision main --dest "$RUNNER_TEMP/verify"
