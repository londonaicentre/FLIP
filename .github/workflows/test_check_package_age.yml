name: Check Package Age - Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/actions/check-package-age/**"
      - ".github/workflows/test_check_package_age.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/actions/check-package-age/**"
      - ".github/workflows/test_check_package_age.yml"

permissions:
  contents: read

jobs:
  check-package-age-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./.github/actions/check-package-age

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The cooldown gate is pure standard library, so its own tests install
      # nothing — avoiding the bootstrap problem of needing a package to test
      # the package-install policy.
      - name: Run unit tests
        run: python -m unittest discover --verbose --buffer
