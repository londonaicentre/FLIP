name: Build and Push Docker Image for the Trust Upgrade Agent

# The image the trust Helm chart's CronJob runs (#1644). Direct push trigger like orthanc /
# monailabel — the agent's behaviour is covered by the chart's own test suite and
# scripts/tests/, not by a service test workflow. workflow_dispatch covers branch-pinned testing
# (see AGENTS.md "Docker image builds").
on:
  workflow_dispatch:
  # Release builds (FLIP#1204): every image, at the tag — see AGENTS.md "Docker image builds".
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
    paths:
      - "trust/deploy/helm/agent/**"
      - "scripts/trust_upgrade_agent.py"
      - ".github/workflows/docker_build_trust_upgrade_agent.yml"
  # PR runs build + the smoke only — the push steps are gated below, so nothing is published
  # from a pull request.
  pull_request:
    paths:
      - "trust/deploy/helm/agent/**"
      - "scripts/trust_upgrade_agent.py"
      - ".github/workflows/docker_build_trust_upgrade_agent.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    # Skip on forks: they cannot push to ghcr.io/londonaicentre.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions: # override top-level read-only default to allow GHCR push
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: londonaicentre/trust-upgrade-agent
    steps:
      # Default checkout on purpose: no workflow_run trigger here (FLIP#882,
      # scripts/tests/test_workflow_trust_guards.py).
      - name: Checkout code
        uses: actions/checkout@v5

      # A stable v<X.Y.Z> tag must point at a commit on main — releases are cut there by
      # release.yml; pre-release (-rc.N) tags are the release-candidate path and pass.
      - name: Release tag guard
        uses: ./.github/actions/release-tag-guard

      - name: Determine tags
        id: tags
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          TAGS="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"

          # An empty sha would silently publish a mutable literal `sha-` tag — refuse.
          [[ -n "$GH_SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }

          # Immutable short-SHA tag (FLIP#751), pushed uniformly on every publish.
          # Length 7 must match the tag resolution in deploy/providers/AWS/Makefile.
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${GH_SHA:0:7}"

          # A release-tag run publishes :v<X.Y.Z> only — see AGENTS.md "Docker image builds".
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            TAGS="${REGISTRY}/${IMAGE_NAME}:${GH_REF_NAME}"
          else
            SAFE_REF_NAME=$(echo "$GH_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${SAFE_REF_NAME}"
          fi

          if [[ "$GH_REF_NAME" =~ ^[0-9]+ ]]; then
              BRANCH_NUM=$(echo "$GH_REF_NAME" | grep -oE '^[0-9]+')
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH_NUM}"
          fi

          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
             PR_NUMBER=$(echo "$GH_REF" | awk -F / '{print $3}')
             TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi

          BRANCH_NAME=""
          if [[ "$GH_EVENT_NAME" == "push" ]]; then
            BRANCH_NAME="$GH_REF_NAME"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stag"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login $REGISTRY -u "$GH_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          TAG_FLAGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS+=("-t" "$tag")
          done
          # The context is the repo root: the image ships scripts/trust_upgrade_agent.py itself, so
          # the CronJob runs the same file as the host timer rather than a copy that can drift.
          # shellcheck disable=SC2086
          docker build "${TAG_FLAGS[@]}" -f trust/deploy/helm/agent/Dockerfile .

      # The tick is the entrypoint, so "it starts and knows cluster mode" is the smoke: a missing
      # helm or kubectl binary would otherwise only surface in a live CronJob at 03:00.
      - name: Smoke test — the tick runs and knows its cluster mode
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG="${DOCKER_TAGS%%,*}"
          docker run --rm "$TAG" --help | grep -q -- "--mode"
          docker run --rm --entrypoint helm "$TAG" version --short
          docker run --rm --entrypoint kubectl "$TAG" version --client
          # The agent is stdlib-only; assert that stays true in the image it ships in.
          docker run --rm --entrypoint python3 "$TAG" -c "import ast,sys; ast.parse(open('/opt/flip/trust_upgrade_agent.py').read())"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "$tag"
          done
