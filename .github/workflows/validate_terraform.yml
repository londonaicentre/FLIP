name: Terraform Validate

on:
  push:
    branches: [main, develop]
    paths:
      - "deploy/providers/AWS/**"
      - ".github/workflows/validate_terraform.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "deploy/providers/AWS/**"
      - ".github/workflows/validate_terraform.yml"

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Terraform roots share the modules under deploy/providers/AWS/modules;
        # validating each root exercises the module code from the caller's side.
        root:
          - ./deploy/providers/AWS
          - ./deploy/providers/AWS/dev
    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.13"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Black-box harnesses for the deploy scripts, every external tool stubbed on
  # PATH — no credentials, no network, no checkov install. add_fl_kits.sh mints
  # certs and mutates live S3 kit state in real runs (aws/make/openssl stubbed);
  # checkov_lint.sh's harness drives its own self-guards — version pin,
  # unknown-check-ID validation, mandatory skip rationale, canary must-fail —
  # which the checkov-lint job below only exercises on the happy path (checkov
  # stubbed). Shares this workflow's deploy/providers/AWS/** path filter, so it
  # runs whenever a script or its tests change.
  script-tests:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run add_fl_kits.sh test harness
        run: bash deploy/providers/AWS/scripts/tests/test_add_fl_kits.sh

      - name: Run checkov_lint.sh test harness
        run: bash deploy/providers/AWS/scripts/tests/test_checkov_lint.sh

  # Static checkov security lint (FLIP#1052 + the FLIP#1058 triage): a curated
  # check list over the whole AWS tree — IAM policy content (overly-broad
  # statements fmt/validate can't see) plus promoted infrastructure-posture
  # checks. Runs on raw .tf with no credentials, no init, no plan —
  # fork-PR-safe. Deliberate breadth/posture is acknowledged in-code via
  # `# checkov:skip=<ID>:<rationale>`, never by weakening the check list. The
  # script self-tests against a canary fixture first, so a broken install
  # can't produce a vacuous green.
  checkov-lint:
    name: Checkov Security Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install checkov
        # Keep in sync with CHECKOV_VERSION in scripts/checkov_lint.sh.
        run: pip install checkov==3.3.14

      - name: Run checkov lint
        run: bash deploy/providers/AWS/scripts/checkov_lint.sh
