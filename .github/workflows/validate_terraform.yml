name: Terraform Validate

on:
  push:
    branches: [main, develop]
    paths:
      - "deploy/aws/**"
      # test_providers_forwarding.py runs the old path's forwarding stub (FLIP#1438).
      - "deploy/providers/AWS/GNUmakefile"
      # The Makefile and test_env_mode.py read the HUB table; the Makefiles the suite parses
      # include the other fragments.
      - "deploy/*.mk"
      # Read by deploy/aws/tests from outside the tree. tests/test_validate_terraform_paths.py
      # derives the list from the test sources and fails when a path is missing here (FLIP#2047).
      # test_env_mode.py and test_fl_kit_iam.py read these Makefiles (flower's is listed below);
      # test_trust_makefile_hub.py parses the trust ones.
      - "Makefile"
      - "flip-ui/Makefile"
      - "fl-services/nvflare/Makefile"
      - "trust/Makefile"
      - "trust/xnat/Makefile"
      - "trust/xnat/.env"
      # test_non_root_user.py and test_readonly_root_filesystem.py read each image's user and
      # write paths; test_register_trusts_task_override.py reads flip-api's.
      - "flip-api/Dockerfile"
      - "fl-services/*/*/Dockerfile"
      - "fl-services/nvflare/fl-server/fl-server/entrypoint.sh"
      # test_flip_api_ses_iam.py reads the sender address the SES policy must allow.
      - "flip-api/src/flip_api/utils/constants.py"
      # test_validate_terraform_paths.py matches these lists with the PR path gate's pattern rules.
      - "scripts/pr_paths_changed.py"
      # The trust roots (azure/, aws/, the Snowflake roots) have their own workflows,
      # validate_terraform_{azure,aws_node,snowflake}.yml, each on its own paths (FLIP#2021).
      # test_flip_api_cognito_iam.py reads it: a new Cognito call must bring its IAM action.
      - "flip-api/src/flip_api/auth/identity/cognito.py"
      # test_flare_kit_required_files.py reads it: add_fl_kits.sh uploads the same files last.
      - "flip-api/src/flip_api/db/seed/fl_kit_slots.py"
      # test_flower_kit_slots.py and the add_fl_kits.sh harness read or stand in for these (FLIP#1942).
      - "fl-services/flower/register-supernode-keys.sh"
      - "fl-services/flower/Makefile"
      - ".github/workflows/validate_terraform.yml"
      - ".github/workflows/terraform_plan.yml"
      - ".github/workflows/terraform_apply.yml"
      - ".github/workflows/terraform_drift.yml"
      # test_staging_lifecycle_workflow.py reads it.
      - ".github/workflows/staging_lifecycle.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "deploy/aws/**"
      # test_providers_forwarding.py runs the old path's forwarding stub (FLIP#1438).
      - "deploy/providers/AWS/GNUmakefile"
      # The Makefile and test_env_mode.py read the HUB table; the Makefiles the suite parses
      # include the other fragments.
      - "deploy/*.mk"
      # Read by deploy/aws/tests from outside the tree. tests/test_validate_terraform_paths.py
      # derives the list from the test sources and fails when a path is missing here (FLIP#2047).
      # test_env_mode.py and test_fl_kit_iam.py read these Makefiles (flower's is listed below);
      # test_trust_makefile_hub.py parses the trust ones.
      - "Makefile"
      - "flip-ui/Makefile"
      - "fl-services/nvflare/Makefile"
      - "trust/Makefile"
      - "trust/xnat/Makefile"
      - "trust/xnat/.env"
      # test_non_root_user.py and test_readonly_root_filesystem.py read each image's user and
      # write paths; test_register_trusts_task_override.py reads flip-api's.
      - "flip-api/Dockerfile"
      - "fl-services/*/*/Dockerfile"
      - "fl-services/nvflare/fl-server/fl-server/entrypoint.sh"
      # test_flip_api_ses_iam.py reads the sender address the SES policy must allow.
      - "flip-api/src/flip_api/utils/constants.py"
      # test_validate_terraform_paths.py matches these lists with the PR path gate's pattern rules.
      - "scripts/pr_paths_changed.py"
      # The trust roots (azure/, aws/, the Snowflake roots) have their own workflows,
      # validate_terraform_{azure,aws_node,snowflake}.yml, each on its own paths (FLIP#2021).
      # test_flip_api_cognito_iam.py reads it: a new Cognito call must bring its IAM action.
      - "flip-api/src/flip_api/auth/identity/cognito.py"
      # test_flare_kit_required_files.py reads it: add_fl_kits.sh uploads the same files last.
      - "flip-api/src/flip_api/db/seed/fl_kit_slots.py"
      # test_flower_kit_slots.py and the add_fl_kits.sh harness read or stand in for these (FLIP#1942).
      - "fl-services/flower/register-supernode-keys.sh"
      - "fl-services/flower/Makefile"
      - ".github/workflows/validate_terraform.yml"
      - ".github/workflows/terraform_plan.yml"
      - ".github/workflows/terraform_apply.yml"
      - ".github/workflows/terraform_drift.yml"
      # test_staging_lifecycle_workflow.py reads it.
      - ".github/workflows/staging_lifecycle.yml"

permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run. Any other run is a group of its own, so a
# push to develop or main, a tag or a manual dispatch is never cancelled or queued (FLIP#2021).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Validating each root exercises the shared modules under
        # deploy/aws/modules from the caller's side.
        root:
          - ./deploy/aws
          # The adopters' wrapper around modules/terraform_ci_bootstrap, the
          # Terraform-CI bootstrap the platform repositories pin by commit.
          # Never applied by CI, but validating it exercises the module — so a
          # broken trust policy is caught before any caller picks it up.
          - ./deploy/aws/ci
    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.13"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Black-box harnesses for the deploy scripts, every external tool stubbed on
  # PATH — no credentials, no network, no checkov install. add_fl_kits.sh mints
  # certs and mutates live S3 kit state in real runs (aws/make/openssl stubbed);
  # checkov_lint.sh's harness drives its own self-guards — version pin,
  # unknown-check-ID validation, mandatory skip rationale, canary must-fail —
  # which the checkov-lint job below only exercises on the happy path (checkov
  # stubbed). test_compose_ci_env.sh additionally cross-checks the Makefile and
  # the Terraform CI workflows against the env manifest, so adding a TF_VAR
  # export without wiring it through fails here rather than at apply time.
  # Shares this workflow's deploy/aws/** path filter, so it runs
  # whenever a script or its tests change.
  script-tests:
    name: Deploy script tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - test_add_fl_kits.sh
          - test_checkov_lint.sh
          - test_check_fl_plan_impact.sh
          - test_staging_power.sh
          - test_tflint_lint.sh
          - test_compose_ci_env.sh
          - test_image_wait_budgets.sh
          - test_publish_ui.sh
          - test_reset_fl_server_local.sh
          - test_resolve_image_tags.sh
          - test_setup_github_environments.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ${{ matrix.harness }}
        run: bash deploy/aws/scripts/tests/${{ matrix.harness }}

  # setup-github-environments.sh and add_fl_kits.sh are run by a repo admin on
  # their own machine, often a Mac, whose /bin/bash is 3.2: no `declare -A`, no
  # `mapfile`, and an empty "${a[@]}" is an unbound-variable error under
  # `set -u`. The Linux job above runs bash 5 and cannot see any of that, so the
  # harnesses that drive an operator-run script (and compose-ci-env.sh's, which
  # contributors run locally) also run here on the stock macOS bash.
  script-tests-macos:
    name: Deploy script tests on macOS bash 3.2
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - test_add_fl_kits.sh
          - test_compose_ci_env.sh
          - test_publish_ui.sh
          - test_reset_fl_server_local.sh
          - test_setup_github_environments.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ${{ matrix.harness }} under /bin/bash
        run: |
          /bin/bash --version | head -1
          /bin/bash deploy/aws/scripts/tests/${{ matrix.harness }}

  # Credential-free pytest checks over the stack's static artefacts: rendered
  # Jinja templates, the deploy helper scripts, and Terraform source itself
  # (e.g. the Cognito callback_urls / CORS allowlist invariants, which no runtime
  # suite can see — flip-api reads that list from live Cognito, not from this
  # tree; and reconcile_ci_env.py's state mining, which decides what a CI plan is
  # handed). No AWS calls, no init, no plan. Deps are named explicitly rather
  # than synced from the lockfile: the project's dev group pulls ansible-core
  # and pyqt5, which this suite does not need.
  #
  # This is the only place the suite runs: the root `make unit_test` does not
  # reach deploy/aws, and that directory's Makefile has no `test`
  # target.
  python-tests:
    name: AWS deploy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # graphviz lets test_architecture_diagram.py's render smoke test run rather than skip.
      - name: Install graphviz
        uses: ./.github/actions/install-graphviz

      - name: Run AWS deploy test suite
        working-directory: deploy/aws
        run: uv run --no-project --with pytest --with jinja2 --with click --with diagrams --with pyyaml pytest tests/ -v

  # Static checkov security lint (FLIP#1052 + the FLIP#1058 triage): a curated
  # check list over the whole AWS tree — IAM policy content (overly-broad
  # statements fmt/validate can't see) plus promoted infrastructure-posture
  # checks. Runs on raw .tf with no credentials, no init, no plan —
  # fork-PR-safe. Deliberate breadth/posture is acknowledged in-code via
  # `# checkov:skip=<ID>:<rationale>`, never by weakening the check list. The
  # script self-tests against a canary fixture first, so a broken install
  # can't produce a vacuous green.
  checkov-lint:
    name: Checkov Security Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install checkov
        # Keep in sync with CHECKOV_VERSION in scripts/checkov_lint.sh.
        run: pip install checkov==3.3.14

      - name: Run checkov lint
        run: bash deploy/aws/scripts/checkov_lint.sh

  # Static tflint lint: the bundled terraform ruleset (recommended preset) plus
  # the AWS ruleset, configured in deploy/aws/.tflint.hcl. Catches what
  # validate accepts — a variable nothing reads, a module with no provider
  # version constraint, an AWS argument value the API would reject. Every
  # directory with .tf files is linted on its own, so a module is checked even
  # where no root calls it. No credentials, no init, no plan. Like checkov-lint,
  # the script certifies itself against a canary fixture first. GITHUB_TOKEN
  # only lifts the anonymous rate limit on the plugin download.
  tflint-lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          # Keep in sync with TFLINT_VERSION in scripts/tflint_lint.sh.
          tflint_version: v0.64.0

      - name: Run tflint lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/aws/scripts/tflint_lint.sh
