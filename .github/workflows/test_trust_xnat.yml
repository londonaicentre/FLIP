name: Trust - XNAT CI

# The suite covers the anonymization script, the weak-password guards, and the deployment wiring
# that carries configuration into configure-xnat.sh. Those tests read their inputs from outside
# trust/xnat/tests/, so every file they assert on has to trigger this workflow — otherwise a change
# to a guard, to the credential minter, or to either deployment path's environment block lands with
# the test that pins it unrun. That includes both trust-core compose files: test_deploy_wiring.py
# asserts each wires XNAT_AETITLE to exactly its two consumers with the same default the XNAT stack
# substitutes, and the AE titles on the two sides drifting apart is the queries-succeed /
# retrievals-time-out failure, since DQR matches the C-MOVE destination by exact AE and port.
# The dcm2niix-pin-sync job below likewise reads four files scattered across the
# repo, so each of those triggers the workflow too.
on:
  push:
    branches: [main, develop]
    paths:
      - "trust/xnat/xnat/config/anon_script.das"
      - "trust/xnat/xnat/config/configure-xnat.sh"
      - "trust/xnat/xnat/config/wait-for-xnat-plugins.sh"
      - "trust/xnat/scripts/ensure_plugins.sh"
      - "trust/xnat/tests/**"
      - "trust/xnat/Makefile"
      - "trust/xnat/docker-compose-stack.yml"
      - "trust/deploy/compose_trust.development.yml"
      - "trust/deploy/compose_trust.production.yml"
      - "deploy/providers/kubernetes/templates/xnat-init-job.yaml"
      - "trust/Makefile"
      - "Makefile"
      - "flip-api/Makefile"
      - "deploy/fl_backend.mk"
      - "deploy/instance.mk"
      - "trust/xnat/xnat/wait-for-postgres.sh"
      - "trust/xnat/postgres/guard-xnat-db-passwords.sh"
      - "trust/imaging-api/imaging_api/config.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - "trust/xnat/dcm2niix/**"
      - "trust/xnat/xnat/config/dcm2niix_command.json"
      - ".github/workflows/test_trust_xnat.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "trust/xnat/xnat/config/anon_script.das"
      - "trust/xnat/xnat/config/configure-xnat.sh"
      - "trust/xnat/xnat/config/wait-for-xnat-plugins.sh"
      - "trust/xnat/scripts/ensure_plugins.sh"
      - "trust/xnat/tests/**"
      - "trust/xnat/Makefile"
      - "trust/xnat/docker-compose-stack.yml"
      - "trust/deploy/compose_trust.development.yml"
      - "trust/deploy/compose_trust.production.yml"
      - "deploy/providers/kubernetes/templates/xnat-init-job.yaml"
      - "trust/Makefile"
      - "Makefile"
      - "flip-api/Makefile"
      - "deploy/fl_backend.mk"
      - "deploy/instance.mk"
      - "trust/xnat/xnat/wait-for-postgres.sh"
      - "trust/xnat/postgres/guard-xnat-db-passwords.sh"
      - "trust/imaging-api/imaging_api/config.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - "trust/xnat/dcm2niix/**"
      - "trust/xnat/xnat/config/dcm2niix_command.json"
      - ".github/workflows/test_trust_xnat.yml"

permissions:
  contents: read

jobs:
  xnat-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trust/xnat/tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run XNAT tests
        run: make unit_test

  # Backstop for the xnat-dcm2niix-pin-sync pre-commit hook, for commits made without pre-commit
  # installed. Kept a separate job (no Python, no uv) because it is a two-second grep and must stay
  # cheap enough to run on any of the four pin sites changing.
  dcm2niix-pin-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check the dcm2niix image pin is in sync
        run: ./trust/xnat/dcm2niix/check_image_pin_sync.sh
