name: Trust - XNAT CI

# The suite covers the anonymization script and the weak-password guards. The
# guard parity tests read their inputs from outside trust/xnat/tests/, so every
# file they assert on has to trigger this workflow — otherwise a change to a
# guard (or to the credential minter) lands with the test that pins it unrun.
on:
  push:
    branches: [main, develop]
    paths:
      - "trust/xnat/xnat/config/anon_script.das"
      - "trust/xnat/xnat/config/configure-xnat.sh"
      - "trust/xnat/xnat/config/wait-for-xnat-plugins.sh"
      - "trust/xnat/scripts/ensure_plugins.sh"
      - "trust/xnat/tests/**"
      - "trust/xnat/Makefile"
      - "trust/Makefile"
      - "Makefile"
      - "trust/xnat/xnat/wait-for-postgres.sh"
      - "trust/xnat/postgres/guard-xnat-db-passwords.sh"
      - "trust/imaging-api/imaging_api/config.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - ".github/workflows/test_trust_xnat.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "trust/xnat/xnat/config/anon_script.das"
      - "trust/xnat/xnat/config/configure-xnat.sh"
      - "trust/xnat/xnat/config/wait-for-xnat-plugins.sh"
      - "trust/xnat/scripts/ensure_plugins.sh"
      - "trust/xnat/tests/**"
      - "trust/xnat/Makefile"
      - "trust/Makefile"
      - "Makefile"
      - "trust/xnat/xnat/wait-for-postgres.sh"
      - "trust/xnat/postgres/guard-xnat-db-passwords.sh"
      - "trust/imaging-api/imaging_api/config.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - ".github/workflows/test_trust_xnat.yml"

permissions:
  contents: read

jobs:
  xnat-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trust/xnat/tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run XNAT tests
        run: make unit_test
