name: Trust - XNAT CI

# The XNAT image builds (docker_build_xnat_*.yml) publish only after this workflow passes on
# main/develop (FLIP#880), so it triggers on every input of those images: all of trust/xnat/ and the
# build workflows themselves. A build input added outside trust/xnat/ belongs here too.
# The other paths are files outside trust/xnat/ that the suite asserts on, so a change to one never
# lands with the test that pins it unrun: both trust-core compose files (test_deploy_wiring.py holds
# XNAT_AETITLE to the default the XNAT stack substitutes; DQR matches the C-MOVE destination by exact
# AE and port), the Ansible playbooks and roles (test_data_dir_ownership.py holds their ownership
# tasks to trust/xnat/Makefile), imaging-api's config.py and services/projects.py (the dcm2niix pin
# and the subscription name test_dcm2niix_registration.py checks, FLIP#1451), and the credential minter.
on:
  push:
    branches: [main, develop]
    paths:
      - "trust/xnat/**"
      - "tests/make_dry_run.py"
      - "trust/deploy/compose/compose_trust.development.yml"
      - "trust/deploy/compose/compose_trust.prod.yml"
      - "trust/deploy/helm/templates/xnat-init-job.yaml"
      - "trust/Makefile"
      - "Makefile"
      - "flip-api/Makefile"
      - "deploy/env_mode.mk"
      - "deploy/fl_backend.mk"
      - "deploy/instance.mk"
      - "deploy/portable.mk"
      - "deploy/data_root.mk"
      - "trust/imaging-api/imaging_api/config.py"
      - "trust/imaging-api/imaging_api/services/projects.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - "trust/deploy/ansible/aws-ec2-host.yml"
      - "trust/deploy/ansible/onprem.yml"
      - "trust/deploy/ansible/roles/**"
      - ".github/workflows/docker_build_xnat_*.yml"
      - ".github/workflows/test_trust_xnat.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "trust/xnat/**"
      - "tests/make_dry_run.py"
      - "trust/deploy/compose/compose_trust.development.yml"
      - "trust/deploy/compose/compose_trust.prod.yml"
      - "trust/deploy/helm/templates/xnat-init-job.yaml"
      - "trust/Makefile"
      - "Makefile"
      - "flip-api/Makefile"
      - "deploy/env_mode.mk"
      - "deploy/fl_backend.mk"
      - "deploy/instance.mk"
      - "deploy/portable.mk"
      - "deploy/data_root.mk"
      - "trust/imaging-api/imaging_api/config.py"
      - "trust/imaging-api/imaging_api/services/projects.py"
      - "flip-api/src/flip_api/scripts/generate_xnat_credentials.py"
      - "trust/deploy/ansible/aws-ec2-host.yml"
      - "trust/deploy/ansible/onprem.yml"
      - "trust/deploy/ansible/roles/**"
      - ".github/workflows/docker_build_xnat_*.yml"
      - ".github/workflows/test_trust_xnat.yml"

permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run. Any other run is a group of its own, so a
# push to develop or main, a tag or a manual dispatch is never cancelled or queued (FLIP#2021).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  xnat-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trust/xnat/tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Run XNAT tests
        run: make unit_test

  # Backstop for the xnat-dcm2niix-pin-sync pre-commit hook, for commits made without pre-commit
  # installed. Kept a separate job (no Python, no uv) because it is a two-second grep and must stay
  # cheap enough to run on any of the three pin sites changing.
  dcm2niix-pin-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check the dcm2niix image pin is in sync
        run: ./trust/xnat/dcm2niix/check_image_pin_sync.sh
