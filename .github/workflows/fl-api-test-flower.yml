name: Flip Flower FL API CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "fl-services/flower/fl-api-flower/fl_api/**"
      - ".github/workflows/fl-api-test-flower.yml"
      # The sibling copy and the sync check, so drift in either direction runs the guard.
      - "fl-services/nvflare/fl-api-base/fl_api/utils/validation.py"
      - "scripts/check_fl_api_validation_sync.sh"
  pull_request:
    branches: [main, develop]
    paths:
      - "fl-services/flower/fl-api-flower/fl_api/**"
      - ".github/workflows/fl-api-test-flower.yml"
      # The sibling copy and the sync check, so drift in either direction runs the guard.
      - "fl-services/nvflare/fl-api-base/fl_api/utils/validation.py"
      - "scripts/check_fl_api_validation_sync.sh"
jobs:
  flip-fl-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fl-services/flower/fl-api-flower/ # Set working directory for subsequent steps

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Read the version from the file rather than restating it here, so it
          # cannot drift from requires-python.
          python-version-file: ./fl-services/flower/fl-api-flower/.python-version

      - name: Install uv (if used for dependency management)
        run: pip install uv

      - name: Check fl-api validation guards are in sync
        working-directory: ./
        run: ./scripts/check_fl_api_validation_sync.sh

      - name: Run tests with pytest (example)
        run: |
          make local_test
