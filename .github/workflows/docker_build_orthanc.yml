name: Build and Push Docker Image for Orthanc

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "trust/orthanc/**"
      - ".github/workflows/docker_build_orthanc.yml"
  # PR runs build + the FLIP-PT-091 auth smoke tests only — the push steps are
  # gated below, so nothing is published from a pull request.
  pull_request:
    paths:
      - "trust/orthanc/**"
      - ".github/workflows/docker_build_orthanc.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    # Skip on forks: they cannot push to ghcr.io/londonaicentre, so this whole
    # build-and-publish job would otherwise show a spurious CI failure on fork
    # pushes. Upstream main/develop publishing is unchanged.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions: # override top-level read-only default to allow GHCR push
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./trust/orthanc
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: londonaicentre/orthanc
      BUILD_ARGS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine tags
        id: tags
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_WR_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          TAGS="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"

          # An empty sha would silently publish a mutable literal `sha-` tag — refuse.
          [[ -n "$GH_SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }

          # Immutable short-SHA tag (FLIP#751), pushed uniformly on every publish; today
          # only the hub ECS images are consumed (by `make deploy-centralhub`). Length 7
          # must match the tag resolution in deploy/providers/AWS/Makefile.
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${GH_SHA:0:7}"

          # Branch name sanitization
          SAFE_REF_NAME=$(echo "$GH_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${SAFE_REF_NAME}"

          # Branch number (if starts with number)
          if [[ "$GH_REF_NAME" =~ ^[0-9]+ ]]; then
              BRANCH_NUM=$(echo "$GH_REF_NAME" | grep -oE '^[0-9]+')
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH_NUM}"
          fi

          # PR Number (if PR)
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
             PR_NUMBER=$(echo "$GH_REF" | awk -F / '{print $3}')
             TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi

          # Determine if this is a merge/push to main or develop
          BRANCH_NAME=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$GH_WR_EVENT" == "push" ]]; then
            BRANCH_NAME="$GH_WR_BRANCH"
          elif [[ "$GH_EVENT_NAME" == "push" ]]; then
            BRANCH_NAME="$GH_REF_NAME"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stag"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login $REGISTRY -u "$GH_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          TAG_FLAGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS+=("-t" "$tag")
          done
          # shellcheck disable=SC2086
          docker build $BUILD_ARGS "${TAG_FLAGS[@]}" .

      # FLIP-PT-091: a red auth smoke never publishes — these steps sit between
      # Build and Push, and also run standalone on pull requests.
      - name: Smoke test — unauthenticated access denied (FLIP-PT-091)
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG="${DOCKER_TAGS%%,*}"
          docker run -d --name orthanc-smoke -p 8042:8042 \
            -e ORTHANC__REGISTERED_USERS='{"ci": "ci-test-password"}' "$TAG"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8042/ || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8042/)
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 for unauthenticated /, got ${code}"
            docker logs orthanc-smoke
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8042/system)" = "401"
          test "$(curl -s -u ci:ci-test-password -o /dev/null -w '%{http_code}' http://localhost:8042/system)" = "200"
          # DICOM-Web plugin is not loaded — the route must not exist even when authenticated
          test "$(curl -s -u ci:ci-test-password -o /dev/null -w '%{http_code}' http://localhost:8042/dicom-web/studies)" = "404"
          docker rm -f orthanc-smoke

      - name: Smoke test — image refuses to start without registered users (FLIP-PT-091)
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG="${DOCKER_TAGS%%,*}"
          if timeout 30 docker run --rm --name orthanc-nouser "$TAG" > nouser.log 2>&1; then
            echo "::error::image started without ORTHANC__REGISTERED_USERS"
            cat nouser.log
            exit 1
          fi
          grep -q "REFUSING TO START" nouser.log

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "$tag"
          done
