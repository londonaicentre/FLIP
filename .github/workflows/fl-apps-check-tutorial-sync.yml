name: Check flower tutorial sync with fl-apps templates

on:
  push:
    branches: [develop]
    paths:
      - "fl-apps/flower/**"
      - "fl-tutorials/flower/**"
      - "scripts/check_tutorial_sync.sh"
      - ".github/workflows/fl-apps-check-tutorial-sync.yml"
  pull_request:
    branches: [develop]
    paths:
      - "fl-apps/flower/**"
      - "fl-tutorials/flower/**"
      - "scripts/check_tutorial_sync.sh"
      - ".github/workflows/fl-apps-check-tutorial-sync.yml"

permissions:
  contents: read

jobs:
  check-tutorial-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run check_tutorial_sync.sh
        run: bash scripts/check_tutorial_sync.sh
