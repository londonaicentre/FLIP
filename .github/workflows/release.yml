name: Create Release

on:
    push:
        branches:
            - main

permissions:
  contents: read

jobs:
    release:
        name: Tag and Create GitHub Release
        # Skip on forks: they cannot push tags or create releases in the upstream
        # repo, so this job would otherwise show a spurious CI failure on a fork's
        # main push. Upstream main release behaviour is unchanged.
        if: github.repository == 'londonaicentre/FLIP'
        runs-on: ubuntu-latest
        permissions: # override top-level read-only default to allow tag/release creation
            contents: write
            actions: write # dispatch the image builds at the release tag (see the step below)

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Read version from pyproject.toml
              id: version
              run: |
                  VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

            - name: Check if tag already exists
              id: tag_check
              run: |
                  if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create tag
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${{ steps.version.outputs.tag }}"
                  git push origin "${{ steps.version.outputs.tag }}"

            # The image workflows listen for a push of refs/tags/v*.*.* (FLIP#1204) — but
            # GitHub starts no workflow for an event created with the repository's own
            # GITHUB_TOKEN, which is what the tag push above is (the anti-recursion rule; only
            # workflow_dispatch and repository_dispatch are exempt). So the twelve builds are
            # dispatched here explicitly, at the tag, one run each: inside them github.ref is
            # refs/tags/v<X.Y.Z> and github.sha the tagged commit, exactly as a hand-pushed
            # tag would present. The roster is every publishing image workflow;
            # scripts/tests/test_release_image_tags.py holds it to the set that carries the
            # tag trigger, so a workflow added without being listed here fails CI.
            - name: Build every image at the release tag
              if: steps.tag_check.outputs.exists == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  for wf in \
                      docker_build_flip_api.yml \
                      docker_build_omop_db.yml \
                      docker_build_orthanc.yml \
                      docker_build_trust_data_access_api.yml \
                      docker_build_trust_imaging_api.yml \
                      docker_build_trust_trust_api.yml \
                      docker_build_xnat_db.yml \
                      docker_build_xnat_dcm2niix.yml \
                      docker_build_xnat_nginx.yml \
                      docker_build_xnat_web.yml \
                      fl-docker-build-flower.yml \
                      fl-docker-build-nvflare.yml; do
                    gh workflow run "$wf" --ref "$TAG"
                    echo "dispatched $wf at $TAG"
                  done

            # generate_release_notes lets GitHub choose the previous release itself, which is
            # whatever was published most recently — including a flip-utils release cut seconds
            # after ours on the same push. Pin the range to the previous *platform* tag instead,
            # the way release-pypi.yml already does for its own artefact.
            - name: Prepare release notes
              if: steps.tag_check.outputs.exists == 'false'
              id: notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="${{ steps.version.outputs.tag }}"
                  # `|| true` is load-bearing under `set -o pipefail` — the tag for THIS release
                  # was created by the step above, so when it is the only match grep exits 1.
                  # Empty is a valid answer and is handled below.
                  PREV_TAG=$(git tag --list 'v*.*.*' | sort -V | grep -v "^${TAG}$" | tail -n1 || true)

                  API_ARGS=(-X POST
                    -f "tag_name=${TAG}"
                    -f "target_commitish=${{ github.sha }}")
                  if [[ -n "$PREV_TAG" ]]; then
                    API_ARGS+=(-f "previous_tag_name=${PREV_TAG}")
                    echo "Generating notes for ${PREV_TAG}...${TAG}"
                  else
                    echo "No previous platform tag found — generating notes from the start."
                  fi

                  GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
                    "${API_ARGS[@]}" --jq '.body')

                  # The curated header (Highlights, Breaking Changes, Site upgrade, …) from the
                  # release-notes template goes ABOVE the generated changelog, the same way
                  # release-pypi.yml publishes it (FLIP#1204: before this, the template only
                  # reached the PR preview and the flip-utils release, so the "Site upgrade"
                  # section trust operators act on never appeared on the platform release).
                  # The licence block is stripped by its whole-line delimiters — see
                  # release-pypi.yml for why an unanchored range would eat every section.
                  VERSION="${{ steps.version.outputs.version }}"
                  HEADER=$(sed '/^<!--$/,/^-->$/d' "$GITHUB_WORKSPACE/.github/RELEASE_NOTES_TEMPLATE.md" \
                    | sed "s/{{PROJECT}}/FLIP/g" \
                    | sed "s/{{VERSION}}/${VERSION}/g" \
                    | sed "s/{{TAG}}/${TAG}/g" \
                    | sed "s/{{PREV_TAG}}/${PREV_TAG:-initial release}/g")

                  {
                    printf '%s\n\n' "$HEADER"
                    printf '%s\n' "$GENERATED"
                  } > /tmp/release_notes.md

                  echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              if: steps.tag_check.outputs.exists == 'false'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: "Release ${{ steps.version.outputs.tag }}"
                  body_path: ${{ steps.notes.outputs.notes_file }}
