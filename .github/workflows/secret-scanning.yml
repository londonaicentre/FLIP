name: Code checks and Secret Scanning

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        # Run weekly on Sundays at 2 AM UTC
        - cron: "0 2 * * 0"
    workflow_dispatch:

permissions:
  contents: read

jobs:
    trufflehog:
        name: TruffleHog Secret Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: TruffleHog OSS
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  extra_args: --debug --only-verified

    detect-secrets:
        name: Detect Secrets Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install detect-secrets
              run: |
                  pip install detect-secrets

            - name: Run detect-secrets scan
              run: |
                  detect-secrets scan --all-files --force-use-all-plugins --exclude-files '\.git/.*' --exclude-files '\.venv/.*' --exclude-files 'node_modules/.*' --exclude-files '.*\.lock$'

    pre-commit:
        name: Pre-commit Hooks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  pip install pre-commit

            - name: Run pre-commit
              run: |
                  # Run all pre-commit hooks except for the check-env-vars hook, since .env.development is not present in the repository
                  pre-commit run check-added-large-files --all-files || true
                  pre-commit run check-yaml --all-files || true
                  pre-commit run check-merge-conflict --all-files || true
                  pre-commit run detect-secrets --all-files || true
                  pre-commit run end-of-file-fixer --all-files || true
                  # No `|| true`: malformed YAML in deploy/providers/AWS/ must
                  # fail CI. Pre-commit's prettier hook is the sole gate now
                  # that the npx-prettier Makefile recipe is gone.
                  pre-commit run prettier --all-files

    dependency-cooldown:
        # Backstop for the 72h supply-chain cooldown on the Python side. Runs
        # `uv lock --check` on every uv project, which re-resolves under the
        # manifest's `tool.uv.exclude-newer` window and fails CI if the
        # committed `uv.lock` has drifted from its `pyproject.toml` (or was
        # generated under a wider window). This is a drift + window check, not
        # an independent freshness audit — the cooldown itself is enforced
        # preventively at `uv lock` time by `tool.uv.exclude-newer`; reviewer
        # scrutiny of any change to that key is still required. Runs on every
        # push and pull request, so it also covers the root and
        # deploy/providers/AWS lockfiles that no service-specific workflow
        # installs. npm cooldown is enforced preventively (.npmrc
        # min-release-age + Renovate), not here.
        name: Dependency Cooldown Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              # Pin to the same version as flip-api/Dockerfile + .pre-commit-
              # config.yaml so `uv lock --check` here uses the same resolver
              # and lockfile format as the build/commit-time gates.
              run: pip install uv==0.11.16

            - name: Verify uv lockfiles (drift + exclude-newer window)
              run: |
                  set -euo pipefail
                  for dir in . flip-api docs trust/trust-api trust/imaging-api trust/data-access-api trust/xnat/tests deploy/providers/AWS; do
                    echo "::group::uv lock --check ($dir)"
                    uv lock --check --project "$dir"
                    echo "::endgroup::"
                  done
