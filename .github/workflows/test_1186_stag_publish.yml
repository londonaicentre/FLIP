# TEMPORARY (FLIP#1186): one stag run of publish_ui.yml from the PR branch,
# under a branch-scoped test role. Reverted before review.

name: "TEMP #1186 stag publish test"

on:
  push:
    branches: [1186-ui-publish-on-merge]

permissions:
  contents: read

jobs:
  ui:
    name: Publish flip-ui (stag test)
    uses: ./.github/workflows/publish_ui.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: aws-stag
