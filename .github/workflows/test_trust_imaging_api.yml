name: Trust - Imaging API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "trust/imaging-api/**"
      - ".github/workflows/test_trust_imaging_api.yml"
      # trust/imaging-api/Makefile:15 includes and exports this kit example (the path is
      # hardcoded to GSTT), so make parses it before `make local_test` runs a single test — a
      # line it cannot read stops the target outright — and its values reach the environment
      # Settings reads; tests/conftest.py:33 exists to neutralise its <placeholder> values.
      # The KCH twin is deliberately absent: no Makefile points at it.
      - "trust/.env.GSTT.development.example"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        trust/imaging-api/**
        .github/workflows/test_trust_imaging_api.yml
        trust/.env.GSTT.development.example

  imaging-api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: flip
    defaults:
      run:
        working-directory: ./trust/imaging-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Read the version from the file rather than restating it here, so it
          # cannot drift from requires-python. Do not go back to the previous
          # `github.event.inputs.python-version || '3.11'` form: this workflow has
          # no `workflow_dispatch` trigger, so that input was always empty and the
          # job silently ran 3.11 while the file (and pyproject) pin 3.12.
          python-version-file: ./trust/imaging-api/.python-version

      - name: Install uv (if used for dependency management)
        run: pip install uv

      - name: Setup environment file
        run: | # pragma: allowlist secret
          cp ../../.env.development.example ../../.env.development
          # Override sensitive values with GitHub secrets
          echo "AES_KEY_BASE64=${{ secrets.AES_KEY_BASE64 || 'dGVzdC1hZXMta2V5LWZvci1jaS10ZXN0aW5nLTMyYnk=' }}" >> ../../.env.development  # pragma: allowlist secret
          echo "TRUST_API_KEY=${{ secrets.TRUST_API_KEY || 'test-trust-api-key-for-ci' }}" >> ../../.env.development
          echo "DATA_ACCESS_POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          echo "OMOP_POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ../../.env.development
          echo "ENV=development" >> ../../.env.development

      - name: Run tests with pytest (example)
        run: make local_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: trust/imaging-api/coverage.xml
          flags: imaging-api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
