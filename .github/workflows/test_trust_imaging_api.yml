name: Trust - Imaging API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "trust/imaging-api/**"
      # imaging_api/main.py imports log_config at module import time, resolved via
      # pyproject.toml's pythonpath = [..., "../observability"], so a break there fails
      # this suite. Both sibling trust suites already list it.
      - "trust/observability/**"
      - ".github/workflows/test_trust_imaging_api.yml"
      # This service's Makefile includes+exports the GSTT kit example at parse time, so a
      # line make cannot read stops the suite before a test runs, and its values land in the
      # environment Settings reads. The KCH twin exists but no Makefile reads it.
      # The root .env.development.example is deliberately NOT listed here, unlike the two
      # sibling trust suites — nothing in this job reads it; see the note above the test
      # step for why the copy it used to make was removed.
      - "trust/.env.GSTT.development.example"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Gate for pull requests into develop: run the suite only when the PR touches this
  # service (pr_paths_changed.yml; PRs into main always run everything). The list is
  # the push `paths:` filter above, verbatim — scripts/tests/test_pr_paths_changed.py
  # fails when the two drift.
  changes:
    uses: ./.github/workflows/pr_paths_changed.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        trust/imaging-api/**
        trust/observability/**
        .github/workflows/test_trust_imaging_api.yml
        trust/.env.GSTT.development.example

  imaging-api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: flip
    defaults:
      run:
        working-directory: ./trust/imaging-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Read the version from the file rather than restating it here, so it
          # cannot drift from requires-python. Do not go back to the previous
          # `github.event.inputs.python-version || '3.11'` form: this workflow has
          # no `workflow_dispatch` trigger, so that input was always empty and the
          # job silently ran 3.11 while the file (and pyproject) pin 3.12.
          python-version-file: ./trust/imaging-api/.python-version

      - name: Install uv (if used for dependency management)
        run: pip install uv

      # No "Setup environment file" step here, deliberately, unlike the trust-api and
      # data-access-api suites: their config.py sets env_file to the repo-root
      # .env.development, so copying the template there is load-bearing for them.
      # imaging_api/config.py declares no env_file at all — its values come from
      # tests/conftest.py's defaults and from the kit example trust/imaging-api/Makefile
      # includes+exports — so the copy was written and never read, and the four repository
      # secrets it injected reached nothing. Restore it if imaging-api ever gains an
      # env_file, and add .env.development.example to this workflow's two path lists when
      # you do.

      - name: Run tests with pytest (example)
        run: make local_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: trust/imaging-api/coverage.xml
          flags: imaging-api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
