name: Build and Push Flower FL Docker Images

on:
  push:
    branches: [main, develop]
    # Release builds (FLIP#1204): every image, at the tag — see AGENTS.md "Docker image builds".
    tags: ['v*.*.*']
    paths:
      - "fl-services/flower/**"
      # The fl-base image installs the in-repo flip-utils, so flip-utils changes
      # must also trigger a rebuild.
      - "flip-utils/**"
      - ".github/workflows/fl-docker-build-flower.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    # Skip on forks: they cannot push to ghcr.io/londonaicentre, so this whole
    # build-and-publish job would otherwise show a spurious CI failure on fork
    # pushes. Upstream main/develop publishing is unchanged.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      ORG: londonaicentre
      BASE_IMAGE: flower-fl-base
      SERVER_IMAGE: flower-superlink
      CLIENT_IMAGE: flower-supernode
      API_IMAGE: flower-fl-api
      BUILD_ARGS: |
        --build-arg UID=1000
        --build-arg GID=1000
        --build-arg UNAME=flip
        --build-arg LOCAL_DEV=false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # A stable v<X.Y.Z> tag must point at a commit on main — releases are cut there by
      # release.yml; pre-release (-rc.N) tags are the release-candidate path and pass.
      - name: Release tag guard
        uses: ./.github/actions/release-tag-guard

      - name: Determine image tags
        id: tags
        run: |
          # Immutable short-SHA tag (FLIP#751): the server/api images are consumed by
          # `make deploy-centralhub`; the base/client tags are pushed uniformly. Length 7
          # must match the tag resolution in deploy/providers/AWS/Makefile.
          # Persisted to GITHUB_ENV so the per-image build/push/cleanup steps see it.
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          [[ -n "$SHORT_SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          BASE_TAGS="${REGISTRY}/${ORG}/${BASE_IMAGE}:${{ github.sha }},${REGISTRY}/${ORG}/${BASE_IMAGE}:sha-${SHORT_SHA}"
          SERVER_TAGS="${REGISTRY}/${ORG}/${SERVER_IMAGE}:${{ github.sha }},${REGISTRY}/${ORG}/${SERVER_IMAGE}:sha-${SHORT_SHA}"
          CLIENT_TAGS="${REGISTRY}/${ORG}/${CLIENT_IMAGE}:${{ github.sha }},${REGISTRY}/${ORG}/${CLIENT_IMAGE}:sha-${SHORT_SHA}"
          API_TAGS="${REGISTRY}/${ORG}/${API_IMAGE}:${{ github.sha }},${REGISTRY}/${ORG}/${API_IMAGE}:sha-${SHORT_SHA}"

          # A release-tag run publishes :v<X.Y.Z> only — see AGENTS.md "Docker image builds".
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BASE_TAGS="${REGISTRY}/${ORG}/${BASE_IMAGE}:${GITHUB_REF_NAME}"
            SERVER_TAGS="${REGISTRY}/${ORG}/${SERVER_IMAGE}:${GITHUB_REF_NAME}"
            CLIENT_TAGS="${REGISTRY}/${ORG}/${CLIENT_IMAGE}:${GITHUB_REF_NAME}"
            API_TAGS="${REGISTRY}/${ORG}/${API_IMAGE}:${GITHUB_REF_NAME}"
          fi

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BASE_TAGS="${BASE_TAGS},${REGISTRY}/${ORG}/${BASE_IMAGE}:prod"
            SERVER_TAGS="${SERVER_TAGS},${REGISTRY}/${ORG}/${SERVER_IMAGE}:prod"
            CLIENT_TAGS="${CLIENT_TAGS},${REGISTRY}/${ORG}/${CLIENT_IMAGE}:prod"
            API_TAGS="${API_TAGS},${REGISTRY}/${ORG}/${API_IMAGE}:prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BASE_TAGS="${BASE_TAGS},${REGISTRY}/${ORG}/${BASE_IMAGE}:stag"
            SERVER_TAGS="${SERVER_TAGS},${REGISTRY}/${ORG}/${SERVER_IMAGE}:stag"
            CLIENT_TAGS="${CLIENT_TAGS},${REGISTRY}/${ORG}/${CLIENT_IMAGE}:stag"
            API_TAGS="${API_TAGS},${REGISTRY}/${ORG}/${API_IMAGE}:stag"
          fi

          echo "base_tags=${BASE_TAGS}"   >> $GITHUB_OUTPUT
          echo "server_tags=${SERVER_TAGS}" >> $GITHUB_OUTPUT
          echo "client_tags=${CLIENT_TAGS}" >> $GITHUB_OUTPUT
          echo "api_tags=${API_TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags:"
          echo "Base:   ${BASE_TAGS}"
          echo "Server: ${SERVER_TAGS}"
          echo "Client: ${CLIENT_TAGS}"
          echo "API:    ${API_TAGS}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary packages and clean
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes
          echo "Disk space after cleanup:"
          df -h

      ###########################################
      # 1️⃣ Build Base Image
      ###########################################
      # NOTE: the fl-base build context is the REPO ROOT (.) because the
      # Dockerfile COPYs in-repo flip-utils. The derived images (superlink,
      # supernode, fl-api) use their own dir as context.
      - name: Build Base Image
        run: |
          docker build ${BUILD_ARGS} \
            -f fl-services/flower/fl-base/Dockerfile \
            -t $REGISTRY/$ORG/$BASE_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$BASE_IMAGE:sha-$SHORT_SHA .

          echo "✅ Built base image."

      - name: Push Base Image
        env:
          TAGS: ${{ steps.tags.outputs.base_tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker tag "$REGISTRY/$ORG/$BASE_IMAGE:${{ github.sha }}" "$tag"
            docker push "$tag"
          done
          echo "✅ Pushed base image."

      - name: Cleanup after base image
        run: |
          # Remove untagged local copies but keep the SHA-tagged image for dependent builds
          docker rmi $REGISTRY/$ORG/$BASE_IMAGE:sha-$SHORT_SHA || true
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker rmi $REGISTRY/$ORG/$BASE_IMAGE:prod || true
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            docker rmi $REGISTRY/$ORG/$BASE_IMAGE:stag || true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker rmi $REGISTRY/$ORG/$BASE_IMAGE:${GITHUB_REF_NAME} || true
          fi
          docker system prune -f
          echo "Disk space after base image cleanup:"
          df -h

      ###########################################
      # 2️⃣ Build and Push SuperLink (server)
      ###########################################
      - name: Build SuperLink Image
        run: |
          docker build ${BUILD_ARGS} \
            -f fl-services/flower/superlink/Dockerfile \
            --build-arg BASE_REF=$REGISTRY/$ORG/$BASE_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$SERVER_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$SERVER_IMAGE:sha-$SHORT_SHA fl-services/flower/superlink

          echo "✅ Built SuperLink."

      - name: Push SuperLink Image
        env:
          TAGS: ${{ steps.tags.outputs.server_tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker tag "$REGISTRY/$ORG/$SERVER_IMAGE:${{ github.sha }}" "$tag"
            docker push "$tag"
          done
          echo "✅ Pushed SuperLink."

      - name: Cleanup after SuperLink
        run: |
          docker rmi $REGISTRY/$ORG/$SERVER_IMAGE:${{ github.sha }} || true
          docker rmi $REGISTRY/$ORG/$SERVER_IMAGE:sha-$SHORT_SHA || true
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker rmi $REGISTRY/$ORG/$SERVER_IMAGE:prod || true
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            docker rmi $REGISTRY/$ORG/$SERVER_IMAGE:stag || true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker rmi $REGISTRY/$ORG/$SERVER_IMAGE:${GITHUB_REF_NAME} || true
          fi
          docker system prune -f
          echo "Disk space after SuperLink cleanup:"
          df -h

      ###########################################
      # 3️⃣ Build and Push SuperNode (client)
      ###########################################
      - name: Build SuperNode Image
        run: |
          docker build ${BUILD_ARGS} \
            -f fl-services/flower/supernode/Dockerfile \
            --build-arg BASE_REF=$REGISTRY/$ORG/$BASE_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$CLIENT_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$CLIENT_IMAGE:sha-$SHORT_SHA fl-services/flower/supernode

          echo "✅ Built SuperNode."

      - name: Push SuperNode Image
        env:
          TAGS: ${{ steps.tags.outputs.client_tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker tag "$REGISTRY/$ORG/$CLIENT_IMAGE:${{ github.sha }}" "$tag"
            docker push "$tag"
          done
          echo "✅ Pushed SuperNode."

      - name: Cleanup after SuperNode
        run: |
          docker rmi $REGISTRY/$ORG/$CLIENT_IMAGE:${{ github.sha }} || true
          docker rmi $REGISTRY/$ORG/$CLIENT_IMAGE:sha-$SHORT_SHA || true
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker rmi $REGISTRY/$ORG/$CLIENT_IMAGE:prod || true
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            docker rmi $REGISTRY/$ORG/$CLIENT_IMAGE:stag || true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker rmi $REGISTRY/$ORG/$CLIENT_IMAGE:${GITHUB_REF_NAME} || true
          fi
          docker system prune -f
          echo "Disk space after SuperNode cleanup:"
          df -h

      ###########################################
      # 4️⃣ Build and Push FL API
      ###########################################
      - name: Build FL API Image
        run: |
          docker build ${BUILD_ARGS} \
            -f fl-services/flower/fl-api-flower/Dockerfile \
            -t $REGISTRY/$ORG/$API_IMAGE:${{ github.sha }} \
            -t $REGISTRY/$ORG/$API_IMAGE:sha-$SHORT_SHA fl-services/flower/fl-api-flower

          echo "✅ Built FL API."

      - name: Push FL API Image
        env:
          TAGS: ${{ steps.tags.outputs.api_tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker tag "$REGISTRY/$ORG/$API_IMAGE:${{ github.sha }}" "$tag"
            docker push "$tag"
          done
          echo "✅ Pushed FL API."

      - name: Final cleanup
        run: |
          docker rmi $REGISTRY/$ORG/$API_IMAGE:${{ github.sha }} || true
          docker rmi $REGISTRY/$ORG/$API_IMAGE:sha-$SHORT_SHA || true
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker rmi $REGISTRY/$ORG/$API_IMAGE:prod || true
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            docker rmi $REGISTRY/$ORG/$API_IMAGE:stag || true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker rmi $REGISTRY/$ORG/$API_IMAGE:${GITHUB_REF_NAME} || true
          fi
          # Clean up the base image
          docker rmi $REGISTRY/$ORG/$BASE_IMAGE:${{ github.sha }} || true
          docker system prune -af
          echo "Final disk space:"
          df -h
