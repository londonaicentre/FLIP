name: Build and Push Docker Image for XNAT Web

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "trust/xnat/**"
      - ".github/workflows/docker_build_xnat_web.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    # Skip on forks: they cannot assume the upstream AWS OIDC role or push to
    # ghcr.io/londonaicentre, so this whole build-and-publish job would otherwise
    # show a spurious CI failure on fork pushes. Upstream publishing is unchanged.
    if: github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions: # override top-level read-only default to allow GHCR push
      id-token: write # required for OIDC
      contents: read
      packages: write
    environment: flip
    defaults:
      run:
        working-directory: ./trust/xnat/xnat
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: londonaicentre/xnat-web
      FLIP_ARTIFACTS_BUCKET_NAME: flipdev-artifacts
      # XNAT_VERSION is intentionally absent here: it is read from trust/xnat/.env
      # by the step below and appended at the docker build call.
      BUILD_ARGS: |
        --build-arg XNAT_SMTP_ENABLED=false
        --build-arg XNAT_DATASOURCE_DRIVER=org.postgresql.Driver
        --build-arg XNAT_DATASOURCE_USERNAME=xnat
        --build-arg XNAT_DATASOURCE_PASSWORD=xnat
        --build-arg XNAT_DATASOURCE_URL=jdbc:postgresql://xnat-db/xnat
        --build-arg TOMCAT_XNAT_FOLDER=ROOT
        --build-arg XNAT_ROOT=/data/xnat
        --build-arg XNAT_HOME=/data/xnat/home
        --build-arg XNAT_EMAIL=email@gstt.nhs.uk
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      # Single source for the XNAT version: trust/xnat/.env — the same pin the
      # Makefile build reads — so a version bump there flows through the WAR and
      # plugin downloads and the image build without editing this workflow.
      - name: Read XNAT version from trust/xnat/.env
        run: |
          XNAT_VERSION="$(grep -E '^XNAT_VERSION=' ../.env | cut -d= -f2 || true)"
          [[ -n "$XNAT_VERSION" ]] || { echo "::error::XNAT_VERSION not set in trust/xnat/.env"; exit 1; }
          echo "Using XNAT version: $XNAT_VERSION"
          echo "XNAT_VERSION=$XNAT_VERSION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ vars.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Determine tags
        id: tags
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_WR_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # An empty sha would silently publish a mutable literal `sha-` tag — refuse.
          [[ -n "$GH_SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }

          # Immutable short-SHA tag (FLIP#751), pushed uniformly on every publish; today
          # only the hub ECS images are consumed (by `make deploy-centralhub`). Length 7
          # must match the tag resolution in deploy/providers/AWS/Makefile.
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GH_SHA:0:7}"

          # Branch name sanitization
          SAFE_REF_NAME=$(echo "$GH_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SAFE_REF_NAME}"

          # Branch number (if starts with number)
          if [[ "$GH_REF_NAME" =~ ^[0-9]+ ]]; then
              BRANCH_NUM=$(echo "$GH_REF_NAME" | grep -oE '^[0-9]+')
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NUM}"
          fi

          # PR Number (if PR)
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
             PR_NUMBER=$(echo "$GH_REF" | awk -F / '{print $3}')
             TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${PR_NUMBER}"
          fi

          # Determine if this is a merge/push to main or develop
          BRANCH_NAME=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$GH_WR_EVENT" == "push" ]]; then
            BRANCH_NAME="$GH_WR_BRANCH"
          elif [[ "$GH_EVENT_NAME" == "push" ]]; then
            BRANCH_NAME="$GH_REF_NAME"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stag"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login $REGISTRY -u "$GH_ACTOR" --password-stdin

      # The S3 artifact set is keyed by XNAT version — s3://<bucket>/xnat-<version>/{war, plugins/} —
      # so branches on different XNAT versions (e.g. main vs develop across an upgrade) each build
      # against their own WAR + plugin roster.
      - name: Download XNAT WAR
        run: aws s3 cp "s3://${{ env.FLIP_ARTIFACTS_BUCKET_NAME }}/xnat-${XNAT_VERSION}/xnat-web-${XNAT_VERSION}.war" "build-artifacts/xnat-web-${XNAT_VERSION}.war"

      - name: Download XNAT plugins
        # Exclude ohif-viewer: FLIP never opens the viewer, and its per-session
        # metadata-rebuild listener is the dominant load on XNAT's Reactor
        # EventBus (FLIP#662). Keep this in sync with scripts/ensure_plugins.sh.
        run: aws s3 sync "s3://${{ env.FLIP_ARTIFACTS_BUCKET_NAME }}/xnat-${XNAT_VERSION}/plugins/" plugins/ --exclude "ohif-viewer-*"

      - name: Build Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          TAG_FLAGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS+=("-t" "$tag")
          done
          # shellcheck disable=SC2086
          docker build --build-arg XNAT_VERSION="$XNAT_VERSION" $BUILD_ARGS "${TAG_FLAGS[@]}" .

      - name: Push Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "$tag"
          done
