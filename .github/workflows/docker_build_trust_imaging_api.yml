name: Build and Push Docker Image for Imaging API

on:
  workflow_dispatch:
  # Release builds (FLIP#1204): a run at refs/tags/v<X.Y.Z> rebuilds this image at the release
  # commit and pushes :v<X.Y.Z>, changed or not, so a site can pin ONE release across its whole
  # stack. For a real release that run is release.yml's workflow_dispatch at the tag (its own
  # GITHUB_TOKEN tag push starts no workflow); this push trigger fires for a hand-pushed
  # release candidate (v<X.Y.Z>-rc.N).
  push:
    tags: ['v*.*.*']
  # Publish only after the imaging-api test suite ("Trust - Imaging API CI")
  # completes on main/develop; the job-level `if` below gates on its success.
  # The test workflow is path-filtered to trust/imaging-api/**, so the build only
  # fires when imaging-api actually changed.
  workflow_run:
    workflows: ["Trust - Imaging API CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-push:
    # Only publish when the upstream test run passed. workflow_dispatch (manual)
    # and the release-tag push have no workflow_run context, so allow them through
    # unconditionally — a stable tag's commit is on main, whose tests run on it (the
    # release-tag guard below enforces that); a release-candidate tag is a deliberate
    # hand-pushed build of a release PR head.
    # The head_repository clause is the trust boundary (FLIP#882): a fork PR's
    # test run satisfies every other gate, and the checkout below fetches the
    # triggering run's code. `github.repository == …` only stops a fork's own
    # copy of this file running in the fork. Rationale + regression guard:
    # scripts/tests/test_workflow_trust_guards.py; the same clause guards
    # terraform_plan.yml. One shared workflow for these copies: FLIP#1201.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) &&
      github.repository == 'londonaicentre/FLIP'
    runs-on: ubuntu-latest
    permissions: # override top-level read-only default to allow GHCR push
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./trust/imaging-api
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: londonaicentre/imaging-api
      BUILD_ARGS: |
        --build-arg UID=1000
        --build-arg GID=1000
        --build-arg UNAME=flip
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # workflow_run.* is empty on manual workflow_dispatch runs, so fall
          # back to the dispatched ref so manual builds check out correctly.
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A stable v<X.Y.Z> tag must point at a commit on main — releases are cut there by
      # release.yml; pre-release (-rc.N) tags are the release-candidate path and pass.
      - name: Release tag guard
        uses: ./.github/actions/release-tag-guard

      - name: Determine tags
        id: tags
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_WR_EVENT: ${{ github.event.workflow_run.event }}
          GH_WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # On a workflow_run trigger, github.sha / github.ref_name point at the
          # default branch (where this workflow definition lives), NOT the commit
          # that was tested and checked out. Use the triggering run's head_sha /
          # head_branch so the :<sha> and :<branch> tags match the built code.
          if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
            SHA="$GH_WR_SHA"
            REF_NAME="$GH_WR_BRANCH"
          else
            SHA="$GH_SHA"
            REF_NAME="$GH_REF_NAME"
          fi

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SHA}"

          # An empty sha would silently publish a mutable literal `sha-` tag — refuse.
          [[ -n "$SHA" ]] || { echo "::error::empty commit SHA — cannot compute the sha-<short7> tag"; exit 1; }

          # Immutable short-SHA tag (FLIP#751), pushed uniformly on every publish; today
          # only the hub ECS images are consumed (by `make deploy-centralhub`). Length 7
          # must match the tag resolution in deploy/providers/AWS/Makefile.
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${SHA:0:7}"

          # Release tag (FLIP#1204): a run at refs/tags/v<X.Y.Z> (release.yml's dispatch, or a
          # hand-pushed release candidate) publishes :v<X.Y.Z> ONLY. The sha tags belong to the
          # branch build of the same commit and stay immutable: a second push would swap the
          # image under a sha-pinned hub, with a different FLIP_RELEASE baked in. RELEASE is what
          # the image bakes as FLIP_RELEASE so /health names the build: the release tag when
          # there is one, else the sha tag.
          RELEASE="sha-${SHA:0:7}"
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            RELEASE="$GH_REF_NAME"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${GH_REF_NAME}"
          else
            # Branch name sanitization
            SAFE_REF_NAME=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${SAFE_REF_NAME}"
          fi
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT

          # Branch number (if starts with number)
          if [[ "$REF_NAME" =~ ^[0-9]+ ]]; then
              BRANCH_NUM=$(echo "$REF_NAME" | grep -oE '^[0-9]+')
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH_NUM}"
          fi

          # PR Number (if PR)
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
             PR_NUMBER=$(echo "$GH_REF" | awk -F / '{print $3}')
             TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi

          # Determine if this is a merge/push to main or develop
          BRANCH_NAME=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$GH_WR_EVENT" == "push" ]]; then
            BRANCH_NAME="$GH_WR_BRANCH"
          elif [[ "$GH_EVENT_NAME" == "push" ]]; then
            BRANCH_NAME="$GH_REF_NAME"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stag"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login $REGISTRY -u "$GH_ACTOR" --password-stdin

      - name: Copy shared logging library into build context
        run: cp -r ../observability/log_config ./log_config

      - name: Build Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
          # Baked into the image as FLIP_RELEASE so /health names the build (FLIP#1204).
          FLIP_RELEASE: ${{ steps.tags.outputs.release }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          TAG_FLAGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS+=("-t" "$tag")
          done
          # shellcheck disable=SC2086
          docker build --build-arg FLIP_RELEASE="$FLIP_RELEASE" $BUILD_ARGS "${TAG_FLAGS[@]}" .

      - name: Push Docker image
        env:
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "$DOCKER_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "$tag"
          done
