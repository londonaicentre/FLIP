name: Test Helm Chart

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "deploy/providers/kubernetes/**"
      - ".github/workflows/test_helm_chart.yml"
  push:
    branches: [develop, main]
    paths:
      - "deploy/providers/kubernetes/**"
      - ".github/workflows/test_helm_chart.yml"
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests (sync-kit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run sync-kit unit tests
        working-directory: deploy/providers/kubernetes
        run: uv run --no-project --with pytest pytest tests/ -v

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.2.3"

      - name: Lint chart
        run: helm lint deploy/providers/kubernetes/

  helm-template:
    name: Helm Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.2.3"

      - name: Render template (default/nvflare)
        run: helm template trust-release deploy/providers/kubernetes/ > /dev/null

      - name: Render template (flower backend)
        run: helm template trust-release deploy/providers/kubernetes/ --set flBackend=flower > /dev/null

      - name: Render template (all services disabled)
        run: |
          helm template trust-release deploy/providers/kubernetes/ \
            --set trustApi.enabled=false \
            --set imagingApi.enabled=false \
            --set dataAccessApi.enabled=false \
            --set flClient.enabled=false \
            --set omopDb.enabled=false \
            --set orthanc.enabled=false \
            --set xnat.enabled=false \
            --set observability.loki.enabled=false \
            --set observability.alloy.enabled=false \
            --set observability.grafana.enabled=false \
            > /dev/null

      - name: Render template (external service override)
        run: |
          helm template trust-release deploy/providers/kubernetes/ \
            --set omopDb.enabled=false \
            --set omopDb.external.host=test.example.com \
            > /dev/null

      # omopDb.vocabLoad.s3Bucket defaults to "" (the licensed bundle has no public
      # mirror — FLIP#842/843), so every other render in this job skips the
      # vocab-load Job. Without this step its ~110-line body is never rendered in
      # CI and a broken .Values path there would merge green, only to fail the
      # WHOLE Helm release of the first operator who configures a bucket.
      - name: Render template (vocab-load enabled)
        run: |
          helm template trust-release deploy/providers/kubernetes/ \
            --set omopDb.vocabLoad.s3Bucket=test-bucket > /tmp/vocab.yaml
          if ! grep -q "omop-vocab-load" /tmp/vocab.yaml; then
            echo "::error::the vocab-load Job did not render with s3Bucket set — its body is now untested in CI"
            exit 1
          fi

      # Asserted with an explicit `if`, not `! grep -q`: `set -e` exempts a
      # negated command, so that form only fails the step by virtue of being the
      # LAST line — appending so much as a debug echo would silently disarm it.
      # The positive control matters too: `! grep -q` also passes on an empty
      # file, so without it "the Job is absent" and "nothing rendered at all"
      # would be indistinguishable.
      - name: Render template (vocab-load skipped without a bucket)
        run: |
          helm template trust-release deploy/providers/kubernetes/ > /tmp/novocab.yaml
          if ! grep -q "omop-db" /tmp/novocab.yaml; then
            echo "::error::the default render produced no omop-db resources — the absence check below would pass vacuously"
            exit 1
          fi
          if grep -q "omop-vocab-load" /tmp/novocab.yaml; then
            echo "::error::the vocab-load Job rendered with no s3Bucket set — a failed hook fails the WHOLE Helm release"
            exit 1
          fi

      # FLIP-PT-091: the orthanc user map must stay a required secret reference.
      # With optional: true, an install whose Secret lacks the key boots a PACS
      # with no registered users instead of failing the pod.
      - name: Orthanc registered-users secret ref stays required (FLIP-PT-091)
        run: |
          helm template trust-release deploy/providers/kubernetes/ \
            --show-only templates/orthanc.yaml > orthanc.rendered.yaml
          if ! grep -q 'key: orthanc-registered-users' orthanc.rendered.yaml; then
            echo "::error::orthanc-registered-users secretKeyRef missing from the rendered manifest"
            exit 1
          fi
          if grep -A5 'key: orthanc-registered-users' orthanc.rendered.yaml | grep -qE 'optional: *true'; then
            echo "::error::the orthanc-registered-users secretKeyRef is optional again — a missing key would boot a userless PACS"
            exit 1
          fi

  kind-e2e:
    name: kind E2E
    runs-on: ubuntu-latest
    needs: [helm-lint, helm-template]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.2.3"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flip-helm-test

      - name: Create namespace and secrets
        run: |
          kubectl create namespace flip-trust 2>/dev/null || true
          kubectl label namespace flip-trust app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate namespace flip-trust \
            meta.helm.sh/release-name=trust-release \
            meta.helm.sh/release-namespace=flip-trust \
            --overwrite
          kubectl apply -f deploy/providers/kubernetes/ci/test-secret.yaml

      - name: Install chart
        run: |
          helm install trust-release deploy/providers/kubernetes/ \
            --namespace flip-trust \
            -f deploy/providers/kubernetes/ci/test-values.yaml \
            --set secrets.existingName=flip-trust-secrets \
            --set trustApi.env.CENTRAL_HUB_API_URL=http://test-hub.example.com/api

      - name: Check pod status
        run: |
          kubectl get pods -n flip-trust
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/instance=trust-release \
            --namespace flip-trust \
            --timeout=120s

      - name: Verify services
        run: |
          kubectl get svc -n flip-trust
          kubectl get pods -n flip-trust

      - name: Debug on failure
        if: failure()
        run: |
          kubectl describe pods -n flip-trust
          kubectl logs -n flip-trust -l app.kubernetes.io/component=trust-api --tail=50
