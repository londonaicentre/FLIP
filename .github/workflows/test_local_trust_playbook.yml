name: Test Local Trust Playbook

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "deploy/providers/local/**"
      - ".github/workflows/test_local_trust_playbook.yml"
  push:
    branches: [develop, main]
    paths:
      - "deploy/providers/local/**"
      - ".github/workflows/test_local_trust_playbook.yml"
  workflow_dispatch:

jobs:
  python-tests:
    name: Playbook regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run playbook regression tests
        working-directory: deploy/providers/local
        run: uv run --no-project --with pytest --with pyyaml pytest tests/ -v
