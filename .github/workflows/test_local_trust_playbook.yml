name: Test Local Trust Playbook

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "trust/deploy/ansible/**"
      # test_roles_contract.py holds flip_observability_config's file list to this tree.
      - "trust/observability/**"
      - ".github/workflows/test_local_trust_playbook.yml"
  push:
    branches: [develop, main]
    paths:
      - "trust/deploy/ansible/**"
      # test_roles_contract.py holds flip_observability_config's file list to this tree.
      - "trust/observability/**"
      - ".github/workflows/test_local_trust_playbook.yml"
  workflow_dispatch:

# A new push to a PR cancels that PR's in-flight run. Any other run is a group of its own, so a
# push to develop or main, a tag or a manual dispatch is never cancelled or queued (FLIP#2021).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Playbook regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Run playbook regression tests
        working-directory: trust/deploy/ansible
        run: uv run --no-project --with pytest --with pyyaml --with jinja2 pytest tests/ -v
