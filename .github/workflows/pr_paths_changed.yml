#
# Reusable gate for the service test workflows: should this event run the suite?
#
# A `paths:` filter on `pull_request` applies to every target branch alike, so it cannot
# express "filter PRs into develop, but run everything on a PR into main". The service
# workflows therefore always fire on PRs, call this workflow as their first job, and gate
# every test job on its `run` output. A skipped job reports as skipped, never as a missing
# check. The policy itself lives in scripts/pr_paths_changed.py (unit-tested under
# scripts/tests/): non-PR events run, PRs into main run, PRs into anything else run only
# when a changed file matches the caller's list or touches this gate.
#
# The caller passes the SAME list as its push `paths:` filter, in GitHub's filter syntax;
# scripts/tests/test_pr_paths_changed.py fails if the two ever drift.

name: PR paths changed

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Newline-separated path patterns (GitHub filter syntax) — the caller's push
          `paths:` list verbatim.
        required: true
        type: string
    outputs:
      run:
        description: "'true' when the calling workflow's test jobs should run"
        value: ${{ jobs.decide.outputs.run }}

permissions:
  contents: read
  pull-requests: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Only the script is needed; a cone-less sparse checkout fetches that one file
      # instead of the tree.
      - name: Checkout the gate script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/pr_paths_changed.py
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_PATHS: ${{ inputs.paths }}
        run: |
          printf '%s\n' "$CALLER_PATHS" > "$RUNNER_TEMP/paths.txt"
          python3 scripts/pr_paths_changed.py \
            --event "${{ github.event_name }}" \
            --base-ref "${{ github.base_ref }}" \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --paths-file "$RUNNER_TEMP/paths.txt"
