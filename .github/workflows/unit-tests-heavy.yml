# Heavy NVFLARE tests that require PyTorch. Run manually via workflow_dispatch.
name: Unit Tests — NVFLARE (heavy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvflare-heavy:
    name: NVFLARE heavy unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flip-utils
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (hatch/hatchling wrapper)
        run: pip install uv

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch (CPU)
        run: |
          # Use PyTorch CPU wheels to avoid GPU drivers. This uses PyTorch's CPU index.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision --extra-index-url https://pypi.org/simple

      - name: Install dependencies
        run: uv sync --all-groups --extra full

      - name: Run NVFLARE unit tests
        run: |
          # Run only tests in the nvflare test tree to exercise heavy code paths
          uv run pytest tests/unit/nvflare -q --maxfail=1

      - name: Upload coverage (optional)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: nvflare
          fail_ci_if_error: false
