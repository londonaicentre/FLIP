name: Release tag guard
description: |
  Refuse to publish release images for a stable v<X.Y.Z> tag whose commit is not on main.

  Every image workflow builds on a push of refs/tags/v*.*.* (FLIP#1204), so the twelve
  images carry one :v<X.Y.Z> per release. A tag push is not gated by branch protection:
  anyone with write access can push a v* tag at any commit, and without this step that
  would publish release-looking images — FLIP_RELEASE baked in, pinnable by a site — from
  code that was never released. Releases are cut on main by release.yml; this step makes
  the image builds hold the same line.

  Pre-release tags (v<X.Y.Z>-rc.N and other -<suffix> forms) are exempt: that is the
  release-candidate path, where an admin tags a release PR head to build every image for
  staging before the merge to main produces the stable tag. The tag ruleset on v* decides
  who may create such tags; this step only decides what a stable one must point at.

  Ancestry is asked of the API (compare main...<sha>), not the clone: actions/checkout is a
  depth-1 checkout, and a shallow clone cannot answer merge-base questions.

runs:
  using: composite
  steps:
    - name: Refuse a stable release tag that is not on main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG_REF: ${{ github.ref }}
        TAG_NAME: ${{ github.ref_name }}
        TAG_SHA: ${{ github.sha }}
      run: |
        case "$TAG_REF" in
          refs/tags/v*) ;;
          *) echo "not a release-tag push ($TAG_REF) — nothing to guard"; exit 0 ;;
        esac
        if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::notice::$TAG_NAME is a pre-release tag — the release-candidate path; not required to be on main"
          exit 0
        fi
        # compare/<base>...<head>: "behind" or "identical" means <head> is an ancestor of <base>.
        status="$(gh api "repos/$GH_REPO/compare/main...$TAG_SHA" --jq '.status')" || {
          echo "::error::could not compare $TAG_SHA against main (API error) — refusing to publish rather than guess"
          exit 1
        }
        case "$status" in
          behind|identical)
            echo "✓ $TAG_NAME ($TAG_SHA) is on main — publishing release images" ;;
          *)
            echo "::error::$TAG_NAME points at $TAG_SHA, which is not on main (compare status: $status)."
            echo "::error::Releases are cut on main by release.yml; a stable v tag elsewhere would publish release-looking images from unreleased code. For a release candidate use v<X.Y.Z>-rc.N."
            exit 1 ;;
        esac
