name: Publish ref guard
description: |
  Refuse to publish when the branch-named image tag this run would push is a tag deployments consume.

  Every image workflow can be dispatched at any ref (AGENTS.md "Docker image builds": pinning a
  branch-named tag in a compose file for prod testing is an intended workflow), and the tag step
  then pushes `:<sanitised ref name>` with `packages: write`. The ref name is the only part of that
  tag a dispatcher chooses, so a branch whose name happens to read as a deployment tag — `prod`,
  `stag`, `sha-<short7>`, `v<X.Y.Z>` — would publish under a name a hub or a trust node pulls,
  from code that never went through the gated push path. The tag values deploys actually resolve
  are `stag` / `prod` (the configured floats: `.env.development.example`, the chart's per-image
  `tag: stag` defaults, `FALLBACK_DOCKER_TAG` in deploy/aws/scripts/resolve-image-tags.sh),
  `sha-<short7>` (`make deploy-centralhub`, a kit's `DOCKER_TAG`) and `v<X.Y.Z>` (the release
  identity sites pin), plus `latest` (docker's implicit default when a reference carries no tag)
  and `dev` (the local-image convention). This step refuses those names and nothing else.

  `main` and `develop` are deliberately NOT refused. They are real, review-gated branches whose
  builds are the documented rebuild path (`gh workflow run docker_build_flip_api.yml --ref
  develop`), the `:main` / `:develop` tags are not resolved by any deploy, and no second branch
  can be created under either name — refusing them would remove an operator path and no exposure.

  Tag refs are skipped: a `v*.*.*` run publishes `:v<X.Y.Z>` only and `.github/actions/release-tag-guard`
  is what decides whether that tag may be built at all.

  Residual: like every local action this one is loaded from the checked-out ref, so a run dispatched
  at a branch executes that branch's copy of this file. Making a branch unable to edit its own guard
  needs the guard to come from the default branch or a repository-settings control; see FLIP#1743.

runs:
  using: composite
  steps:
    - name: Refuse a branch build that would publish a deployment tag
      shell: bash
      env:
        GH_EVENT_NAME: ${{ github.event_name }}
        GH_REF: ${{ github.ref }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        case "$GH_REF" in
          refs/tags/*)
            echo "release-tag run ($GH_REF) — publishes :v<X.Y.Z> only; release-tag-guard owns this path"
            exit 0 ;;
        esac

        # Same source as the tag steps: on a workflow_run trigger github.ref_name is the default
        # branch (where the workflow definition lives), not the branch that was tested and built.
        if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
          REF_NAME="$GH_WR_BRANCH"
        else
          REF_NAME="$GH_REF_NAME"
        fi

        if [[ -z "$REF_NAME" ]]; then
          echo "::error::empty ref name — cannot tell which image tag this run would publish"
          exit 1
        fi

        # Same sanitisation as every tag step: non-alphanumerics become dashes. Both the raw ref
        # name and the sanitised tag are checked, so the refusal does not depend on that detail.
        SAFE_REF_NAME=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        for candidate in "$REF_NAME" "$SAFE_REF_NAME"; do
          name="$(echo "$candidate" | tr '[:upper:]' '[:lower:]')"
          reserved=""
          case "$name" in
            stag | prod)
              reserved="the floating tag a staging/production deploy resolves" ;;
            latest)
              reserved="docker's implicit default tag" ;;
            dev)
              reserved="the local development image tag" ;;
            *)
              if [[ "$name" =~ ^sha-[0-9a-f]{7,}$ ]]; then
                reserved="the immutable sha-<short7> tag a hub deploy pins"
              elif [[ "$name" =~ ^v[0-9]+[.-][0-9]+[.-][0-9]+ ]]; then
                reserved="the v<X.Y.Z> release tag sites pin"
              fi ;;
          esac
          if [[ -n "$reserved" ]]; then
            echo "::error::refusing to publish from ref '$REF_NAME': the image tag '$candidate' it would push is $reserved."
            echo "::error::stag and prod follow a push to develop and main, sha-<short7> is minted from the built commit, and v<X.Y.Z> is cut by release.yml. Rename the branch and dispatch again."
            exit 1
          fi
        done

        echo "✓ ref '$REF_NAME' publishes ':$SAFE_REF_NAME', which no deploy resolves"
