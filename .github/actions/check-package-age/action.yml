name: Check package age
description: >-
  Supply-chain cooldown gate. Fails the build when a locked Python (uv.lock) or
  JavaScript (package-lock.json) dependency was published to its upstream
  registry within the cooldown window (default 72 hours). See issue #495 and
  CONTRIBUTING.md ("Dependency cooldown").

inputs:
  paths:
    description: >-
      Whitespace-separated lockfile or directory paths to scan, relative to the
      repository root. Directories are searched recursively for uv.lock and
      package-lock.json files.
    required: false
    default: "."
  cooldown-hours:
    description: Minimum dependency release age, in hours.
    required: false
    default: "72"

runs:
  using: composite
  steps:
    - name: Restore registry-age cache
      uses: actions/cache@v4
      with:
        # Release timestamps are immutable, so the cache never needs to expire;
        # the lockfile hash only rotates the key so newly pinned versions are
        # topped up onto the most recent restore.
        path: ${{ runner.temp }}/check-package-age-cache.json
        key: check-package-age-v1-${{ hashFiles('**/uv.lock', '**/package-lock.json') }}
        restore-keys: |
          check-package-age-v1-

    - name: Deepen git history for override detection
      shell: bash
      # actions/checkout produces a shallow (depth-1) tree; deepen it so the
      # script can scan recent commit messages for the [skip-cooldown] override
      # marker. Best-effort — never fail the build if the fetch cannot run.
      run: git fetch --deepen=50 --quiet 2>/dev/null || true

    - name: Check dependency release age
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CPA_PATHS: ${{ inputs.paths }}
        CPA_COOLDOWN_HOURS: ${{ inputs.cooldown-hours }}
        CPA_CACHE_FILE: ${{ runner.temp }}/check-package-age-cache.json
        # The supply-chain-override label is read from the event payload on
        # every CI run. Adding the label to an already-failed pull request
        # takes effect on the next run, so push a commit to re-trigger CI.
        CPA_OVERRIDE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'supply-chain-override') }}
      # CPA_PATHS is intentionally unquoted so multiple space-separated paths
      # word-split into separate arguments; it is supplied by FLIP workflows,
      # never by untrusted input.
      run: >-
        python3 "${GITHUB_ACTION_PATH}/check_package_age.py"
        --cooldown-hours "${CPA_COOLDOWN_HOURS}"
        --cache-file "${CPA_CACHE_FILE}"
        --override-label "${CPA_OVERRIDE_LABEL}"
        ${CPA_PATHS}
