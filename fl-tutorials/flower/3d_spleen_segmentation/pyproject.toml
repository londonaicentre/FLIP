# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-app"
version = "1.0.0"
description = "Tutorial for medical image segmentation of spleen images using MONAI and Flower."
license = "Apache-2.0"
# Dependencies for your Flower App
# flip-utils is deliberately NOT declared here. A local `flwr run` (sim-tutorial) still
# runtime-installs an app's declared dependencies (`uv sync`) into a per-run environment that it
# PREPENDS to sys.path, so declaring flip-utils resolves it from PyPI and shadows the copy the run
# should use — the tutorial-side half of FLIP#767. PyPI's release follows main and can lag the
# checkout: when it was 0.1.8, which had no flip/flower/strategy.py, a declared dependency broke
# `from flip.flower.strategy import FlipFedAvg` outright. Undeclared, `import flip` resolves to
# the environment running the app: the checkout's flip-utils under sim-tutorial, the FL image's
# copy on the compose stacks, where nothing installs at run time (FLIP#1418). The fl-apps templates
# solve the same problem with `[tool.uv.sources] flip-utils = { path = "/opt/flip-utils" }`; that
# pin cannot be used here because it makes `uv sync` unresolvable on a workstation, where the path
# does not exist. Pick up flip-utils changes on the compose stacks with
# `make build-fl FL_BACKEND=flower`.
dependencies = [
    "flwr[simulation]>=1.38.0",
    "monai>=1.6.0",
    "nibabel>=5.3.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.13.0,<2.14",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 3 # Equivalent to global_rounds
local-epochs = 1      # Equivalent to local_rounds
learning-rate = 1e-4
val-split = 0.3
test-split = 0.3
batch-size = 2
# Client-side differential privacy (flip.flower.privacy). On by default; set dp-enabled = false
# to run the same app with the mechanism off. See the README's "Differential privacy" section.
dp-enabled = true
dp-clipping-norm = 1.0
dp-sensitivity = 1e-4
dp-epsilon = 10.0
dp-delta = 1e-5
# Model configuration
spatial-dims = 3 # This is currently unused but can be passed to get_model()
# FLIP configuration - needs to be set here so it can be overridden by flwr run command
# See https://flower.ai/docs/framework/ref-api-cli.html#flwr-run for more details
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Placeholder matching flwr's own default; fl-api overrides it with the participating-trust
# count at submit time (flwr rejects a --run-config key the app config does not declare).
flip-min-clients = 2
# Best-model selection: save best_FL_global_model.pt alongside the final model, chosen by
# the aggregated test Dice (higher is better) that client_app.py reports each round. Set
# the metric to "" to disable, and -minimize to true for a loss-like metric. Selection
# makes the evaluate phase run every round instead of only the last one.
best-model-metric = "test_dice"
best-model-metric-minimize = false

# Linter
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
