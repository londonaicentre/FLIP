# Flower run-config overrides for this evaluation app.
#
# fl-api-flower's submit_run (a platform submit) passes this file to `flwr run --run-config`;
# a tutorial submit (`make -C fl-services/flower submit`) does not, and runs pyproject.toml's values (FLIP#1432). Keys here override
# values already declared in pyproject.toml's [tool.flwr.app.config] -- they cannot introduce
# new keys. The FL API injects flip-model-id / flip-project-id / flip-cohort-query /
# flip-min-clients at upload time, and flip-job-dir at submit time.

# Checkpoint file to evaluate, relative to flip-job-dir. On the platform the app is bundled
# into fl-apps/flower/evaluation, whose pyproject.toml names only a placeholder.
checkpoint = "model.pt"
