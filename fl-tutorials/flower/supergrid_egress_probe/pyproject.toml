# FLIP#744: maps SuperGrid's undocumented egress allowlist from inside the
# ServerApp pod. The ServerApp probes candidate experiment-tracker (and control)
# endpoints and logs one verdict line each — it never starts a round, so the
# run finishes in seconds. Motivation: both the SageMaker MLflow App domain and
# a cloudflared tunnel came back "ProxyError ... 403 Forbidden" (2026-07-31),
# so the reachable-tracker set has to be established empirically.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supergrid-egress-probe"
version = "1.0.0"
description = "Probe which external endpoints SuperGrid's ServerApp egress proxy allows."
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.32.0",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
# Comma-separated extra URLs to probe on top of the built-in candidates.
extra-urls = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
