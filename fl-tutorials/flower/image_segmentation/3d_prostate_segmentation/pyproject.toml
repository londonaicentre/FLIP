# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
#
# This file serves the flwr simulator (`make -C fl-tutorials sim-tutorial`) and local `flwr run`.
# On the platform the standard template's pyproject (fl-apps/flower/standard/) is what runs, so
# every run-config key below must exist there too.
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-app"
version = "1.0.0"
description = "Tutorial for 3D prostate zonal segmentation on PI-CAI bpMRI, an nnU-Net-planned DynUNet trained with Flower."
license = "Apache-2.0"
# Dependencies for your Flower App
# flip-utils is deliberately NOT declared here. Flower runtime-installs an app's declared
# dependencies (`uv sync`) into a per-run environment that it PREPENDS to sys.path, so declaring
# flip-utils resolves it from PyPI and shadows the in-repo copy baked into the FL images at
# /opt/flip-utils — the tutorial-side half of FLIP#767. Undeclared, `import flip` falls through to
# the image's copy, which is what the platform runs. Pick up flip-utils changes with
# `make build-fl FL_BACKEND=flower`.
#
# nnunetv2 is NOT a dependency of the app either: the network is MONAI's DynUNet, built from the
# planner's JSON (app/models.py). The planner itself needs nnunetv2 — see the `planning` group.
dependencies = [
    "einops>=0.8.1",
    "flwr[simulation]>=1.38.0",
    "monai>=1.6.0",
    "nibabel>=5.3.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "scipy>=1.14.0",
    "torch>=2.13.0,<2.14",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]
# `make plan` — calculate_dataset_fingerprint_segmentation.py is nnU-Net's fingerprint extractor and
# experiment planner, run once on a workstation over every site; its output ships as
# app/nnUNetPlans_segmentation.json. Only that script needs these.
planning = [
    "nnunetv2>=2.5.1",
    "simpleitk>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 2 # Equivalent to global_rounds (simulator default; app/config.toml sets the platform's)
local-epochs = 1      # Equivalent to local_rounds
learning-rate = 0.01  # nnU-Net's SGD default
val-split = 0.2
test-split = 0.2
batch-size = 1        # volumes per step — each expands to its whole patch grid
# Client-side differential privacy (flip.flower.privacy). On by default; set dp-enabled = false
# to run the same app with the mechanism off. See the README's "Differential privacy" section.
dp-enabled = true
dp-clipping-norm = 1.0
dp-sensitivity = 1e-4
dp-epsilon = 10.0
dp-delta = 1e-5
# Model configuration
spatial-dims = 3 # This is currently unused but can be passed to get_model()
# FLIP configuration - needs to be set here so it can be overridden by flwr run command
# See https://flower.ai/docs/framework/ref-api-cli.html#flwr-run for more details
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Placeholder matching flwr's own default; fl-api overrides it with the participating-trust
# count at submit time (flwr rejects a --run-config key the app config does not declare).
flip-min-clients = 2
# Best-model selection: save best_FL_global_model.pt alongside the final model, chosen by the
# aggregated mean test Dice (higher is better) that client_app.py reports each round. Set the
# metric to "" to disable, and -minimize to true for a loss-like metric.
best-model-metric = "test_dice_mean"
best-model-metric-minimize = false

# Linter
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
