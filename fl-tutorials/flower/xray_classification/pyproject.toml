# This pyproject.toml is for `flwr run` simulation only. In FLIP, the
# destination bundle's pyproject.toml comes from the base bundle, and the
# upload flow refuses to overwrite it (see bundle_flower_application). The
# per-tutorial chest-X-ray hyperparameters live in app/config.json — that is
# what client_app.py and server_app.py read.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-app"
version = "1.0.0"
description = "Tutorial for chest-X-ray multi-lesion classification using MONAI / DenseNet and Flower."
license = "Apache-2.0"
dependencies = [
    "flip-utils>=0.1.8",
    "flwr[simulation]>=1.32.0",
    "monai>=1.5.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.10.0,<2.12",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
# 3 rounds so best-model selection has checkpoints to choose between (a 1-round
# job's best model is always the final model).
num-server-rounds = 3
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Save the best aggregated global model by validation loss (lower is better);
# saves best_FL_global_model.pt alongside FL_global_model.pt in the results.
best-model-metric = "test_loss"
best-model-metric-minimize = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
