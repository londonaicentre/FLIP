# This pyproject.toml is for `flwr run` simulation only. In FLIP, the
# destination bundle's pyproject.toml comes from the base bundle, and the
# upload flow refuses to overwrite it (see bundle_flower_application). The
# per-tutorial chest-X-ray hyperparameters live in app/config.json — that is
# what client_app.py and server_app.py read.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-app"
version = "1.0.0"
description = "Tutorial for chest-X-ray multi-lesion classification using MONAI / DenseNet and Flower."
license = "Apache-2.0"
# flip-utils is deliberately NOT declared here. Flower runtime-installs an app's declared
# dependencies (`uv sync`) into a per-run environment that it PREPENDS to sys.path, so declaring
# flip-utils resolves it from PyPI and shadows the in-repo copy baked into the FL images at
# /opt/flip-utils — the tutorial-side half of FLIP#767. PyPI currently serves 0.1.8 against the
# repo's 0.4.0, and 0.1.8 has no flip/flower/strategy.py, so a declared dependency breaks
# `from flip.flower.strategy import FlipFedAvg` outright. Undeclared, `import flip` falls through
# to the image's copy, which is what the platform runs. The fl-apps templates solve the same
# problem with `[tool.uv.sources] flip-utils = { path = "/opt/flip-utils" }`; that pin cannot be
# used here because it makes `uv sync` unresolvable on a workstation, where the path does not
# exist. Pick up flip-utils changes with `make build-fl FL_BACKEND=flower`.
dependencies = [
    "flwr[simulation]>=1.32.0",
    "monai>=1.6.0",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.10.0,<2.12",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
# 3 rounds so best-model selection has checkpoints to choose between (a 1-round
# job's best model is always the final model).
num-server-rounds = 3
# Client-side differential privacy (flip.flower.privacy). On by default; set dp-enabled = false
# to run the same app with the mechanism off. See the README's "Differential privacy" section.
dp-enabled = true
dp-clipping-norm = 1.0
dp-sensitivity = 1e-4
dp-epsilon = 10.0
dp-delta = 1e-5
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Placeholder matching flwr's own default; fl-api overrides it with the participating-trust
# count at submit time (flwr rejects a --run-config key the app config does not declare).
flip-min-clients = 2
# Save the best aggregated global model by macro F1 across lesions (higher is better),
# the same interpretable metric the NVFLARE chest-X-ray tutorial selects on (VAL-F1-SCORE).
# Saves best_FL_global_model.pt alongside FL_global_model.pt in the results.
best-model-metric = "test_f1-score"
best-model-metric-minimize = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
