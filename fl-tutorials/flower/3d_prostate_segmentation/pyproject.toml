[project]
name = "prostate-segmentation-tutorial"
version = "0.1.0"
description = "Local uv environment for the 3D prostate segmentation tutorial (PI-CAI dataset fingerprinting, experiment planning and nnU-Net training)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8.0",
    "monai>=1.6.0",
    "nibabel>=5.3.3",
    "nnunetv2>=2.5.1",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "simpleitk>=2.5.6",
    "torch>=2.10.0,<2.12",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
