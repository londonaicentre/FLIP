# This pyproject.toml is for `flwr run` simulation only. In FLIP, the destination bundle's
# pyproject.toml comes from the base bundle, and the upload flow refuses to overwrite it. The
# per-tutorial settings (federation mode, bootstraps, variables, background knowledge) live in
# app/config.json — that is what client_app.py reads.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-app"
version = "1.0.0"
description = "Tutorial for federated bootstrapped FCI causal discovery on OMOP biomarker data using Flower."
license = "Apache-2.0"
# flip-utils is deliberately NOT declared here: a local `flwr run` installs an app's declared
# dependencies into a per-run environment it prepends to sys.path, so declaring flip-utils would
# shadow the checkout's copy with a PyPI release (FLIP#767). causal-learn IS declared — it is a
# plain PyPI package, and the per-run environment needs it the same way it needs torch.
dependencies = [
    "causal-learn>=0.1.4.3",
    "flwr[simulation]>=1.38.0",
    "numpy>=2.2.0",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "torch>=2.13.0,<2.14",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
# pooled_statistics completes in 2 rounds (statistics, then FCI). layer_voting needs
# (max conditioning-set size + 2) rounds — override with --run-config 'num-server-rounds=6'.
num-server-rounds = 2
# Client-side differential privacy (flip.flower.privacy) is OFF for this tutorial: clipping and
# noising pooled second moments (or 0/1 votes) is not a meaningful mechanism for them and breaks
# the arithmetic the federation relies on. See the README's privacy section.
dp-enabled = false
dp-clipping-norm = 1.0
dp-sensitivity = 1e-4
dp-epsilon = 10.0
dp-delta = 1e-5
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Placeholder matching flwr's own default; fl-api overrides it with the participating-trust
# count at submit time (flwr rejects a --run-config key the app config does not declare).
flip-min-clients = 2
# No best-model selection: the "model" is the federated state and "best" has no meaning for it.
best-model-metric = ""
best-model-metric-minimize = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
