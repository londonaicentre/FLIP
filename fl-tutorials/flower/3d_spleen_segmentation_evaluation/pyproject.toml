# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation-app"
version = "1.0.0"
description = "Evaluation app"
license = "Apache-2.0"
# Dependencies for your Flower App
# flip-utils is deliberately NOT declared here. Flower runtime-installs an app's declared
# dependencies (`uv sync`) into a per-run environment that it PREPENDS to sys.path, so declaring
# flip-utils resolves it from PyPI and shadows the in-repo copy baked into the FL images at
# /opt/flip-utils — the tutorial-side half of FLIP#767. PyPI currently serves 0.1.8 against the
# repo's 0.4.0, and 0.1.8 has no flip/flower/strategy.py, so a declared dependency breaks
# `from flip.flower.strategy import FlipFedAvg` outright. Undeclared, `import flip` falls through
# to the image's copy, which is what the platform runs. The fl-apps templates solve the same
# problem with `[tool.uv.sources] flip-utils = { path = "/opt/flip-utils" }`; that pin cannot be
# used here because it makes `uv sync` unresolvable on a workstation, where the path does not
# exist. Pick up flip-utils changes with `make build-fl FL_BACKEND=flower`.
dependencies = [
    "flwr[simulation]>=1.32.0",
    "monai>=1.6.0",
    "nibabel>=5.3.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydicom>=3.0.1",
    "torch>=2.10.0,<2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 1 # Evaluation only needs 1 round
local-epochs = 1      # Number of evaluation rounds per model
learning-rate = 1e-4
batch-size = 2
# Model configuration
spatial-dims = 3
num-classes = 2
# Checkpoint filename to evaluate, relative to flip-job-dir.
# Dummy placeholder -- the real value is supplied per run via config.toml.
checkpoint = "dummy.pt"
# FLIP configuration - needs to be set here so it can be overridden by flwr run command
# See https://flower.ai/docs/framework/ref-api-cli.html#flwr-run for more details
flip-model-id = "uuid"
flip-project-id = "uuid"
flip-cohort-query = "*"
flip-job-dir = "job-dir"
# Declared so fl-api can override it at submit time with the participating-trust count
# (flwr rejects a --run-config key that the app config does not declare). Drives FedAvg's
# node thresholds; see FlipFedAvg's min_clients.
flip-min-clients = 1

# Linter
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT', 'UP006', 'UP007', 'UP035', 'UP042', 'UP045']
