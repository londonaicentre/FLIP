services:
  nvflare-simulator:
    image: ghcr.io/londonaicentre/flare-fl-base:${FL_BASE_IMAGE_TAG}
    pull_policy: missing
    environment:
      - LOCAL_DEV=true
      - DEV_IMAGES_DIR=/images
      - DEV_DATAFRAME=/dataframe/sample_get_dataframe_response.csv
    volumes:
      - ${RUNS_DIR}:/app/runs
      - ${DEV_IMAGES_DIR}:/images
      - ${DEV_DATAFRAME}:/dataframe/sample_get_dataframe_response.csv
      - ./tmp/app:/app/job
    shm_size: 32gb
    gpus: all
    # --gpu takes an explicit comma-separated GPU device-id list (NVFLARE has no auto-detect);
    # without it the simulator leaves the client workers on CPU. Defaults to GPU 0; override with
    # SIM_GPU (e.g. SIM_GPU=0,1 for multi-GPU) in .env.testing.
    command: nvflare simulator -t 2 -n ${NUM_CLIENTS} --gpu ${SIM_GPU:-0} -w runs/workspace job
