[project]
name = "spleen-dataset-tools"
version = "0.1.0"
description = "Local uv environment for the shared spleen dataset tooling (MSD download + accession CSV)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "monai>=1.5.1",
    "natsort>=8.4.0",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "torch>=2.6.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = false
