[project]
name = "arkplus-dataset-tools"
version = "0.1.0"
description = "Local uv environment for the arkplus_project OMOP conversion and DICOM set (FLIP#2084)."
requires-python = ">=3.13,<3.14"
# The download itself needs only huggingface_hub and keeps running with `uv run --no-project` (see
# README.md); this environment is for the metadata table, the OMOP conversion and the DICOM set.
dependencies = [
    "pandas>=2.3.2",
    "pandera[pandas,io]>=0.28.1",
    "pydicom>=3.0.2",
    # utils/omop_schemas.py imports requests at module scope for its --regenerate path, so every
    # consumer of the shared contract needs it even though no conversion run reaches the network.
    "requests>=2.32.5",
    "sqlglot>=28.6.0",
]

[dependency-groups]
# Test-only: fl-tutorials/tests/datasets/arkplus/ runs in this project's environment
# (see fl-tutorials/tests/README.md).
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
package = false
