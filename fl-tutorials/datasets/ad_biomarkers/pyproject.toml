[project]
name = "ad-biomarkers-dataset-tools"
version = "0.1.0"
description = "Local uv environment for the ADNI → biomarker_causal_discovery cohort converter."
requires-python = ">=3.12,<3.14"
# The converter reads five ADNI study tables and writes CSVs: numpy + pandas is the whole of it.
# The project exists so that tests/datasets/ad_biomarkers/ runs in an environment declaring exactly
# what the script imports (see fl-tutorials/tests/README.md).
dependencies = [
    "numpy>=2.2.0",
    "pandas>=2.3.2",
]

[dependency-groups]
# Test-only. The query.sql parity test needs nothing beyond the standard library's sqlite3.
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
package = false
