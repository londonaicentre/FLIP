;
; This suite has no pyproject.toml of its own on purpose: it runs in flip-utils' environment
; (`flip-utils[full]` — monai, pydicom, torch), which is what the FL images give these apps at
; runtime. A per-tutorial env would be the wrong target — arkplus_fine_tuning/pyproject.toml does
; not even declare monai, so that env cannot import its own data_utils.py. This file exists so
; pytest anchors its rootdir here rather than at the repository root.

[pytest]
pythonpath = .
testpaths = .
python_files = test_*.py
addopts = -ra
; Later filters take precedence: torch/numpy noise stays ignored, but a deprecation announced by
; MONAI itself (the reader conventions this suite pins) fails the run the day it appears, not the
; day the behaviour flips. The `:monai` field matches the module a warning is *issued from*, which
; for MONAI's deprecation helpers is monai.utils.deprecate_utils (it warns with stacklevel=2, so
; attribution stops at MONAI's own decorator frame rather than reaching the caller). That is a
; mechanism, not an assumption: test_monai_deprecations_escalate_to_errors fails if it ever stops
; holding, or if these two lines are ever reordered above the blanket ignores.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    error::DeprecationWarning:monai
    error::FutureWarning:monai
