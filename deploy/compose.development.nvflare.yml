# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

# No `container_name` here either — see the header of compose.development.yml. The service KEYS
# are load-bearing and must not be renamed: every provisioned client kit pins the server by name
# (`fed_client.json` carries `"target": "fl-server-net-1:8002"`, and the name is a SAN in the
# provisioned certificates), and `fl-api-net-<N>` is what NET_ENDPOINTS dials.
services:
  #################### CENTRAL HUB FL ####################

  fl-api-net-1:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    environment:
      - FL_ADMIN_DIRECTORY=${FL_ADMIN_DIRECTORY}
      - DEBUG=${DEBUG}
      # Shared volume where the FL API stages a de-bundled eval checkpoint (mirrors Flower's /app/src).
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      # Per-job GPU request written into meta.json resource_spec by configure_meta. Default 0 =>
      # empty resource_spec => NVFLARE hides the GPU from the training worker (CPU). Set >0 (with
      # mem <= the client's advertised mem_per_gpu_in_GiB) so jobs train on the GPU.
      - JOB_RESOURCE_SPEC_NUM_GPUS=${JOB_RESOURCE_SPEC_NUM_GPUS:-0}
      - JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB=${JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB:-0}
    ports:
      - "${FL_API_PORT}:8000"
      # Loopback-only — an exposed debugpy port is arbitrary code execution for anyone
      # who can reach it; see compose.development.yml's flip-api ports (FLIP#959).
      - "127.0.0.1:${FL_API_DEBUG_PORT:-5679}:5679"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      # Provisioned NVFLARE admin secrets (certificates, fed_admin.json)
      - ${FL_PROVISIONED_DIR}/net-1/services/flip-fl-api-net-1/local:/app/admin/local
      - ${FL_PROVISIONED_DIR}/net-1/services/flip-fl-api-net-1/startup:/app/admin/startup
      # Shared with fl-server-net-1: the FL API writes de-bundled eval checkpoints here; the
      # fl-server reads them from disk. The checkpoint is never bundled into the NVFLARE job,
      # so it is never deployed to clients (mirrors the Flower backend's /app/src mount).
      - ${FL_JOBS_DIR}/net-1:/app/server-checkpoints
    depends_on:
      - fl-server-net-1
    networks:
      - default
    restart: unless-stopped

  fl-api-net-2:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    environment:
      - FL_ADMIN_DIRECTORY=${FL_ADMIN_DIRECTORY}
      - DEBUG=${DEBUG}
      # Shared volume where the FL API stages a de-bundled eval checkpoint (mirrors Flower's /app/src).
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      # Per-job GPU request (see fl-api-net-1). Default 0 => CPU; set >0 to train on the GPU.
      - JOB_RESOURCE_SPEC_NUM_GPUS=${JOB_RESOURCE_SPEC_NUM_GPUS:-0}
      - JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB=${JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB:-0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      # Provisioned NVFLARE admin secrets (certificates, fed_admin.json)
      - ${FL_PROVISIONED_DIR}/net-2/services/flip-fl-api-net-2/local:/app/admin/local
      - ${FL_PROVISIONED_DIR}/net-2/services/flip-fl-api-net-2/startup:/app/admin/startup
      # Shared with fl-server-net-2: the FL API writes de-bundled eval checkpoints here; the
      # fl-server reads them from disk. The checkpoint is never bundled into the NVFLARE job,
      # so it is never deployed to clients (mirrors the Flower backend's /app/src mount).
      - ${FL_JOBS_DIR}/net-2:/app/server-checkpoints
    depends_on:
      - fl-server-net-2
    networks:
      - default
    restart: unless-stopped

  fl-server-net-1:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    volumes:
      # Provisioned NVFLARE secrets (certificates, fed_server.json)
      - ${FL_PROVISIONED_DIR}/net-1/services/fl-server-net-1/local:/app/local
      - ${FL_PROVISIONED_DIR}/net-1/services/fl-server-net-1/startup:/app/startup
      - ${FL_PROVISIONED_DIR}/net-1/services/fl-server-net-1/transfer:/app/transfer
      # Shared with fl-api-net-1: de-bundled eval checkpoints staged by the FL API are read
      # from here by the fl-server. The checkpoint is never in the NVFLARE job, so it is never
      # deployed to clients (mirrors the Flower backend's /app/src mount).
      - ${FL_JOBS_DIR}/net-1:/app/server-checkpoints
      # Mount the AWS credentials (needed to upload model results to S3).
      # The image runs non-root as `flip` with HOME=/home/flip (GHSA-8465), so the
      # mount lands under /home/flip/.aws/ — the SDK's default lookup path. Both the
      # path and the user are FIXED, not ${UNAME}-derived: the image identity no
      # longer varies with who built it (FLIP#1171), and `user:` below re-points only
      # the runtime uid, which is what actually has to match these host-owned files.
      - ~/.aws/config:/home/flip/.aws/config:ro
      - ~/.aws/sso/cache:/home/flip/.aws/sso/cache:rw
    environment:
      - NET_ID=net-1
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - AWS_PROFILE=${AWS_PROFILE}
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      - HOME=/home/flip
      # The overridden uid has no /etc/passwd entry, so pwd.getpwuid() raises
      # KeyError: 'getpwuid(): uid not found'. getpass.getuser() consults these first
      # and only falls back to pwd, so naming the image's user here keeps every
      # getuser() caller working without mounting the host's passwd file (FLIP#1171).
      - USER=flip
      - LOGNAME=flip
    # Run as the HOST user's uid, with the image's gid (FLIP#1171). The bind mounts
    # below — the provisioned NVFLARE kit and the operator's 0600 AWS SSO token — are
    # owned by whoever ran `make provision` and `aws sso login`, so only a matching
    # uid can read and write them. A 0600 file cannot be reached by group membership
    # at all, which is why group_add is not an option here (the Flower dev fl-server
    # makes the same point in compose.development.flower.yml). The gid stays the
    # image's so /app and /home/flip — group-writable in fl-base — remain writable for
    # NVFLARE's job workspace and torch's cache. On EC2/on-prem the host user is uid
    # 1000, so this resolves to the baked identity and nothing changes there; prod
    # composes set no `user:` at all and keep running as `flip`.
    user: "${UID:-1000}:${FL_IMAGE_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No cap_add. The previous CHOWN/DAC_OVERRIDE/FOWNER grants were inert and always
    # had been: Docker gives effective capabilities only to uid 0, and this container
    # is non-root, so they landed in the bounding set alone (verified in the running
    # container: CapBnd 0xb, CapEff 0). They could not have been what made the
    # host-owned mounts readable — a matching uid was, which is exactly what broke
    # when the published images' uid stopped matching the developer's. Reading the
    # mounts is now the `user:` override's job, honestly and least-privileged.
    # `default` is the hub-internal network. fl-server is the one FL service that calls back
    # into flip-api (FLIP_API_INTERNAL_URL + INTERNAL_SERVICE_KEY above), and flip-api is
    # deliberately not on the FL net — see the networks block in compose.development.yml.
    networks:
      - default
      - fl-net-1
    restart: unless-stopped
    init: true

  fl-server-net-2:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    volumes:
      # Provisioned NVFLARE secrets (certificates, fed_server.json)
      - ${FL_PROVISIONED_DIR}/net-2/services/fl-server-net-2/local:/app/local
      - ${FL_PROVISIONED_DIR}/net-2/services/fl-server-net-2/startup:/app/startup
      - ${FL_PROVISIONED_DIR}/net-2/services/fl-server-net-2/transfer:/app/transfer
      # Shared with fl-api-net-2: de-bundled eval checkpoints staged by the FL API are read
      # from here by the fl-server. The checkpoint is never in the NVFLARE job, so it is never
      # deployed to clients (mirrors the Flower backend's /app/src mount).
      - ${FL_JOBS_DIR}/net-2:/app/server-checkpoints
      # Mount the AWS credentials (needed to upload model results to S3).
      # The image runs non-root as `flip` with HOME=/home/flip (GHSA-8465), so the
      # mount lands under /home/flip/.aws/ — the SDK's default lookup path. Both the
      # path and the user are FIXED, not ${UNAME}-derived: the image identity no
      # longer varies with who built it (FLIP#1171), and `user:` below re-points only
      # the runtime uid, which is what actually has to match these host-owned files.
      - ~/.aws/config:/home/flip/.aws/config:ro
      - ~/.aws/sso/cache:/home/flip/.aws/sso/cache:rw
    environment:
      - NET_ID=net-2
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - AWS_PROFILE=${AWS_PROFILE}
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      - HOME=/home/flip
      # The overridden uid has no /etc/passwd entry, so pwd.getpwuid() raises
      # KeyError: 'getpwuid(): uid not found'. getpass.getuser() consults these first
      # and only falls back to pwd, so naming the image's user here keeps every
      # getuser() caller working without mounting the host's passwd file (FLIP#1171).
      - USER=flip
      - LOGNAME=flip
    # Run as the HOST user's uid, with the image's gid (FLIP#1171). The bind mounts
    # below — the provisioned NVFLARE kit and the operator's 0600 AWS SSO token — are
    # owned by whoever ran `make provision` and `aws sso login`, so only a matching
    # uid can read and write them. A 0600 file cannot be reached by group membership
    # at all, which is why group_add is not an option here (the Flower dev fl-server
    # makes the same point in compose.development.flower.yml). The gid stays the
    # image's so /app and /home/flip — group-writable in fl-base — remain writable for
    # NVFLARE's job workspace and torch's cache. On EC2/on-prem the host user is uid
    # 1000, so this resolves to the baked identity and nothing changes there; prod
    # composes set no `user:` at all and keep running as `flip`.
    user: "${UID:-1000}:${FL_IMAGE_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No cap_add. The previous CHOWN/DAC_OVERRIDE/FOWNER grants were inert and always
    # had been: Docker gives effective capabilities only to uid 0, and this container
    # is non-root, so they landed in the bounding set alone (verified in the running
    # container: CapBnd 0xb, CapEff 0). They could not have been what made the
    # host-owned mounts readable — a matching uid was, which is exactly what broke
    # when the published images' uid stopped matching the developer's. Reading the
    # mounts is now the `user:` override's job, honestly and least-privileged.
    # `default` is the hub-internal network — see fl-server-net-1 above.
    networks:
      - default
      - fl-net-2
    restart: unless-stopped
    init: true
