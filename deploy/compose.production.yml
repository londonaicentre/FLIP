# ROLE (FLIP#936): local prod-image harness ONLY — `make up PROD=stag|true` runs the baked images with no
# dev mounts. This file is NOT a deployment target: the Central Hub deploys on ECS Fargate, and the task
# definitions in deploy/providers/AWS/ecs_tasks.tf (env maps in locals.tf) are the canonical definition of
# production container config. When changing production config, change Terraform first; update this file
# only as far as the local harness needs.

# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:
  #################### CENTRAL HUB ####################

  # flip-ui is NOT deployed as a container in stag/prod — it's served as a
  # static bundle from S3 via CloudFront (see deploy/providers/AWS/cloudfront.tf
  # and deploy/providers/AWS/Makefile's `deploy-ui` target). Dev still runs the
  # Vite container (deploy/compose.development.yml).

  flip-api:
    image: ghcr.io/londonaicentre/flip-api:${DOCKER_TAG}
    ports:
      - "${API_PORT}:8000"
    environment:
      - ENV=production
      - ENFORCE_MFA=${ENFORCE_MFA:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # - AWS_PROFILE=${AWS_PROFILE} # in production, AWS credentials are retrieved from the instance role
      - AWS_REGION=${AWS_REGION}
      # Force boto3 to mint presigned URLs against the regional S3 endpoint
      # (e.g. s3.eu-west-2.amazonaws.com) instead of the legacy global one
      # (s3.amazonaws.com). DNS for a freshly created bucket in a non-us-east-1
      # region can take up to ~24h to propagate on the global endpoint — the
      # bucket-split rollout (FLIP#24) hit a 500 from the global endpoint on
      # the new uploads bucket until propagation completed. Regional endpoints
      # never have this lag and are AWS's recommended path for non-us-east-1
      # buckets anyway.
      # `:?` makes docker compose abort if AWS_REGION is empty — without the
      # guard the URL becomes `https://s3..amazonaws.com` and boto3 fails late
      # at request time with an opaque EndpointConnectionError, which is
      # exactly the kind of CORS-preflight-failure surprise this env var is
      # supposed to prevent.
      - AWS_ENDPOINT_URL_S3=https://s3.${AWS_REGION:?AWS_REGION must be set in the env file}.amazonaws.com
      - AWS_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID}
      - AWS_COGNITO_APP_CLIENT_ID=${AWS_COGNITO_APP_CLIENT_ID}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_SECRET_ARN=${POSTGRES_SECRET_ARN} # unused since FLIP#556 (ECS prod uses RDS Proxy IAM); legacy EC2/compose path only — retirement tracked in #505
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - TRUST_API_KEY_HEADER=${TRUST_API_KEY_HEADER}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      # in production, INTERNAL_SERVICE_KEY_HASH and AES_KEY_BASE64 are retrieved from AWS Secrets Manager at runtime
      - AWS_SECRET_NAME=${AWS_SECRET_NAME}
      - AWS_SES_ADMIN_EMAIL_ADDRESS=${AWS_SES_ADMIN_EMAIL_ADDRESS}
      - AWS_SES_SENDER_EMAIL_ADDRESS=${AWS_SES_SENDER_EMAIL_ADDRESS}
      - UPLOADED_MODEL_FILES_BUCKET=${UPLOADED_MODEL_FILES_BUCKET}
      - SCANNED_MODEL_FILES_BUCKET=${SCANNED_MODEL_FILES_BUCKET}
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FL_APP_DESTINATION_BUCKET=${FL_APP_DESTINATION_BUCKET}
      - NET_ENDPOINTS=${NET_ENDPOINTS}
      - FL_BACKEND=${FL_BACKEND}
      # No FL_KIT_SLOT_NAMES here: in production the kit-slot pool's single source
      # is the /flip/fl_kit_slot_names SSM parameter (read at runtime by
      # resolve_fl_kit_slot_names) — an env copy would be dead config that
      # apply-fl-kit-slots never updates.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: unless-stopped
    container_name: flip-api
