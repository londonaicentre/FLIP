# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:
  #################### CENTRAL HUB ####################

  flip-ui:
    build:
      args:
        UI_PORT: ${UI_PORT}
      context: ../flip-ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT}:443"
    volumes:
      - ../flip-ui:/app
      - /app/node_modules
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache
    environment:
      # flip-ui reads config at runtime from window.js, which is generated
      # from these canonical names by scripts/generate-window-js.sh (via
      # the predev npm hook). No VITE_AWS_* duplication — those were
      # dropped so the build, dev, and deploy paths all consume the same
      # env vars as the rest of the stack.
      - NODE_ENV=${NODE_ENV}
      - VITE_LOCAL=${VITE_LOCAL}
      - CENTRAL_HUB_API_URL=${CENTRAL_HUB_API_URL}
      - AWS_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID}
      - AWS_COGNITO_APP_CLIENT_ID=${AWS_COGNITO_APP_CLIENT_ID}
      - AWS_REGION=${AWS_REGION}
      - BLACKLISTED_MODEL_FILES=${BLACKLISTED_MODEL_FILES}
    restart: unless-stopped
    networks:
      - default
    container_name: flip-ui

  flip-api:
    platform: linux/x86_64
    # Pull the pre-built GHCR image by default (pull_policy: always); the local
    # src/ bind-mount below overlays it so live reload still runs your working
    # copy. `make up BUILD=true` rebuilds from the build: block instead.
    # flip-ui is intentionally NOT given an image/pull_policy — it has no GHCR
    # image (its workflow is a CI smoke test; prod serves it from S3/CloudFront).
    image: ${DOCKER_REGISTRY}flip-api:${DOCKER_TAG}
    pull_policy: always
    # Dev-on-pull: the GHCR image bakes uid 1000 (flip); run the pulled image as
    # the HOST uid so it can write the host-owned bind mounts (src/, ~/.aws).
    # Paired with the HOME/UV_* env below so it never writes the image-owned
    # .venv. No effect under BUILD=true (the image is already host-uid).
    user: "${UID}:${GID}"
    build:
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
      context: ../flip-api
      # fl-apps/ lives at the repo root, outside the flip-api build context. Pass it as a named
      # additional context so the Dockerfile can `COPY --from=fl_apps` the base FL templates into
      # the image (FLIP#724). Requires BuildKit (compose default).
      additional_contexts:
        fl_apps: ../fl-apps
      dockerfile: Dockerfile
      target: development
    ports:
      - "${API_PORT}:8000"
      - 5678:5678
    depends_on:
      - flip-db
    volumes:
      - ../flip-api/src/:/app/src/
      - ../flip-api/entrypoint.sh:/app/entrypoint.sh
      - ../flip-api/tests/:/app/tests/
      - ../flip-api/.vscode:/app/.vscode
      # Bind-mount the base FL app templates over the baked-in copy so template edits take effect
      # without a rebuild (the bundler reads them from FL_APP_BASE_DIR=/app/fl-apps). FLIP#724.
      - ../fl-apps/:/app/fl-apps/
      - ~/.aws/config:/home/${UNAME}/.aws/config:ro
      - ~/.aws/sso/cache:/home/${UNAME}/.aws/sso/cache:rw
    networks:
      - default
      - central-hub-trust-apis-network
      - shared-net-1
      - shared-net-2
    environment:
      - ENV=development
      # Dev-on-pull (see `user:` above): import flip_api via PYTHONPATH and skip
      # the runtime editable install (UV_NO_SYNC) so the host-uid process never
      # writes the image-owned .venv; keep uv's cache + HOME writable. HOME
      # matches the ~/.aws mount path below so boto3 still finds credentials.
      - HOME=/home/${UNAME}
      - UV_CACHE_DIR=/tmp/uv-cache
      - UV_NO_SYNC=1
      - PYTHONPATH=/app/src
      # Under user-mapping the host uid has no /etc/passwd entry, so libpq's
      # getpwuid fails and the entrypoint's `pg_isready` gate returns "no
      # attempt". PGUSER lets it skip the user lookup (it doesn't authenticate).
      - PGUSER=${POSTGRES_USER}
      # Disable the app-layer MFA gate for local dev so developers aren't
      # forced through TOTP enrolment on a burner authenticator app just
      # to click around. Stag/prod compose files don't pass this through;
      # Settings.ENFORCE_MFA defaults to True elsewhere. Flip to `true`
      # here (and `make restart`) to test the MFA flow end-to-end locally.
      - ENFORCE_MFA=false
      # Settings.LOG_LEVEL defaults to INFO so unknown environments emit
      # at INFO. Local dev defaults to DEBUG when LOG_LEVEL is unset
      # (override via LOG_LEVEL in .env.development) so debug-level
      # diagnostics are still visible during development.
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - DEBUG=${DEBUG}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}
      # Force boto3 to mint presigned URLs against the regional S3 endpoint
      # (e.g. s3.eu-west-2.amazonaws.com) instead of the legacy global one
      # (s3.amazonaws.com). DNS for a freshly created bucket in a non-us-east-1
      # region can take up to ~24h to propagate on the global endpoint — see
      # the matching note in compose.production.yml for the FLIP#24 incident
      # that surfaced this. Regional endpoints never have this lag and are
      # AWS's recommended path for non-us-east-1 buckets anyway.
      # See compose.production.yml for the `:?` rationale (load-bearing guard).
      - AWS_ENDPOINT_URL_S3=https://s3.${AWS_REGION:?AWS_REGION must be set in the env file}.amazonaws.com
      - AWS_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID}
      - AWS_COGNITO_APP_CLIENT_ID=${AWS_COGNITO_APP_CLIENT_ID}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - TRUST_API_KEY_HEADER=${TRUST_API_KEY_HEADER}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY_HASH=${INTERNAL_SERVICE_KEY_HASH}
      - AES_KEY_BASE64=${AES_KEY_BASE64}
      - AWS_SECRET_NAME=${AWS_SECRET_NAME}
      - AWS_SES_ADMIN_EMAIL_ADDRESS=${AWS_SES_ADMIN_EMAIL_ADDRESS}
      - AWS_SES_SENDER_EMAIL_ADDRESS=${AWS_SES_SENDER_EMAIL_ADDRESS}
      - UPLOADED_MODEL_FILES_BUCKET=${UPLOADED_MODEL_FILES_BUCKET}
      - SCANNED_MODEL_FILES_BUCKET=${SCANNED_MODEL_FILES_BUCKET}
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FL_APP_DESTINATION_BUCKET=${FL_APP_DESTINATION_BUCKET}
      - NET_ENDPOINTS=${NET_ENDPOINTS}
      - FL_BACKEND=${FL_BACKEND}
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD}
      - FL_KIT_SLOT_NAMES=${FL_KIT_SLOT_NAMES}
      # Hub-shared kit values — must be readable inside the container by
      # flip_api/scripts/register_trust.py::_hub_shared_from_env() so that
      # `make register-trusts` populates the per-trust kit file's managed
      # block instead of leaving `<run-make-sync-trust-kit>` placeholders.
      # Keep this list in lockstep with HUB_SHARED_ENV_KEYS in that script.
      # (AES_KEY_BASE64, TRUST_API_KEY_HEADER, FL_BACKEND and
      # UPLOADED_FEDERATED_DATA_BUCKET are passed above.)
      - CENTRAL_HUB_API_URL=${CENTRAL_HUB_API_URL}
      - FLOWER_KIT_DATE=${FLOWER_KIT_DATE}
      - FLARE_KIT_DATE=${FLARE_KIT_DATE}
      - DOCKER_TAG=${DOCKER_TAG}
      - DOCKER_REGISTRY=${DOCKER_REGISTRY}
      - DOCKER_FL_TAG=${DOCKER_FL_TAG}
      - DOCKER_FL_REGISTRY=${DOCKER_FL_REGISTRY}
      - DOCKER_FL_CLIENT_NAME=${DOCKER_FL_CLIENT_NAME}
      - NLB_SUBDOMAIN=${NLB_SUBDOMAIN}
      - FL_SERVER_PORT=${FL_SERVER_PORT}
      # MLflow dual-write (FLIP#745): flip-api pre-creates the tracking run at job
      # submit (tags + config.json params) over central-hub-network. Empty => the
      # integration is a no-op.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
    restart: unless-stopped
    container_name: flip-api

  flip-db:
    image: postgres:17
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - default
    container_name: flip-db

  #################### MLFLOW ####################

  # Experiment tracking + model registry (FLIP#745). Additive dual-write: flip-api
  # stays canonical for status + the metrics the UI shows; the fl-servers and
  # flip-api mirror runs/metrics/params here best-effort (never in the training
  # critical path — an absent or dead MLflow only costs warning logs).
  # Model weights are NOT stored here: registered model versions reference the
  # results zip in UPLOADED_FEDERATED_DATA_BUCKET by S3 URI (metadata only).
  mlflow:
    # Pin the server to the same minor as the mlflow-skinny client in
    # flip-utils/ and flip-api/ (keep them in lockstep when bumping).
    image: ghcr.io/mlflow/mlflow:v3.14.0
    # sqlite-on-volume backend store + local artifact volume: zero-touch dev spike
    # (the official image ships no postgres driver). Upgrade path before any
    # multi-writer/prod use: a `mlflow` database on flip-db (needs psycopg2, so a
    # small custom image) — see docs/source/sys-admin.rst.
    # --allowed-hosts: MLflow >=3.x rejects Host headers outside its allowlist
    # (DNS-rebinding protection, default = localhost + private IPs) with a 403.
    # Container-to-container calls carry Host "mlflow:5000", so the Docker DNS
    # name must be allowed explicitly alongside the host-browser loopback forms.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/data/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      # Loopback-only binding IS the dev access-control story: MLflow OSS ships no
      # real auth, so only hub admins on this host may reach the UI. The explicit
      # 127.0.0.1 is load-bearing — create-networks-centralhub creates the network
      # without a host_binding_ipv4 driver_opt, so an unqualified mapping would
      # publish on 0.0.0.0.
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow/data
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      # default (central-hub-network): flip-api + the admin browser reach it here.
      # mlflow-network: hub-only bridge shared with the fl-servers. NEVER attach
      # mlflow to shared-net-1/2 — trust fl-clients live there and MLflow has no
      # auth of its own; network placement is the security boundary.
      - default
      - mlflow-network
    restart: unless-stopped
    container_name: flip-mlflow

  #################### PGADMIN ####################

  pgadmin:
    image: dpage/pgadmin4:9
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - trust-network-1
      - trust-network-2
    container_name: flip-pgadmin

volumes:
  pgadmin_data:
  mlflow_data:
  mlflow_artifacts:

networks:
  default:
    external: true
    name: central-hub-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "central-hub-network"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

  # Shared network for trust-to-hub communication (outbound from trust only).
  # Trusts poll the hub for tasks and push results back — no inbound connections to trusts.
  central-hub-trust-apis-network:
    external: true
    name: central-hub-trust-apis-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "central-hub-trust-apis-network"
      com.docker.network.bridge.host_binding_ipv4: "127.10.0.1"

  trust-network-1:
    external: true
    name: deploy_trust-network-1
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "deploy_trust-network-1"
      com.docker.network.bridge.host_binding_ipv4: "127.20.0.1"

  trust-network-2:
    external: true
    name: deploy_trust-network-2
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "deploy_trust-network-2"
      com.docker.network.bridge.host_binding_ipv4: "127.30.0.1"

  shared-net-1:
    external: true
    name: deploy_shared-net-1
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "deploy_shared-net-1"
      com.docker.network.bridge.host_binding_ipv4: "127.40.0.1"

  shared-net-2:
    external: true
    name: deploy_shared-net-2
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "deploy_shared-net-2"
      com.docker.network.bridge.host_binding_ipv4: "127.50.0.1"

  # Hub-only bridge for the fl-server → MLflow dual-write. Deliberately distinct
  # from shared-net-1/2 (which the trust fl-clients join): MLflow OSS has no auth,
  # so keeping trust-side containers off this network is the security boundary.
  mlflow-network:
    external: true
    name: central-hub-mlflow-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "central-hub-mlflow-network"
      com.docker.network.bridge.host_binding_ipv4: "127.60.0.1"
