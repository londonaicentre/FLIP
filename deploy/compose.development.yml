# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

# No service here sets `container_name`. Container names are left to the compose project
# (`-p $(COMPOSE_PROJECT)` — see deploy/instance.mk), which yields `deploy-flip-api-1` on the
# default stack and `<instance>-deploy-flip-api-1` on a second one, so a parallel dev stack
# (FLIP#957) needs no per-service naming at all. `container_name` is incompatible with a
# project prefix anyway: it is a global, project-independent name, so two stacks sharing one
# would collide outright.
#
# Nothing in the stack addresses these containers by name. Service-to-service traffic resolves
# through the compose SERVICE name, which docker registers as a network alias on every network
# the container joins and which is identical in both stacks — so the FL kits (`fed_client.json`
# targets `fl-server-net-1:8002`, the SuperLink cert SAN is `DNS:fl-server-net-1`) and
# NET_ENDPOINTS keep working untouched. That makes the service KEYS below load-bearing: renaming
# one breaks TLS and the kits, whereas the container names are free to change.
services:
  #################### CENTRAL HUB ####################

  flip-ui:
    build:
      args:
        UI_PORT: ${UI_PORT}
      context: ../flip-ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT}:443"
    volumes:
      - ../flip-ui:/app
      - /app/node_modules
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache
    environment:
      # flip-ui reads config at runtime from window.js, which is generated
      # from these canonical names by scripts/generate-window-js.sh (via
      # the predev npm hook). No VITE_AWS_* duplication — those were
      # dropped so the build, dev, and deploy paths all consume the same
      # env vars as the rest of the stack.
      - NODE_ENV=${NODE_ENV}
      - VITE_LOCAL=${VITE_LOCAL}
      - CENTRAL_HUB_API_URL=${CENTRAL_HUB_API_URL}
      - AWS_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID}
      - AWS_COGNITO_APP_CLIENT_ID=${AWS_COGNITO_APP_CLIENT_ID}
      - AWS_REGION=${AWS_REGION}
      - BLACKLISTED_MODEL_FILES=${BLACKLISTED_MODEL_FILES}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    restart: unless-stopped
    networks:
      - default

  flip-api:
    platform: linux/x86_64
    # Pull the pre-built GHCR image by default (pull_policy: always); the local
    # src/ bind-mount below overlays it so live reload still runs your working
    # copy. `make up BUILD=true` rebuilds from the build: block instead.
    # flip-ui is intentionally NOT given an image/pull_policy — it has no GHCR
    # image (its workflow is a CI smoke test; prod serves it from S3/CloudFront).
    image: ${DOCKER_REGISTRY}flip-api:${DOCKER_TAG}
    pull_policy: always
    # Dev-on-pull: the GHCR image bakes uid 1000 (flip); run the pulled image as
    # the HOST uid so it can write the host-owned bind mounts (src/, ~/.aws).
    # Paired with the HOME/UV_* env below so it never writes the image-owned
    # .venv. No effect under BUILD=true (the image is already host-uid).
    user: "${UID}:${GID}"
    build:
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
      context: ../flip-api
      # fl-apps/ lives at the repo root, outside the flip-api build context. Pass it as a named
      # additional context so the Dockerfile can `COPY --from=fl_apps` the base FL templates into
      # the image (FLIP#724). Requires BuildKit (compose default).
      additional_contexts:
        fl_apps: ../fl-apps
      dockerfile: Dockerfile
      target: development
    ports:
      - "${API_PORT}:8000"
      # Bound to loopback: an open debugpy port is arbitrary code execution for
      # anyone who can reach it, and docker's iptables rules sit ahead of most host
      # firewalls. This was the intent behind the network driver_opts added with the
      # debugger in nhsflame#311, which never applied because the networks are
      # external — compose ignores driver options there (FLIP#959).
      - 127.0.0.1:${API_DEBUG_PORT:-5678}:5678
    depends_on:
      - flip-db
    volumes:
      - ../flip-api/src/:/app/src/
      - ../flip-api/entrypoint.sh:/app/entrypoint.sh
      - ../flip-api/tests/:/app/tests/
      - ../flip-api/.vscode:/app/.vscode
      # Bind-mount the base FL app templates over the baked-in copy so template edits take effect
      # without a rebuild (the bundler reads them from FL_APP_BASE_DIR=/app/fl-apps). FLIP#724.
      - ../fl-apps/:/app/fl-apps/
      - ~/.aws/config:/home/${UNAME}/.aws/config:ro
      - ~/.aws/sso/cache:/home/${UNAME}/.aws/sso/cache:rw
    # Deliberately NOT on `fl-net-*`: flip-api fronts the database and holds the hub's
    # credentials, and nothing on the FL data plane calls it. The traffic that looks like
    # it needs this is the fl-server → flip-api callback, and fl-server reaches it over
    # `default` (the hub-internal network) instead — see the FL overlays. A trust's
    # fl-client carries no hub URL and no hub credential, only TRUST_INTERNAL_SERVICE_KEY,
    # so putting flip-api on the FL nets only widened the reachable surface, and did so
    # further than production, where clients reach the hub VPC on the FL port alone.
    networks:
      - default
      - central-hub-trust-apis-network
    environment:
      - ENV=development
      # Dev-on-pull (see `user:` above): import flip_api via PYTHONPATH and skip
      # the runtime editable install (UV_NO_SYNC) so the host-uid process never
      # writes the image-owned .venv; keep uv's cache + HOME writable. HOME
      # matches the ~/.aws mount path below so boto3 still finds credentials.
      - HOME=/home/${UNAME}
      - UV_CACHE_DIR=/tmp/uv-cache
      - UV_NO_SYNC=1
      - PYTHONPATH=/app/src
      # Under user-mapping the host uid has no /etc/passwd entry, so libpq's
      # getpwuid fails and the entrypoint's `pg_isready` gate returns "no
      # attempt". PGUSER lets it skip the user lookup (it doesn't authenticate).
      - PGUSER=${POSTGRES_USER}
      # Disable the app-layer MFA gate for local dev so developers aren't
      # forced through TOTP enrolment on a burner authenticator app just
      # to click around. Stag/prod compose files don't pass this through;
      # Settings.ENFORCE_MFA defaults to True elsewhere. Flip to `true`
      # here (and `make restart`) to test the MFA flow end-to-end locally.
      - ENFORCE_MFA=false
      # Settings.LOG_LEVEL defaults to INFO so unknown environments emit
      # at INFO. Local dev defaults to DEBUG when LOG_LEVEL is unset
      # (override via LOG_LEVEL in .env.development) so debug-level
      # diagnostics are still visible during development.
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - DEBUG=${DEBUG}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}
      # Force boto3 to mint presigned URLs against the regional S3 endpoint
      # (e.g. s3.eu-west-2.amazonaws.com) instead of the legacy global one
      # (s3.amazonaws.com). DNS for a freshly created bucket in a non-us-east-1
      # region can take up to ~24h to propagate on the global endpoint — see
      # the matching note in compose.production.yml for the FLIP#24 incident
      # that surfaced this. Regional endpoints never have this lag and are
      # AWS's recommended path for non-us-east-1 buckets anyway.
      # See compose.production.yml for the `:?` rationale (load-bearing guard).
      - AWS_ENDPOINT_URL_S3=https://s3.${AWS_REGION:?AWS_REGION must be set in the env file}.amazonaws.com
      - AWS_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID}
      - AWS_COGNITO_APP_CLIENT_ID=${AWS_COGNITO_APP_CLIENT_ID}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      # The port flip-db listens on inside the docker network, not the published one.
      # Fixed at 5432 by the postgres image, so it is a literal here rather than
      # ${DB_PORT} — in dev DB_PORT is the *host* port (see the flip-db ports below),
      # and reusing it here would point flip-api, and wait-for-postgres.sh, at a port
      # nothing is listening on as soon as a second stack moved it (FLIP#957).
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - TRUST_API_KEY_HEADER=${TRUST_API_KEY_HEADER}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY_HASH=${INTERNAL_SERVICE_KEY_HASH}
      - AES_KEY_BASE64=${AES_KEY_BASE64}
      - AWS_SECRET_NAME=${AWS_SECRET_NAME}
      - AWS_SES_ADMIN_EMAIL_ADDRESS=${AWS_SES_ADMIN_EMAIL_ADDRESS}
      - AWS_SES_SENDER_EMAIL_ADDRESS=${AWS_SES_SENDER_EMAIL_ADDRESS}
      - UPLOADED_MODEL_FILES_BUCKET=${UPLOADED_MODEL_FILES_BUCKET}
      - SCANNED_MODEL_FILES_BUCKET=${SCANNED_MODEL_FILES_BUCKET}
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FL_APP_DESTINATION_BUCKET=${FL_APP_DESTINATION_BUCKET}
      - NET_ENDPOINTS=${NET_ENDPOINTS}
      - FL_BACKEND=${FL_BACKEND}
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD}
      - FL_KIT_SLOT_NAMES=${FL_KIT_SLOT_NAMES}
      # Hub-shared kit values — must be readable inside the container by
      # flip_api/scripts/register_trust.py::_hub_shared_from_env() so that
      # `make register-trusts` populates the per-trust kit file's managed
      # block instead of leaving `<run-make-sync-trust-kit>` placeholders.
      # Keep this list in lockstep with HUB_SHARED_ENV_KEYS in that script.
      # (AES_KEY_BASE64, TRUST_API_KEY_HEADER, FL_BACKEND and
      # UPLOADED_FEDERATED_DATA_BUCKET are passed above.)
      - CENTRAL_HUB_API_URL=${CENTRAL_HUB_API_URL}
      - FLOWER_KIT_DATE=${FLOWER_KIT_DATE}
      - FLARE_KIT_DATE=${FLARE_KIT_DATE}
      - DOCKER_TAG=${DOCKER_TAG}
      - DOCKER_REGISTRY=${DOCKER_REGISTRY}
      - DOCKER_FL_TAG=${DOCKER_FL_TAG}
      - DOCKER_FL_REGISTRY=${DOCKER_FL_REGISTRY}
      - DOCKER_FL_CLIENT_NAME=${DOCKER_FL_CLIENT_NAME}
      - NLB_SUBDOMAIN=${NLB_SUBDOMAIN}
      - FL_SERVER_PORT=${FL_SERVER_PORT}
      # MLflow dual-write (FLIP#745): flip-api pre-creates the tracking run at job
      # submit (tags + config.json params) over central-hub-network. Empty => the
      # integration is a no-op.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: unless-stopped

  flip-db:
    image: postgres:17
    ports:
      # DB_PORT is the host port; the container side is fixed at 5432 by the postgres
      # image, exactly as uvicorn is fixed at 8000 behind ${API_PORT}.
      #
      # This was previously ${DB_PORT}:${DB_PORT}, one variable meaning two different
      # things, which made a second stack impossible: raising it to free the host port
      # pointed flip-api at a port nothing was listening on, and leaving it pinned
      # failed outright with "Bind for 0.0.0.0:5432 failed: port is already allocated"
      # (FLIP#957).
      - ${DB_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    networks:
      - default

  #################### MLFLOW ####################

  # Experiment tracking + model registry (FLIP#745). Additive dual-write: flip-api
  # stays canonical for status + the metrics the UI shows; the fl-servers and
  # flip-api mirror runs/metrics/params here best-effort (never in the training
  # critical path — an absent or dead MLflow only costs warning logs).
  # Model weights are NOT stored here: registered model versions reference the
  # results zip in UPLOADED_FEDERATED_DATA_BUCKET by S3 URI (metadata only).
  mlflow:
    # Pin the server to the same minor as the mlflow-skinny client in
    # flip-utils/ and flip-api/ (keep them in lockstep when bumping).
    image: ghcr.io/mlflow/mlflow:v3.14.0
    # sqlite-on-volume backend store + local artifact volume: zero-touch dev spike
    # (the official image ships no postgres driver). Upgrade path before any
    # multi-writer/prod use: a `mlflow` database on flip-db (needs psycopg2, so a
    # small custom image) — see docs/source/sys-admin.rst.
    # --allowed-hosts: MLflow >=3.x rejects Host headers outside its allowlist
    # (DNS-rebinding protection, default = localhost + private IPs) with a 403.
    # Container-to-container calls carry Host "mlflow:5000", so the Docker DNS
    # name must be allowed explicitly alongside the host-browser loopback forms.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/data/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      # Loopback-only binding IS the dev access-control story: MLflow OSS ships no
      # real auth, so only hub admins on this host may reach the UI. The explicit
      # 127.0.0.1 is load-bearing — create-networks-centralhub creates the network
      # without a host_binding_ipv4 driver_opt, so an unqualified mapping would
      # publish on 0.0.0.0.
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow/data
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      # `default` is the hub-internal network, and it is the whole access-control
      # story: MLflow OSS has no auth, so network placement is the boundary. Every
      # writer is already here (flip-api, both fl-servers) and no trust container
      # is — a trust is its own compose project and only declares its own network,
      # central-hub-trust-apis-network and fl-net-1/2. NEVER attach mlflow to
      # fl-net-1/2: that is where the trust fl-clients live.
      - default
    restart: unless-stopped

  #################### PGADMIN ####################

  pgadmin:
    image: dpage/pgadmin4:9
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    # pgadmin (dev-only; not in the production compose) starts as root and drops
    # to the pgadmin user via sudo in its entrypoint. That is incompatible with
    # no-new-privileges + cap_drop:ALL (sudo can't run, the setuid drop fails and
    # the container crash-loops with exit 126). Left unhardened intentionally — it
    # is never deployed to stag/prod.
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - trust-network-1
      - trust-network-2

volumes:
  pgadmin_data:
  mlflow_data:
  mlflow_artifacts:

# Every network here is created outside compose by `make create-networks` —
# trust-network-* as swarm overlays (`--driver overlay --attachable`) because the
# XNAT stack attaches to them via `docker stack deploy`, the rest as plain bridges.
# They are therefore `external: true` and compose only looks them up by name.
#
# These blocks used to also carry `driver: bridge` and `driver_opts` pinning a
# per-network bridge name plus a distinct host_binding_ipv4 (127.0.0.1, .10.0.1,
# .20.0.1, .30.0.1, .40.0.1, .50.0.1). None of it has ever applied: compose ignores
# driver options for external networks, and `create-networks` passes no `-o`, so
# every network reports `opts=map[]` and published ports bind to 0.0.0.0. The
# `driver: bridge` was additionally wrong for trust-network-*, which are overlay.
# Removed rather than left standing as a description of behaviour that does not
# happen. If loopback-only binding is wanted, it belongs on the `docker network
# create` calls in `create-networks` as `-o`, not here (FLIP#959).
#
# All six real names follow one rule: `${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_<name>`. The
# `deploy_` names the hub compose project that owns the network — which is also exactly what
# compose would generate (`<project>_<key>`) if it still created them. It stopped generating
# anything once they became `external: true` ("the name field is used as is and is not scoped
# with the project name"), so the prefix has to be spelled out here; `central-hub-network` and
# `central-hub-trust-apis-network` were the two left bare when the rest were written out, and
# now match (FLIP#957).
#
# The two numbering axes are NOT parallel, which is the trap the `fl-net-<N>` name exists to
# defuse: `fl-net-<N>` is numbered by **FL net** (`net-1`/`net-2` — the `fl_nets` table,
# NET_NUMBER, `fl-server-net-<N>`), while `trust-network-<N>` is numbered by **trust slot**.
# One trust can sit on `trust-network-2` and `fl-net-1` at the same time, and does today. The
# earlier name for these, `shared-net-<N>`, described who was attached rather than what the
# network is for — and stopped being true once flip-api came off them (see below).
networks:
  default:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_central-hub-network

  # Shared network for trust-to-hub communication (outbound from trust only).
  # Trusts poll the hub for tasks and push results back — no inbound connections to trusts.
  central-hub-trust-apis-network:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_central-hub-trust-apis-network

  trust-network-1:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_trust-network-1

  trust-network-2:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_trust-network-2

  # The FL data plane, one per FL net. Membership is exactly two services: the hub's
  # `fl-server-net-<N>` and every trust's `fl-client-net-<N>`. It is the FL twin of
  # `central-hub-trust-apis-network` (flip-api ↔ trust-api) — one hub service meeting one
  # trust service, and nothing else crossing.
  #
  # Everything else hub-side stays on `default`: `flip-api`, `fl-api-net-<N>` and flower's
  # one-shot `register-supernode-keys-net-<N>` all reach the FL server there, on its control
  # ports (`9093`/`9097` for flower, the admin port for nvflare) rather than the client-facing
  # Fleet port. Keep it that way. Putting any of them back here would hand every trust's
  # fl-client a route to a hub service it has no business reaching — wider than the documented
  # model (an fl-client holds no hub URL and no hub credential, only TRUST_INTERNAL_SERVICE_KEY)
  # and wider than production, where a trust reaches the hub VPC on the FL port alone.
  fl-net-1:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_fl-net-1

  fl-net-2:
    external: true
    name: ${FLIP_INSTANCE:+$FLIP_INSTANCE-}deploy_fl-net-2
