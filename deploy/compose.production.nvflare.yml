# ROLE (FLIP#936): NVFLARE overlay of the local prod-image harness (see the note in
# compose.production.yml) — not a deployment target. The canonical production FL task definitions live in
# deploy/providers/AWS/ecs_tasks.tf, which mirror THIS overlay (NVFLARE); Flower has no ECS resources
# (FLIP#566).

# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:
  #################### CENTRAL HUB FL ####################

  fl-api-net-1:
    container_name: flip-fl-api-net-1
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    environment:
      - FL_ADMIN_DIRECTORY=${FL_ADMIN_DIRECTORY}
      # Shared volume where the FL API stages a de-bundled eval checkpoint (mirrors Flower's /app/src).
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      # Per-job GPU request written into meta.json resource_spec by configure_meta. Default 0 =>
      # empty resource_spec => NVFLARE hides the GPU from the training worker (CPU). Set >0 (with
      # mem <= the client's advertised mem_per_gpu_in_GiB) so jobs train on the GPU.
      - JOB_RESOURCE_SPEC_NUM_GPUS=${JOB_RESOURCE_SPEC_NUM_GPUS:-0}
      - JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB=${JOB_RESOURCE_SPEC_MEM_PER_GPU_IN_GIB:-0}
    ports:
      - "${FL_API_PORT}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      # Provisioned NVFLARE admin secrets (certificates, fed_admin.json)
      - /opt/flip/services/flip-fl-api-net-1/local:/app/admin/local
      - /opt/flip/services/flip-fl-api-net-1/startup:/app/admin/startup
      # Shared with fl-server-net-1: the FL API writes de-bundled eval checkpoints here; the
      # fl-server reads them from disk. The checkpoint is never bundled into the NVFLARE job,
      # so it is never deployed to clients (mirrors the Flower backend's /app/src mount).
      - ${FL_JOBS_DIR}/net-1:/app/server-checkpoints
    depends_on:
      - fl-server-net-1
    restart: unless-stopped

  # TODO add second FL network when needed
  # fl-api-net-2:
  #   container_name: flip-fl-api-net-2
  #   image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
  #   environment:
  #     - FL_ADMIN_DIRECTORY=${FL_ADMIN_DIRECTORY}
  #   volumes:
  #     # Provisioned NVFLARE admin secrets (certificates, fed_admin.json)
  #     - /opt/flip/services/flip-fl-api-net-2/local:/app/admin/local
  #     - /opt/flip/services/flip-fl-api-net-2/startup:/app/admin/startup
  #   depends_on:
  #     - fl-server-net-2
  #   restart: unless-stopped

  fl-server-net-1:
    container_name: fl-server-net-1
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    volumes:
      # Provisioned NVFLARE secrets (certificates, fed_server.json)
      - /opt/flip/services/fl-server-net-1/local:/app/local
      - /opt/flip/services/fl-server-net-1/startup:/app/startup
      - /opt/flip/services/fl-server-net-1/transfer:/app/transfer
      # Shared with fl-api-net-1: de-bundled eval checkpoints staged by the FL API are read
      # from here by the fl-server. The checkpoint is never in the NVFLARE job, so it is never
      # deployed to clients (mirrors the Flower backend's /app/src mount). If the fl-server runs
      # as a separate ECS task in cloud prod, this needs a shared EFS mount (same as Flower).
      - ${FL_JOBS_DIR}/net-1:/app/server-checkpoints
    ports:
      - "${FL_SERVER_PORT}:8002"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # The container runs as root, but the provisioned NVFLARE kit under
      # /opt/flip/services is bind-mounted with 0600 keys owned by the provisioning
      # uid. cap_drop: ALL strips root's implicit DAC bypass, so DAC_OVERRIDE is
      # needed to read keys it does not own; the entrypoint also chmods kit scripts
      # it does not own (FOWNER). Without these the container crash-loops (FLIP#485).
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - NET_ID=net-1
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - SERVER_CHECKPOINT_ROOT=/app/server-checkpoints
      # - AWS_PROFILE=${AWS_PROFILE} # in production, AWS credentials are retrieved from the instance role
    restart: unless-stopped
    init: true

  # TODO add second FL network when needed
  # fl-server-net-2:
  #   container_name: fl-server-net-2
  #   image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
  #   volumes:
