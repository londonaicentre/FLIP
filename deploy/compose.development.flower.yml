# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

# No `container_name` here either — see the header of compose.development.yml. The service KEYS
# are load-bearing and must not be renamed: `fl-server-net-<N>` is the SAN in the SuperLink's
# provisioned TLS certificate (`DNS:fl-server-net-1`), so a SuperNode's certificate check fails
# outright if that name stops resolving, and `fl-api-net-<N>` is what NET_ENDPOINTS and
# FL_API_ADDRESS below dial.
#
# The trusts' SuperNodes reach `fl-server-net-<N>` on `fl-net-<N>`, and there that name is the
# fleet proxy's (`fl-fleet-proxy-net-<N>`, FLIP#1517), not the SuperLink's: flwr>=1.40 serves
# Control, Fleet and Runtime on one port, so the SuperLink stays off `fl-net-<N>` and the proxy
# forwards the Fleet API alone. Hub-side, on `default`, the name is still the SuperLink.
services:
  #################### CENTRAL HUB FL ####################

  fl-api-net-1:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      - ${FL_JOBS_DIR}/net-1:/app/src
    environment:
      - DEBUG=${DEBUG}
      - SUPERLINK_ADDRESS=fl-server-net-1:8000
      # Origin allow-list for the server-side bundle fetch (FLIP#905, #1291): the only origin the
      # FL API may download an app bundle from — the dev object store flip-api presigns bundle
      # URLs against (AWS_ENDPOINT_URL_S3 in its service block; path-style URLs, host exactly
      # object-store:9000). The two lines must move together, or every bundle download 400s.
      - BUNDLE_URL_ALLOWED_ORIGINS=http://object-store:9000
      - SUPERLINK_HEALTH_ADDRESS=fl-server-net-1:9097
      - SUPERLINK_ROOT_CERTIFICATES=/certs/ca.crt
      - FLOWER_SRC_ROOT=/app/src
    ports:
      - "${FL_API_PORT}:8000"
      # Loopback-only — an exposed debugpy port is arbitrary code execution for anyone
      # who can reach it; see compose.development.yml's flip-api ports (FLIP#959).
      - "127.0.0.1:${FL_API_DEBUG_PORT:-5679}:5679"
    depends_on:
      - fl-server-net-1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fl-api-net-2:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      - ${FL_JOBS_DIR}/net-2:/app/src
    environment:
      - DEBUG=${DEBUG}
      - SUPERLINK_ADDRESS=fl-server-net-2:8000
      # Bundle-fetch origin allow-list: the dev object store, like fl-api-net-1 (FLIP#905, #1291).
      - BUNDLE_URL_ALLOWED_ORIGINS=http://object-store:9000
      - SUPERLINK_HEALTH_ADDRESS=fl-server-net-2:9097
      - SUPERLINK_ROOT_CERTIFICATES=/certs/ca.crt
      - FLOWER_SRC_ROOT=/app/src
    depends_on:
      - fl-server-net-2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fl-server-net-1:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    # Dev-only: run as the host user rather than root (FLIP#1320). The image user
    # (app, uid 49999) cannot read the host-provisioned 0640 TLS keys; root can, but
    # a root SuperLink rewrites every host-owned file it touches as root:root, which
    # is how the operator's AWS SSO token used to end up unreadable to their own CLI.
    # That particular mount has since gone (results go to the dev object store with
    # static keys, FLIP#1291), but the hazard applies to any host-owned bind mount,
    # and matching flip-api (FLIP#1171) is the honest fix. The uid is the host's, so
    # the provisioned keys and the bundle dir shared with flip-api are readable and
    # writable; the gid stays the image's, so the rest of the image tree is readable
    # as it is for the baked user.
    # Prod uses an ECS task IAM role and sets no `user:` at all, so this is confined
    # to the dev compose.
    user: "${UID:-1000}:49999"
    # Second route to the 0640 provisioned keys: the host group that owns them, for a
    # kit provisioned under a different uid from the one running the stack. Same
    # pattern as the NVFLARE dev compose and the trust Flower client.
    group_add: ["${DOCKER_GID:?DOCKER_GID must be the host user's gid; make up exports it}"]
    volumes:
      # Provisioned Flower secrets (only certificates are needed here)
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      # Shared with FL API: uploaded app bundles (sources + checkpoint) live under
      # /app/src/<model_id>; the evaluation ServerApp reads the checkpoint from
      # the path in the flip-job-dir run-config value the FL API injects at submit.
      - ${FL_JOBS_DIR}/net-1:/app/src
    environment:
      - NET_ID=net-1
      # The overridden uid has no /etc/passwd entry, so pwd.getpwuid() raises and the
      # image's own HOME (`/app`, baked into flwr/base) is all that is left: the
      # SuperLink's ~/.flwr cache and the ServerApp's torch caches then fail far from
      # the cause (FLIP#1171). /tmp rather than the image user's /app on purpose: /app
      # is owned by app:app 0755 (and pip has already put /app/.cache there at build
      # time), so the host uid cannot write it on any SuperLink image, including every
      # one published before FLIP#1320. /tmp is 1777 in every image, which keeps this
      # working without a rebuild or a re-pull.
      - HOME=/tmp
      - USER=app
      - LOGNAME=app
      # Same reason, for the other path the apps write: the SuperLink runs the ServerApp
      # as a subprocess (`--isolation subprocess` is the default), so it inherits this
      # uid, and the app templates default WORKING_DIR to /app/runs, which this uid
      # cannot create. Left unset, every run finishes its rounds and then dies at
      # `output_dir.mkdir()` with PermissionError, having saved and uploaded nothing
      # while the hub model stays RUNNING (FLIP#1320).
      - WORKING_DIR=/tmp/runs
      # The ServerApp runs in the image's environment, as on the ECS SuperLink: a cold
      # per-run `uv sync` outlives Flower's task heartbeat and the run never starts (FLIP#1418).
      - FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION=1
      - LOCAL_DEV=false
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      # Results go to the dev object store (FLIP#1291) with its static keys — generic AWS
      # env is right here, the fl-server has no other AWS use. Same variables as the store.
      - AWS_ENDPOINT_URL_S3=http://object-store:9000
      - AWS_ACCESS_KEY_ID=${OBJECT_STORE_ACCESS_KEY:-flip-dev}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORE_SECRET_KEY:-flip-dev-object-store}  # pragma: allowlist secret
      - AWS_DEFAULT_REGION=${AWS_REGION:?AWS_REGION must be set in the env file}
    depends_on:
      # The store must serve before the first results upload (FLIP#1291).
      object-store:
        condition: service_healthy
    command:
      - --ssl-ca-certfile
      - /certs/ca.crt
      - --ssl-certfile
      - /certs/server.pem
      - --ssl-keyfile
      - /certs/server.key
      - --enable-supernode-auth
      # Every SuperLink API is on 8000 (see the header); loopback-only unless --host says
      # otherwise. Reached over `default`; the host port below is on loopback only.
      - --host
      - 0.0.0.0
      - --health-server-address
      - 0.0.0.0:9097
    ports:
      - "127.0.0.1:${FLOWER_SUPERLINK_NET_1_PORT:-9093}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No cap_add. CHOWN and DAC_OVERRIDE were what let the root SuperLink read the
    # host-owned 0640 TLS key under cap_drop: ALL (FLIP#485); now that it runs as the
    # host user they would be inert anyway, since Docker gives effective capabilities
    # only to uid 0. Reading the key is the `user:` and `group_add:` above doing it
    # through the file's own owner and group, which is the least-privileged route
    # (FLIP#1320).
    # `default` is the hub-internal network. fl-server is the one FL service that calls back
    # into flip-api (FLIP_API_INTERNAL_URL + INTERNAL_SERVICE_KEY above), and flip-api is
    # deliberately not on the FL net — see the networks block in compose.development.yml.
    # Not on `fl-net-1` either (FLIP#1517): its port 8000 is the Control and Runtime API too.
    networks:
      default:
        # The fleet proxy's upstream: on `fl-net-1` the proxy itself answers to fl-server-net-1.
        aliases:
          - fl-superlink-net-1
    restart: unless-stopped
    init: true

  # The trusts' only route to the net-1 SuperLink (see the header and fleet-proxy/), on the
  # address and port the kits already dial. No capabilities: the host group reads the key.
  fl-fleet-proxy-net-1:
    image: ${DOCKER_FL_REGISTRY}flower-fleet-proxy:${DOCKER_FL_TAG}
    group_add: ["${DOCKER_GID:-1000}"]
    volumes:
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
    environment:
      - FLEET_PROXY_UPSTREAM=fl-superlink-net-1:8000
      - FLEET_PROXY_UPSTREAM_TLS_NAME=fl-server-net-1
    depends_on:
      - fl-server-net-1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      default: {}
      fl-net-1:
        aliases:
          - fl-server-net-1
    restart: unless-stopped

  # One-shot service to register SuperNode public keys with the SuperLink
  register-supernode-keys-net-1:
    # It doesn't really matter if we use FL server or FL base image here since register-supernode-keys.sh is in both
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    environment:
      - SUPERLINK_ADDRESS=fl-server-net-1:8000
      # Service name (`fl-api-net-1`), which is the only name that resolves: with no
      # container_name the container is named by the compose project, and the old
      # `flip-fl-api-net-1` spelling is not a DNS name in any stack. Getting this wrong
      # fails SILENTLY — register-supernode-keys.sh swallows the DNS error and still exits
      # 0, leaving SuperNode keys unlabelled and FL metrics attributed to unknown_client
      # (FLIP#957).
      - FL_API_ADDRESS=http://fl-api-net-1:8000
      # The script reads ${TRUST_NAMES} as a label list, but the underlying identity it's
      # labelling is the per-slot SuperNode key — one entry per provisioned slot. Feed
      # FL_KIT_SLOT_NAMES through so trusts admin-created later (and bound to a slot via
      # FLKitSlot.assigned_to_trust_id) still get their node_id mapped on net startup.
      - TRUST_NAMES=${FL_KIT_SLOT_NAMES}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      - ${FL_PROVISIONED_DIR}/net-1/keys:/keys:ro
      # Dev-overlay: edits to the register-supernode-keys.sh script apply without a rebuild.
      # In-tree at fl-services/flower/ (#622); also baked into the image, so removal still works.
      # Pathed off FL_JOBS_DIR (abs /repo/jobs) since FL_PROVISIONED_DIR now lives under deploy/.
      - ${FL_JOBS_DIR}/../fl-services/flower/register-supernode-keys.sh:/scripts/register-supernode-keys.sh:ro
    entrypoint: ["/bin/bash", "/scripts/register-supernode-keys.sh"]
    depends_on:
      fl-server-net-1:
        condition: service_started
      fl-api-net-1:
        condition: service_healthy
    networks:
      - default

  fl-server-net-2:
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    # Dev-only: run as the host user rather than root, and take the host gid as a
    # second route to the 0640 provisioned keys. Rationale in full on fl-server-net-1
    # above (FLIP#1320).
    user: "${UID:-1000}:49999"
    group_add: ["${DOCKER_GID:?DOCKER_GID must be the host user's gid; make up exports it}"]
    volumes:
      # Provisioned Flower secrets (only certificates are needed here)
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      # Shared with FL API: uploaded app bundles (sources + checkpoint) live under
      # /app/src/<model_id>; the evaluation ServerApp reads the checkpoint from
      # the path in the flip-job-dir run-config value the FL API injects at submit.
      - ${FL_JOBS_DIR}/net-2:/app/src
    environment:
      - NET_ID=net-2
      # Same HOME and WORKING_DIR rationale as fl-server-net-1 above.
      - HOME=/tmp
      - USER=app
      - LOGNAME=app
      - WORKING_DIR=/tmp/runs
      # The ServerApp runs in the image's environment, as on the ECS SuperLink: a cold
      # per-run `uv sync` outlives Flower's task heartbeat and the run never starts (FLIP#1418).
      - FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION=1
      - LOCAL_DEV=false
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      # Results go to the dev object store (FLIP#1291) with its static keys — generic AWS
      # env is right here, the fl-server has no other AWS use. Same variables as the store.
      - AWS_ENDPOINT_URL_S3=http://object-store:9000
      - AWS_ACCESS_KEY_ID=${OBJECT_STORE_ACCESS_KEY:-flip-dev}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORE_SECRET_KEY:-flip-dev-object-store}  # pragma: allowlist secret
      - AWS_DEFAULT_REGION=${AWS_REGION:?AWS_REGION must be set in the env file}
    depends_on:
      # The store must serve before the first results upload (FLIP#1291).
      object-store:
        condition: service_healthy
    command:
      - --ssl-ca-certfile
      - /certs/ca.crt
      - --ssl-certfile
      - /certs/server.pem
      - --ssl-keyfile
      - /certs/server.key
      - --enable-supernode-auth
      # Every SuperLink API is on 8000 (see the header); loopback-only unless --host says
      # otherwise. Reached over `default`; the host port below is on loopback only.
      - --host
      - 0.0.0.0
      - --health-server-address
      - 0.0.0.0:9097
    ports:
      - "127.0.0.1:${FLOWER_SUPERLINK_NET_2_PORT:-9095}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No cap_add, for the reasons spelled out on fl-server-net-1 above (FLIP#1320).
    # `default` is the hub-internal network — see fl-server-net-1 above, and for why not `fl-net-2`.
    networks:
      default:
        aliases:
          - fl-superlink-net-2
    restart: unless-stopped
    init: true

  # The trusts' only route to the net-2 SuperLink — see fl-fleet-proxy-net-1 above.
  fl-fleet-proxy-net-2:
    image: ${DOCKER_FL_REGISTRY}flower-fleet-proxy:${DOCKER_FL_TAG}
    group_add: ["${DOCKER_GID:-1000}"]
    volumes:
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
    environment:
      - FLEET_PROXY_UPSTREAM=fl-superlink-net-2:8000
      - FLEET_PROXY_UPSTREAM_TLS_NAME=fl-server-net-2
    depends_on:
      - fl-server-net-2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      default: {}
      fl-net-2:
        aliases:
          - fl-server-net-2
    restart: unless-stopped

  # One-shot service to register SuperNode public keys with the SuperLink
  register-supernode-keys-net-2:
    # It doesn't really matter if we use FL server or FL base image here since register-supernode-keys.sh is in both
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    environment:
      - SUPERLINK_ADDRESS=fl-server-net-2:8000
      # Service name — see net-1 above.
      - FL_API_ADDRESS=http://fl-api-net-2:8000
      # See net-1 above — feed FL_KIT_SLOT_NAMES so all provisioned slots get labelled.
      - TRUST_NAMES=${FL_KIT_SLOT_NAMES}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      - ${FL_PROVISIONED_DIR}/net-2/keys:/keys:ro
      # See net-1 above — symmetric dev-overlay (was missing the flower/ path segment).
      - ${FL_JOBS_DIR}/../fl-services/flower/register-supernode-keys.sh:/scripts/register-supernode-keys.sh:ro
    entrypoint: ["/bin/bash", "/scripts/register-supernode-keys.sh"]
    depends_on:
      fl-server-net-2:
        condition: service_started
      fl-api-net-2:
        condition: service_healthy
    networks:
      - default
