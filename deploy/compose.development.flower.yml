# NOTE Important: any sections specified in base configs will be overridden if you specify the same sections in the
# inheriting service configs below

services:
  #################### CENTRAL HUB FL ####################

  fl-api-net-1:
    container_name: flip-fl-api-net-1
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      - ${FL_JOBS_DIR}/net-1:/app/src
    environment:
      - DEBUG=${DEBUG}
      - SUPERLINK_ADDRESS=fl-server-net-1:9093
      - SUPERLINK_HEALTH_ADDRESS=fl-server-net-1:9097
      - SUPERLINK_ROOT_CERTIFICATES=/certs/ca.crt
      - FLOWER_SRC_ROOT=/app/src
    ports:
      - "${FL_API_PORT}:8000"
      - "5679:5679"
    depends_on:
      - fl-server-net-1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    networks:
      - default
      - shared-net-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fl-api-net-2:
    container_name: flip-fl-api-net-2
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_API_NAME}:${DOCKER_FL_TAG}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      - ${FL_JOBS_DIR}/net-2:/app/src
    environment:
      - DEBUG=${DEBUG}
      - SUPERLINK_ADDRESS=fl-server-net-2:9093
      - SUPERLINK_HEALTH_ADDRESS=fl-server-net-2:9097
      - SUPERLINK_ROOT_CERTIFICATES=/certs/ca.crt
      - FLOWER_SRC_ROOT=/app/src
    depends_on:
      - fl-server-net-2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    networks:
      - default
      - shared-net-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fl-server-net-1:
    container_name: fl-server-net-1
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    # Dev-only: run as root so the server can read BOTH the host-provisioned
    # 0640 TLS keys AND the host operator's AWS SSO cache. The app user (uid
    # 49999) can't read the cache: `aws sso login` writes the token file 0600,
    # and group_add can't grant read on a 0600 file. The NVFLARE dev fl-server
    # instead mounts the cache under the non-root user's own HOME (GHSA-8465;
    # see deploy/compose.development.nvflare.yml) rather than running as root
    # — that approach doesn't apply here because it's the 0640 TLS keys, not
    # just the SSO cache, that need the override. Prod uses an ECS task IAM
    # role (no mounted creds), so this root override is confined to dev compose.
    user: "0:0"
    volumes:
      # Mount the host AWS credentials (needed to upload model results to S3). The image
      # pins HOME=/app (kept even under the root override), so boto3 looks under /app/.aws/.
      # Running as root with DAC_OVERRIDE (granted below — cap_drop: ALL strips root's
      # implicit DAC bypass), it reads the 0640 key + 0600 SSO token there.
      # sso/cache is rw so boto3 can refresh the cached token in place.
      - ~/.aws/config:/app/.aws/config:ro
      - ~/.aws/sso/cache:/app/.aws/sso/cache:rw
      # Provisioned Flower secrets (only certificates are needed here)
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      # Shared with FL API: uploaded app bundles (sources + checkpoint) live under
      # /app/src/<model_id>; the evaluation ServerApp reads the checkpoint from
      # the path in the flip-job-dir run-config value the FL API injects at submit.
      - ${FL_JOBS_DIR}/net-1:/app/src
    environment:
      - NET_ID=net-1
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - AWS_PROFILE=${AWS_PROFILE}
      # MLflow dual-write (FLIP#745): the flip package mirrors metrics/status to
      # MLflow over the hub-only mlflow-network below. Empty => sink disabled.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
    command:
      - --ssl-ca-certfile
      - /certs/ca.crt
      - --ssl-certfile
      - /certs/server.pem
      - --ssl-keyfile
      - /certs/server.key
      - --enable-supernode-auth
      - --health-server-address
      - 0.0.0.0:9097
    ports:
      - 9093:9093
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # The root override above still needs DAC_OVERRIDE under cap_drop: ALL to read
      # the host-owned 0640 TLS key and 0600 SSO token cache — root's implicit DAC
      # bypass is itself a capability, and it is dropped here (FLIP#485).
      - DAC_OVERRIDE
    networks:
      - shared-net-1
      # Hub-only bridge to the mlflow container — NOT shared with trust fl-clients.
      - mlflow-network
    restart: unless-stopped
    init: true

  # One-shot service to register SuperNode public keys with the SuperLink
  register-supernode-keys-net-1:
    container_name: register-supernode-keys-net-1
    # It doesn't really matter if we use FL server or FL base image here since register-supernode-keys.sh is in both
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    environment:
      - SUPERLINK_ADDRESS=fl-server-net-1:9093
      - FL_API_ADDRESS=http://flip-fl-api-net-1:8000
      # The script reads ${TRUST_NAMES} as a label list, but the underlying identity it's
      # labelling is the per-slot SuperNode key — one entry per provisioned slot. Feed
      # FL_KIT_SLOT_NAMES through so trusts admin-created later (and bound to a slot via
      # FLKitSlot.assigned_to_trust_id) still get their node_id mapped on net startup.
      - TRUST_NAMES=${FL_KIT_SLOT_NAMES}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-1/certificates:/certs:ro
      - ${FL_PROVISIONED_DIR}/net-1/keys:/keys:ro
      # Dev-overlay: edits to the register-supernode-keys.sh script apply without a rebuild.
      # In-tree at fl-services/flower/ (#622); also baked into the image, so removal still works.
      # Pathed off FL_JOBS_DIR (abs /repo/jobs) since FL_PROVISIONED_DIR now lives under deploy/.
      - ${FL_JOBS_DIR}/../fl-services/flower/register-supernode-keys.sh:/scripts/register-supernode-keys.sh:ro
    entrypoint: ["/bin/bash", "/scripts/register-supernode-keys.sh"]
    depends_on:
      fl-server-net-1:
        condition: service_started
      fl-api-net-1:
        condition: service_healthy
    networks:
      - shared-net-1

  fl-server-net-2:
    container_name: fl-server-net-2
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    # Dev-only: run as root so the server can read BOTH the host-provisioned
    # 0640 TLS keys AND the host operator's AWS SSO cache. The app user (uid
    # 49999) can't read the cache: `aws sso login` writes the token file 0600,
    # and group_add can't grant read on a 0600 file. The NVFLARE dev fl-server
    # instead mounts the cache under the non-root user's own HOME (GHSA-8465;
    # see deploy/compose.development.nvflare.yml) rather than running as root
    # — that approach doesn't apply here because it's the 0640 TLS keys, not
    # just the SSO cache, that need the override. Prod uses an ECS task IAM
    # role (no mounted creds), so this root override is confined to dev compose.
    user: "0:0"
    volumes:
      # Mount the host AWS credentials (needed to upload model results to S3). The image
      # pins HOME=/app (kept even under the root override), so boto3 looks under /app/.aws/.
      # Running as root with DAC_OVERRIDE (granted below — cap_drop: ALL strips root's
      # implicit DAC bypass), it reads the 0640 key + 0600 SSO token there.
      # sso/cache is rw so boto3 can refresh the cached token in place.
      - ~/.aws/config:/app/.aws/config:ro
      - ~/.aws/sso/cache:/app/.aws/sso/cache:rw
      # Provisioned Flower secrets (only certificates are needed here)
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      # Shared with FL API: uploaded app bundles (sources + checkpoint) live under
      # /app/src/<model_id>; the evaluation ServerApp reads the checkpoint from
      # the path in the flip-job-dir run-config value the FL API injects at submit.
      - ${FL_JOBS_DIR}/net-2:/app/src
    environment:
      - NET_ID=net-2
      - LOCAL_DEV=false
      - MIN_CLIENTS=${MIN_CLIENTS}
      - IMAGES_DIR=/app/data/images
      - UPLOADED_FEDERATED_DATA_BUCKET=${UPLOADED_FEDERATED_DATA_BUCKET}
      - FLIP_API_INTERNAL_URL=${FLIP_API_INTERNAL_URL}
      - INTERNAL_SERVICE_KEY_HEADER=${INTERNAL_SERVICE_KEY_HEADER}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - AWS_PROFILE=${AWS_PROFILE}
      # MLflow dual-write (FLIP#745): see fl-server-net-1.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
    command:
      - --ssl-ca-certfile
      - /certs/ca.crt
      - --ssl-certfile
      - /certs/server.pem
      - --ssl-keyfile
      - /certs/server.key
      - --enable-supernode-auth
      - --health-server-address
      - 0.0.0.0:9097
    ports:
      - 9095:9093
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # The root override above still needs DAC_OVERRIDE under cap_drop: ALL to read
      # the host-owned 0640 TLS key and 0600 SSO token cache — root's implicit DAC
      # bypass is itself a capability, and it is dropped here (FLIP#485).
      - DAC_OVERRIDE
    networks:
      - shared-net-2
      # Hub-only bridge to the mlflow container — NOT shared with trust fl-clients.
      - mlflow-network
    restart: unless-stopped
    init: true

  # One-shot service to register SuperNode public keys with the SuperLink
  register-supernode-keys-net-2:
    container_name: register-supernode-keys-net-2
    # It doesn't really matter if we use FL server or FL base image here since register-supernode-keys.sh is in both
    image: ${DOCKER_FL_REGISTRY}${DOCKER_FL_SERVER_NAME}:${DOCKER_FL_TAG}
    environment:
      - SUPERLINK_ADDRESS=fl-server-net-2:9093
      - FL_API_ADDRESS=http://flip-fl-api-net-2:8000
      # See net-1 above — feed FL_KIT_SLOT_NAMES so all provisioned slots get labelled.
      - TRUST_NAMES=${FL_KIT_SLOT_NAMES}
    volumes:
      - ${FL_PROVISIONED_DIR}/net-2/certificates:/certs:ro
      - ${FL_PROVISIONED_DIR}/net-2/keys:/keys:ro
      # See net-1 above — symmetric dev-overlay (was missing the flower/ path segment).
      - ${FL_JOBS_DIR}/../fl-services/flower/register-supernode-keys.sh:/scripts/register-supernode-keys.sh:ro
    entrypoint: ["/bin/bash", "/scripts/register-supernode-keys.sh"]
    depends_on:
      fl-server-net-2:
        condition: service_started
      fl-api-net-2:
        condition: service_healthy
    networks:
      - shared-net-2
