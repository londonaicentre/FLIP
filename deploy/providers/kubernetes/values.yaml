      limits:
        memory: "512Mi"
        cpu: "200m"
    # adminPassword is supplied via secrets.data.grafana-admin-password

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler configuration
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---------------------------------------------------------------------------
# Network policies — zero inbound trust model
# ---------------------------------------------------------------------------
networkPolicies:
  enabled: true
  # When true, allows ingress from kube-system namespace (kubelet health checks,
  # metrics scraping). Set to true if your CNI requires explicit carve-outs for
  # kubelet probes or cluster-internal monitoring.
  allowKubeSystemIngress: false
  # CIDRs allowed for all-ports egress (in addition to intra-namespace)
  allowedEgressCIDRs: []
  #   - 10.0.0.0/8
  # CIDRs allowed for egress on a specific port, e.g. fl-server gRPC (port 8002)
  # Each entry: cidrs (list of CIDR strings) + port (int) + optional protocol (default TCP)
  allowedEgressCIDRsWithPorts: []
  # - cidrs:
  #     - 13.43.208.193/32
  #     - 13.43.162.56/32
  #   port: 8002
  # Egress rules to allow (defaults include DNS/HTTP/HTTPS)
  allowedEgressPorts:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
