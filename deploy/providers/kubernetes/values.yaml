# ---------------------------------------------------------------------------
# XNAT — Neuroimaging platform (multi-component)
# ---------------------------------------------------------------------------
xnat:
  enabled: true
  initJob:
    enabled: true
  web:
    enabled: true
    adminUser: "admin"
    # DICOM SCP (Service Class Provider) configuration
    # XNAT listens as AE 'XNAT' on this port to receive C-STORE requests
    dicomAet: XNAT
    dicomPort: 8104
    image:
      repository: ghcr.io/londonaicentre/xnat-web
      tag: stag
      pullPolicy: Always
    service:
      port: 8080
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: ""
      size: 100Gi
      accessMode: ReadWriteOnce
    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "4Gi"
        cpu: "2"
    probes:
      liveness:
        initialDelaySeconds: 120
        periodSeconds: 20
        timeoutSeconds: 10
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
    plugins:
      enabled: true
      image: python:3.12-slim
      # These URLs are the single source of the plugin roster: the download
      # init-container derives each jar's filename from the URL, so a version
      # bump is a one-line change here. Keep them in step with the Swarm roster
      # baked by trust/xnat/xnat/Dockerfile — the chart mounts an emptyDir over
      # ${XNAT_HOME}/plugins, so these downloads REPLACE the image's plugins
      # rather than adding to them, and the XNAT_VERSION compatibility matrices
      # apply to whatever is listed here.
      # XNAT 1.10.0 requires DQR 3.0.0 and Container Service 3.8.x:
      #   https://wiki.xnat.org/xnat-tools/dqr-plugin-compatibility-matrix
      #   https://wiki.xnat.org/container-service/container-service-compatibility-matrix
      urls:
        container-service: "https://github.com/NrgXnat/container-service/releases/download/3.8.1/container-service-3.8.1-fat.jar"
        dicom-query-retrieve: "https://api.bitbucket.org/2.0/repositories/xnatdev/dicom-query-retrieve/downloads/dicom-query-retrieve-3.0.0-xpl.jar"
        batch-launch: "https://api.bitbucket.org/2.0/repositories/xnatx/xnatx-batch-launch-plugin/downloads/batch-launch-0.9.0-xpl.jar"
        ohif-viewer: "https://xnat.org/files/ohif-viewer-xnat-plugin/ohif-viewer-3.7.2.jar"
    env:
      XNAT_EMAIL: ""
      XNAT_MIN_HEAP: "1024m"
      XNAT_MAX_HEAP: "3072m"
  db:
    enabled: true
    datasourceUsername: "xnat"
    image:
      repository: ghcr.io/londonaicentre/xnat-db
      tag: stag
      pullPolicy: Always
    service:
      port: 5432
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: ""
      size: 20Gi
      accessMode: ReadWriteOnce
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  nginx:
    enabled: true
    image:
      repository: ghcr.io/londonaicentre/xnat-nginx
      tag: stag
      pullPolicy: Always
    service:
      port: 80
      type: ClusterIP
    probes:
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

