# ---------------------------------------------------------------------------
# Global trust-wide configuration
# ---------------------------------------------------------------------------
trustName: "Trust_1"
trustNumber: 1
environment: production
logLevel: INFO

# AWS region for S3 bucket access (used by FL client init container and other AWS-integrated services)
awsRegion: "eu-west-2"

# S3 bucket for uploaded federated data (mounted by FL client)
uploadedFederatedDataBucket: ""

# FL backend selection — switches image, command, volumes, env for the FL client
# Supported values: "nvflare" | "flower"
flBackend: "nvflare"

# Global image pull secrets (optional — for private registries)
imagePullSecrets: []
#   - name: my-registry-credentials

# Whether to create the namespace as part of the chart install
namespace:
  create: false
  name: ""

# ---------------------------------------------------------------------------
# Pod Security & container hardening (FLIP#530)
# ---------------------------------------------------------------------------
# Pod Security Standards labels applied to the chart-created namespace. Defaults
# are non-breaking: enforce `baseline` (which the stateful images satisfy) while
# `restricted` is surfaced via warn/audit so violations show up without blocking.
# Tighten `enforce` to `restricted` once the stateful services (xnat/orthanc/
# postgres) gain fsGroup/chown init containers — see README "Known Limitations".
podSecurity:
  enabled: true
  enforce: baseline
  warn: restricted
  audit: restricted

# Container-level securityContext applied to the stateless services (the API
# pods + fl-client). The defaults are safe for any
# image — they do NOT require a non-root image. runAsNonRoot and
# readOnlyRootFilesystem are intentionally left unset because they depend on the
# image; enable them per-deployment once validated against the image.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# Secrets management
# ---------------------------------------------------------------------------
# When secrets.create is true, the chart creates a Secret with the keys listed
# in the template. The operator must provide the values (e.g. via --set or a
# separate secrets file). When false, the operator must create the Secret
# externally before installing the chart.
secrets:
  create: false
  # Name of the existing Secret (when secrets.create=false)
  existingName: "flip-trust-secrets"
  # Key-value pairs for the Secret (when secrets.create=true)
  # These should be provided via --set or a separate values file, not checked in.
  data:
    aes-key-base64: ""
    trust-api-key: ""
    trust-internal-service-key-header: ""
    trust-internal-service-key: ""
    omop-postgres-password: ""
    data-access-postgres-password: ""
    # REQUIRED when orthanc.enabled — JSON user map, e.g. {"admin": "<password>"}.
    # Left empty, templates/secrets.yaml omits the key and the orthanc pod fails
    # with CreateContainerConfigError (fail-loud by design, FLIP-PT-091) — never
    # weaken this with a dummy default. Populated from the ORTHANC_REGISTERED_USERS
    # env var by scripts/generate_values.py.
    orthanc-registered-users: ""
    xnat-admin-user: ""
    xnat-admin-password: ""
    xnat-service-user: ""
    xnat-service-password: ""
    xnat-datasource-password: ""
    xnat-datasource-admin-password: ""
    grafana-admin-password: ""
    s3-access-key-id: ""
    s3-secret-access-key: ""
    # Only for temporary AWS credentials (SSO/STS); leave empty for long-lived keys.
    aws-session-token: ""

# ---------------------------------------------------------------------------
# trust-api — API gateway, polls Central Hub for tasks, orchestrates trust
# ---------------------------------------------------------------------------
trustApi:
  enabled: true
  image:
    repository: ghcr.io/londonaicentre/trust-api
    tag: stag
    pullPolicy: Always
  replicas: 1
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - trust-api
            topologyKey: kubernetes.io/hostname
  env:
    CENTRAL_HUB_API_URL: ""
    # HTTP header the hub reads the per-trust API key from. Must match the hub's
    # TRUST_API_KEY_HEADER; the platform default (.env.development.example, the
    # prod/dev compose, and register_trust's Hub-shared block) is "Authorization".
    # A mismatch makes the hub answer 401 "API key is missing".
    TRUST_API_KEY_HEADER: "Authorization"  # pragma: allowlist secret
    POLL_INTERVAL_SECONDS: "5"
    # Internal service URLs (short names resolve via K8s DNS in same namespace)

# ---------------------------------------------------------------------------
# imaging-api — DICOM image retrieval from PACS / XNAT
# ---------------------------------------------------------------------------
imagingApi:
  enabled: true
  image:
    repository: ghcr.io/londonaicentre/imaging-api
    tag: stag
    pullPolicy: Always
  replicas: 1
  command:
    - "uv"
    - "run"
    - "python"
    - "-m"
    - "uvicorn"
    - "imaging_api.main:app"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - imaging-api
            topologyKey: kubernetes.io/hostname
  env:
    XNAT_URL: "http://xnat-web:8080"
    # DICOM SCP receiver port — NOT the web port. DQR import requests are
    # queued with destination AE "XNAT:{XNAT_PORT}"; XNAT only dequeues them
    # if a DICOM SCP receiver with that exact AE:port exists (8104, matching
    # the xnat-web Service dicom-scp port and the Orthanc modality config).
    XNAT_PORT: "8104"
    PACS_ID: "1"
    # Topology only — no password here (FLIP-PT-056): imaging-api splices in the
    # xnat-datasource-password secret at startup (see templates/imaging-api.yaml).
    XNAT_DATABASE_URL: "postgresql+asyncpg://xnat@xnat-db:5432/xnat"
    DATA_ACCESS_API_URL: "http://data-access-api:8000"
    BASE_IMAGES_DOWNLOAD_DIR: "/app/data/images"

# ---------------------------------------------------------------------------
# data-access-api — OMOP database queries for cohort analysis
# ---------------------------------------------------------------------------
dataAccessApi:
  enabled: true
  image:
    repository: ghcr.io/londonaicentre/data-access-api
    tag: stag
    pullPolicy: Always
  replicas: 1
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - data-access-api
            topologyKey: kubernetes.io/hostname
  env:
    OMOP_DB_SERVICE_NAME: "omop-db"
    OMOP_POSTGRES_DB: "trustomopdb"
    DATA_ACCESS_POSTGRES_USER: "data_analyst_reader"

# ---------------------------------------------------------------------------
# Shared images PVC — used by imaging-api and fl-client to share downloaded
# DICOM images
# ---------------------------------------------------------------------------
sharedImagesPvc:
  enabled: false
  storageClassName: ""
  size: 100Gi
  accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------
# FL client — federated learning participant
# ---------------------------------------------------------------------------
flClient:
  enabled: true
  netId: "net-1"
  s3EndpointOverride: ""
  imagesDir: /app/data/images
  hostAliases:
    - ip: "13.43.162.56"
      hostnames:
        - "fl-server-net-1"
  image:
    repository: ghcr.io/londonaicentre
    tag: stag
    pullPolicy: Always
  nvflare:
    # Fetching the kit from S3 requires this trust to hold credentials into the
    # AI Centre's account, which is at odds with the platform's own boundary —
    # FL clients deliberately carry no Central Hub credentials, and a cloud
    # credential is the same category of secret (FLIP#922). Kits are therefore
    # delivered OUT OF BAND for production, exactly as the on-prem flow already
    # does (`make -C deploy/providers/AWS package-onprem-trust-kit`): stage the
    # kit on the node and point flClient.kitHostPath at it. Turn this on only as
    # a dev convenience, and only against a bucket the cluster should be able to
    # read.
    kitFromS3:
      enabled: false
      # S3 bucket holding the FL participant kits (the AI Centre bucket,
      # AICENTRE_BUCKET_NAME). Required, but deployment-specific — supply it via
      # the kit override (`make sync-kit` writes it from the kit file). Empty here
      # so the chart stays env-agnostic; an empty bucket crash-loops the kit-init.
      bucket: ""
      kitDate: "20260318"
      # pathTemplate's trailing segment is the FL kit SLOT the hub assigned
      # (FL_KIT_SLOT, e.g. Trust_2) — not the cosmetic trustName. `make sync-kit`
      # pins it to the slot in the generated override. The trustName default below
      # only works when trustName == the slot.
      pathTemplate: "fl-flare-participant-kits/{{ .Values.flClient.nvflare.kitFromS3.kitDate }}/net-1/services/{{ .Values.trustName }}"
  flower:
    # Fetching the kit from S3 requires this trust to hold credentials into the
    # AI Centre's account, which is at odds with the platform's own boundary —
    # FL clients deliberately carry no Central Hub credentials, and a cloud
    # credential is the same category of secret (FLIP#922). Kits are therefore
    # delivered OUT OF BAND for production, exactly as the on-prem flow already
    # does (`make -C deploy/providers/AWS package-onprem-trust-kit`): stage the
    # kit on the node and point flClient.kitHostPath at it. Turn this on only as
    # a dev convenience, and only against a bucket the cluster should be able to
    # read.
    kitFromS3:
      enabled: false
      # See the nvflare note above — supply via the kit override (`make sync-kit`).
      bucket: ""
      kitDate: "20260401"
      pathTemplate: "fl-flower-participant-kits/{{ .Values.flClient.flower.kitFromS3.kitDate }}/net-1"
    superlink: ""
    supernodeClientAppIoAddress: "127.0.0.1:9094"
  resources:
    requests:
      memory: "8Gi"
      cpu: "4"
    limits:
      memory: "32Gi"
      cpu: "16"
  shmSize: 8Gi
  gpu:
    enabled: false
    count: 0
    operator:
      # Set to true to enable GPU operator validation resources
      enabled: false
  probes:
    liveness:
      port: 9094
      initialDelaySeconds: 60
      periodSeconds: 30
    readiness:
      port: 9094
      initialDelaySeconds: 30
      periodSeconds: 15
  serviceAccount:
    annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/fl-client-s3-access
  sidecar:
    enabled: false

# ---------------------------------------------------------------------------
# omop-db — Mocked OMOP patient database (PostgreSQL)
# ---------------------------------------------------------------------------
omopDb:
  enabled: true
  external:
    host: ""
    port: 5432
  image:
    repository: ghcr.io/londonaicentre/omop-db
    # Tracks the develop build like every other service in this file. The tag is
    # load-bearing here, not cosmetic: the vocab-load Job below runs the image's
    # own /flip/omop/load_core_vocab.sh, which only exists in CI-published
    # (vocab-free, FLIP#842) images.
    tag: stag
    pullPolicy: Always
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  credentials:
    user: postgres
    # password is supplied via secrets.data.omop-postgres-password
  # Streams the licensed core vocabulary into the running database after
  # install/upgrade (the published image and pgdata tarballs are vocab-free —
  # FLIP#842/843).
  #
  # The bundle CANNOT be publicly mirrored (SNOMED CT / LOINC / Read v2 / dm+d
  # licences — see trust/omop-db/README.md), so unlike initJob there is no
  # credential-free fallback. The Job therefore runs only when s3Bucket names a
  # bucket this cluster can read; left empty, the release installs cleanly with
  # NO vocabulary loaded.
  #
  # ⚠️  With no vocabulary the stack looks healthy but cohort queries that join
  # omop.concept return nothing. Either set s3Bucket, or load the bundle by hand
  # (chart README → "OMOP core vocabulary").
  #
  # Use YOUR environment's own bucket — trust roles have no cross-account read
  # on another environment's bucket. `make -C deploy/providers/kubernetes
  # sync-kit KIT=<CODE> PROD=<env>` writes this from the kit's
  # AICENTRE_BUCKET_NAME, so check that the kit carries the right one (it is not
  # a hub-managed key — a kit scaffolded from trust/.env.example ships the dev
  # bucket).
  #
  # AWS *credentials* are deliberately shared with initJob (initJob.awsProfile /
  # initJob.hostAwsMount) — one place to configure auth, not two. Note the
  # AWS_PROFILE/region env vars only reach this Job when initJob.hostAwsMount is
  # enabled; on EKS it relies on IRSA. The bucket itself is a separate key per
  # job, and sync-kit sets only this one.
  #
  # enabled: false is only for keeping an in-cluster omop-db while loading the
  # vocabulary by hand — an external database (omopDb.enabled: false) already
  # skips this Job.
  vocabLoad:
    enabled: true
    s3Bucket: ""
    bundleName: "vocab_aicentre_core_20240916"
    # Scratch space for the downloaded bundle. Must hold the zip and its unpacked
    # contents at the same time — for the 20240916 bundle that is ~3.6 GiB
    # unpacked plus a ~600 MiB zip, so a peak near 4.2 GiB (both figures are in
    # trust/omop-db/README.md, "The core vocabulary bundle"). The kubelet
    # enforces this on the emptyDir directly; keep the pod's ephemeral-storage
    # ceiling (below) above it, so that this limit is what bounds the work dir
    # rather than the pod being evicted before it has finished filling it.
    workDirSize: 10Gi
    # The fetch initContainer downloads the zip and stops there — unpacking is
    # the loader's, because unzip is in the omop-db image and not in the aws-cli
    # one. Its request is small for that reason, though the pod's request is set
    # by loadResources either way (see the max rule below); the zip itself lands
    # in the emptyDir, which is charged to the pod and never to this container —
    # a container's own ephemeral-storage accounting covers only its writable
    # layer and logs.
    fetchResources:
      requests:
        cpu: "250m"
        memory: 512Mi
        ephemeral-storage: 2Gi
      limits:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 12Gi
    # Shared by the probe and the loader. The work dir itself is bounded by
    # workDirSize above, which the kubelet enforces on the emptyDir directly and
    # independently of anything here. What the ephemeral-storage REQUEST buys is
    # scheduling and eviction ranking: emptyDir usage counts against the pod, and
    # the kubelet ranks eviction on usage OVER request, so a pod that requested
    # nothing is picked first under node disk pressure — and an evicted run
    # restarts from zero. Sized for the loader, which briefly holds the zip and
    # its unpacked contents at once. The probe over-requests harmlessly: an
    # ordinary init container's resources are taken as a max against the regular
    # containers' total, never added to it (a restartable init container — a
    # sidecar — WOULD be added, so do not convert the probe into one without
    # revisiting these numbers).
    #
    # Limits follow that same max rule, not a sum: the pod's ceiling here is
    # max(12Gi regular, 12Gi per init) = 12Gi, above workDirSize. Do not read it
    # as 3 x 12Gi — setting all three to 4Gi on a sum reading would give a real
    # ceiling of 4Gi and evict the pod less than halfway through the work dir.
    loadResources:
      requests:
        cpu: "100m"
        memory: 256Mi
        ephemeral-storage: 6Gi
      limits:
        cpu: "500m"
        memory: 512Mi
        ephemeral-storage: 12Gi
  initJob:
    enabled: true
    s3Bucket: ""
    # Archive file name. When empty, derived from trust name + dataVersion:
    #   {trustName}_pgdata_{dataVersion}.tar.gz
    # Override to point at a different archive (e.g. reuse Trust_2's data):
    #   archiveName: "trust2_pgdata_20260729.tar.gz"
    archiveName: ""
    dataVersion: "20260729"
    # AWS profile to use for S3 authentication (uses SSO cached credentials)
    awsProfile: "default"
    # Mount host's ~/.aws directory for SSO-based S3 authentication
    # Enabled for local K8s clusters; disable for EKS (use IRSA instead)
    hostAwsMount:
      enabled: false
    # Path to an AWS config directory ON THE NODE (a hostPath, not your
    # workstation). On a single-node k3s/on-prem cluster the node IS the
    # workstation, so this is $HOME/.aws. On kind the node is a container, so
    # the cluster must be created with an extraMount mapping ~/.aws to this
    # path. Deliberately empty: Helm templates cannot read $HOME, and a
    # hardcoded personal path only ever works on one machine. Required when
    # enabled — the render fails rather than emitting an empty hostPath.
      hostPath: ""
      readOnly: true

