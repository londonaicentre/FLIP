{{- if and .Values.xnat.enabled .Values.xnat.web.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
data:
  XNAT_HOME: /data/xnat/home
  XNAT_ADMIN_USER: {{ .Values.xnat.web.adminUser | quote }}
  XNAT_PORT: "8080"
  XNAT_DATASOURCE_DRIVER: "org.postgresql.Driver"
  XNAT_DATASOURCE_NAME: "xnat"
  XNAT_DATASOURCE_USERNAME: {{ .Values.xnat.db.datasourceUsername | quote }}
  XNAT_DATASOURCE_URL: "jdbc:postgresql://xnat-db:5432/xnat"
  XNAT_ACTIVEMQ_URL: ""
  XNAT_SMTP_ENABLED: "false"
  XNAT_EMAIL: {{ .Values.xnat.web.env.XNAT_EMAIL | quote }}
  XNAT_MIN_HEAP: {{ .Values.xnat.web.env.XNAT_MIN_HEAP | quote }}
  XNAT_MAX_HEAP: {{ .Values.xnat.web.env.XNAT_MAX_HEAP | quote }}
  CATALINA_OPTS: "-Xms{{ .Values.xnat.web.env.XNAT_MIN_HEAP }} -Xmx{{ .Values.xnat.web.env.XNAT_MAX_HEAP }} -Dxnat.home=/data/xnat/home -XX:+UseG1GC -Djava.awt.headless=true"
  PACS_DICOM_PORT: "4242"
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
spec:
  type: {{ .Values.xnat.web.service.type }}
  ports:
    - port: {{ .Values.xnat.web.service.port }}
      targetPort: tomcat
      protocol: TCP
      name: tomcat
    - port: {{ .Values.xnat.web.dicomPort | default 8104 }}
      targetPort: {{ .Values.xnat.web.dicomPort | default 8104 }}
      protocol: TCP
      name: dicom-scp
      {{- if and .Values.xnat.web.dicomNodePort (eq .Values.xnat.web.service.type "NodePort") }}
      # Pinned so the PACS has a stable destination port. Without this Kubernetes allocates one at
      # random, and the C-MOVE destination XNAT advertises would not match what the PACS can reach.
      nodePort: {{ .Values.xnat.web.dicomNodePort }}
      {{- end }}
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-web
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-web
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "flip-trust.fullname" . }}-xnat-web
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-xnat-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z xnat-db 5432; do
                echo "Waiting for xnat-db:5432..."
                sleep 3
              done
              echo "xnat-db is ready."
{{- if and .Values.xnat.web.plugins.enabled }}
        - name: download-plugins
          image: "{{ .Values.xnat.web.plugins.image }}"
          command:
            - python3
            - -c
            - |
              import urllib.parse, urllib.request, os
              # Each jar's filename is derived from its URL so the version lives
              # in exactly one place (values.yaml xnat.web.plugins.urls).
              urls = [
              {{- range $name, $url := .Values.xnat.web.plugins.urls }}
                  {{ $url | quote }},
              {{- end }}
              ]
              os.makedirs("/plugins", exist_ok=True)
              for url in urls:
                  name = os.path.basename(urllib.parse.urlsplit(url).path)
                  if not name.endswith(".jar"):
                      raise SystemExit("Plugin URL does not end in a .jar filename: " + url)
                  dest = os.path.join("/plugins", name)
                  print("Downloading " + name + "...")
                  urllib.request.urlretrieve(url, dest)
                  sz = os.path.getsize(dest)
                  print("  Done: " + str(sz // 1024 // 1024) + " MB")
              print("All plugins downloaded successfully!")
          volumeMounts:
            - name: plugins
              mountPath: /plugins
{{- end }}
      containers:
        - name: tomcat
          image: "{{ .Values.xnat.web.image.repository }}:{{ .Values.xnat.web.image.tag }}"
          imagePullPolicy: {{ .Values.xnat.web.image.pullPolicy }}
          ports:
            - name: tomcat
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-xnat-web
          env:
            - name: XNAT_ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
            - name: XNAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
            - name: XNAT_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-user
            - name: XNAT_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-password
            - name: XNAT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
          volumeMounts:
            - name: data
              mountPath: /data/xnat/home/logs
              subPath: logs
            - name: data
              mountPath: /data/xnat/archive
              subPath: archive
            - name: data
              mountPath: /data/xnat/build
              subPath: build
            - name: data
              mountPath: /data/xnat/cache
              subPath: cache
            - name: data
              mountPath: /data/xnat/prearchive
              subPath: prearchive
            - name: plugins
              mountPath: /data/xnat/home/plugins
          livenessProbe:
            httpGet:
              path: /xnat/
              port: tomcat
            initialDelaySeconds: {{ .Values.xnat.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.web.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.web.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /xnat/
              port: tomcat
            initialDelaySeconds: {{ .Values.xnat.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.xnat.web.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.xnat.web.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.xnat.web.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "flip-trust.fullname" . }}-xnat-web
        - name: plugins
          emptyDir: {}
{{- if .Values.xnat.web.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-web
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-web
spec:
  accessModes:
    - {{ .Values.xnat.web.persistence.accessMode }}
  {{- if .Values.xnat.web.persistence.storageClassName }}
  storageClassName: {{ .Values.xnat.web.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.xnat.web.persistence.size }}
{{- end }}
{{- end }}
