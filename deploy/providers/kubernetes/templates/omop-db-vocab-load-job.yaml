# The published omop-db image and pgdata tarballs are vocab-free (FLIP#842/843):
# this Job streams the licensed core vocabulary bundle into the running database
# after install/upgrade, using the image's own loader (which skips tables that
# already hold the core vocabulary, so re-runs are cheap no-ops). Not applicable
# when the trust brings an external OMOP database.
#
# Gated on s3Bucket as well as enabled — deliberately UNLIKE the sibling
# omop-db-init-job, which renders unconditionally because it can fall back to an
# anonymous Hugging Face download when its bucket is empty. The licensed bundle
# has no such mirror, so with no bucket there is nothing this Job could do: no
# bucket ⇒ no Job ⇒ the release installs cleanly (a failed Helm hook fails the
# WHOLE release). NOTES.txt announces the skip so it is not silent.
{{- if and .Values.omopDb.enabled .Values.omopDb.vocabLoad.enabled .Values.omopDb.vocabLoad.s3Bucket }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-omop-vocab-load
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-vocab-load
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # No `hook-succeeded`, unlike omop-db-init-job: the failure mode of a missing
    # vocabulary is silence (cohort queries return nothing), so the completed Job
    # is the operator's evidence that the load ran and what it skipped. Exactly
    # one lingers — the next upgrade replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: omop-vocab-load
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fetch-bundle
          image: amazon/aws-cli:2.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              BUNDLE="{{ .Values.omopDb.vocabLoad.bundleName }}"
              if [ -d "/vocab-work/${BUNDLE}" ]; then
                echo "Bundle already fetched. Skipping."
                exit 0
              fi
              microdnf install -y unzip 2>/dev/null || yum install -y unzip 2>/dev/null
              aws s3 cp "s3://{{ .Values.omopDb.vocabLoad.s3Bucket }}/vocab/${BUNDLE}.zip" /vocab-work/bundle.zip
              unzip -q /vocab-work/bundle.zip -d "/vocab-work/${BUNDLE}"
              rm -f /vocab-work/bundle.zip
          {{- if .Values.omopDb.initJob.hostAwsMount.enabled }}
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ default "eu-west-2" .Values.awsRegion | quote }}
            - name: AWS_PROFILE
              value: {{ .Values.omopDb.initJob.awsProfile | quote }}
          {{- end }}
          volumeMounts:
            - name: vocab-work
              mountPath: /vocab-work
            {{- if .Values.omopDb.initJob.hostAwsMount.enabled }}
            - name: host-aws
              mountPath: /root/.aws
              readOnly: true
            {{- end }}
      containers:
        - name: load-vocab
          image: "{{ .Values.omopDb.image.repository }}:{{ .Values.omopDb.image.tag }}"
          imagePullPolicy: {{ .Values.omopDb.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              attempts=0
              until pg_isready -h "${OMOP_DB_HOST}" -p "${OMOP_DB_PORT}" > /dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "${attempts}" -ge 60 ]; then
                  echo "omop-db not reachable after ${attempts} attempts" >&2
                  exit 1
                fi
                sleep 5
              done
              /flip/omop/load_core_vocab.sh "/vocab-work/{{ .Values.omopDb.vocabLoad.bundleName }}" /flip/omop/constraints.sql
          env:
            - name: OMOP_DB_HOST
              value: "omop-db"
            - name: OMOP_DB_PORT
              value: "5432"
            - name: OMOP_POSTGRES_USER
              value: {{ .Values.omopDb.credentials.user | quote }}
            - name: OMOP_POSTGRES_DB
              value: {{ .Values.dataAccessApi.env.OMOP_POSTGRES_DB | quote }}
            - name: OMOP_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: omop-postgres-password
          volumeMounts:
            - name: vocab-work
              mountPath: /vocab-work
      volumes:
        - name: vocab-work
          emptyDir:
            sizeLimit: 10Gi
        {{- if .Values.omopDb.initJob.hostAwsMount.enabled }}
        - name: host-aws
          hostPath:
            path: {{ .Values.omopDb.initJob.hostAwsMount.hostPath | quote }}
            type: Directory
        {{- end }}
{{- end }}
