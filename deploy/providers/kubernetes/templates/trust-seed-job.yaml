{{- /*
Seed this trust from the canonical dataset (FLIP#1101/#1187): its slice of each listed project's
OMOP rows into omop-db and the matching studies into Orthanc, both selected by the dataset's own
`source_trust` column so the rows and the PACS agree by construction. This replaced the pgdata /
Orthanc volume snapshots: the two stores start on empty PVCs (omop-db initialises its schema and
roles on first start; Orthanc its index) and this post-install/post-upgrade hook fills them.

Idempotent and cheap on an upgrade: the OMOP loader replaces only the listed projects' rows, the
DICOM vocabulary loader skips itself when the vocabulary is present, and Orthanc dedupes on
SOPInstanceUID. Weight 6 — after the vocab-load hook (5), so on a cluster that loads the licensed
vocabulary the rows land in a constrained database, which the loader handles (the DICOM vocabulary
goes in first, so every imaging concept the rows reference resolves).

The tools are the repository's own (trust/omop-db's omop_db_tools and trust/orthanc/seed_orthanc.py),
installed at run time from the FLIP git ref `trustData.seed.sourceRef` by uv (as a GitHub source
archive — the image has no git), so the chart carries no copy of them and needs no extra image; the
Job therefore needs egress to github.com, huggingface.co and PyPI in addition to the two in-cluster
services.
*/}}
{{- if and .Values.trustData.seed.enabled (or (and .Values.omopDb.enabled .Values.trustData.seed.omop) (and .Values.orthanc.enabled .Values.trustData.seed.orthanc)) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-trust-seed
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "6"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: trust-seed
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: "{{ .Values.trustData.seed.image.repository }}{{ with .Values.trustData.seed.image.digest }}@{{ . }}{{ else }}:{{ $.Values.trustData.seed.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.trustData.seed.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export UV_CACHE_DIR=/work/uv-cache UV_LINK_MODE=copy
              # A source archive, not git+https: uv's slim image carries no git, and a tarball needs none.
              TOOLS="omop-db-tools @ https://github.com/londonaicentre/FLIP/archive/${FLIP_REF}.tar.gz#subdirectory=trust/omop-db"
              SEEDER="https://raw.githubusercontent.com/londonaicentre/FLIP/${FLIP_REF}/trust/orthanc/seed_orthanc.py"
              tools() { uv run --no-project --with "${TOOLS}" "$@"; }
              wait_tcp() {  # $1 host $2 port — omop-db answers over TCP only once its init scripts are done
                python3 - "$1" "$2" <<'PY'
              import socket, sys, time
              host, port = sys.argv[1], int(sys.argv[2])
              for attempt in range(120):
                  try:
                      socket.create_connection((host, port), timeout=3).close(); sys.exit(0)
                  except OSError:
                      time.sleep(5)
              sys.exit(f"{host}:{port} not reachable after 10 minutes")
              PY
              }
              fetch() {  # $1 url $2 dest
                python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' "$1" "$2"
              }
              echo "trust-seed: source_trust ${SOURCE_TRUST} of ${NUM_TRUSTS}; projects [${PROJECTS}]; data version ${TRUST_DATA_VERSION}; tools @ ${FLIP_REF}"
              if [ "${SEED_OMOP}" = "true" ]; then
                wait_tcp "${OMOP_DB_HOST}" "${OMOP_DB_PORT}"
                # shellcheck disable=SC2086
                tools python -m omop_db_tools.dataset fetch --revision "${TRUST_DATA_VERSION}" --dest /work/canonical --projects ${PROJECTS}
                VOCAB="/work/${VOCAB_DICOM_BUNDLE}"
                [ -f "${VOCAB}.zip" ] || fetch "https://huggingface.co/datasets/${HF_TRUST_DATA_REPO}/resolve/${TRUST_DATA_VERSION}/omop-vocab/${VOCAB_DICOM_BUNDLE}.zip" "${VOCAB}.zip"
                tools python -m omop_db_tools.load_dicom_vocab --vocab-dir "${VOCAB}" --skip-if-loaded
                # shellcheck disable=SC2086
                tools python -m omop_db_tools.import_tables --trust-index "${SOURCE_TRUST}" --num-trusts "${NUM_TRUSTS}" \
                  --partition source_trust --clean projects --projects ${PROJECTS} --data-dir /work/canonical
              else
                echo "trust-seed: OMOP half disabled (trustData.seed.omop / omopDb.enabled)"
              fi
              if [ "${SEED_ORTHANC}" = "true" ]; then
                # The chart holds Orthanc's users as the JSON map the server reads; the seeder wants one login.
                eval "$(python3 -c 'import json, os, shlex; u, p = next(iter(json.loads(os.environ["ORTHANC_REGISTERED_USERS"]).items())); print(f"export ORTHANC_USERNAME={shlex.quote(u)} ORTHANC_PASSWORD={shlex.quote(p)}")')"
                python3 - <<'PY'
              import base64, os, sys, time, urllib.request
              url = os.environ["ORTHANC_URL"] + "/system"
              auth = base64.b64encode(f'{os.environ["ORTHANC_USERNAME"]}:{os.environ["ORTHANC_PASSWORD"]}'.encode()).decode()
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Basic " + auth}), timeout=5).close(); sys.exit(0)
                  except Exception:
                      time.sleep(5)
              sys.exit(f"{url} not reachable after 5 minutes")
              PY
                # shellcheck disable=SC2086
                uv run --no-project "${SEEDER}" --trust-index "${SOURCE_TRUST}" --projects ${PROJECTS} \
                  --revision "${TRUST_DATA_VERSION}" --orthanc-url "${ORTHANC_URL}" --cache-dir /work/dicom
              else
                echo "trust-seed: Orthanc half disabled (trustData.seed.orthanc / orthanc.enabled)"
              fi
              echo "trust-seed: done"
          env:
            {{- include "flip-trust.omopVocabDbEnv" . | nindent 12 }}
            - name: TRUST_DATA_VERSION
              value: {{ required "trustData.version is required — the trust-data tag every artefact is fetched at" .Values.trustData.version | quote }}
            - name: HF_TRUST_DATA_REPO
              value: {{ .Values.trustData.hfRepo | quote }}
            - name: FLIP_REF
              value: {{ required "trustData.seed.sourceRef is required — the FLIP git ref the seed tools are installed from" .Values.trustData.seed.sourceRef | quote }}
            - name: PROJECTS
              value: {{ .Values.trustData.seed.projects | quote }}
            - name: SOURCE_TRUST
              value: {{ default .Values.trustNumber .Values.trustData.seed.sourceTrust | quote }}
            - name: NUM_TRUSTS
              value: {{ .Values.trustData.seed.numTrusts | quote }}
            - name: VOCAB_DICOM_BUNDLE
              value: {{ .Values.trustData.seed.dicomVocabBundle | quote }}
            - name: SEED_OMOP
              value: {{ and .Values.omopDb.enabled .Values.trustData.seed.omop | quote }}
            - name: SEED_ORTHANC
              value: {{ and .Values.orthanc.enabled .Values.trustData.seed.orthanc | quote }}
            - name: ORTHANC_URL
              value: "http://orthanc:{{ .Values.orthanc.service.port }}"
            {{- if and .Values.orthanc.enabled .Values.trustData.seed.orthanc }}
            - name: ORTHANC_REGISTERED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: orthanc-registered-users
            {{- end }}
          resources:
            {{- toYaml .Values.trustData.seed.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.trustData.seed.workDirSize }}
{{- end }}
