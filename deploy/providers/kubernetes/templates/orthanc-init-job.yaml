{{- if and .Values.orthanc.enabled .Values.orthanc.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-orthanc-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
    app.kubernetes.io/part-of: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orthanc-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: restore-data
          image: amazon/aws-cli:2.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # Skip if Orthanc data already exists (index file present and non-empty)
              if [ -f /var/lib/orthanc/db/index ] && [ -s /var/lib/orthanc/db/index ]; then
                echo "Orthanc index already exists. Skipping restore."
                exit 0
              fi
              # Install tar (amazon/aws-cli image doesn't ship it)
              microdnf install -y tar gzip curl 2>/dev/null || yum install -y tar gzip curl 2>/dev/null
              TRUST_NUM="{{ .Values.trustNumber }}"
              DATA_VERSION="{{ .Values.orthanc.initJob.dataVersion }}"
              S3_BUCKET="{{ .Values.orthanc.initJob.s3Bucket }}"
              if [ -n "$S3_BUCKET" ]; then
                ARCHIVE_NAME="{{ .Values.orthanc.initJob.archiveName }}"
                if [ -z "$ARCHIVE_NAME" ]; then
                  TRUST_NAME="{{ .Values.trustName }}"
                  ARCHIVE_NAME="${TRUST_NAME}_orthanc_data_${DATA_VERSION}.tar.gz"
                fi
                ARCHIVE_URL="s3://${S3_BUCKET}/orthanc/${ARCHIVE_NAME}"
                echo "Downloading Orthanc data from S3: ${ARCHIVE_URL}..."
                aws s3 cp "${ARCHIVE_URL}" /tmp/orthanc-data.tar
                rm -rf /var/lib/orthanc/db/*
                tar xf /tmp/orthanc-data.tar -C /var/lib/orthanc/db
              else
                # Fall back to HuggingFace mock data, selecting the correct trust
                # slot (trustNumber) so trust2 gets trust2's dataset, not trust1's.
                HF_REPO="aicentreflip/trust-data"
                HF_REVISION="main"
                ARCHIVE="trust${TRUST_NUM}_orthanc_data_${DATA_VERSION}.tar"
                ARCHIVE_URL="https://huggingface.co/datasets/${HF_REPO}/resolve/${HF_REVISION}/trust${TRUST_NUM}/${ARCHIVE}"
                echo "Downloading Orthanc data from HuggingFace (trust${TRUST_NUM}): ${ARCHIVE_URL}..."
                curl -fSL "${ARCHIVE_URL}" -o /tmp/orthanc-data.tar
                rm -rf /var/lib/orthanc/db/*
                tar xf /tmp/orthanc-data.tar -C /var/lib/orthanc/db
              fi
              echo "Orthanc data restore complete."
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ default "eu-west-2" .Values.awsRegion | quote }}
            - name: AWS_PROFILE
              value: {{ .Values.orthanc.initJob.awsProfile | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/orthanc/db
            {{- if .Values.orthanc.initJob.hostAwsMount.enabled }}
            - name: host-aws
              mountPath: /root/.aws
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "flip-trust.fullname" . }}-orthanc
        {{- if .Values.orthanc.initJob.hostAwsMount.enabled }}
        - name: host-aws
          hostPath:
            path: {{ required "orthanc.initJob.hostAwsMount.hostPath is required when hostAwsMount is enabled — set it to the AWS config dir ON THE NODE, e.g. --set orthanc.initJob.hostAwsMount.hostPath=$HOME/.aws" .Values.orthanc.initJob.hostAwsMount.hostPath | quote }}
            type: Directory
        {{- end }}
{{- end }}
