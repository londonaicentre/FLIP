{{- if .Values.networkPolicies.enabled }}
# Deny all ingress by default — zero inbound trust model
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flip-trust.fullname" . }}-default-deny-ingress
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicies.allowKubeSystemIngress }}
  # Allow ingress from kube-system (kubelet health checks, metrics scraping)
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  {{- end }}
---
# Allow intra-namespace communication (trust-api → imaging-api, data-access-api, etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flip-trust.fullname" . }}-allow-intra-namespace
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "flip-trust.namespace" . }}
  policyTypes:
    - Ingress
---
{{- if .Values.networkPolicies.allowedIngressCIDRsWithPorts }}
# Allow inbound DICOM from the trust PACS.
#
# The default-deny above models FLIP's zero-inbound posture, which holds for the internet and for
# the Central Hub: neither can open a connection to a trust. Retrieval from a trust PACS is the one
# exception, and it is inbound by protocol rather than by choice — FLIP pulls, so after XNAT issues
# C-MOVE the PACS opens a *new* association back to XNAT to C-STORE the studies (FLIP#993).
#
# This stays default-deny until an operator lists the PACS CIDRs, and the allowance is scoped to
# those CIDRs on that port only. It does not open anything to the internet or to the hub.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flip-trust.fullname" . }}-allow-pacs-ingress
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-web
  ingress:
{{- range .Values.networkPolicies.allowedIngressCIDRsWithPorts }}
    - from:
  {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
  {{- end }}
      ports:
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
{{- end }}
  policyTypes:
    - Ingress
{{- end }}
---
# Allow egress to specific destinations (Central Hub, FL server, DNS, IMDS)
# All other egress is denied
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flip-trust.fullname" . }}-egress
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
spec:
  podSelector: {}
  egress:
    # Allow configured egress ports (defaults include DNS/HTTP/HTTPS)
    - ports:
{{- range .Values.networkPolicies.allowedEgressPorts }}
        - port: {{ .port }}
          protocol: {{ .protocol }}
{{- end }}
    # Allow intra-namespace egress (all ports)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "flip-trust.namespace" . }}
    # Allow egress to Central Hub and FL server (custom CIDRs, all ports)
{{- if .Values.networkPolicies.allowedEgressCIDRs }}
{{- range .Values.networkPolicies.allowedEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- end }}
    # Allow egress to specific CIDRs on specific ports (e.g. FL server gRPC)
{{- if .Values.networkPolicies.allowedEgressCIDRsWithPorts }}
{{- range .Values.networkPolicies.allowedEgressCIDRsWithPorts }}
    - to:
{{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - port: {{ .port }}
          protocol: {{ default "TCP" .protocol }}
{{- end }}
{{- end }}
    # Allow AWS IMDS (needed for EC2 metadata and IAM roles)
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
  policyTypes:
    - Egress
{{- end }}
