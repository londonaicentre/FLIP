{{- if and .Values.xnat.enabled .Values.xnat.db.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
data:
  POSTGRES_DB: "xnat"
  XNAT_DATASOURCE_USERNAME: {{ .Values.xnat.db.datasourceUsername | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  type: {{ .Values.xnat.db.service.type }}
  ports:
    - port: {{ .Values.xnat.db.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  serviceName: xnat-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-db
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-db
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.xnat.db.image.repository }}:{{ .Values.xnat.db.image.tag }}"
          imagePullPolicy: {{ .Values.xnat.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-xnat-db
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
            - name: XNAT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.xnat.db.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 5
            periodSeconds: 5
  {{- if .Values.xnat.db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "flip-trust.labels" . | nindent 10 }}
          app.kubernetes.io/component: xnat-db
      spec:
        accessModes:
          - {{ .Values.xnat.db.persistence.accessMode }}
        {{- if .Values.xnat.db.persistence.storageClassName }}
        storageClassName: {{ .Values.xnat.db.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.xnat.db.persistence.size }}
  {{- end }}
{{- end }}
