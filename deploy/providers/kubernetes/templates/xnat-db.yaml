{{- if and .Values.xnat.enabled .Values.xnat.db.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
data:
  POSTGRES_DB: "xnat"
  POSTGRES_USER: {{ .Values.xnat.db.datasourceUsername | quote }}
  XNAT_DATASOURCE_USERNAME: {{ .Values.xnat.db.datasourceUsername | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
    app.kubernetes.io/part-of: init
data:
  01-create-service-account.sql: |
    -- Create the flipServiceAccount user for XNAT API access
    -- Runs on first database initialization (empty PVC).
    -- PostgreSQL skips docker-entrypoint-initdb.d if data directory already exists.
    DO $init$
    DECLARE
      next_id INTEGER;
      user_exists BOOLEAN;
    BEGIN
      SELECT EXISTS(SELECT 1 FROM xdat_user WHERE login = 'flipServiceAccount') INTO user_exists;
      IF NOT user_exists THEN
        SELECT COALESCE(MAX(xdat_user_id), 0) + 1 INTO next_id FROM xdat_user;
        INSERT INTO xnat.public.xdat_user (xdat_user_id, login, email, primary_password, firstname, lastname, enabled, verified)
        VALUES (next_id, 'flipServiceAccount', 'flip@gstt.nhs.uk', '{bcrypt}$2a$10$3iLPGsSFFfNYyZbZqh6Wgu0JSaaltV8nIrp55pBoqfWDY36fmwaxC', 'FLIP', 'Service', 1, 1);
        -- Assign roles
        INSERT INTO xnat.public.xdat_r_xdat_role_type_assign_xdat_user (xdat_user_xdat_user_id, xdat_role_type_role_name, xdat_r_xdat_role_type_assign_xdat_user_id)
        VALUES (next_id, 'Administrator', (SELECT COALESCE(MAX(xdat_r_xdat_role_type_assign_xdat_user_id), 0) + 1 FROM xnat.public.xdat_r_xdat_role_type_assign_xdat_user)),
               (next_id, 'SiteUser', (SELECT COALESCE(MAX(xdat_r_xdat_role_type_assign_xdat_user_id), 0) + 2 FROM xnat.public.xdat_r_xdat_role_type_assign_xdat_user));
        RAISE NOTICE 'Created flipServiceAccount user with id %', next_id;
      ELSE
        RAISE NOTICE 'flipServiceAccount user already exists, skipping.';
      END IF;
    END $init$;
---
apiVersion: v1
kind: Service
metadata:
  name: xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  type: {{ .Values.xnat.db.service.type }}
  ports:
    - port: {{ .Values.xnat.db.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-db
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-db
spec:
  serviceName: xnat-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: xnat-db
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-db
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.xnat.db.image.repository }}:{{ .Values.xnat.db.image.tag }}"
          imagePullPolicy: {{ .Values.xnat.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-xnat-db
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
            - name: XNAT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.xnat.db.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.xnat.db.datasourceUsername | quote }}
                - -d
                - xnat
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "flip-trust.fullname" . }}-xnat-db-init
            defaultMode: 0444
  {{- if .Values.xnat.db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "flip-trust.labels" . | nindent 10 }}
          app.kubernetes.io/component: xnat-db
      spec:
        accessModes:
          - {{ .Values.xnat.db.persistence.accessMode }}
        {{- if .Values.xnat.db.persistence.storageClassName }}
        storageClassName: {{ .Values.xnat.db.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.xnat.db.persistence.size }}
  {{- end }}
{{- end }}
