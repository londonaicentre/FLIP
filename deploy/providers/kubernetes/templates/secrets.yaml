{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flip-trust.fullname" . }}-secrets
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if index .Values.secrets.data "aes-key-base64" }}
  aes-key-base64: {{ index .Values.secrets.data "aes-key-base64" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "trust-api-key" }}
  trust-api-key: {{ index .Values.secrets.data "trust-api-key" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "trust-internal-service-key-header" }}
  trust-internal-service-key-header: {{ index .Values.secrets.data "trust-internal-service-key-header" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "trust-internal-service-key" }}
  trust-internal-service-key: {{ index .Values.secrets.data "trust-internal-service-key" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "omop-postgres-password" }}
  omop-postgres-password: {{ index .Values.secrets.data "omop-postgres-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "data-access-postgres-password" }}
  data-access-postgres-password: {{ index .Values.secrets.data "data-access-postgres-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "orthanc-registered-users" }}
  orthanc-registered-users: {{ index .Values.secrets.data "orthanc-registered-users" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "xnat-admin-password" }}
  xnat-admin-password: {{ index .Values.secrets.data "xnat-admin-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "xnat-service-user" }}
  xnat-service-user: {{ index .Values.secrets.data "xnat-service-user" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "xnat-service-password" }}
  xnat-service-password: {{ index .Values.secrets.data "xnat-service-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "xnat-datasource-password" }}
  xnat-datasource-password: {{ index .Values.secrets.data "xnat-datasource-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "grafana-admin-password" }}
  grafana-admin-password: {{ index .Values.secrets.data "grafana-admin-password" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "s3-access-key-id" }}
  s3-access-key-id: {{ index .Values.secrets.data "s3-access-key-id" | b64enc }}
  {{- end }}
  {{- if index .Values.secrets.data "s3-secret-access-key" }}
  s3-secret-access-key: {{ index .Values.secrets.data "s3-secret-access-key" | b64enc }}
  {{- end }}
{{- end }}
