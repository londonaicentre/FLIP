{{- if and .Values.xnat.enabled .Values.xnat.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
    app.kubernetes.io/part-of: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-init
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      # The service account used to be created here by a sibling postgres:17-alpine
      # container that INSERTed straight into xdat_user with a fixed bcrypt hash.
      # That is removed: the row it wrote has no xhbm_xdat_user_auth record, which
      # XNAT 1.9.3 back-filled on the later password PUT but 1.10.0 does not, so the
      # account could never authenticate. configure-xnat-web now creates it through
      # POST /xapi/users instead — see the comment at that call.
      containers:
        - name: configure-xnat-web
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache curl jq >/dev/null 2>&1
              XNAT_URL="http://xnat-web:8080"
              ADMIN_USER="{{ .Values.xnat.web.adminUser }}"
              ADMIN_PASS="${XNAT_ADMIN_PASS}"

              # Scrub secrets out of anything echoed on failure: the value
              # following -u (credentials) or -d/--data-binary (payloads carry
              # the admin and service passwords) must never reach the pod log,
              # and neither must a live JSESSIONID.
              scrub_args() {
                local redact_next=""
                local arg
                local out=""
                for arg in "$@"; do
                  if [ -n "$redact_next" ]; then
                    out="$out <redacted>"
                    redact_next=""
                  elif [ "$arg" = "-u" ] || [ "$arg" = "-d" ] || [ "$arg" = "--data-binary" ]; then
                    out="$out $arg"
                    redact_next=1
                  else
                    out="$out $arg"
                  fi
                done
                printf '%s' "${out# }" | sed 's/JSESSIONID=[^ ]*/JSESSIONID=<redacted>/g'
              }

              # Fail-loud wrapper for XNAT's REST API — the Kubernetes
              # counterpart of xnat_curl in trust/xnat/xnat/config/configure-xnat.sh
              # (FLIP#862). Bare `curl -s` exits 0 on HTTP errors, so every
              # configuration call below used to be swallowed by `|| true` and
              # this Job reported success on a half-configured XNAT — the same
              # silent-failure class as the unregistered-PACS bug (FLIP#822).
              # On 2xx, emits the response body on stdout. On anything else —
              # or a curl transport failure — reports the (scrubbed) request and
              # the response body on stderr and returns non-zero, which `set -e`
              # turns into an abort at the call site.
              xnat_curl() {
                local response
                local status
                local body
                local curl_exit=0
                response=$(curl -sS --connect-timeout 10 --max-time 120 -w '\n%{http_code}' "$@") || curl_exit=$?
                if [ "$curl_exit" -ne 0 ]; then
                  echo "ERROR: curl transport failure (exit $curl_exit)" >&2
                  echo "  args: $(scrub_args "$@")" >&2
                  return 1
                fi
                # Strip CRs so a middlebox emitting \r\n line endings cannot
                # make the status guard fail on an invisible character.
                status=$(printf '%s' "$response" | tail -n1 | tr -d '\r')
                body=$(printf '%s' "$response" | sed '$d' | tr -d '\r')
                # Fail closed: anything other than a literal 2xx status line
                # (including an empty or non-numeric one) is an error.
                case "$status" in
                  2[0-9][0-9]) ;;
                  *)
                    echo "ERROR: XNAT request failed with HTTP $status" >&2
                    echo "  args: $(scrub_args "$@")" >&2
                    echo "  body: $body" >&2
                    return 1
                    ;;
                esac
                if [ -n "$body" ]; then
                  printf '%s\n' "$body"
                fi
              }

              echo "Waiting for XNAT to be ready..."
              XNAT_READY=false
              HTTP_CODE=000
              for i in $(seq 1 60); do
                # `|| HTTP_CODE=000` is load-bearing: `set -e` aborts on a
                # failing command substitution, so without it the first probe
                # against a still-booting Tomcat (curl exit 7) kills this
                # container and the loop can never wait.
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 "${XNAT_URL}/xapi/siteConfig" 2>/dev/null) || HTTP_CODE=000
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
                  echo "XNAT is ready (HTTP ${HTTP_CODE})!"
                  XNAT_READY=true
                  break
                fi
                sleep 10
              done
              if [ "$XNAT_READY" != "true" ]; then
                echo "ERROR: XNAT did not become ready within 600s (last HTTP ${HTTP_CODE})" >&2
                exit 1
              fi

              # Login: try configured password first, fall back to XNAT default (admin:admin pre-init)
              _xnat_login() {
                local PASS="$1"
                local RESP
                RESP=$(curl -s -D - -X POST "${XNAT_URL}/data/JSESSION" -u "${ADMIN_USER}:${PASS}" 2>/dev/null)
                local SID
                SID=$(echo "$RESP" | tail -1 | tr -d '[:space:]')
                if [ -z "$SID" ] || echo "$SID" | grep -qi '<html'; then
                  SID=$(echo "$RESP" | grep -i 'Set-Cookie: JSESSIONID=' | sed 's/.*JSESSIONID=\([^;]*\).*/\1/' | tr -d '\r')
                fi
                echo "$SID"
              }
              JSESSION=$(_xnat_login "${ADMIN_PASS}")
              if [ -z "$JSESSION" ]; then
                echo "Configured password failed, trying XNAT default (admin:admin)..."
                JSESSION=$(_xnat_login "admin")
              fi
              echo "JSESSIONID: ${JSESSION}"
              if [ -z "$JSESSION" ]; then
                echo "Failed to login to XNAT with any credential"
                exit 1
              fi

              # The readiness loop above accepts 200 *or* 401 from a core route, so it proves only
              # that Tomcat is answering — not that the plugins have registered their routes. Every
              # plugin call below (container service, DICOM SCP, PACS, DQR) would otherwise race a
              # still-registering webapp and 404, leaving XNAT half-configured. Gate on the DQR
              # route the same way the Compose path does in
              # trust/xnat/xnat/config/wait-for-xnat-plugins.sh. Authenticated via the session
              # cookie, because an anonymous probe answers 401 whatever the plugin state.
              echo "Waiting for XNAT plugin routes to register..."
              PLUGINS_READY=false
              HTTP_CODE=000
              # Timed rather than assumed: 60 iterations of a 10s sleep plus a curl that can itself
              # burn --max-time is a budget of at least 600s and up to roughly twice that, so a
              # fixed "within 600s" in the failure line would mis-state how long XNAT was given.
              PLUGIN_WAIT_START=$(date +%s)
              for i in $(seq 1 60); do
                # `|| HTTP_CODE=000` is load-bearing for the same reason as the loop above: `set -e`
                # would abort on a failing command substitution and the loop could never wait.
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 \
                  -H "Cookie: JSESSIONID=${JSESSION}" \
                  "${XNAT_URL}/xapi/dqr/settings" 2>/dev/null) || HTTP_CODE=000
                case "${HTTP_CODE}" in
                  2*)
                    echo "XNAT plugin routes are ready (HTTP ${HTTP_CODE})!"
                    PLUGINS_READY=true
                    break
                    ;;
                esac
                sleep 10
              done
              if [ "$PLUGINS_READY" != "true" ]; then
                echo "ERROR: XNAT plugin routes did not register within $(( $(date +%s) - PLUGIN_WAIT_START ))s (last HTTP ${HTTP_CODE})" >&2
                echo "  endpoint: ${XNAT_URL}/xapi/dqr/settings" >&2
                exit 1
              fi

              # Activate XNAT site (idempotent — safe to call even if already initialized).
              # siteUrl must be non-empty on XNAT >= 1.10.0: the Restlet create paths NPE on a
              # null siteUrl while building the response (entity created, request 500s) — see
              # trust/xnat/xnat/config/configure-xnat.sh for the full explanation.
              echo "Activating XNAT site..."
              xnat_curl -X POST "${XNAT_URL}/xapi/siteConfig" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d "{\"initialized\": true, \"siteUrl\": \"${XNAT_URL}\"}" >/dev/null

              # Set admin password to configured value if it differs from default
              echo "Setting admin password..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/users/${ADMIN_USER}" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d "{\"password\": \"${ADMIN_PASS}\"}" >/dev/null

              # Grant the admin account the ContainerManager role. Mirrors
              # trust/xnat/xnat/config/configure-xnat.sh — the sibling
              # configure-dcm2niix container authenticates as admin, and since
              # Container Service 3.7.0 both /xapi/docker/server and
              # /xapi/commands require this role. Without it those calls fail
              # with 401/403 and, because they were `|| true`, the Job still
              # reported success with dcm2niix silently unregistered.
              echo "Assigning role 'ContainerManager' to ${ADMIN_USER}..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/users/${ADMIN_USER}/roles/ContainerManager" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "accept: application/json" >/dev/null

              # Assign roles to service account
              SERVICE_USER="${XNAT_SERVICE_USER:-flipServiceAccount}"

              # Create the service account through the REST API, never with a raw
              # INSERT into xdat_user: XNAT only provisions the account's matching
              # xhbm_xdat_user_auth "localdb" record on this path, and without that
              # record every login is rejected 401 no matter what
              # xdat_user.primary_password holds. XNAT 1.9.3 masked a DB-layer
              # insert by back-filling the record on the password PUT below; 1.10.0
              # does not, and since the PUT still answers 200 the job would report
              # success on an XNAT whose service account can never authenticate —
              # imaging-api then 401s on every call (TROUBLESHOOTING.md §2.3).
              echo "Ensuring service account ${SERVICE_USER} exists..."
              existing_users=$(xnat_curl "${XNAT_URL}/xapi/users" \
                -H "Cookie: JSESSIONID=${JSESSION}")
              if printf '%s' "$existing_users" | jq -e --arg u "${SERVICE_USER}" 'index($u)' >/dev/null; then
                echo "  ${SERVICE_USER} already exists — leaving as-is."
              else
                xnat_curl -X POST "${XNAT_URL}/xapi/users" \
                  -H "Cookie: JSESSIONID=${JSESSION}" \
                  -H "Content-Type: application/json" \
                  -d "{\"username\": \"${SERVICE_USER}\",
                       \"password\": \"${SERVICE_PASS}\",
                       \"firstName\": \"FLIP\",
                       \"lastName\": \"Service\",
                       \"email\": \"flip@gstt.nhs.uk\",
                       \"enabled\": true,
                       \"verified\": true}" >/dev/null
                echo "  ${SERVICE_USER} created."
              fi

              # Sync service-account password from the chart secret so it always
              # matches XNAT_SERVICE_PASSWORD in imaging-api, even after a backup
              # restore that carries an older password hash.
              echo "Setting ${SERVICE_USER} password..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/users/${SERVICE_USER}" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d "{\"password\": \"${SERVICE_PASS}\"}" >/dev/null
              echo "Assigning roles to ${SERVICE_USER}..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/users/${SERVICE_USER}/groups/" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d '["ALL_DATA_ADMIN"]' >/dev/null
              xnat_curl -X PUT "${XNAT_URL}/xapi/users/${SERVICE_USER}/roles/" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d '["ContainerManager","DataManager","SiteUser","Administrator","Dqr","non_expiring"]' >/dev/null

              # Apply + enable the site-wide anonymization script (mirrors
              # trust/xnat/xnat/config/configure-xnat.sh in the Compose deploy).
              echo "Applying site-wide anonymization script..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/anonymize/site" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: text/plain" \
                --data-binary @/cs-config/anon_script.das >/dev/null
              xnat_curl -X PUT "${XNAT_URL}/xapi/anonymize/site/enabled" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d 'true' >/dev/null

              # Replace the default DICOM SCP receiver with the DQR-aware one.
              # The stock receiver uses identifier=dicomObjectIdentifier with
              # customProcessing=false, which leaves DQR-pulled studies in the
              # Unassigned prearchive ("Cannot build session. 0 prearchive
              # sessions found"). DQR needs identifier=dqrObjectIdentifier +
              # customProcessing so received studies are routed to the
              # requesting project and the relabel map (Subject UUID /
              # Session=accession) is applied.
              echo "Replacing DICOM SCP receiver with DQR-aware config..."
              scp_list=$(xnat_curl "${XNAT_URL}/xapi/dicomscp" \
                -H "Cookie: JSESSIONID=${JSESSION}")
              for SCP_ID in $(printf '%s' "$scp_list" | jq -r '.[] | select(.aeTitle == "XNAT") | .id'); do
                echo "  Removing existing SCP receiver id=${SCP_ID}..."
                xnat_curl -X DELETE "${XNAT_URL}/xapi/dicomscp/${SCP_ID}" \
                  -H "Cookie: JSESSIONID=${JSESSION}" >/dev/null
              done
              xnat_curl -X POST "${XNAT_URL}/xapi/dicomscp" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d '{
                  "aeTitle": "XNAT",
                  "port": 8104,
                  "enabled": true,
                  "customProcessing": true,
                  "directArchive": true,
                  "identifier": "dqrObjectIdentifier",
                  "anonymizationEnabled": true,
                  "whitelistEnabled": false,
                  "whitelistText": "",
                  "routingExpressionsEnabled": false,
                  "projectRoutingExpression": "",
                  "subjectRoutingExpression": "",
                  "sessionRoutingExpression": ""
                }' >/dev/null

              # Register PACS. Check-then-create by aeTitle: a duplicate
              # registration surfaces as an unspecific 500 (DB unique-constraint
              # violation), so re-run idempotency has to be a lookup rather than
              # a tolerated status code (FLIP#862).
              existing_pacs=$(xnat_curl "${XNAT_URL}/xapi/pacs" \
                -H "Cookie: JSESSIONID=${JSESSION}")
              if printf '%s' "$existing_pacs" | grep -q '"aeTitle":"ORTHANC"'; then
                echo "PACS 'ORTHANC' already registered — leaving as-is."
              else
                echo "Registering PACS..."
                xnat_curl -X POST "${XNAT_URL}/xapi/pacs" \
                  -H "Cookie: JSESSIONID=${JSESSION}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "aeTitle": "ORTHANC",
                    "defaultQueryRetrievePacs": true,
                    "defaultStoragePacs": true,
                    "host": "orthanc",
                    "label": "Orthanc PACS",
                    "ormStrategySpringBeanId": "dicomOrmStrategy",
                    "queryRetrievePort": 4242,
                    "queryable": true,
                    "storable": true,
                    "supportsExtendedNegotiations": true
                  }' >/dev/null
              fi

              # Configure DQR settings
              echo "Configuring DQR settings..."
              xnat_curl -X POST "${XNAT_URL}/xapi/dqr/settings" \
                -H "Cookie: JSESSIONID=${JSESSION}" \
                -H "Content-Type: application/json" \
                -d '{
                  "pacsAvailabilityCheckFrequency": "1 minute",
                  "dqrWaitToRetryRequestInSeconds": "300",
                  "assumeSameSessionIfArrivedWithin": "30 minutes",
                  "allowAllUsersToUseDqr": false,
                  "dqrCallingAe": "XNAT",
                  "notifyAdminOnImport": false,
                  "allowAllProjectsToUseDqr": true,
                  "leavePacsAuditTrail": false,
                  "dqrMaxPacsRequestAttempts": "100"
                }' >/dev/null

              # Configure PACS availability for all days. DQR pre-creates
              # availability intervals when the PACS is registered, so this POST
              # returns 400 "probable overlap with existing interval" for an
              # already-scheduled day — treated as "already configured" rather
              # than a failure. Anything else non-2xx is a real error.
              echo "Configuring PACS availability..."
              for DAY in MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY; do
                avail_status=$(curl -s -o /tmp/pacs-availability-response.json \
                  --connect-timeout 10 --max-time 120 -w '%{http_code}' \
                  -X POST "${XNAT_URL}/xapi/pacs/1/availability" \
                  -H "Cookie: JSESSIONID=${JSESSION}" \
                  -H "Content-Type: application/json" \
                  -d "{\"availabilityEnd\":\"23:59\",\"availabilityStart\":\"00:00\",\"availableNow\":true,\"dayOfWeek\":\"$DAY\",\"enabled\":true,\"pacsId\":1,\"threads\":4,\"utilizationPercent\":100}") || avail_status="000"
                case "$avail_status" in
                  2[0-9][0-9]) ;;
                  400)
                    echo "  Availability interval for $DAY already exists (HTTP 400 overlap) — leaving as-is."
                    ;;
                  *)
                    echo "ERROR: setting PACS availability for $DAY failed (HTTP $avail_status)" >&2
                    cat /tmp/pacs-availability-response.json >&2 || true
                    exit 1
                    ;;
                esac
              done

              echo "XNAT web configuration complete."
          env:
            - name: XNAT_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
            - name: XNAT_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-user
            - name: SERVICE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-service-password
          volumeMounts:
            - name: cs-config
              mountPath: /cs-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
        # Configures the XNAT Container Service plugin to use the native
        # Kubernetes compute backend (available since container-service 3.2.0),
        # registers the dcm2niix command, and enables the Event Service so
        # imaging-api can create per-project event subscriptions. Mirrors what
        # configure-dcm2niix.sh does in the Compose deployment, but speaks to
        # the K8s backend instead of the Docker socket.
        - name: configure-dcm2niix
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache curl jq >/dev/null
              XNAT_URL="http://xnat-web:8080"
              CREDS="${XNAT_ADMIN_USER}:${XNAT_ADMIN_PASS}"
              DCM2NIIX_NAME="dcm2niix"

              # Same fail-loud helper as the configure-xnat-web container (each
              # container runs its own script, so it is defined twice). Mirrors
              # xnat_curl in trust/xnat/xnat/config/configure-dcm2niix.sh, which
              # is already fail-loud on the Compose side — this brings K8s to
              # parity (FLIP#862).
              scrub_args() {
                local redact_next=""
                local arg
                local out=""
                for arg in "$@"; do
                  if [ -n "$redact_next" ]; then
                    out="$out <redacted>"
                    redact_next=""
                  elif [ "$arg" = "-u" ] || [ "$arg" = "-d" ] || [ "$arg" = "--data-binary" ]; then
                    out="$out $arg"
                    redact_next=1
                  else
                    out="$out $arg"
                  fi
                done
                printf '%s' "${out# }" | sed 's/JSESSIONID=[^ ]*/JSESSIONID=<redacted>/g'
              }

              xnat_curl() {
                local response
                local status
                local body
                local curl_exit=0
                response=$(curl -sS --connect-timeout 10 --max-time 120 -w '\n%{http_code}' "$@") || curl_exit=$?
                if [ "$curl_exit" -ne 0 ]; then
                  echo "ERROR: curl transport failure (exit $curl_exit)" >&2
                  echo "  args: $(scrub_args "$@")" >&2
                  return 1
                fi
                status=$(printf '%s' "$response" | tail -n1 | tr -d '\r')
                body=$(printf '%s' "$response" | sed '$d' | tr -d '\r')
                case "$status" in
                  2[0-9][0-9]) ;;
                  *)
                    echo "ERROR: XNAT request failed with HTTP $status" >&2
                    echo "  args: $(scrub_args "$@")" >&2
                    echo "  body: $body" >&2
                    return 1
                    ;;
                esac
                if [ -n "$body" ]; then
                  printf '%s\n' "$body"
                fi
              }

              echo "Waiting for XNAT to be ready..."
              XNAT_READY=false
              HTTP_CODE=000
              for i in $(seq 1 60); do
                # `|| HTTP_CODE=000` is load-bearing: `set -e` aborts on a
                # failing command substitution, so without it the first probe
                # against a still-booting Tomcat (curl exit 7) kills this
                # container and the loop can never wait.
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 "${XNAT_URL}/xapi/siteConfig" 2>/dev/null) || HTTP_CODE=000
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
                  echo "XNAT is ready (HTTP ${HTTP_CODE})!"
                  XNAT_READY=true
                  break
                fi
                sleep 10
              done
              if [ "$XNAT_READY" != "true" ]; then
                echo "ERROR: XNAT did not become ready within 600s (last HTTP ${HTTP_CODE})" >&2
                exit 1
              fi

              # The sibling configure-xnat-web container activates the site
              # ({"initialized": true} on /xapi/siteConfig). Wait for that before
              # touching the Container Service plugin so we don't race it.
              echo "Waiting for XNAT site activation..."
              SITE_ACTIVATED=false
              for i in $(seq 1 60); do
                INIT=$(curl -sf -u "${CREDS}" --connect-timeout 5 --max-time 10 \
                  "${XNAT_URL}/xapi/siteConfig" 2>/dev/null \
                  | jq -r '.initialized // false') || INIT=false
                if [ "${INIT}" = "true" ]; then
                  echo "XNAT site is activated."
                  SITE_ACTIVATED=true
                  break
                fi
                sleep 5
              done
              if [ "$SITE_ACTIVATED" != "true" ]; then
                echo "ERROR: XNAT site was not activated within 300s — the sibling configure-xnat-web container likely failed" >&2
                exit 1
              fi

              # The sibling configure-xnat-web container grants ${XNAT_ADMIN_USER}
              # the ContainerManager role, which every Container Service call
              # below requires (CS >= 3.7.0). Wait for it to land rather than
              # racing it — an unauthorised call here used to be swallowed by
              # `|| true` and left dcm2niix unregistered on a "successful" Job.
              echo "Waiting for the ContainerManager role on ${XNAT_ADMIN_USER}..."
              HAS_CM=false
              for i in $(seq 1 60); do
                ROLES=$(curl -sf -u "${CREDS}" --connect-timeout 5 --max-time 10 \
                  "${XNAT_URL}/xapi/users/${XNAT_ADMIN_USER}/roles/" 2>/dev/null) || ROLES=""
                if printf '%s' "$ROLES" | jq -e 'index("ContainerManager")' >/dev/null 2>&1; then
                  echo "${XNAT_ADMIN_USER} holds ContainerManager."
                  HAS_CM=true
                  break
                fi
                sleep 5
              done
              if [ "$HAS_CM" != "true" ]; then
                echo "ERROR: ${XNAT_ADMIN_USER} never gained the ContainerManager role within 300s — Container Service calls would fail 401/403" >&2
                exit 1
              fi

              echo "Registering Kubernetes backend with the Container Service plugin..."
              CS_HTTP=$(curl -s -o /tmp/cs_resp.txt -w "%{http_code}" \
                --connect-timeout 10 --max-time 120 \
                -X POST "${XNAT_URL}/xapi/docker/server" \
                -u "${CREDS}" \
                -H "Content-Type: application/json" \
                -d @/cs-config/container-service-backend-configuration.kubernetes.json) || CS_HTTP="000"
              if [ "${CS_HTTP}" = "200" ] || [ "${CS_HTTP}" = "201" ]; then
                echo "Container Service backend registered (HTTP ${CS_HTTP})."
              else
                echo "ERROR: Container Service backend registration failed (HTTP ${CS_HTTP})" >&2
                cat /tmp/cs_resp.txt >&2 || true
                exit 1
              fi

              echo "Checking for an existing ${DCM2NIIX_NAME} command..."
              EXISTING=$(xnat_curl -u "${CREDS}" "${XNAT_URL}/xapi/commands?name=${DCM2NIIX_NAME}")
              EXISTING_ID=$(printf '%s' "$EXISTING" | jq -r '.[0].id // empty')
              if [ -n "${EXISTING_ID}" ]; then
                echo "Deleting existing command id=${EXISTING_ID}..."
                xnat_curl -X DELETE "${XNAT_URL}/xapi/commands/${EXISTING_ID}" -u "${CREDS}" >/dev/null
              fi

              echo "Registering ${DCM2NIIX_NAME} command..."
              xnat_curl -X POST "${XNAT_URL}/xapi/commands" \
                -u "${CREDS}" \
                -H "Content-Type: application/json" \
                -d @/cs-config/dcm2niix_command.json >/dev/null

              echo "Looking up registered command id and wrapper name..."
              RESPONSE=$(xnat_curl -u "${CREDS}" "${XNAT_URL}/xapi/commands?name=${DCM2NIIX_NAME}")
              CMD_ID=$(printf '%s' "${RESPONSE}" | jq -r '.[0].id // empty')
              WRAPPER_NAME=$(printf '%s' "${RESPONSE}" | jq -r '.[0].xnat[0].name // empty')
              if [ -z "${CMD_ID}" ] || [ -z "${WRAPPER_NAME}" ]; then
                echo "ERROR: ${DCM2NIIX_NAME} command not found after registration (id='${CMD_ID}' wrapper='${WRAPPER_NAME}')" >&2
                exit 1
              fi
              echo "Command id=${CMD_ID}, wrapper=${WRAPPER_NAME}"
              echo "Enabling ${DCM2NIIX_NAME} command site-wide..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/commands/${CMD_ID}/wrappers/${WRAPPER_NAME}/enabled" \
                -u "${CREDS}" >/dev/null

              echo "Enabling the Event Service..."
              xnat_curl -X PUT "${XNAT_URL}/xapi/events/prefs" \
                -u "${CREDS}" \
                -H "Content-Type: application/json" \
                -d '{"enabled": true}' >/dev/null

              echo "Container Service + dcm2niix configuration complete."
          env:
            - name: XNAT_ADMIN_USER
              value: {{ .Values.xnat.web.adminUser | quote }}
            - name: XNAT_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-admin-password
          volumeMounts:
            - name: cs-config
              mountPath: /cs-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: cs-config
          configMap:
            name: {{ include "flip-trust.fullname" . }}-xnat-cs-config
---
# Container Service plugin configuration (K8s backend) + dcm2niix command JSON
# + site-wide DICOM anonymization script.
#
# The Kubernetes backend entry carries the PVC mount settings (FLIP#565). Without
# them the Container Service falls back to "no PVC mount" and bind-mounts the scan
# path as a node hostPath — a path that only exists inside the xnat-web pod, so
# kubelet creates it empty and dcm2niix exits with "Unable to find any DICOM images
# in /input". `combined-pvc-name` is the single xnat-web data PVC (its root holds
# both `archive/` and `build/`, which xnat-web mounts by subPath).
#
# `combined-path-translation` MUST keep its trailing slash. It is the prefix the
# plugin strips from XNAT's own paths to build the volume's `subPath`; without the
# slash the result keeps a leading `/` and the Kubernetes API rejects the whole Job
# with `spec.template.spec.containers[0].volumeMounts.subPath: Invalid value ...
# must be a relative path` (HTTP 422) — the launch then fails before any pod exists.
#
# The `data:` entries are sourced verbatim from:
#   trust/xnat/xnat/config/container-service-backend-configuration.kubernetes.json
#   trust/xnat/xnat/config/dcm2niix_command.json
#   trust/xnat/xnat/config/anon_script.das
# Keep them in sync with those source files until the chart can read them via
# Helm `.Files.Get` (blocked by the source files living outside the chart dir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-cs-config
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
data:
  anon_script.das: |
    version "6.3"
    // FLIP Site-Wide DICOM Anonymization Script
    // Compatible with XNAT 1.10.0 (DicomEdit 6.9.x)
    //
    // This script is applied to all incoming DICOM data when anonymizationEnabled
    // is set to true on the SCP receiver. It removes Protected Health Information
    // (PHI) from DICOM headers to ensure patient privacy.

    // Store XNAT labels into DICOM headers
    (0010,4000) := project
    (0010,0010) := subject
    (0010,0020) := subject
    (0008,1030) := session

    // Remove direct patient identifiers
    - (0010,0030)    // Patient Birth Date
    - (0010,1000)    // Other Patient IDs
    - (0010,1001)    // Other Patient Names
    - (0010,1002)    // Other Patient IDs Sequence
    - (0010,1005)    // Patient Birth Name
    - (0010,1040)    // Patient Address
    - (0010,2154)    // Patient Telephone Numbers
    - (0010,0032)    // Patient Birth Time

    // Remove institutional identifiers
    - (0008,0080)    // Institution Name
    - (0008,0081)    // Institution Address
    - (0008,1040)    // Institutional Department Name

    // Remove physician/operator identifiers
    - (0008,0090)    // Referring Physician Name
    - (0008,0092)    // Referring Physician Address
    - (0008,0094)    // Referring Physician Telephone Numbers
    - (0008,1048)    // Physician(s) of Record
    - (0008,1050)    // Performing Physician Name
    - (0008,1070)    // Operators Name

    // Remove other potentially identifying tags
    - (0008,0050)    // Accession Number (we use relabelMap for session)
    - (0010,1090)    // Medical Record Locator
    - (0010,2160)    // Ethnic Group
    - (0010,2180)    // Occupation
    - (0010,21B0)    // Additional Patient History
    - (0010,4000)    // Patient Comments (after project label stored above)
    - (0032,1032)    // Requesting Physician
    - (0040,0006)    // Scheduled Performing Physician Name
    - (0040,2016)    // Placer Order Number
    - (0040,2017)    // Filler Order Number
    - (0040,A123)    // Person Name (in structured reports)

    // Hash UIDs for pseudonymization (repeatable hashing)
    (0020,000D) := hashUID[(0020,000D)]    // Study Instance UID
    (0020,000E) := hashUID[(0020,000E)]    // Series Instance UID
    (0008,0018) := hashUID[(0008,0018)]    // SOP Instance UID

    // Record de-identification method
    (0012,0062) := "YES"                                    // Patient Identity Removed
    (0012,0063) := "FLIP Site-Wide Anonymization v1"         // De-identification Method
  container-service-backend-configuration.kubernetes.json: |
    {
        "name": "Kubernetes",
        "backend": "kubernetes",
        "host": "",
        "cert-path": "",
        "swarm-mode": false,
        "combined-pvc-name": "{{ include "flip-trust.fullname" . }}-xnat-web",
        "combined-path-translation": "/data/xnat/",
        "pull-images-on-xnat-init": true,
        "container-user": "",
        "auto-cleanup": true
    }
  dcm2niix_command.json: |
    {
        "name": "dcm2niix",
        "label": "dcm2niix",
        "description": "Runs dcm2niix",
        "version": "1.6",
        "schema-version": "1.0",
        "info-url": "https://github.com/rordenlab/dcm2niix",
        "image": "xnat/dcm2niix:latest",
        "type": "docker",
        "command-line": "dcm2niix [BIDS] [GZIP] [OTHER_OPTIONS] -o /output /input",
        "mounts": [
          {
            "name": "dicom-in",
            "writable": false,
            "path": "/input"
          },
          {
            "name": "nifti-out",
            "writable": true,
            "path": "/output"
          }
        ],
        "environment-variables": {},
        "ports": {},
        "inputs": [
          {
            "name": "bids",
            "description": "Create BIDS metadata file",
            "type": "boolean",
            "default-value": "false",
            "required": false,
            "replacement-key": "[BIDS]",
            "command-line-flag": "-b",
            "true-value": "y",
            "false-value": "n",
            "select-values": []
          },
          {
            "name": "gzip",
            "description": "Compress output files with gzip",
            "type": "boolean",
            "default-value": "true",
            "required": false,
            "replacement-key": "[GZIP]",
            "command-line-flag": "-z",
            "true-value": "y",
            "false-value": "n",
            "select-values": []
          },
          {
            "name": "other-options",
            "description": "Other command-line flags to pass to dcm2niix",
            "type": "string",
            "required": false,
            "replacement-key": "[OTHER_OPTIONS]",
            "select-values": []
          }
        ],
        "outputs": [
          {
            "name": "nifti",
            "description": "The nifti files",
            "required": true,
            "mount": "nifti-out"
          }
        ],
        "xnat": [
          {
            "name": "dcm2niix-scan",
            "label": "dcm2niix",
            "description": "Run dcm2niix on a Scan",
            "contexts": [
              "xnat:imageScanData"
            ],
            "external-inputs": [
              {
                "name": "scan",
                "description": "Input scan",
                "type": "Scan",
                "matcher": "'DICOM' in @.resources[*].label",
                "required": true,
                "load-children": true
              }
            ],
            "derived-inputs": [
              {
                "name": "scan-dicoms",
                "description": "The dicom resource on the scan",
                "type": "Resource",
                "matcher": "@.label == 'DICOM'",
                "required": true,
                "provides-files-for-command-mount": "dicom-in",
                "load-children": true,
                "derived-from-wrapper-input": "scan",
                "multiple": false
              }
            ],
            "output-handlers": [
              {
                "name": "nifti-resource",
                "accepts-command-output": "nifti",
                "as-a-child-of": "scan",
                "type": "Resource",
                "label": "NIFTI",
                "tags": []
              }
            ]
          }
        ],
        "reserve-memory": 1000,
        "limit-cpu": 1,
        "container-labels": {},
        "generic-resources": {},
        "ulimits": {}
    }
---
# ConfigMap with helper scripts for XNAT configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-scripts
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
data:
  configure-xnat.sh: |
    #!/bin/sh
    # XNAT Configuration Script
    # This script configures XNAT after initial deployment.
    # It can be run manually if the automated init job is disabled.
    set -euo pipefail

    XNAT_URL="${1:-http://xnat-web:8080}"
    ADMIN_USER="${2:-admin}"
    ADMIN_PASS="${3:-}"
    SERVICE_USER="${4:-flipServiceAccount}"
    SERVICE_PASS="${5:-}"
    ORTHANC_HOST="${6:-orthanc}"
    PACS_DICOM_PORT="${7:-4242}"

    if [ -z "$ADMIN_PASS" ] || [ -z "$SERVICE_PASS" ]; then
      echo "Usage: configure-xnat.sh <xnat_url> <admin_user> <admin_pass> [service_user] [service_pass] [orthanc_host] [pacs_port]"
      exit 1
    fi

    echo "Configuring XNAT at ${XNAT_URL}..."

    wait_for_xnat() {
      echo "Waiting for XNAT to be available..."
      for i in $(seq 1 120); do
        if wget -q --spider "${XNAT_URL}/app/template/Login.vm" 2>/dev/null; then
          echo "XNAT is up!"
          return 0
        fi
        sleep 5
      done
      echo "XNAT did not become available within timeout"
      return 1
    }

    wait_for_xnat

    # Login and get JSESSIONID
    login() {
      local u="$1" p="$2"
      wget -q -O /tmp/jsession.txt --post-data="" \
        --header="Authorization: Basic $(printf '%s:%s' "$u" "$p" | base64)" \
        "${XNAT_URL}/data/JSESSION" 2>/dev/null || true
      cat /tmp/jsession.txt 2>/dev/null || echo ""
    }

    JSESSION=$(login "${ADMIN_USER}" "${ADMIN_PASS}")

    if [ -z "$JSESSION" ]; then
      echo "Trying initial admin password..."
      JSESSION=$(login "${ADMIN_USER}" "${ADMIN_PASS}")
      if [ -z "$JSESSION" ]; then
        echo "Failed to authenticate with XNAT"
        exit 1
      fi
    fi

    COOKIE="Cookie: JSESSIONID=${JSESSION}"

    # Activate XNAT site. siteUrl must be non-empty on XNAT >= 1.10.0 (Restlet create paths
    # NPE on null siteUrl while building the response) — see configure-xnat.sh.
    echo "Activating XNAT site..."
    wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
      --post-data="{\"initialized\": true, \"siteUrl\": \"${XNAT_URL}\"}" "${XNAT_URL}/xapi/siteConfig"

    # Register PACS (Orthanc)
    echo "Registering PACS..."
    wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
      --post-data="{
        \"aeTitle\": \"ORTHANC\",
        \"defaultQueryRetrievePacs\": true,
        \"defaultStoragePacs\": true,
        \"host\": \"${ORTHANC_HOST}\",
        \"label\": \"Orthanc PACS\",
        \"ormStrategySpringBeanId\": \"dicomOrmStrategy\",
        \"queryRetrievePort\": ${PACS_DICOM_PORT},
        \"queryable\": true,
        \"storable\": true,
        \"supportsExtendedNegotiations\": true
      }" "${XNAT_URL}/xapi/pacs"

    # Assign roles to service account
    echo "Assigning roles to service account..."
    wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
      --post-data='["ALL_DATA_ADMIN"]' \
      "${XNAT_URL}/xapi/users/${SERVICE_USER}/groups/"
    wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
      --post-data='["ContainerManager","DataManager","SiteUser","Administrator","Dqr","non_expiring"]' \
      "${XNAT_URL}/xapi/users/${SERVICE_USER}/roles/"

    # Configure DQR settings
    echo "Configuring DQR settings..."
    wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
      --post-data='{
        "pacsAvailabilityCheckFrequency": "1 minute",
        "dqrWaitToRetryRequestInSeconds": "300",
        "assumeSameSessionIfArrivedWithin": "30 minutes",
        "allowAllUsersToUseDqr": false,
        "dqrCallingAe": "XNAT",
        "notifyAdminOnImport": false,
        "allowAllProjectsToUseDqr": true,
        "leavePacsAuditTrail": false,
        "dqrMaxPacsRequestAttempts": "100"
      }' "${XNAT_URL}/xapi/dqr/settings"

    # Configure PACS availability for all days
    echo "Configuring PACS availability..."
    for DAY in MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY; do
      wget -q -O /dev/null --header="${COOKIE}" --header="Content-Type: application/json" \
        --post-data="{
          \"availabilityEnd\": \"23:59\",
          \"availabilityStart\": \"00:00\",
          \"availableNow\": true,
          \"dayOfWeek\": \"$DAY\",
          \"enabled\": true,
          \"pacsId\": 1,
          \"threads\": 4,
          \"utilizationPercent\": 100
        }" "${XNAT_URL}/xapi/pacs/1/availability"
    done

    echo "XNAT configuration complete."
{{- end }}
