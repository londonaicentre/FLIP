{{- if and .Values.xnat.enabled .Values.xnat.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
    app.kubernetes.io/part-of: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: xnat-init
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: configure-xnat
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "Waiting for xnat-db to be ready..."
              until pg_isready -h xnat-db -U xnat -d xnat 2>/dev/null; do
                sleep 3
              done
              echo "xnat-db is ready. Creating XNAT service account..."
              psql -h xnat-db -U xnat -d xnat <<-EOSQL
                DO \$init\$
                DECLARE
                  next_id INTEGER;
                  user_exists BOOLEAN;
                BEGIN
                  SELECT EXISTS(SELECT 1 FROM xdat_user WHERE login = 'flipServiceAccount') INTO user_exists;
                  IF NOT user_exists THEN
                    SELECT COALESCE(MAX(xdat_user_id), 0) + 1 INTO next_id FROM xdat_user;
                    INSERT INTO xdat_user (xdat_user_id, login, email, primary_password, firstname, lastname, enabled, verified)
                    VALUES (next_id, 'flipServiceAccount', 'flip@gstt.nhs.uk', '{bcrypt}\$2a\$10\$3iLPGsSFFfNYyZbZqh6Wgu0JSaaltV8nIrp55pBoqfWDY36fmwaxC', 'FLIP', 'Service', 1, 1);
                    INSERT INTO xdat_r_xdat_role_type_assign_xdat_user (xdat_user_xdat_user_id, xdat_role_type_role_name, xdat_r_xdat_role_type_assign_xdat_user_id)
                    VALUES (next_id, 'Administrator', (SELECT COALESCE(MAX(xdat_r_xdat_role_type_assign_xdat_user_id), 0) + 1 FROM xdat_r_xdat_role_type_assign_xdat_user)),
                           (next_id, 'SiteUser', (SELECT COALESCE(MAX(xdat_r_xdat_role_type_assign_xdat_user_id), 0) + 2 FROM xdat_r_xdat_role_type_assign_xdat_user));
                    RAISE NOTICE 'Created flipServiceAccount user with id %', next_id;
                  ELSE
                    RAISE NOTICE 'flipServiceAccount user already exists, skipping.';
                  END IF;
                END \$init\$;
              EOSQL
              echo "XNAT service account configuration complete."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: xnat-datasource-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
---
# ConfigMap with helper scripts for XNAT configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-xnat-scripts
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: xnat-init
data:
  configure-xnat.sh: |
    #!/bin/sh
    # XNAT Configuration Script
    # This script configures XNAT after initial deployment.
    # It can be run manually if the automated init job is disabled.
    set -euo pipefail
    XNAT_URL="${1:-http://xnat-web:8080}"
    ADMIN_USER="${2:-admin}"
    ADMIN_PASS="${3:-}"
    echo "Configuring XNAT at ${XNAT_URL}..."
    echo "Placeholder — XNAT REST API calls would go here."
    echo "XNAT configuration complete."
{{- end }}
