{{- if .Values.orthanc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flip-trust.fullname" . }}-orthanc
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
data:
  # Orthanc configuration is built from values; users may supply additional
  # configuration via extra config maps in the future.
  ORTHANC__DICOM_MODALITIES: |
    {"XNAT": {"AET": "XNAT", "Host": "xnat-web", "Port": "8104"}}
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
spec:
  type: {{ .Values.orthanc.service.type }}
  ports:
    - port: {{ .Values.orthanc.service.port }}
      targetPort: orthanc-api
      protocol: TCP
      name: orthanc-api
    - port: 4242
      targetPort: dicom
      protocol: TCP
      name: dicom
  selector:
    {{- include "flip-trust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flip-trust.fullname" . }}-orthanc
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
spec:
  replicas: {{ .Values.orthanc.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "flip-trust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orthanc
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orthanc
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ include "flip-trust.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- if .Values.orthanc.initJob.enabled }}
      initContainers:
        - name: seed-data
          image: amazon/aws-cli:2.22.0
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # Skip if Orthanc data already exists (index file present and non-empty)
              if [ -f /var/lib/orthanc/db/index ] && [ -s /var/lib/orthanc/db/index ]; then
                echo "Orthanc data directory already populated. Skipping seed."
                exit 0
              fi
              microdnf install -y tar gzip curl 2>/dev/null || yum install -y tar gzip curl 2>/dev/null
              TRUST_NUM="{{ .Values.trustNumber }}"
              DATA_VERSION="{{ .Values.orthanc.initJob.dataVersion }}"
              S3_BUCKET="{{ .Values.orthanc.initJob.s3Bucket }}"
              mkdir -p /var/lib/orthanc/db
              if [ -n "$S3_BUCKET" ]; then
                ARCHIVE_NAME="{{ .Values.orthanc.initJob.archiveName }}"
                if [ -z "$ARCHIVE_NAME" ]; then
                  TRUST_NAME="{{ .Values.trustName }}"
                  ARCHIVE_NAME="${TRUST_NAME}_orthanc_data_${DATA_VERSION}.tar.gz"
                fi
                ARCHIVE_URL="s3://${S3_BUCKET}/orthanc/${ARCHIVE_NAME}"
                echo "Downloading Orthanc data from S3: ${ARCHIVE_URL}..."
                aws s3 cp "${ARCHIVE_URL}" /tmp/orthanc-data.tar
                rm -rf /var/lib/orthanc/db/*
                tar xf /tmp/orthanc-data.tar -C /var/lib/orthanc/db
              else
                HF_REPO="aicentreflip/trust-data"
                HF_REVISION="main"
                ARCHIVE="trust${TRUST_NUM}_orthanc_data_${DATA_VERSION}.tar"
                ARCHIVE_URL="https://huggingface.co/datasets/${HF_REPO}/resolve/${HF_REVISION}/trust${TRUST_NUM}/${ARCHIVE}"
                echo "Downloading Orthanc data from HuggingFace (trust${TRUST_NUM}): ${ARCHIVE_URL}..."
                curl -fSL "${ARCHIVE_URL}" -o /tmp/orthanc-data.tar
                rm -rf /var/lib/orthanc/db/*
                tar xf /tmp/orthanc-data.tar -C /var/lib/orthanc/db
              fi
              echo "Orthanc data seed complete."
          volumeMounts:
            - name: data
              mountPath: /var/lib/orthanc/db
          {{- if .Values.orthanc.initJob.hostAwsMount.enabled }}
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ default "eu-west-2" .Values.awsRegion | quote }}
            - name: AWS_PROFILE
              value: {{ .Values.orthanc.initJob.awsProfile | quote }}
          {{- end }}
      {{- end }}
      containers:
        - name: orthanc
          image: "{{ .Values.orthanc.image.repository }}:{{ .Values.orthanc.image.tag }}"
          imagePullPolicy: {{ .Values.orthanc.image.pullPolicy }}
          ports:
            - name: orthanc-api
              containerPort: 8042
              protocol: TCP
            - name: dicom
              containerPort: 4242
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flip-trust.fullname" . }}-orthanc
          env:
            - name: ORTHANC__REGISTERED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: orthanc-registered-users
                  # Deliberately NOT optional (FLIP-PT-091): a missing key must
                  # fail the pod (CreateContainerConfigError) rather than boot a
                  # PACS with no registered users.
          volumeMounts:
            - name: data
              mountPath: /var/lib/orthanc/db
          resources:
            {{- toYaml .Values.orthanc.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: orthanc-api
            initialDelaySeconds: {{ .Values.orthanc.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orthanc.probes.liveness.periodSeconds }}
          readinessProbe:
            tcpSocket:
              port: orthanc-api
            initialDelaySeconds: {{ .Values.orthanc.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orthanc.probes.readiness.periodSeconds }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "flip-trust.fullname" . }}-orthanc
{{- if .Values.orthanc.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flip-trust.fullname" . }}-orthanc
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
spec:
  accessModes:
    - {{ .Values.orthanc.persistence.accessMode }}
  {{- if .Values.orthanc.persistence.storageClassName }}
  storageClassName: {{ .Values.orthanc.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.orthanc.persistence.size }}
{{- end }}
{{- else }}
# External orthanc: create a minimal Service to point at the external host
apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: orthanc
    flip/external: "true"
spec:
  type: ExternalName
  externalName: {{ .Values.orthanc.external.host | quote }}
  ports:
    - port: {{ .Values.orthanc.external.port }}
      targetPort: {{ .Values.orthanc.external.port }}
      protocol: TCP
      name: orthanc-api
{{- end }}
