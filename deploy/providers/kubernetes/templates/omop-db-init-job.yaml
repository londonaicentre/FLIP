{{- if and .Values.omopDb.enabled .Values.omopDb.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flip-trust.fullname" . }}-omop-db-init
  namespace: {{ include "flip-trust.namespace" . }}
  labels:
    {{- include "flip-trust.labels" . | nindent 4 }}
    app.kubernetes.io/component: omop-db
    app.kubernetes.io/part-of: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "flip-trust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: omop-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: restore-data
          image: amazon/aws-cli:2.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              S3_BUCKET="{{ .Values.omopDb.initJob.s3Bucket }}"
              S3_PATH="{{ .Values.omopDb.initJob.s3Path }}"
              echo "Downloading OMOP data archive from s3://${S3_BUCKET}/${S3_PATH}..."
              aws s3 cp "s3://${S3_BUCKET}/${S3_PATH}" /tmp/omop-data.tar.gz
              echo "Extracting to /var/lib/postgresql/data..."
              tar xzf /tmp/omop-data.tar.gz -C /var/lib/postgresql/data
              echo "OMOP data restore complete."
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ default "eu-west-2" .Values.awsRegion | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.create }}{{ include "flip-trust.fullname" . }}-secrets{{ else }}{{ .Values.secrets.existingName }}{{ end }}
                  key: s3-secret-access-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-{{ include "flip-trust.fullname" . }}-omop-db-0
{{- end }}
