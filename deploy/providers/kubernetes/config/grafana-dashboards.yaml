# This file is embedded as ConfigMap data by the grafana.yaml template.
apiVersion: 1

providers:
  - name: "Trust Dashboards"
    orgId: 1
    folder: "Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
