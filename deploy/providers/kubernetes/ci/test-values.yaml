# Test values for CI pipeline — overrides production defaults for kind-based
# testing where resources are limited.

# Reduce resource requirements for CI
trustApi:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3

imagingApi:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

dataAccessApi:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

flClient:
  enabled: false  # Disable fl-client in CI (no GPU, no S3 access)

orthanc:
  persistence:
    size: 1Gi
  probes:
    liveness:
      initialDelaySeconds: 30
    readiness:
      initialDelaySeconds: 10

omopDb:
  # The vocab-load hook needs org S3 credentials — not available (and not
  # licence-appropriate) in CI; the kind cluster runs vocab-less.
  vocabLoad:
    enabled: false
  persistence:
    size: 1Gi
  probes:
    readiness:
      initialDelaySeconds: 5

xnat:
  enabled: false  # Disable XNAT in CI to save resources

observability:
  loki:
    enabled: false  # Disable observability in CI
  alloy:
    enabled: false
  grafana:
    enabled: false

sharedImagesPvc:
  size: 1Gi
  accessMode: ReadWriteOnce  # Kind's local-path provisioner only supports RWO

# Use default storage class
persistence:
  storageClassName: "standard"
