# site_local_trust.yml
#
# Provisions an on-premises Ubuntu host to run the FLIP Trust-API stack.
# Trusts poll the Central Hub for tasks — all communication is outbound.
#
# Usage:
#   ansible-playbook -i <trust-host-ip>, \
#     -u ubuntu --private-key ~/.ssh/trust_key \
#     deploy/providers/local/site_local_trust.yml

---
- name: Configure on-premises Trust host
  hosts: all
  become: true
  vars:
    flip_dir: /opt/flip

  tasks:
    # ── System packages ──────────────────────────────────────────────────────
    - name: Install required packages
      apt:
        name:
          - openssl
          - curl
        state: present
        update_cache: yes

    # ── Docker ───────────────────────────────────────────────────────────────
    - name: Install Docker
      include_role:
        name: geerlingguy.docker
      vars:
        docker_users: [ubuntu]

    # ── Application directories ───────────────────────────────────────────────
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ flip_dir }}"
        - "{{ flip_dir }}/data/images"

    # XNAT containers run as the in-image `xnat` user (UID 1001) after the
    # Docker-hardening pass on `trust/xnat/xnat/Dockerfile`. Bind-mounted host
    # paths must be writable by that UID — see deploy/providers/AWS/site.yml
    # for the full rationale. Keep this list in sync with that playbook.
    - name: Create XNAT bind-mount directories (owned by container UID 1001)
      file:
        path: "{{ item }}"
        state: directory
        owner: "1001"
        group: "1001"
        mode: "0755"
      loop:
        - "{{ flip_dir }}/xnat"
        - "{{ flip_dir }}/xnat/xnat-data/tomcat_logs"
        - "{{ flip_dir }}/xnat/xnat-data/archive"
        - "{{ flip_dir }}/xnat/xnat-data/build"
        - "{{ flip_dir }}/xnat/xnat-data/cache"
        - "{{ flip_dir }}/xnat/xnat-db-data"

    # ── FL participant kit dir ────────────────────────────────────────────────
    # Pre-create /opt/flip/fl-kit/net-1/services/<slot>/{local,startup,transfer}
    # — the layout the trust-side prod compose mounts via
    # ${FL_KIT_DIR}/net-1/services/${TRUST_NAME}/... (nvflare) or
    # ${FL_KIT_DIR}/net-1/{certificates,keys} (flower). Keep this list in
    # sync with the playbook in deploy/providers/AWS/site.yml; if the
    # operator overrides FL_KIT_DIR in their trust kit file they're
    # responsible for the directory tree themselves.
    - name: Create FL participant kit directories (default FL_KIT_DIR=/opt/flip/fl-kit)
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ flip_dir }}/fl-kit"
        - "{{ flip_dir }}/fl-kit/net-1"
        - "{{ flip_dir }}/fl-kit/net-1/services"
        - "{{ flip_dir }}/fl-kit/net-1/services/Trust_2"
        - "{{ flip_dir }}/fl-kit/net-1/services/Trust_2/local"
        - "{{ flip_dir }}/fl-kit/net-1/services/Trust_2/startup"
        - "{{ flip_dir }}/fl-kit/net-1/services/Trust_2/transfer"
        - "{{ flip_dir }}/fl-kit/net-1/certificates"
        - "{{ flip_dir }}/fl-kit/net-1/keys"
