#
# Read by ansible-playbook when run from this directory (every Makefile target
# here does). The trust-host roles site.yml composes live beside the trust
# compose files (FLIP#1213). ~/.ansible/roles comes FIRST because ansible-galaxy installs
# into the first entry: with the shared roles dir first, every `make ansible-init` dropped
# geerlingguy.docker into the checkout. The flip_* names never collide with galaxy roles.
[defaults]
roles_path = ~/.ansible/roles:../../../trust/deploy/ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
