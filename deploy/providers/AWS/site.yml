#
# site.yml — the AWS half of trust-host provisioning.
#
# The trust host itself is provisioned by the roles under
# trust/deploy/ansible/roles (found via ./ansible.cfg), which the on-prem play
# trust/deploy/ansible/onprem.yml composes too. What stays here is what only an
# AWS-hosted trust has: the Terraform-derived inventory, the AWS CLI, the SSM
# bastion, the CloudWatch agent, the S3 kit source, and the S3-sourced vocabulary.

---
- name: create EC2 Ansible inventory hosts on-the-fly
  hosts: localhost
  gather_facts: false
  # `always` so the inventory (add_host for flip-trust) is built even when a
  # tag filter like `--tags flkit` selects only a later play.
  tags: always
  tasks:
    - name: ensure flip_aicentre_bucket variable is defined
      assert:
        that:
          - flip_aicentre_bucket is defined
          - flip_aicentre_bucket | length > 0
        fail_msg: "The flip_aicentre_bucket variable must be defined to proceed."
    - name: ensure fl_kit_date variable is defined
      assert:
        that:
          - fl_kit_date is defined
          - fl_kit_date | length > 0
        fail_msg: "The fl_kit_date variable must be defined to proceed."
    - name: ensure trust_data_version variable is defined
      assert:
        that:
          - trust_data_version is defined
          - trust_data_version | length > 0
        fail_msg: "trust_data_version must be defined (contents of trust/.data_version, a tag on the trust-data dataset, e.g. 20260729)."
    - name: initialize Terraform backend for validation
      command: >
        terraform init
        -backend-config="bucket={{ lookup('env', 'FLIP_TFSTATE_BUCKET_NAME') }}"
        -backend-config="region={{ lookup('env', 'AWS_REGION') | default('eu-west-2', true) }}"
        -reconfigure
      args:
        chdir: ./
      changed_when: false
    - name: extract Terraform outputs as JSON
      command: terraform output -json
      args:
        chdir: ./
      register: terraform_raw_output
      changed_when: false
    - name: parse Terraform outputs
      set_fact:
        terraform_output:
          outputs: "{{ terraform_raw_output.stdout | from_json }}"
    - name: add Central Hub EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        # The 'flip' Host entry in ~/.ssh/config provides ProxyCommand, IdentityFile,
        # and StrictHostKeyChecking=accept-new — no additional ssh_common_args needed.
        name: flip
        groups:
          - ec2
          - central_hub
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.Ec2InstanceId.value }}"
    - name: add Trust EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        name: flip-trust
        groups:
          - ec2
          - trust_ec2
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.TrustEc2InstanceId.value }}"
      # Hub-only deployment (deploy_trust_ec2=false): no cloud trust host exists —
      # the output is empty, the trust_ec2 group stays empty, and every
      # `hosts: trust_ec2` play below is skipped cleanly.
      when: (terraform_output.outputs.TrustEc2InstanceId.value | default('')) | length > 0

- name: update packages
  hosts: ec2
  become: true
  tasks:
    - name: update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes

- name: reboot if kernel update requires it
  hosts: ec2
  become: true
  tasks:
    - name: check if reboot is required
      stat:
        path: /run/reboot-required
      register: reboot_required_file

    - name: reboot and wait for EC2 to come back
      reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists

- name: install Docker on Trust EC2, adding ubuntu to docker group
  hosts: trust_ec2
  become: true
  vars:
    # The EC2 host is reachable only through SSM, so the login user may hold the
    # (root-equivalent) docker group; the on-prem play deliberately does not.
    flip_docker_users: [ubuntu]
  roles:
    - flip_base_packages
    - flip_docker

- name: install AWS CLI v2 on Trust EC2 (if missing)
  hosts: trust_ec2
  become: true
  tasks:
    - name: check if aws cli is already installed
      command: aws --version
      register: awscli_check
      changed_when: false
      failed_when: false

    - name: download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: awscli_check.rc != 0

    - name: unzip AWS CLI installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: awscli_check.rc != 0

    - name: install AWS CLI v2
      command: /tmp/aws/install
      when: awscli_check.rc != 0

- name: install PostgreSQL client on Central Hub SSM bastion
  hosts: central_hub
  become: true
  tags: [bastion]
  tasks:
    - name: install PostgreSQL client
      apt:
        name: postgresql-client
        state: present
        update_cache: yes

- name: create Trust EC2 application directories
  hosts: trust_ec2
  become: true
  vars:
    # /opt/flip/trust holds the per-trust kit file (.env.<slot>) that register-trusts
    # scp's to the EC2; the trust compose -include's it. Without this dir the scp in
    # register-trusts.sh fails with "No such file or directory".
    flip_app_dirs:
      - /opt/flip/trust
    # One images tree per FL kit slot: the production composes default
    # BASE_IMAGES_DOWNLOAD_DIR to /opt/flip/data/trust-<slot> and prod kits deliberately
    # leave that variable unset. Slots 1 and 2 unconditionally, so the pre-registration
    # ansible-init pass — which has no assigned slot to read yet — still lays down the
    # common case. The registered slot is added on top: FL_KIT_SLOT_NUMBER is handed out
    # by the hub and is not bounded by 2, so a host on slot 3 would otherwise have Docker
    # create the path root-owned, which is exactly the failure the role's comments
    # describe. `unique` keeps the list flat when the registered slot is 1 or 2.
    flip_images_base_dirs: >-
      {{ (['/opt/flip/data/trust-1', '/opt/flip/data/trust-2']
          + (['/opt/flip/data/trust-' ~ trust_num]
             if trust_num is defined and trust_num | string | length > 0
             else [])) | unique }}
    # The EC2 stack bind-mounts Loki/Grafana data from /opt/flip/volumes.
    flip_observability_volume_dirs: true
  roles:
    - flip_trust_dirs

- name: stage the FL participant kit on Trust EC2
  hosts: trust_ec2
  become: true
  # `flkit` so this kit-staging play can be run on its own (e.g. re-staging a
  # kit after re-registration) via `--tags flkit`, without the host reboot /
  # OMOP+Orthanc data restore the full playbook performs.
  tags: flkit
  vars:
    fl_kit_source: s3
  roles:
    - flip_fl_kit

- name: deploy observability config files to Trust EC2
  hosts: trust_ec2
  become: true
  roles:
    - flip_observability_config

- name: install and configure CloudWatch agent on Trust EC2
  hosts: trust_ec2
  become: true
  vars:
    cloudwatch_agent_deb: "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb"
    log_group_name: "/aws/ec2/flip-trust"
  tasks:
    - name: download CloudWatch agent package
      get_url:
        url: "{{ cloudwatch_agent_deb }}"
        dest: "/tmp/amazon-cloudwatch-agent.deb"
        mode: "0644"
    - name: install CloudWatch agent
      apt:
        deb: "/tmp/amazon-cloudwatch-agent.deb"
    - name: configure CloudWatch agent for Trust EC2
      template:
        src: cloudwatch-agent-trust.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"
    - name: start CloudWatch agent
      command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

- name: download and restore OMOP PGDATA on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, omop]
  roles:
    - flip_omop_restore

- name: load OMOP core vocabulary on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, omop, omop-vocab]
  roles:
    - flip_omop_vocab

- name: restore Orthanc storage on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, orthanc]
  roles:
    - flip_orthanc_restore
