#
# site.yml — the AWS half of trust-host provisioning.
#
# The trust host itself is provisioned by the roles under
# trust/deploy/ansible/roles (found via ./ansible.cfg), which the on-prem play
# trust/deploy/ansible/onprem.yml composes too. What stays here is what only an
# AWS-hosted trust has: the Terraform-derived inventory, the AWS CLI, the SSM
# bastion, the CloudWatch agent, the S3 kit source, the seed from the canonical
# dataset (FLIP#1187 — an on-prem host seeds itself at `make -C trust up-trust`
# instead), and the S3-sourced vocabulary.

---
- name: create EC2 Ansible inventory hosts on-the-fly
  hosts: localhost
  gather_facts: false
  # `always` so the inventory (add_host for flip-trust) is built even when a
  # tag filter like `--tags flkit` selects only a later play.
  tags: always
  tasks:
    - name: ensure flip_aicentre_bucket variable is defined
      assert:
        that:
          - flip_aicentre_bucket is defined
          - flip_aicentre_bucket | length > 0
        fail_msg: "The flip_aicentre_bucket variable must be defined to proceed."
    - name: ensure fl_kit_date variable is defined
      assert:
        that:
          - fl_kit_date is defined
          - fl_kit_date | length > 0
        fail_msg: "The fl_kit_date variable must be defined to proceed."
    - name: ensure trust_data_version variable is defined
      assert:
        that:
          - trust_data_version is defined
          - trust_data_version | length > 0
        fail_msg: "trust_data_version must be defined (contents of trust/.data_version, a tag on the trust-data dataset, e.g. 20260729)."
    - name: initialize Terraform backend for validation
      command: >
        terraform init
        -backend-config="bucket={{ lookup('env', 'FLIP_TFSTATE_BUCKET_NAME') }}"
        -backend-config="region={{ lookup('env', 'AWS_REGION') | default('eu-west-2', true) }}"
        -reconfigure
      args:
        chdir: ./
      changed_when: false
    - name: extract Terraform outputs as JSON
      command: terraform output -json
      args:
        chdir: ./
      register: terraform_raw_output
      changed_when: false
    - name: parse Terraform outputs
      set_fact:
        terraform_output:
          outputs: "{{ terraform_raw_output.stdout | from_json }}"
    - name: add Central Hub EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        # The 'flip' Host entry in ~/.ssh/config provides ProxyCommand, IdentityFile,
        # and StrictHostKeyChecking=accept-new — no additional ssh_common_args needed.
        name: flip
        groups:
          - ec2
          - central_hub
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.Ec2InstanceId.value }}"
    - name: add Trust EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        name: flip-trust
        groups:
          - ec2
          - trust_ec2
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.TrustEc2InstanceId.value }}"
      # Hub-only deployment (deploy_trust_ec2=false): no cloud trust host exists —
      # the output is empty, the trust_ec2 group stays empty, and every
      # `hosts: trust_ec2` play below is skipped cleanly.
      when: (terraform_output.outputs.TrustEc2InstanceId.value | default('')) | length > 0

- name: update packages
  hosts: ec2
  become: true
  tasks:
    - name: update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes

- name: reboot if kernel update requires it
  hosts: ec2
  become: true
  tasks:
    - name: check if reboot is required
      stat:
        path: /run/reboot-required
      register: reboot_required_file

    - name: reboot and wait for EC2 to come back
      reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists

- name: install Docker on Trust EC2, adding ubuntu to docker group
  hosts: trust_ec2
  become: true
  vars:
    # The EC2 host is reachable only through SSM, so the login user may hold the
    # (root-equivalent) docker group; the on-prem play deliberately does not.
    flip_docker_users: [ubuntu]
  roles:
    - flip_base_packages
    - flip_docker

- name: install AWS CLI v2 on Trust EC2 (if missing)
  hosts: trust_ec2
  become: true
  tasks:
    - name: check if aws cli is already installed
      command: aws --version
      register: awscli_check
      changed_when: false
      failed_when: false

    - name: download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: awscli_check.rc != 0

    - name: unzip AWS CLI installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: awscli_check.rc != 0

    - name: install AWS CLI v2
      command: /tmp/aws/install
      when: awscli_check.rc != 0

- name: install PostgreSQL client on Central Hub SSM bastion
  hosts: central_hub
  become: true
  tags: [bastion]
  tasks:
    - name: install PostgreSQL client
      apt:
        name: postgresql-client
        state: present
        update_cache: yes

- name: create Trust EC2 application directories
  hosts: trust_ec2
  become: true
  vars:
    # /opt/flip/trust holds the per-trust kit file (.env.<slot>) that register-trusts
    # scp's to the EC2; the trust compose -include's it. Without this dir the scp in
    # register-trusts.sh fails with "No such file or directory".
    flip_app_dirs:
      - /opt/flip/trust
    # One images tree per FL kit slot: the production composes default
    # BASE_IMAGES_DOWNLOAD_DIR to /opt/flip/data/trust-<slot> and prod kits deliberately
    # leave that variable unset. Slots 1 and 2 unconditionally, so the pre-registration
    # ansible-init pass — which has no assigned slot to read yet — still lays down the
    # common case. The registered slot is added on top: FL_KIT_SLOT_NUMBER is handed out
    # by the hub and is not bounded by 2, so a host on slot 3 would otherwise have Docker
    # create the path root-owned, which is exactly the failure the role's comments
    # describe. `unique` keeps the list flat when the registered slot is 1 or 2.
    flip_images_base_dirs: >-
      {{ (['/opt/flip/data/trust-1', '/opt/flip/data/trust-2']
          + (['/opt/flip/data/trust-' ~ trust_num]
             if trust_num is defined and trust_num | string | length > 0
             else [])) | unique }}
    # The EC2 stack bind-mounts Loki/Grafana data from /opt/flip/volumes.
    flip_observability_volume_dirs: true
  roles:
    - flip_trust_dirs

- name: stage the FL participant kit on Trust EC2
  hosts: trust_ec2
  become: true
  # `flkit` so this kit-staging play can be run on its own (e.g. re-staging a
  # kit after re-registration) via `--tags flkit`, without the host reboot /
  # OMOP+Orthanc seeding the full playbook performs.
  tags: flkit
  vars:
    fl_kit_source: s3
  roles:
    - flip_fl_kit

- name: deploy observability config files to Trust EC2
  hosts: trust_ec2
  become: true
  roles:
    - flip_observability_config

- name: install and configure CloudWatch agent on Trust EC2
  hosts: trust_ec2
  become: true
  vars:
    cloudwatch_agent_deb: "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb"
    log_group_name: "/aws/ec2/flip-trust"
  tasks:
    - name: download CloudWatch agent package
      get_url:
        url: "{{ cloudwatch_agent_deb }}"
        dest: "/tmp/amazon-cloudwatch-agent.deb"
        mode: "0644"
    - name: install CloudWatch agent
      apt:
        deb: "/tmp/amazon-cloudwatch-agent.deb"
    - name: configure CloudWatch agent for Trust EC2
      template:
        src: cloudwatch-agent-trust.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"
    - name: start CloudWatch agent
      command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

- name: seed the trust's OMOP database and Orthanc from the canonical dataset on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, seed]
  # FLIP#1187: the stores start empty and are seeded, with the trust stack stopped, exactly the
  # way a dev host (`make -C trust ensure-seeded`) and the Kubernetes chart (the trust-seed hook)
  # seed them — the one procedure in trust/seed_trust.sh, run here in uv's image against two
  # throwaway containers on the host's data directories (the same pattern the vocabulary play
  # below uses): omop-db initialises its schema and roles on the empty volume, Orthanc its index,
  # and the seeder loads this trust's `source_trust` slice of each project through them. The
  # loaders come from THIS checkout (copied over, like the vocabulary loader), so the host runs
  # what the operator deploys. No snapshot, no S3: the data is fetched anonymously from Hugging
  # Face at the pinned tag. Idempotent — a .data_version bump re-runs it and replaces only the
  # listed projects' rows and studies.
  vars:
    omop_dir: "/opt/flip/omop"
    orthanc_base_dir: "/opt/flip/orthanc"
    orthanc_data_dir: "/opt/flip/orthanc/orthanc-storage"
    seed_dir: "/opt/flip/seed"
    trust_num: "{{ trust_num | default('1') }}"
    # Optional extra-vars get DISTINCT internal names (like hf_trust_data_repo above): a play
    # var that references itself (`x: "{{ x | default(...) }}"`) is fine only while an
    # extra-var of the same name shadows it, and these four are passed by `make
    # seed-trust-data` only when the operator sets them — unset, the first use would recurse
    # ("Recursive loop detected in template").
    seed_source_trust: "{{ source_trust | default(trust_num) }}"
    seed_num_trusts: "{{ num_trusts | default('2') }}"
    seed_project_list: "{{ seed_projects | default('cxr_project', true) }}"
    seed_orthanc_enabled: "{{ seed_orthanc | default(true) }}"
    # Recovery only — see the seed task below.
    seed_force_dicom_vocab: "{{ force_dicom_vocab | default(false) }}"
    hf_trust_data_repo: "{{ trust_data_hf_repo | default('aicentreflip/trust-data') }}"
    hf_trust_data_revision: "{{ trust_data_hf_revision | default(trust_data_version) }}"
    omop_db_image: "ghcr.io/londonaicentre/omop-db:{{ omop_db_tag | default('stag', true) }}"
    orthanc_image: "ghcr.io/londonaicentre/orthanc:{{ omop_db_tag | default('stag', true) }}"
    # uv's image, pinned by digest — the same one the Helm chart's trust-seed hook runs in.
    uv_image: "ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58"
    seed_omop_port: "15499"
    seed_orthanc_port: "15442"
    omop_postgres_user: "{{ omop_postgres_user | default('postgres', true) }}"
    omop_postgres_db: "{{ omop_postgres_db | default('trustomopdb', true) }}"
  tasks:
    # The throwaway omop-db below starts a postmaster on {{ omop_dir }}/db_data, and Postgres will
    # not refuse if the running stack's omop-db already has it open: that postmaster's PID in
    # postmaster.pid is invisible from the new container's PID namespace, so it is taken as stale
    # and crash recovery runs over a live database (#1190 review). deploy-trust now stops the
    # stack before reaching this play; this guard covers the standalone `make seed-trust-data`.
    # It matches any compose project's omop-db on the host, not just trust<trust_num>'s — the
    # data directory is host-global, so a stack under another project name holds it just the
    # same — and the omop-seed container an aborted run may have left behind.
    - name: check nothing on this host has the OMOP data directory open
      shell: |
        docker ps -q -f label=com.docker.compose.service=omop-db
        docker ps -q -f name='^omop-seed$'
      register: omop_dir_holders
      changed_when: false

    - name: refuse to seed while the trust's own cluster has the data directory open
      assert:
        that:
          - omop_dir_holders.stdout | trim | length == 0
        fail_msg: >-
          a container on this host has {{ omop_dir }}/db_data open ({{ omop_dir_holders.stdout | trim }}):
          stop the trust stack first — DOCKER_CONTEXT=flip-trust make -C trust down-trust-ec2
          KIT=<CODE> PROD=<env>, which is what deploy-trust runs before seeding — or remove a
          leftover throwaway with `docker rm -f omop-seed`; seeding over a live database would
          run crash recovery on it from a second postmaster.

    - name: assert the kit credentials are set
      assert:
        that:
          - omop_postgres_password is defined and omop_postgres_password | length > 0
          - data_access_postgres_password is defined and data_access_postgres_password | length > 0
          - (not seed_orthanc_enabled | bool) or (orthanc_username is defined and orthanc_username | length > 0)
          - (not seed_orthanc_enabled | bool) or (orthanc_password is defined and orthanc_password | length > 0)
        fail_msg: >-
          omop_postgres_password, data_access_postgres_password and (with seed_orthanc) orthanc_username /
          orthanc_password are required — the kit's OMOP_POSTGRES_PASSWORD, DATA_ACCESS_POSTGRES_PASSWORD,
          ORTHANC_USERNAME and ORTHANC_PASSWORD, passed by make seed-trust-data

    # The FL kit slot is only the DEFAULT partition (trust/Makefile says why: slots are claimed in
    # registration order, partitions are a property of the dataset). A slot past the dataset's
    # partition count — Trust_3 on the two-partition mock data, i.e. any third registered trust —
    # has no slice of its own; the loader would refuse it ten minutes in, from inside the no_log'd
    # container. Name the fix here instead.
    - name: assert the source_trust partition exists in the dataset
      assert:
        that:
          - seed_source_trust | int >= 1
          - seed_source_trust | int <= seed_num_trusts | int
        fail_msg: >-
          source_trust {{ seed_source_trust }} is not a partition of the dataset (it has
          {{ seed_num_trusts }}): this trust's FL kit slot number is being used as the default and
          exceeds it. Pick the partition this trust should receive and pass it explicitly, e.g.
          make seed-trust-data KIT=<CODE> PROD=<env> SOURCE_TRUST=1

    # omop-db's entrypoint takes ownership of its data dir itself (it runs as root with CHOWN);
    # Orthanc runs as uid 999 with no way to chown, so its directories must be 999-owned first.
    - name: create the OMOP data directory
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ omop_dir }}"
        - "{{ omop_dir }}/db_data"

    - name: create the Orthanc storage directory owned by container UID 999
      file:
        path: "{{ item }}"
        state: directory
        owner: "999"
        group: "999"
        mode: "0755"
      loop:
        - "{{ orthanc_base_dir }}"
        - "{{ orthanc_data_dir }}"

    - name: create the seed working directory
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ seed_dir }}"
        - "{{ seed_dir }}/omop-db"
        - "{{ seed_dir }}/work"

    - name: copy the seed procedure and the loaders from the repo checkout
      copy:
        src: "{{ item.src }}"
        dest: "{{ seed_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: "../../../trust/seed_trust.sh", dest: "seed_trust.sh" }
        - {
            src: "../../../trust/orthanc/seed_orthanc.py",
            dest: "seed_orthanc.py",
          }
        - {
            src: "../../../trust/omop-db/pyproject.toml",
            dest: "omop-db/pyproject.toml",
          }
        - { src: "../../../trust/omop-db/README.md", dest: "omop-db/README.md" }
        - { src: "../../../trust/omop-db/src/", dest: "omop-db/src/" }

    - name: seed, cleaning up the throwaway containers whatever happens
      block:
        - name: start a throwaway omop-db on the data volume (initialises the schema on an empty one)
          command: >
            docker run -d --name omop-seed
            -v {{ omop_dir }}/db_data:/var/lib/postgresql/data
            -p 127.0.0.1:{{ seed_omop_port }}:5432
            -e POSTGRES_USER={{ omop_postgres_user }}
            -e POSTGRES_PASSWORD={{ omop_postgres_password }}
            -e POSTGRES_DB={{ omop_postgres_db }}
            -e DATA_ACCESS_POSTGRES_PASSWORD={{ data_access_postgres_password }}
            {{ omop_db_image }}
          no_log: true

        - name: start a throwaway Orthanc on the storage directory
          command: >
            docker run -d --name orthanc-seed
            -v {{ orthanc_data_dir }}:/var/lib/orthanc/db
            -p 127.0.0.1:{{ seed_orthanc_port }}:8042
            -e ORTHANC__REGISTERED_USERS={{ {orthanc_username: orthanc_password} | to_json | quote }}
            {{ orthanc_image }}
          no_log: true
          when: seed_orthanc_enabled | bool

        # FORCE_DICOM_VOCAB=1 (make seed-trust-data FORCE_DICOM_VOCAB=1) reloads the DICOM
        # vocabulary over one that reports itself present: its "already loaded" signal is a
        # single concept committed before the bulk load, so a run killed in between leaves a
        # database that skips the load forever. Without it, recovery here means a hand-run
        # psql against the trust's cluster.
        - name: run the seed procedure against both (uv image, host network, loaders from this checkout)
          command: >
            docker run --rm --network host
            -v {{ seed_dir }}:/seed
            -e WORK_DIR=/seed/work
            -e TOOLS_SPEC="omop-db-tools @ /seed/omop-db"
            -e SEEDER=/seed/seed_orthanc.py
            -e TRUST_DATA_VERSION={{ hf_trust_data_revision }}
            -e HF_TRUST_DATA_REPO={{ hf_trust_data_repo }}
            -e PROJECTS="{{ seed_project_list }}"
            -e SOURCE_TRUST={{ seed_source_trust }}
            -e NUM_TRUSTS={{ seed_num_trusts }}
            -e SEED_OMOP=true
            -e SEED_ORTHANC={{ 'true' if seed_orthanc_enabled | bool else 'false' }}
            -e FORCE_DICOM_VOCAB={{ '1' if seed_force_dicom_vocab | bool else '' }}
            -e OMOP_DB_HOST=127.0.0.1
            -e OMOP_DB_PORT={{ seed_omop_port }}
            -e OMOP_POSTGRES_USER={{ omop_postgres_user }}
            -e OMOP_POSTGRES_PASSWORD={{ omop_postgres_password }}
            -e OMOP_POSTGRES_DB={{ omop_postgres_db }}
            -e ORTHANC_URL=http://127.0.0.1:{{ seed_orthanc_port }}
            -e ORTHANC_USERNAME={{ orthanc_username | default('') }}
            -e ORTHANC_PASSWORD={{ orthanc_password | default('') }}
            {{ uv_image }} bash /seed/seed_trust.sh
          no_log: true
          register: seed_run

        - name: seed summary
          debug:
            msg: "{{ seed_run.stdout_lines | select('search', '^(seed_trust:|✅)') | list }}"
      # The command above is no_log (its argv carries the kit passwords), which also hides the
      # reason when it fails. The loaders print no secrets, so show the tail of what they said —
      # a broken download, a partition that does not exist, an unreachable store — before failing.
      rescue:
        - name: seed procedure output (last lines)
          debug:
            msg: "{{ ((seed_run.stdout_lines | default([])) + (seed_run.stderr_lines | default([])))[-40:] }}"
          when: seed_run is defined
        - name: the seed procedure failed
          fail:
            msg: "seed_trust.sh failed on the Trust EC2 — see the output above (rc {{ seed_run.rc | default('?') }})"
      always:
        - name: stop the throwaway containers
          command: docker rm -f {{ item }}
          loop: [omop-seed, orthanc-seed]
          register: seed_rm
          changed_when: false
          failed_when: seed_rm.rc != 0 and 'No such container' not in (seed_rm.stderr | default(''))

        - name: drop the fetched tables and DICOM sets (the seeded stores keep the data)
          file:
            path: "{{ seed_dir }}/work"
            state: absent

- name: load OMOP core vocabulary on Trust EC2
  # The canonical dataset carries no core vocabulary (FLIP#842/#843): it is licensed, so
  # it is loaded separately (role flip_omop_vocab), into the cluster the seed play above
  # filled, via a throwaway container on a loopback-only port. The loader skips tables
  # that already hold the core vocabulary, so re-runs are safe. Bundle comes from the org
  # S3 bucket via the instance role.
  hosts: trust_ec2
  become: true
  tags: [data, omop, omop-vocab]
  roles:
    - flip_omop_vocab
