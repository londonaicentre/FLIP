---
- name: create EC2 Ansible inventory hosts on-the-fly
  hosts: localhost
  gather_facts: false
  # `always` so the inventory (add_host for flip-trust) is built even when a
  # tag filter like `--tags flkit` selects only a later play.
  tags: always
  tasks:
    - name: ensure flip_aicentre_bucket variable is defined
      assert:
        that:
          - flip_aicentre_bucket is defined
          - flip_aicentre_bucket | length > 0
        fail_msg: "The flip_aicentre_bucket variable must be defined to proceed."
    - name: ensure fl_kit_date variable is defined
      assert:
        that:
          - fl_kit_date is defined
          - fl_kit_date | length > 0
        fail_msg: "The fl_kit_date variable must be defined to proceed."
    - name: ensure omop_data_version variable is defined
      assert:
        that:
          - omop_data_version is defined
          - omop_data_version | length > 0
        fail_msg: "omop_data_version must be defined (contents of trust/omop-db/.data_version, e.g. 20260129)."
    - name: ensure orthanc_data_version variable is defined
      assert:
        that:
          - orthanc_data_version is defined
          - orthanc_data_version | length > 0
        fail_msg: "orthanc_data_version must be defined (contents of trust/orthanc/.data_version, e.g. 20260106)."
    - name: initialize Terraform backend for validation
      command: >
        terraform init
        -backend-config="bucket={{ lookup('env', 'FLIP_TFSTATE_BUCKET_NAME') }}"
        -backend-config="region={{ lookup('env', 'AWS_REGION') | default('eu-west-2', true) }}"
        -reconfigure
      args:
        chdir: ./
      changed_when: false
    - name: extract Terraform outputs as JSON
      command: terraform output -json
      args:
        chdir: ./
      register: terraform_raw_output
      changed_when: false
    - name: parse Terraform outputs
      set_fact:
        terraform_output:
          outputs: "{{ terraform_raw_output.stdout | from_json }}"
    - name: add Central Hub EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        # The 'flip' Host entry in ~/.ssh/config provides ProxyCommand, IdentityFile,
        # and StrictHostKeyChecking=accept-new — no additional ssh_common_args needed.
        name: flip
        groups:
          - ec2
          - central_hub
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.Ec2InstanceId.value }}"
    - name: add Trust EC2 instance to Ansible inventory
      add_host:
        # Use the SSH alias so Ansible tunnels through SSM Session Manager
        name: flip-trust
        groups:
          - ec2
          - trust_ec2
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/host-aws' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        ansible_ec2_instance_id: "{{ terraform_output.outputs.TrustEc2InstanceId.value }}"
      # Hub-only deployment (deploy_trust_ec2=false): no cloud trust host exists —
      # the output is empty, the trust_ec2 group stays empty, and every
      # `hosts: trust_ec2` play below is skipped cleanly.
      when: (terraform_output.outputs.TrustEc2InstanceId.value | default('')) | length > 0

- name: update packages
  hosts: ec2
  become: true
  tasks:
    - name: update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes

- name: reboot if kernel update requires it
  hosts: ec2
  become: true
  tasks:
    - name: check if reboot is required
      stat:
        path: /run/reboot-required
      register: reboot_required_file

    - name: reboot and wait for EC2 to come back
      reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists

- name: install Docker on Trust EC2, adding ubuntu to docker group
  hosts: trust_ec2
  become: true
  roles:
    - geerlingguy.docker
  vars:
    docker_users: [ubuntu]

- name: install AWS CLI v2 on Trust EC2 (if missing)
  hosts: trust_ec2
  become: true
  tasks:
    - name: install prerequisites for AWS CLI
      apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: yes

    - name: check if aws cli is already installed
      command: aws --version
      register: awscli_check
      changed_when: false
      failed_when: false

    - name: download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: awscli_check.rc != 0

    - name: unzip AWS CLI installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: awscli_check.rc != 0

    - name: install AWS CLI v2
      command: /tmp/aws/install
      when: awscli_check.rc != 0

- name: install PostgreSQL client on Central Hub SSM bastion
  hosts: central_hub
  become: true
  tags: [bastion]
  tasks:
    - name: install PostgreSQL client
      apt:
        name: postgresql-client
        state: present
        update_cache: yes

- name: create Trust EC2 application directories
  hosts: trust_ec2
  become: true
  tasks:
    - name: create Trust application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - /opt/flip
        # Holds the per-trust kit file (.env.<slot>) that register-trusts scp's
        # to the EC2; the trust compose -include's it. Without this dir the scp
        # in register-trusts.sh fails with "No such file or directory".
        - /opt/flip/trust
        # Bind-mount sources for the imaging-api / fl-client images dir.
        # Both compose projects (trust1-, trust2-) bind-mount one of these
        # onto /app/data/images via BASE_IMAGES_DOWNLOAD_DIR_TRUST{1,2}, then
        # imaging-api creates /app/data/images/net-1/ inside it as uid 1000
        # (the `flip` user in the container).
        # If we don't pre-create them here Docker creates the missing source
        # path as root at first startup, leaving the container unable to
        # mkdir net-1 inside it - imaging-api then 500s every download with
        # `[Errno 13] Permission denied: '/app/data/images/net-1'`, and the
        # FL training run fails downstream with `num_samples=0` because the
        # whole cohort's image fetches errored out.
        - /opt/flip/data/trust-1
        - /opt/flip/data/trust-2

    # XNAT containers run as the in-image `xnat` user (UID 1001) after the
    # Docker-hardening pass on `trust/xnat/xnat/Dockerfile`. Bind-mounted host
    # paths must be writable by that UID or first-boot writes (archive ingest,
    # build cache, Tomcat log rotation, prearchive moves) fail with EACCES.
    - name: create XNAT bind-mount directories (owned by container UID 1001)
      file:
        path: "{{ item }}"
        state: directory
        owner: "1001"
        group: "1001"
        mode: "0755"
      loop:
        - /opt/flip/xnat
        - /opt/flip/xnat/xnat-data/tomcat_logs
        - /opt/flip/xnat/xnat-data/archive
        - /opt/flip/xnat/xnat-data/build
        - /opt/flip/xnat/xnat-data/cache
        - /opt/flip/xnat/xnat-db-data

    - name: create Loki data directory
      file:
        path: /opt/flip/volumes/loki
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"

    - name: create Grafana data directory
      file:
        path: /opt/flip/volumes/grafana
        state: directory
        owner: "472"
        group: "472"
        mode: "0755"

- name: download NVFLARE participant kit services to Trust EC2
  hosts: trust_ec2
  become: true
  # `flkit` so this kit-staging play can be run on its own (e.g. re-staging a
  # kit after re-registration) via `--tags flkit`, without the host reboot /
  # OMOP+Orthanc data restore the full playbook performs.
  tags: flkit
  vars:
    # FL_KIT_DIR on the trust host — kit root containing net-1/services/<slot>/
    # for nvflare and net-1/{certificates,keys} for flower. The trust kit file
    # (/opt/flip/trust/.env.Trust_1) sets FL_KIT_DIR=/opt/flip/fl-kit so the
    # prod compose mounts resolve to the same on-disk paths Ansible stages
    # below — keep the two sides in lockstep.
    fl_kit_dir: "/opt/flip/fl-kit"
    trust_s3_source: "s3://{{ flip_aicentre_bucket }}/fl-flare-participant-kits/{{ fl_kit_date }}/net-1/services/Trust_1/"
  tasks:
    - name: ensure FL kit directory exists
      file:
        path: "{{ fl_kit_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      when: fl_backend == "nvflare"

    # The fl-client/fl-server images now run as a non-root uid (GHSA-8465;
    # CI builds them at UID=1000, matching ubuntu on this host). Pre-create
    # the leaf dirs owned by ubuntu, mirroring deploy/providers/local/
    # site_local_trust.yml — otherwise the `mkdir -p` inside the shell task
    # below runs under `become: true` (root) and the bind-mount source is
    # root-owned, which the non-root container can't write into.
    - name: pre-create NVFLARE Trust_1 kit subdirectories (owned by ubuntu)
      file:
        path: "{{ fl_kit_dir }}/net-1/services/Trust_1/{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - local
        - startup
        - transfer
      when: fl_backend == "nvflare"

    - name: sync NVFLARE Trust_1 participant kit from S3
      # `aws s3 sync` skips files when source/dest size + mtime "look
      # equivalent", so a freshly regenerated kit can leave stale
      # rootCA.pem / client.crt / fed_client.json in place — the
      # symptom is fl-client failing with CERTIFICATE_VERIFY_FAILED
      # against a server cert signed by the new rootCA. Wipe the
      # destination first to force a clean copy. Mirrors the
      # ecs_efs_provision.tf fix on the central-hub side.
      #
      # The hierarchical dest (net-1/services/Trust_1) preserves the
      # S3 bundle's own layout — the compose mount in
      # trust/deploy/compose_trust.production.nvflare.yml is
      # ${FL_KIT_DIR}/net-1/services/${TRUST_NAME}/{local,startup,transfer},
      # which resolves to /opt/flip/fl-kit/net-1/services/Trust_1/...
      #
      # The sync (and the `find -delete` before it) run as root via
      # `become: true`, so files land root-owned regardless of the
      # pre-created parent's ownership above — the closing chown fixes that
      # up for the non-root fl-client (GHSA-8465).
      shell: |
        set -euo pipefail
        dest="{{ fl_kit_dir }}/net-1/services/Trust_1"
        mkdir -p "$dest"
        find "$dest" -mindepth 1 -delete 2>/dev/null || true
        aws s3 sync \
          "{{ trust_s3_source }}" \
          "$dest"
        chown -R ubuntu:ubuntu "$dest"
      args:
        executable: /bin/bash
      register: trust_sync
      changed_when: "'download:' in trust_sync.stdout or 'copy:' in trust_sync.stdout"
      when: fl_backend == "nvflare"

- name: download Flower participant kit to Trust EC2
  hosts: trust_ec2
  become: true
  tags: flkit
  vars:
    # See the NVFLARE play above for the rationale on fl_kit_dir / the
    # preserved net-1/ hierarchy. For flower the compose mounts are
    # ${FL_KIT_DIR}/net-1/{certificates,keys}.
    fl_kit_dir: "/opt/flip/fl-kit"
    trust_s3_source: "s3://{{ flip_aicentre_bucket }}/fl-flower-participant-kits/{{ fl_kit_date }}/net-1/"
  tasks:
    - name: ensure FL kit directory exists
      file:
        path: "{{ fl_kit_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      when: fl_backend == "flower"

    - name: sync Flower net-1 certificates and keys from S3
      # See the NVFLARE sync above — same staleness trap. Flower's
      # mTLS chain (rootCA.pem / server.pem / client.pem) is
      # regenerated whenever the kit date changes; without a wipe
      # `aws s3 sync` can leave a previous rootCA in place and the
      # client fails the TLS handshake to fl-server.
      shell: |
        set -euo pipefail
        mkdir -p "{{ fl_kit_dir }}/net-1"
        find "{{ fl_kit_dir }}/net-1" -mindepth 1 -delete 2>/dev/null || true
        aws s3 sync \
          "{{ trust_s3_source }}/" \
          "{{ fl_kit_dir }}/net-1/"
      args:
        executable: /bin/bash
      register: trust_sync
      changed_when: "'download:' in trust_sync.stdout or 'copy:' in trust_sync.stdout"
      when: fl_backend == "flower"

- name: deploy observability config files to Trust EC2
  hosts: trust_ec2
  become: true
  tasks:
    - name: create observability config directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - /opt/flip/config/observability
        - /opt/flip/config/observability/alloy
        - /opt/flip/config/observability/loki
        - /opt/flip/config/observability/grafana/provisioning/datasources
        - /opt/flip/config/observability/grafana/provisioning/dashboards

    - name: copy Alloy config
      copy:
        src: ../../../trust/observability/alloy/config.alloy
        dest: /opt/flip/config/observability/alloy/config.alloy
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: copy Loki config
      copy:
        src: ../../../trust/observability/loki/loki-config.yml
        dest: /opt/flip/config/observability/loki/loki-config.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: copy Grafana Loki datasource provisioning
      copy:
        src: ../../../trust/observability/grafana/provisioning/datasources/loki.yml
        dest: /opt/flip/config/observability/grafana/provisioning/datasources/loki.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: copy Grafana dashboard provider config
      copy:
        src: ../../../trust/observability/grafana/provisioning/dashboards/dashboards.yml
        dest: /opt/flip/config/observability/grafana/provisioning/dashboards/dashboards.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: copy Grafana Trust APIs dashboard
      copy:
        src: ../../../trust/observability/grafana/provisioning/dashboards/trust-apis.json
        dest: /opt/flip/config/observability/grafana/provisioning/dashboards/trust-apis.json
        owner: ubuntu
        group: ubuntu
        mode: "0644"

- name: install and configure CloudWatch agent on Trust EC2
  hosts: trust_ec2
  become: true
  vars:
    cloudwatch_agent_deb: "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb"
    log_group_name: "/aws/ec2/flip-trust"
  tasks:
    - name: install prerequisites
      apt:
        name:
          - unzip
        state: present
        update_cache: yes
    - name: download CloudWatch agent package
      get_url:
        url: "{{ cloudwatch_agent_deb }}"
        dest: "/tmp/amazon-cloudwatch-agent.deb"
        mode: "0644"
    - name: install CloudWatch agent
      apt:
        deb: "/tmp/amazon-cloudwatch-agent.deb"
    - name: configure CloudWatch agent for Trust EC2
      template:
        src: cloudwatch-agent-trust.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"
    - name: start CloudWatch agent
      command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

- name: download and restore OMOP PGDATA on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, omop]
  vars:
    omop_dir: "/opt/flip/omop"
    # trust_num selects which trust's data package to load (e.g. "1" or "2").
    # Pass via -e trust_num=2 for Trust_2 hosts. Defaults to "1" for
    # backwards-compat with single-trust deployments.
    trust_num: "{{ trust_num | default('1') }}"
    # omop_data_version is the version string from trust/omop-db/.data_version.
    # Passed as an extra-var by the Makefile seed-trust-data target.
    pgdata_trust_dir: "trust{{ trust_num }}"
    pgdata_archive: "trust{{ trust_num }}_pgdata_{{ omop_data_version }}.tar"
    # Mock data is fetched anonymously over HTTPS from the public Hugging Face
    # dataset (no AWS CLI / credentials needed). Laid out per trust; archives are
    # gzip-compressed tarballs named .tar (tar auto-detects gzip on extraction).
    hf_trust_data_repo: "{{ trust_data_hf_repo | default('aicentreflip/trust-data') }}"
    hf_trust_data_revision: "{{ trust_data_hf_revision | default('main') }}"
    hf_base_url: "https://huggingface.co/datasets/{{ hf_trust_data_repo }}/resolve/{{ hf_trust_data_revision }}"
  tasks:
    - name: install tar
      apt:
        name:
          - tar
        state: present
        update_cache: yes

    - name: create OMOP directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ omop_dir }}"
        - "{{ omop_dir }}/db_data"

    - name: download OMOP PGDATA archive from Hugging Face
      ansible.builtin.get_url:
        url: "{{ hf_base_url }}/{{ pgdata_trust_dir }}/{{ pgdata_archive }}"
        dest: "{{ omop_dir }}/pgdata.tar"
        mode: "0644"

    - name: clear existing PGDATA directory
      shell: rm -rf {{ omop_dir }}/db_data/*
      changed_when: false

    - name: extract OMOP PGDATA
      command: >
        tar -xf {{ omop_dir }}/pgdata.tar
        -C {{ omop_dir }}/db_data

    - name: set Postgres ownership and permissions
      shell: |
        chown -R 999:999 {{ omop_dir }}/db_data
        chmod 700 {{ omop_dir }}/db_data
      changed_when: false

- name: load OMOP core vocabulary on Trust EC2
  # The published pgdata tarballs are vocab-free (FLIP#842/#843): the licensed
  # core vocabulary is streamed into the restored cluster here, via a throwaway
  # container on a loopback-only port. The loader skips tables that already
  # hold the core vocabulary, so re-runs are safe. Bundle comes from the org S3
  # bucket via the instance role.
  hosts: trust_ec2
  become: true
  tags: [data, omop, omop-vocab]
  vars:
    omop_dir: "/opt/flip/omop"
    # The env's own bucket (passed by the Makefile as AICENTRE_BUCKET_NAME) —
    # the instance role has no cross-account read on other envs' buckets.
    vocab_s3_bucket: "{{ vocab_s3_bucket | default('flipdev-aicentre', true) }}"
    vocab_core_bundle: "vocab_aicentre_core_20240916"
    # Supplied by `make seed-trust-data` as the env's own DOCKER_TAG. The fallback
    # only applies to a hand-run playbook: the container is a throwaway Postgres
    # server over an already-restored volume, so the tag matters little here —
    # 'stag' is simply the safer accident than the production image.
    omop_db_image: "ghcr.io/londonaicentre/omop-db:{{ omop_db_tag | default('stag', true) }}"
    vocab_load_port: "15499"
    # Superuser credentials of the restored cluster — the kit's OMOP_POSTGRES_*
    # values, passed as extra-vars by the Makefile seed-trust-data target.
    omop_postgres_user: "{{ omop_postgres_user | default('postgres', true) }}"
    omop_postgres_db: "{{ omop_postgres_db | default('trustomopdb', true) }}"
  tasks:
    - name: assert the cluster password extra-var is set
      assert:
        that:
          - omop_postgres_password is defined
          - omop_postgres_password | length > 0
        fail_msg: "omop_postgres_password is required (the kit's OMOP_POSTGRES_PASSWORD; passed by make seed-trust-data)"

    - name: install postgresql-client and unzip
      apt:
        name:
          - postgresql-client
          - unzip
        state: present
        update_cache: yes

    # Everything from the S3 fetch onwards is wrapped so the `always:` cleanup runs
    # even when the unzip, the container, the readiness wait or the loader fails.
    # Without it a mid-play failure leaves the licensed bundle at rest on the host.
    #
    # Both stages stage into a dot-prefixed temp path and rename only on success,
    # so an interrupted download or extraction is never mistaken for a present
    # bundle by the next run's `creates:` guard. Same idiom as `fetch-vocab-core`
    # in trust/omop-db/Makefile.
    - name: load the core vocabulary, cleaning up whatever happens
      block:
        - name: download core vocabulary bundle from S3 (instance role)
          shell: |
            set -euo pipefail
            aws s3 cp "s3://{{ vocab_s3_bucket }}/vocab/{{ vocab_core_bundle }}.zip" "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp"
            mv "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp" "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
          args:
            creates: "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
            executable: /bin/bash

        - name: unzip core vocabulary bundle
          shell: |
            set -euo pipefail
            rm -rf "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"
            unzip -q "{{ omop_dir }}/{{ vocab_core_bundle }}.zip" -d "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"
            mv "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp" "{{ omop_dir }}/{{ vocab_core_bundle }}"
          args:
            creates: "{{ omop_dir }}/{{ vocab_core_bundle }}"
            executable: /bin/bash

        - name: copy vocabulary loader and constraints from the repo checkout
          copy:
            src: "../../../trust/omop-db/files/{{ item }}"
            dest: "{{ omop_dir }}/{{ item }}"
            mode: "0755"
          loop:
            - load_core_vocab.sh
            - OMOPCDM_postgresql_5.4_constraints.sql

        - name: start throwaway database container on the restored volume
          command: >
            docker run -d --name omop-vocab-load
            -v {{ omop_dir }}/db_data:/var/lib/postgresql/data
            -p 127.0.0.1:{{ vocab_load_port }}:5432
            {{ omop_db_image }}

        - name: wait for the database to accept connections
          command: docker exec omop-vocab-load pg_isready -U {{ omop_postgres_user }}
          register: pg_ready
          until: pg_ready.rc == 0
          retries: 30
          delay: 5
          changed_when: false

        - name: stream the core vocabulary and apply constraints
          command: bash {{ omop_dir }}/load_core_vocab.sh {{ omop_dir }}/{{ vocab_core_bundle }} {{ omop_dir }}/OMOPCDM_postgresql_5.4_constraints.sql
          environment:
            OMOP_DB_HOST: "127.0.0.1"
            OMOP_DB_PORT: "{{ vocab_load_port }}"
            OMOP_POSTGRES_USER: "{{ omop_postgres_user }}"
            OMOP_POSTGRES_PASSWORD: "{{ omop_postgres_password }}"
            OMOP_POSTGRES_DB: "{{ omop_postgres_db }}"
      always:
        # Deleting the licensed content comes FIRST: a failing task in `always:`
        # aborts the remaining `always:` tasks, so with the container removal
        # ahead of it a `docker rm` against an unreachable daemon would leave
        # ~3.6GB of licensed vocabulary at rest on the host — exactly what this
        # task exists to prevent. The temp paths are included so an interrupted
        # download or extraction leaves nothing behind either.
        - name: remove the downloaded bundle (~3.6GB of licensed content does not belong at rest on the host)
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ omop_dir }}/{{ vocab_core_bundle }}.zip"
            - "{{ omop_dir }}/{{ vocab_core_bundle }}"
            - "{{ omop_dir }}/.{{ vocab_core_bundle }}.zip.tmp"
            - "{{ omop_dir }}/.{{ vocab_core_bundle }}.tmp"

        # This runs even when the container was never started. `docker rm -f`
        # already exits 0 on a missing container (since Docker 23), so only the
        # "No such container" case is tolerated explicitly — a genuine failure
        # (unreachable daemon, un-removable container) must still fail the play:
        # it would leave a Postgres container holding {{ omop_dir }}/db_data and
        # the loopback port, which the real omop-db later mounts.
        - name: stop the throwaway container
          command: docker rm -f omop-vocab-load
          register: vocab_rm
          changed_when: false
          failed_when: vocab_rm.rc != 0 and 'No such container' not in (vocab_rm.stderr | default(''))

- name: restore Orthanc storage on Trust EC2
  hosts: trust_ec2
  become: true
  tags: [data, orthanc]
  vars:
    # trust_num selects which trust's data package to load (e.g. "1" or "2").
    # Passed via -e trust_num=2 for Trust_2 hosts. Defaults to "1".
    trust_num: "{{ trust_num | default('1') }}"
    # orthanc_data_version is the version string from trust/orthanc/.data_version.
    # Passed as an extra-var by the Makefile seed-trust-data target.
    orthanc_trust_dir: "trust{{ trust_num }}"
    archive: "trust{{ trust_num }}_orthanc_data_{{ orthanc_data_version }}.tar"
    base_dir: "/opt/flip/orthanc"
    data_dir: "/opt/flip/orthanc/orthanc-storage"
    # Mock data is fetched anonymously over HTTPS from the public Hugging Face
    # dataset (no AWS CLI / credentials needed). Laid out per trust; archives are
    # gzip-compressed tarballs named .tar (tar auto-detects gzip on extraction).
    hf_trust_data_repo: "{{ trust_data_hf_repo | default('aicentreflip/trust-data') }}"
    hf_trust_data_revision: "{{ trust_data_hf_revision | default('main') }}"
    hf_base_url: "https://huggingface.co/datasets/{{ hf_trust_data_repo }}/resolve/{{ hf_trust_data_revision }}"
  tasks:
    - name: install tar
      apt:
        name:
          - tar
        state: present
        update_cache: yes

    # Orthanc runs as the in-image `orthanc` user (UID 999) after the
    # Docker-hardening pass on `trust/orthanc/Dockerfile`. The base and data
    # directories — and everything extracted into them by `tar` (which runs
    # as root) — must end up owned by UID 999 or Orthanc cannot write its
    # SQLite index, ingest new DICOM, or update the storage area.
    - name: ensure orthanc base directory exists
      file:
        path: "{{ base_dir }}"
        state: directory
        owner: "999"
        group: "999"
        mode: "0755"

    - name: download Orthanc archive from Hugging Face
      ansible.builtin.get_url:
        url: "{{ hf_base_url }}/{{ orthanc_trust_dir }}/{{ archive }}"
        dest: "{{ base_dir }}/orthanc-storage.tar"
        mode: "0644"

    - name: clear existing Orthanc storage
      shell: rm -rf {{ data_dir }}/*
      changed_when: false

    - name: ensure orthanc data directory exists
      file:
        path: "{{ data_dir }}"
        state: directory
        owner: "999"
        group: "999"
        mode: "0755"

    - name: extract Orthanc data into orthanc-storage
      command: >
        tar -xf {{ base_dir }}/orthanc-storage.tar -C {{ data_dir }}

    - name: ensure Orthanc storage is owned by container UID 999 and writable
      file:
        path: "{{ data_dir }}"
        owner: "999"
        group: "999"
        mode: "0755"
        recurse: true
